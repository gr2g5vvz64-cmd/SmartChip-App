<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartChip — مدیریت کارمندان v1.2</title>
<!--
  ════════════════════════════════════════════════════
  SmartChip — مدیریت کارمندان — تاریخچه نسخه‌ها
  (نسخه‌بندی از همین‌جا شروع می‌شود)
  ════════════════════════════════════════════════════
  نسخه ۱.۱ — ۱۴۰۵/۰۴/۱۸
    + دکمه‌ی حالت شب/روز
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
:root {
  --bg:#0f1117; --surface:#1d212e; --card:#262b3d; --border:#363c54;
  --accent:#f0a500; --accent2:#e8630a; --text:#f7f8fb; --muted:#a3aac4;
  --green:#22c55e; --red:#ef4444;
}
html[data-theme="light"] {
  --bg:#faf8f5; --surface:#ffffff; --card:#f2ede6; --border:#c8bfb0;
  --accent:#c47f00; --accent2:#d4540a; --text:#1a0800; --muted:#5a4a3a;
  --green:#16a34a; --red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased;}
.header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.logo-title{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.content{padding:24px;max-width:800px;margin:0 auto;}
.btn{border:none;border-radius:10px;padding:9px 18px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#1a1206;}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-sm{padding:5px 12px;font-size:11px;}
.add-form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:end;}
@media (max-width:640px){.add-form{grid-template-columns:1fr;}}
.form-control{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:12px;outline:none;}
.form-label{font-size:11px;color:var(--muted);margin-bottom:5px;display:block;}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
th{background:var(--card);font-size:11px;color:var(--muted);padding:10px;text-align:right;}
td{padding:10px;font-size:12px;border-top:1px solid var(--border);}
.access-denied{text-align:center;padding:80px 20px;}
</style>
<script>
  if(localStorage.getItem('smartchip_theme')==='light') document.documentElement.setAttribute('data-theme','light');
</script>
</head>
<body>
<div class="header"><div class="logo-title">👥 مدیریت کارمندان <span style="font-size:9px;color:var(--muted);font-weight:400;">v1.2</span></div><button id="themeToggleBtn" onclick="toggleTheme()" style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--text);font-family:'Vazirmatn',sans-serif;cursor:pointer;" title="تغییر حالت شب/روز">🌙 حالت روز</button></div>
<div class="content" id="mainContent" style="display:none;"></div>
<div class="content" id="emailFormContent" style="display:none;text-align:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:320px;margin:60px auto 0;">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;">ایمیلت رو وارد کن</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:14px;">همان ایمیلی که مدیر برایت ثبت کرده</div>
    <input id="emailFormInput" type="email" placeholder="name@gmail.com" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:13px;outline:none;direction:ltr;text-align:left;margin-bottom:8px;" onkeydown="if(event.key==='Enter')submitEmailForm()"/>
    <div id="emailFormError" style="color:var(--red);font-size:11px;margin-bottom:10px;display:none;"></div>
    <button onclick="submitEmailForm()" style="width:100%;background:var(--accent);color:#1a1206;border:none;border-radius:10px;padding:11px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:700;cursor:pointer;">ورود</button>
  </div>
</div>
<div class="content" id="deniedContent" style="display:none;">
  <div class="access-denied">
    <div style="font-size:40px;margin-bottom:14px;">🔒</div>
    <div style="font-weight:700;margin-bottom:6px;">این صفحه فقط برای مدیر است</div>
    <div style="font-size:12px;color:var(--muted)" id="deniedMsg"></div>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxGpCDZQcaoTTw-QEAv0E_r_lgYSjVlgdGwb8J2TKcV3PzOo9pSeG3Nm_iwEb9FD52A/exec';

// ── حالت شب/روز ──
function applyThemeButtonLabel(){
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  const btn=document.getElementById('themeToggleBtn');
  if(btn) btn.textContent=isLight?'☀️ حالت شب':'🌙 حالت روز';
}
function toggleTheme(){
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('smartchip_theme','dark');
  } else {
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('smartchip_theme','light');
  }
  applyThemeButtonLabel();
}
applyThemeButtonLabel();
const ROLE_LABELS={
  owner:'مدیریت (خودم)', sup_sales:'سرپرست فروش', sup_trade:'سرپرست بازرگانی',
  sup_procurement:'سرپرست تدارکات', sup_finance:'سرپرست مالی', sup_warehouse:'سرپرست انبار',
  office:'مسئول دفتر', sales_expert:'کارشناس فروش', accounting:'حسابداری',
  warehouse_keeper:'انباردار', trade_expert:'کارشناس بازرگانی', procurement_staff:'تدارکات',
  service:'خدمات', parts_mgmt:'مدیریت قطعات', pcb_mgmt:'مدیریت برد مدارچاپی',
  // سازگاری با داده‌های قدیمی
  admin:'مدیریت (خودم)', sales:'کارشناس فروش', ops:'تدارکات/بازرگانی', finance:'حسابداری',
};

async function sheetCall(action, data={}){
  try{
    const url=SHEET_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(data))+'&t='+Date.now();
    const res=await fetch(url,{method:'GET'});
    return await res.json();
  }catch(e){ return null; }
}

let staffList=[];

function getStoredEmail(){ return localStorage.getItem('smartchip_user_email')||''; }
function setStoredEmail(e){ localStorage.setItem('smartchip_user_email', e); }
function clearStoredEmail(){ localStorage.removeItem('smartchip_user_email'); }
let _emailFormResolve=null;
function ensureUserEmail(){
  return new Promise((resolve)=>{
    const stored=getStoredEmail();
    if(stored && stored.includes('@')){ resolve(stored); return; }
    document.getElementById('emailFormContent').style.display='block';
    _emailFormResolve=resolve;
  });
}
function submitEmailForm(){
  const val=(document.getElementById('emailFormInput').value||'').trim().toLowerCase();
  const errEl=document.getElementById('emailFormError');
  if(!val || !val.includes('@')){
    errEl.textContent='⚠ یک ایمیل معتبر وارد کن';
    errEl.style.display='block';
    return;
  }
  errEl.style.display='none';
  setStoredEmail(val);
  document.getElementById('emailFormContent').style.display='none';
  if(_emailFormResolve) _emailFormResolve(val);
}
async function getCurrentUserInfoFromDjangoOrSheet(email){
  try{
    const res = await fetch('https://smartchip-backend.onrender.com/api/staff/staff/'+encodeURIComponent(email)+'/');
    if(res.status===404){
      return { email, name:'', role:'', isStaff:false, error:'این ایمیل در لیست کارمندان ثبت نشده — با مدیر تماس بگیر' };
    }
    if(res.ok){
      const d = await res.json();
      if(!d.active) return { email, name:d.name||'', role:'', isStaff:false, error:'دسترسی این کاربر غیرفعال شده' };
      return { email, name:d.name||'', role:d.role||'', isStaff:true };
    }
  }catch(e){ /* مشکل شبکه — به fallback گوگل‌شیت برمی‌گردیم */ }
  return await sheetCall('getCurrentUserInfo', { email });
}
async function init(){
  const email=await ensureUserEmail();
  if(!email){
    document.getElementById('deniedContent').style.display='block';
    document.getElementById('deniedMsg').textContent='بدون ایمیل نمی‌توان ادامه داد';
    return;
  }
  const userInfo=await getCurrentUserInfoFromDjangoOrSheet(email);
  if(!userInfo || !userInfo.isStaff || (userInfo.role!=='admin' && userInfo.role!=='owner')){
    document.getElementById('deniedContent').style.display='block';
    document.getElementById('deniedMsg').innerHTML=((userInfo&&userInfo.error)||'فقط نقش «مدیریت» به این صفحه دسترسی دارد')+
      '<br><br><a href="#" onclick="clearStoredEmail();location.reload();return false;" style="color:var(--accent);font-size:11px;">تغییر ایمیل</a>';
    return;
  }
  document.getElementById('mainContent').style.display='block';
  renderForm();
  await loadStaff();
}
function renderForm(){
  document.getElementById('mainContent').innerHTML=`
    <div class="add-form" style="grid-template-columns:1.3fr 1fr 1fr 1.3fr auto;">
      <div><label class="form-label">ایمیل گوگل *</label><input class="form-control" id="newEmail" placeholder="name@gmail.com"/></div>
      <div><label class="form-label">نام</label><input class="form-control" id="newName" placeholder="نام کارمند"/></div>
      <div><label class="form-label">موبایل</label><input class="form-control" id="newMobile" placeholder="09123456789"/></div>
      <div><label class="form-label">سمت</label>
        <select class="form-control" id="newRole">
          <option value="owner">مدیریت (خودم)</option>
          <option value="sup_sales">سرپرست فروش</option>
          <option value="sup_trade">سرپرست بازرگانی</option>
          <option value="sup_procurement">سرپرست تدارکات</option>
          <option value="sup_finance">سرپرست مالی</option>
          <option value="sup_warehouse">سرپرست انبار</option>
          <option value="office">مسئول دفتر</option>
          <option value="sales_expert" selected>کارشناس فروش</option>
          <option value="accounting">حسابداری</option>
          <option value="warehouse_keeper">انباردار</option>
          <option value="trade_expert">کارشناس بازرگانی</option>
          <option value="procurement_staff">تدارکات</option>
          <option value="service">خدمات</option>
          <option value="parts_mgmt">مدیریت قطعات</option>
          <option value="pcb_mgmt">مدیریت برد مدارچاپی</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addStaffMember()">+ افزودن</button>
    </div>
    <table>
      <thead><tr><th>شماره پرسنلی</th><th>ایمیل</th><th>نام</th><th>موبایل</th><th>سمت</th><th>فعال</th><th></th><th></th></tr></thead>
      <tbody id="staffTableBody"></tbody>
    </table>
    <div style="margin-top:24px">
      <div style="font-size:14px;font-weight:800;margin-bottom:10px">🤖 وضعیت اتصال بات کارمندان</div>
      <div id="staffBotStatusBox"></div>
    </div>
  `;
}
const DJANGO_STAFF_API = 'https://smartchip-backend.onrender.com/api/staff/staff/';
async function loadStaff(){
  try{
    const res = await fetch(DJANGO_STAFF_API);
    if(res.ok){ staffList = await res.json(); renderTable(); renderStaffBotStatus(); return; }
  }catch(e){}
  const res=await sheetCall('getStaffList');
  staffList=(res&&res.staff)||[];
  renderTable();
  renderStaffBotStatus();
}
function renderTable(){
  const el=document.getElementById('staffTableBody');
  if(!staffList.length){el.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted)">هنوز کارمندی ثبت نشده</td></tr>';return;}
  // ⚠️ (۱۴۰۵/۰۶/۱۴) طبق درخواست کاربر: شماره پرسنلی صعودی و همیشگی —
  // همون id پیش‌فرض جنگو که هیچ‌وقت با حذف رکورد دوباره استفاده نمی‌شه،
  // پس همیشه می‌شه فهمید تا الان چند نفر کارمند اومدن (بدون توجه به اینکه
  // چندتاشون هنوز فعالن یا حذف شدن).
  el.innerHTML=staffList.slice().sort((a,b)=>a.id-b.id).map(s=>`
    <tr>
      <td style="color:var(--muted);font-size:11px">#${s.id}</td>
      <td>${s.email}</td>
      <td>${s.name||'—'}</td>
      <td>${s.mobile||'—'}</td>
      <td>${ROLE_LABELS[s.role]||s.role}</td>
      <td><button class="btn btn-ghost btn-sm" style="color:${s.active?'var(--green)':'var(--red)'}" onclick="toggleStaffActive('${s.email}',${!s.active})">${s.active?'✅ فعال':'❌ غیرفعال'}</button></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openEditStaffModal('${s.email}')">✏️ ویرایش</button></td>
      <td><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeStaffMember('${s.email}')">حذف</button></td>
    </tr>`).join('');
}
function openEditStaffModal(email){
  const s = staffList.find(x=>x.email===email);
  if(!s) return;
  const roleOptions = Object.keys(ROLE_LABELS).filter(k=>!['admin','sales','ops','finance'].includes(k)); // نسخه‌های قدیمی رو تو دراپ‌داون نشون نده
  const html = `
    <div id="editStaffOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999" onclick="if(event.target===this) closeEditStaffModal()">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:340px">
        <div style="font-size:13px;font-weight:700;margin-bottom:14px">✏️ ویرایش — شماره پرسنلی #${s.id}</div>
        <label class="form-label">ایمیل گوگل</label>
        <input class="form-control" id="editStaffEmail" value="${s.email}" style="margin-bottom:10px;direction:ltr;text-align:left"/>
        <label class="form-label">نام</label>
        <input class="form-control" id="editStaffName" value="${(s.name||'').replace(/"/g,'&quot;')}" style="margin-bottom:10px"/>
        <label class="form-label">موبایل</label>
        <input class="form-control" id="editStaffMobile" value="${s.mobile||''}" style="margin-bottom:10px"/>
        <label class="form-label">سمت</label>
        <select class="form-control" id="editStaffRole" style="margin-bottom:14px">
          ${roleOptions.map(k=>`<option value="${k}" ${s.role===k?'selected':''}>${ROLE_LABELS[k]}</option>`).join('')}
        </select>
        <div id="editStaffError" style="color:var(--red);font-size:11px;margin-bottom:8px;display:none"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" onclick="submitEditStaff('${email}')">💾 ذخیره</button>
          <button class="btn btn-ghost" style="flex:1" onclick="closeEditStaffModal()">انصراف</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeEditStaffModal(){
  const el = document.getElementById('editStaffOverlay');
  if(el) el.remove();
}
async function submitEditStaff(originalEmail){
  const newEmail = document.getElementById('editStaffEmail').value.trim().toLowerCase();
  const errEl = document.getElementById('editStaffError');
  if(!newEmail || !newEmail.includes('@')){
    errEl.textContent = '⚠ ایمیل معتبر وارد کن';
    errEl.style.display = 'block';
    return;
  }
  const patch = {
    email: newEmail,
    name: document.getElementById('editStaffName').value.trim(),
    mobile: document.getElementById('editStaffMobile').value.trim(),
    role: document.getElementById('editStaffRole').value,
  };
  try{
    // ⚠️ آدرس درخواست با ایمیل *قبلی* پیدا می‌شه (چون هنوز شناسه‌ی مسیره)،
    // ولی مقدار جدید تو خودِ بدنه فرستاده می‌شه — جنگو خودش فیلد رو آپدیت می‌کنه
    const res = await fetch(DJANGO_STAFF_API+encodeURIComponent(originalEmail)+'/', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      errEl.textContent = errData.email ? '⚠ این ایمیل قبلاً برای یه کارمند دیگه ثبت شده' : 'ذخیره ناموفق بود';
      errEl.style.display = 'block';
      return;
    }
  }catch(e){
    errEl.textContent = '⚠️ اتصال به سرور برقرار نشد';
    errEl.style.display = 'block';
    return;
  }
  closeEditStaffModal();
  await loadStaff();
}
async function addStaffMember(){
  const email=document.getElementById('newEmail').value.trim().toLowerCase();
  const name=document.getElementById('newName').value.trim();
  const mobile=document.getElementById('newMobile').value.trim();
  const role=document.getElementById('newRole').value;
  if(!email||!email.includes('@')){alert('⚠ ایمیل معتبر وارد کن');return;}
  try{
    const res = await fetch(DJANGO_STAFF_API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,name,mobile,role,active:true})});
    if(!res.ok){ const err = await res.json().catch(()=>({})); alert(err.email ? 'این ایمیل قبلاً ثبت شده' : 'خطا در ثبت'); return; }
  }catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); return; }
  document.getElementById('newEmail').value='';
  document.getElementById('newName').value='';
  document.getElementById('newMobile').value='';
  await loadStaff();
}
async function toggleStaffActive(email,active){
  try{ await fetch(DJANGO_STAFF_API+encodeURIComponent(email)+'/', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({active})}); }
  catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); }
  await loadStaff();
}
async function removeStaffMember(email){
  if(!confirm(`دسترسی «${email}» کاملاً حذف شود؟`))return;
  try{ await fetch(DJANGO_STAFF_API+encodeURIComponent(email)+'/', {method:'DELETE'}); }
  catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); }
  await loadStaff();
}

// ══════════════════════════════════════════════════════════════
// 🤖 وضعیت اتصال بات کارمندان — کپی از erp.html/ابزار (۱۴۰۵/۰۶/۱۸)
// ⚠️ طبق درخواست کاربر: همینجا، تو خودِ مدیریت کارمندان، باشه — نه فقط
// تو ERP — تا وقتی کارمندی اضافه/ویرایش می‌شه، همینجا هم دیده بشه.
// ══════════════════════════════════════════════════════════════
let staffBotListM = [];
async function renderStaffBotStatus(){
  const box = document.getElementById('staffBotStatusBox');
  if(!box) return;
  box.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">در حال بارگذاری...</div>';
  try{
    const res = await fetch('https://smartchip-backend.onrender.com/api/bot/staff-list/');
    staffBotListM = res.ok ? await res.json() : [];
  }catch(e){ staffBotListM = []; }
  const connected = staffBotListM.filter(s=>s.telegramConnected||s.baleConnected);
  const notConnected = staffBotListM.filter(s=>!s.telegramConnected&&!s.baleConnected);
  box.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--green)">${connected.length}</div>
        <div style="font-size:10px;color:var(--muted)">🟢 وصل شده</div>
      </div>
      <div style="background:rgba(156,163,175,.08);border:1px solid rgba(156,163,175,.3);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:22px;font-weight:800;color:var(--muted)">${notConnected.length}</div>
        <div style="font-size:10px;color:var(--muted)">⚪ وصل‌نشده</div>
      </div>
    </div>
    ${notConnected.length?`<div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;">⚪ وصل‌نشده‌ها:</div>
    ${notConnected.map(s=>`
      <div id="staffBotRow_${s.id}" style="padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:8px;font-size:11px;">
          <span style="font-weight:700">${s.name}</span><span style="color:var(--muted);font-size:10px">${ROLE_LABELS[s.role]||s.role}</span>
          <button class="btn btn-ghost btn-sm" style="margin-right:auto" onclick="sendStaffBotInviteWhatsAppAdmin(${s.id})">📱 دعوت با واتساپ</button>
        </div>
        <div id="staffBotLinks_${s.id}"></div>
      </div>`).join('')}`:''}
    ${connected.length?`<div style="font-size:11px;font-weight:800;color:var(--green);margin-bottom:6px;margin-top:10px;">🟢 وصل‌شده‌ها:</div>
    ${connected.map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 10px;background:rgba(34,197,94,.05);border-radius:8px;margin-bottom:3px;font-size:11px;">
      <span style="font-weight:700">${s.name}</span><span style="color:var(--muted);font-size:10px">${ROLE_LABELS[s.role]||s.role}</span>
      ${s.telegramConnected?'<span style="color:#0088cc;font-size:10px">✈️ تلگرام</span>':''}
      ${s.baleConnected?'<span style="color:#0070e0;font-size:10px">💙 بله</span>':''}
    </div>`).join('')}`:''}
    ${!staffBotListM.length?'<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">دریافت وضعیت بات ناموفق بود</div>':''}
  `;
}
async function sendStaffBotInviteWhatsAppAdmin(staffId){
  try{
    const httpRes = await fetch('https://smartchip-backend.onrender.com/api/bot/send-staff-invite/', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({staffId})
    });
    const res = await httpRes.json();
    if(!res || !res.ok){
      alert('⚠️ ساخت دعوت‌نامه ناموفق بود: '+(res?.error||'نامشخص'));
      return;
    }
    // ⚠️ لینک‌های تلگرام/بله رو مستقیم از خودِ متنی که سرور برگردونده استخراج
    // می‌کنیم (نه فرض‌کردن ساختار) — تا همیشه دقیقاً همونی باشه که واقعاً
    // ساخته شده، حتی اگه بعداً بک‌اند عوض بشه.
    const msg = res.message || '';
    const tgMatch = msg.match(/https:\/\/t\.me\/\S+/);
    const bleMatch = msg.match(/https:\/\/ble\.ir\/\S+/);
    const linksBox = document.getElementById('staffBotLinks_'+staffId);
    if(linksBox){
      linksBox.innerHTML = `
        <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:10.5px;display:flex;flex-direction:column;gap:4px">
          ${tgMatch ? `<a href="${tgMatch[0]}" target="_blank" style="color:#0088cc;direction:ltr;text-align:left;word-break:break-all">✈️ ${tgMatch[0]}</a>` : ''}
          ${bleMatch ? `<a href="${bleMatch[0]}" target="_blank" style="color:#0070e0;direction:ltr;text-align:left;word-break:break-all">💙 ${bleMatch[0]}</a>` : ''}
        </div>`;
    }
    await navigator.clipboard.writeText(msg).catch(()=>{});
    window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
  }catch(e){ alert('⚠️ خطای شبکه — دوباره امتحان کن'); }
}
init();
</script>
