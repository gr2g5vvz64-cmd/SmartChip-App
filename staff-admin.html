<script>
/* ⚠️ (۱۴۰۵/۰۷/۰۸) سرورِ مدار: api.smartchipelec.com (از طریقِ Cloudflare — بدونِ فیلترشکن).
   اگه این آدرس وصل نشد، همون درخواست خودکار با آدرسِ قدیمیِ Render تکرار می‌شه و تا ۵ دقیقه مستقیم از اون می‌ره. */
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.madarApiFallbackActive = function(){ return Date.now() < downUntil; };
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){
      if(init && init.signal && init.signal.aborted) throw err;   // مهلتی که خودِ صفحه گذاشته — دست نمی‌زنیم
      downUntil = Date.now() + 5*60*1000;
      return orig(alt, init);
    });
  };
})();
</script>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxGpCDZQcaoTTw-QEAv0E_r_lgYSjVlgdGwb8J2TKcV3PzOo9pSeG3Nm_iwEb9FD52A/exec';

// ── حالت شب/روز ──
function applyThemeButtonLabel(){
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  const btn=document.getElementById('themeToggleBtn');
  if(btn) btn.textContent=isLight?'☀️ حالت شب':'🌙 حالت روز';
}
function toggleTheme(){
  const isLight=document.documentElement.getAttribute('data-theme')==='light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('smartchip_theme','dark');
  } else {
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('smartchip_theme','light');
  }
  applyThemeButtonLabel();
}
applyThemeButtonLabel();
const ROLE_LABELS={
  owner:'مدیریت (خودم)', sup_sales:'سرپرست فروش', sup_trade:'سرپرست بازرگانی',
  sup_procurement:'سرپرست تدارکات', sup_finance:'سرپرست مالی', sup_warehouse:'سرپرست انبار',
  office:'مسئول دفتر', sales_expert:'کارشناس فروش', accounting:'حسابداری',
  warehouse_keeper:'انباردار', trade_expert:'کارشناس بازرگانی', procurement_staff:'تدارکات',
  service:'خدمات', parts_mgmt:'مدیریت قطعات', pcb_mgmt:'مدیریت برد مدارچاپی',
  // سازگاری با داده‌های قدیمی
  admin:'مدیریت (خودم)', sales:'کارشناس فروش', ops:'تدارکات/بازرگانی', finance:'حسابداری',
};

async function sheetCall(action, data={}){
  // ⚠️ (۱۴۰۵/۰۷/۱۱) گوگل‌شیت کنار گذاشته شد: همه‌ی داده‌ها از سرورِ مدار میاد و fallback به شیتِ قدیمی (داده‌ی کهنه + ۱۰ ثانیه انتظار)
  //   حذف شد. فقط «پیامک» (sendSMS) تا انتقال به سرویسِ پیامک رویِ سرور، هنوز از Apps Script می‌ره. پرچمِ isConnected دست نمی‌خوره.
  if(action !== 'sendSMS'){
    return action === 'getCurrentUserInfo'
      ? {email: (data && data.email) || '', isStaff: false, error: 'سرورِ مدار در دسترس نیست — اینترنت رو چک کنید و چند ثانیه بعد صفحه رو تازه کنید'}
      : null;
  }

  try{
    const url=SHEET_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(data))+'&t='+Date.now();
    const res=await fetch(url,{method:'GET'});
    return await res.json();
  }catch(e){ return null; }
}

let staffList=[];

function getStoredEmail(){ return localStorage.getItem('smartchip_user_email')||''; }
function setStoredEmail(e){ localStorage.setItem('smartchip_user_email', e); }
function clearStoredEmail(){ localStorage.removeItem('smartchip_user_email'); }
let _emailFormResolve=null;
function ensureUserEmail(){
  return new Promise((resolve)=>{
    const stored=getStoredEmail();
    if(stored && stored.includes('@')){ resolve(stored); return; }
    document.getElementById('emailFormContent').style.display='block';
    _emailFormResolve=resolve;
  });
}
function submitEmailForm(){
  const val=(document.getElementById('emailFormInput').value||'').trim().toLowerCase();
  const errEl=document.getElementById('emailFormError');
  if(!val || !val.includes('@')){
    errEl.textContent='⚠ یک ایمیل معتبر وارد کن';
    errEl.style.display='block';
    return;
  }
  errEl.style.display='none';
  setStoredEmail(val);
  document.getElementById('emailFormContent').style.display='none';
  if(_emailFormResolve) _emailFormResolve(val);
}
async function getCurrentUserInfoFromDjangoOrSheet(email){
  try{
    const res = await fetch('https://api.smartchipelec.com/api/staff/staff/'+encodeURIComponent(email)+'/');
    if(res.status===404){
      return { email, name:'', role:'', isStaff:false, error:'این ایمیل در لیست کارمندان ثبت نشده — با مدیر تماس بگیر' };
    }
    if(res.ok){
      const d = await res.json();
      if(!d.active) return { email, name:d.name||'', role:'', isStaff:false, error:'دسترسی این کاربر غیرفعال شده' };
      return { email, name:d.name||'', role:d.role||'', isStaff:true };
    }
  }catch(e){ /* مشکل شبکه — به fallback گوگل‌شیت برمی‌گردیم */ }
  return await sheetCall('getCurrentUserInfo', { email });
}
async function init(){
  const email=await ensureUserEmail();
  if(!email){
    document.getElementById('deniedContent').style.display='block';
    document.getElementById('deniedMsg').textContent='بدون ایمیل نمی‌توان ادامه داد';
    return;
  }
  const userInfo=await getCurrentUserInfoFromDjangoOrSheet(email);
  if(!userInfo || !userInfo.isStaff || (userInfo.role!=='admin' && userInfo.role!=='owner')){
    document.getElementById('deniedContent').style.display='block';
    document.getElementById('deniedMsg').innerHTML=((userInfo&&userInfo.error)||'فقط نقش «مدیریت» به این صفحه دسترسی دارد')+
      '<br><br><a href="#" onclick="clearStoredEmail();location.reload();return false;" style="color:var(--accent);font-size:11px;">تغییر ایمیل</a>';
    return;
  }
  document.getElementById('mainContent').style.display='block';
  renderForm();
  await loadStaff();
}
function renderForm(){
  document.getElementById('mainContent').innerHTML=`
    <div class="add-form" style="grid-template-columns:1.3fr 1fr 1fr 1.3fr auto;">
      <div><label class="form-label">ایمیل گوگل *</label><input class="form-control" id="newEmail" placeholder="name@gmail.com"/></div>
      <div><label class="form-label">نام</label><input class="form-control" id="newName" placeholder="نام کارمند"/></div>
      <div><label class="form-label">موبایل</label><input class="form-control" id="newMobile" placeholder="09123456789"/></div>
      <div><label class="form-label">سمت</label>
        <select class="form-control" id="newRole">
          <option value="owner">مدیریت (خودم)</option>
          <option value="sup_sales">سرپرست فروش</option>
          <option value="sup_trade">سرپرست بازرگانی</option>
          <option value="sup_procurement">سرپرست تدارکات</option>
          <option value="sup_finance">سرپرست مالی</option>
          <option value="sup_warehouse">سرپرست انبار</option>
          <option value="office">مسئول دفتر</option>
          <option value="sales_expert" selected>کارشناس فروش</option>
          <option value="accounting">حسابداری</option>
          <option value="warehouse_keeper">انباردار</option>
          <option value="trade_expert">کارشناس بازرگانی</option>
          <option value="procurement_staff">تدارکات</option>
          <option value="service">خدمات</option>
          <option value="parts_mgmt">مدیریت قطعات</option>
          <option value="pcb_mgmt">مدیریت برد مدارچاپی</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addStaffMember()">+ افزودن</button>
    </div>
    <table>
      <thead><tr><th>شماره پرسنلی</th><th>ایمیل</th><th>نام</th><th>موبایل</th><th>سمت</th><th>وضعیت بات</th><th>فعال</th><th></th><th></th></tr></thead>
      <tbody id="staffTableBody"></tbody>
    </table>
    <div id="authAdminBox" style="margin-top:28px"></div>
  `;
}
const DJANGO_STAFF_API = 'https://api.smartchipelec.com/api/staff/staff/';
// ⚠️ (۱۴۰۵/۰۶/۱۸) طبق دستور صریح کاربر: جدول یکپارچه — یه ردیف واحد برای
// هر کارمند، نه دو جدول جدا با دو اسم. staffBotListM از api/bot/staff-list/
// میاد و بر اساس id با staffList (که از api/staff/staff/ میاد) وصل می‌شه.
let staffBotListM = [];
async function loadStaff(){
  try{
    const res = await fetch(DJANGO_STAFF_API);
    if(res.ok){ staffList = await res.json(); }
  }catch(e){}
  try{
    const botRes = await fetch('https://api.smartchipelec.com/api/bot/staff-list/');
    if(botRes.ok) staffBotListM = await botRes.json();
  }catch(e){ staffBotListM = []; }
  if(!staffList.length){
    const res=await sheetCall('getStaffList');
    staffList=(res&&res.staff)||[];
  }
  renderTable();
  renderAuthAdmin();
}
// ══════════════════════════════════════════════════════════════
// 🔐 ورودهایِ امن (۱۴۰۵/۰۷/۰۸) — فقط مدیریت: دستگاه‌هایِ واردشده، خروجِ دستگاه، و
//   «درخواست‌هایِ بدونِ ورود» (قبل از روشن کردنِ قفل، اینجا خالی یا فقط موارد شناخته‌شده باشه)
// ══════════════════════════════════════════════════════════════
const AUTH_API = 'https://api.smartchipelec.com/api/staff/auth/';
const _faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function _authAgo(iso){
  if(!iso) return '—';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(m < 2) return 'همین الان'; if(m < 60) return _faNum(m)+' دقیقه پیش';
  const h = Math.round(m/60); if(h < 48) return _faNum(h)+' ساعت پیش';
  return _faNum(Math.round(h/24))+' روز پیش';
}
async function renderAuthAdmin(){
  const box = document.getElementById('authAdminBox'); if(!box) return;
  let ss, ml;
  try{
    const [a, b] = await Promise.all([fetch(AUTH_API+'sessions/'), fetch(AUTH_API+'miss-log/')]);
    if(a.status === 403 || a.status === 401){ box.innerHTML = ''; return; }
    ss = await a.json(); ml = b.ok ? await b.json() : {rows:[]};
  }catch(e){ box.innerHTML = '<div style="color:var(--muted);font-size:12px">بخشِ ورودهایِ امن هنوز روی سرور نصب نشده.</div>'; return; }
  const mode = ss.mode || 'log';
  const modeTxt = {off:'خاموش — بدونِ بررسی', log:'مرحله‌ی اول — بررسی و ثبت، بدونِ رد کردن', on:'قفل روشن — فقط با ورودِ امن'}[mode];
  const modeCol = {off:'var(--muted)', log:'#f0a500', on:'#4ade80'}[mode];
  const by = {};
  (ss.sessions||[]).forEach(x => (by[x.email] = by[x.email] || {name:x.name, list:[]}).list.push(x));
  const loggedEmails = new Set(Object.keys(by));
  const notYet = (staffList||[]).filter(s => s.active !== false && !loggedEmails.has(String(s.email).toLowerCase()) && !loggedEmails.has(s.email));
  box.innerHTML = `
    <h3 style="margin:0 0 6px;font-size:15px">🔐 ورودهایِ امن</h3>
    <div style="font-size:12px;margin-bottom:12px">حالتِ فعلی: <b style="color:${modeCol}">${modeTxt}</b>
      <span style="color:var(--muted)"> · تغییر با متغیرِ <code>MADAR_AUTH_MODE</code> در Render (off / log / on)</span></div>
    ${mode !== 'on' ? `<div style="font-size:12px;line-height:2;background:var(--surface,rgba(255,255,255,.03));border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px">
      📌 <b>یادداشت — قدمِ بعدیِ ورودِ امن</b><br>
      وقتی همه‌ی کارمندها حداقل یک بار وارد شدن (مدار خودش در بله خبرتون می‌کنه):<br>
      ۱. <span dir="ltr">dashboard.render.com</span> ← سرویسِ <b>smartchip-backend</b> ← <b>Environment</b><br>
      ۲. مقدارِ <code>MADAR_AUTH_MODE</code> رو از <code>log</code> به <code>on</code> تغییر بدید ← <b>Save Changes</b><br>
      ۳. اگه مشکلی پیش اومد، همون مقدار رو برگردونید روی <code>log</code> — یک دقیقه‌ای به حالتِ قبل برمی‌گرده.</div>` : ''}
    ${notYet.length ? `<div style="font-size:12px;background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.35);border-radius:10px;padding:8px 12px;margin-bottom:12px">
       هنوز با ورودِ امن وارد نشدن: <b>${notYet.map(s => s.name || s.email).join('، ')}</b> — قبل از روشن کردنِ قفل، هر کدوم یک بار وارد بشن.</div>`
      : `<div style="font-size:12px;color:#4ade80;margin-bottom:12px">✅ همه‌ی کارمندانِ فعال حداقل یک بار با ورودِ امن وارد شدن.</div>`}
    <table><thead><tr><th>کارمند</th><th>دستگاه</th><th>آخرین استفاده</th><th>IP</th><th></th></tr></thead><tbody>
      ${Object.entries(by).map(([email, g]) => g.list.map((x, i) => `<tr>
        ${i===0 ? `<td rowspan="${g.list.length}" style="font-weight:700">${g.name||email}<div style="font-size:10px;color:var(--muted)">${email}</div>
          ${g.list.length>1 || true ? `<button class="btn btn-ghost" style="font-size:10px;padding:2px 8px;margin-top:4px" onclick="authRevokeAll('${email}')">خروج از همه‌ی دستگاه‌ها</button>` : ''}</td>` : ''}
        <td>${x.device||'—'}</td><td>${_authAgo(x.last_used_at)}</td><td style="direction:ltr;font-size:11px">${x.ip||''}</td>
        <td><button class="btn btn-ghost" style="font-size:10px;padding:2px 8px" onclick="authRevoke(${x.id})">خروج</button></td></tr>`).join('')).join('')
        || '<tr><td colspan="5" style="color:var(--muted);text-align:center">هنوز کسی با ورودِ امن وارد نشده</td></tr>'}
    </tbody></table>
    <h3 style="margin:22px 0 6px;font-size:14px">درخواست‌هایِ بدونِ ورود <span style="font-size:11px;font-weight:400;color:var(--muted)">— اگه قفل روشن بود، این‌ها رد می‌شدن</span></h3>
    ${(ml.rows||[]).length ? `<table><thead><tr><th>مسیر</th><th>نوع</th><th>دلیل</th><th>تعداد</th><th>آخرین بار</th></tr></thead><tbody>
      ${ml.rows.map(r => `<tr><td style="direction:ltr;text-align:left;font-size:11px">${r.path}</td><td>${r.method}</td><td>${r.reason==='missing'?'بدونِ ورود':'ورودِ نامعتبر'}</td><td>${_faNum(r.count)}</td><td>${_authAgo(r.last_seen)}</td></tr>`).join('')}
      </tbody></table><button class="btn btn-ghost" style="font-size:11px;margin-top:6px" onclick="authClearMiss()">پاک کردنِ این فهرست</button>`
      : '<div style="font-size:12px;color:#4ade80">✅ درخواستِ بدونِ ورودی ثبت نشده.</div>'}`;
}
async function authRevoke(id){
  if(!confirm('این دستگاه از مدار خارج بشه؟')) return;
  await fetch(AUTH_API+'sessions/'+id+'/revoke/', {method:'POST'}); renderAuthAdmin();
}
async function authRevokeAll(email){
  if(!confirm('همه‌ی دستگاه‌هایِ '+email+' از مدار خارج بشن؟ (مثلاً گوشیِ گم‌شده یا پایانِ همکاری)')) return;
  await fetch(AUTH_API+'revoke-all/', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})}); renderAuthAdmin();
}
async function authClearMiss(){
  if(!confirm('فهرستِ درخواست‌هایِ بدونِ ورود پاک بشه؟')) return;
  await fetch(AUTH_API+'miss-log/clear/', {method:'POST'}); renderAuthAdmin();
}
// آیکون‌های واقعی (نه ایموجی ژنریک) — تلگرام آبی با هواپیمای کاغذی، بله سبز با تیک
const TG_ICON_SVG = `<svg width="18" height="18" style="vertical-align:middle" title="تلگرام"><circle cx="9" cy="9" r="9" fill="#0088cc"/><path d="M13.5 5.5L4.5 9l3 1 1 3.5 1.5-2.5 2.5 2L13.5 5.5z" fill="#fff"/></svg>`;
const BALE_ICON_SVG = `<svg width="18" height="18" style="vertical-align:middle;margin-right:4px" title="بله"><circle cx="9" cy="9" r="9" fill="#22C35E"/><path d="M5.5 9.2l2 2 5-5.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const WA_ICON_SVG = `<svg width="12" height="12"><path d="M6 0C2.7 0 0 2.7 0 6c0 1.1.3 2.1.8 3L0 12l3.1-.8c.9.5 1.9.8 2.9.8 3.3 0 6-2.7 6-6S9.3 0 6 0z" fill="#25D366"/></svg>`;
// ⚠️ (۱۴۰۵/۰۶/۱۸) _staffInvitedThisSessionM حذف شد — دیگه لازم نیست چون
// inviteSent مستقیم از دیتابیس (BotInvite واقعی) میاد، نه یه حالت موقت.
function botStatusCellHTML(staffId){
  const b = staffBotListM.find(x=>String(x.id)===String(staffId));
  if(!b){
    // ⚠️ لیست بات هنوز نیومده یا این کارمند توش نیست — فرض امن: هنوز دعوت نرفته
    return `<button class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:5px;color:#25D366" onclick="sendStaffBotInviteWhatsAppAdmin(${staffId})">${WA_ICON_SVG} ارسال دعوت</button>`;
  }
  if(b.telegramConnected || b.baleConnected){
    return (b.telegramConnected?TG_ICON_SVG:'') + (b.baleConnected?BALE_ICON_SVG:'');
  }
  // ⚠️ (۱۴۰۵/۰۶/۱۸) حالت سوم «منتظر استارت» — حالا دائمیه، چون بک‌اند
  // (list_staff_for_assignment) فیلد inviteSent رو مستقیم از BotInvite
  // واقعیِ دیتابیس محاسبه می‌کنه، نه یه حالت موقتِ سمت مرورگر.
  if(b.inviteSent){
    return `<span style="color:var(--yellow);font-size:11px">⏳ منتظر استارت</span>`;
  }
  return `<button class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:5px;color:#25D366" onclick="sendStaffBotInviteWhatsAppAdmin(${staffId})">${WA_ICON_SVG} ارسال دعوت</button>`;
}
function renderTable(){
  const el=document.getElementById('staffTableBody');
  if(!staffList.length){el.innerHTML='<tr><td colspan="9" style="text-align:center;color:var(--muted)">هنوز کارمندی ثبت نشده</td></tr>';return;}
  // ⚠️ (۱۴۰۵/۰۶/۱۴) طبق درخواست کاربر: شماره پرسنلی صعودی و همیشگی —
  // همون id پیش‌فرض جنگو که هیچ‌وقت با حذف رکورد دوباره استفاده نمی‌شه،
  // پس همیشه می‌شه فهمید تا الان چند نفر کارمند اومدن (بدون توجه به اینکه
  // چندتاشون هنوز فعالن یا حذف شدن).
  el.innerHTML=staffList.slice().sort((a,b)=>a.id-b.id).map(s=>`
    <tr>
      <td style="color:var(--muted);font-size:11px">#${s.id}</td>
      <td style="font-size:11px">${s.email}</td>
      <td>${s.name||'—'}</td>
      <td style="font-size:11px">${s.mobile||'—'}</td>
      <td>${ROLE_LABELS[s.role]||s.role}</td>
      <td>${botStatusCellHTML(s.id)}</td>
      <td><button class="btn btn-ghost btn-sm" style="color:${s.active?'var(--green)':'var(--red)'}" onclick="toggleStaffActive('${s.email}',${!s.active})">${s.active?'✅ فعال':'❌ غیرفعال'}</button></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openEditStaffModal('${s.email}')">✏️ ویرایش</button></td>
      <td><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="removeStaffMember('${s.email}')">حذف</button></td>
    </tr>`).join('');
}
function openEditStaffModal(email){
  const s = staffList.find(x=>x.email===email);
  if(!s) return;
  const roleOptions = Object.keys(ROLE_LABELS).filter(k=>!['admin','sales','ops','finance'].includes(k)); // نسخه‌های قدیمی رو تو دراپ‌داون نشون نده
  const html = `
    <div id="editStaffOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999" onclick="if(event.target===this) closeEditStaffModal()">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:340px">
        <div style="font-size:13px;font-weight:700;margin-bottom:14px">✏️ ویرایش — شماره پرسنلی #${s.id}</div>
        <label class="form-label">ایمیل گوگل</label>
        <input class="form-control" id="editStaffEmail" value="${s.email}" style="margin-bottom:10px;direction:ltr;text-align:left"/>
        <label class="form-label">نام</label>
        <input class="form-control" id="editStaffName" value="${(s.name||'').replace(/"/g,'&quot;')}" style="margin-bottom:10px"/>
        <label class="form-label">موبایل</label>
        <input class="form-control" id="editStaffMobile" value="${s.mobile||''}" style="margin-bottom:10px"/>
        <label class="form-label">سمت</label>
        <select class="form-control" id="editStaffRole" style="margin-bottom:14px">
          ${roleOptions.map(k=>`<option value="${k}" ${s.role===k?'selected':''}>${ROLE_LABELS[k]}</option>`).join('')}
        </select>
        <div id="editStaffError" style="color:var(--red);font-size:11px;margin-bottom:8px;display:none"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" onclick="submitEditStaff('${email}')">💾 ذخیره</button>
          <button class="btn btn-ghost" style="flex:1" onclick="closeEditStaffModal()">انصراف</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function closeEditStaffModal(){
  const el = document.getElementById('editStaffOverlay');
  if(el) el.remove();
}
async function submitEditStaff(originalEmail){
  const newEmail = document.getElementById('editStaffEmail').value.trim().toLowerCase();
  const errEl = document.getElementById('editStaffError');
  if(!newEmail || !newEmail.includes('@')){
    errEl.textContent = '⚠ ایمیل معتبر وارد کن';
    errEl.style.display = 'block';
    return;
  }
  const patch = {
    email: newEmail,
    name: document.getElementById('editStaffName').value.trim(),
    mobile: document.getElementById('editStaffMobile').value.trim(),
    role: document.getElementById('editStaffRole').value,
  };
  try{
    // ⚠️ آدرس درخواست با ایمیل *قبلی* پیدا می‌شه (چون هنوز شناسه‌ی مسیره)،
    // ولی مقدار جدید تو خودِ بدنه فرستاده می‌شه — جنگو خودش فیلد رو آپدیت می‌کنه
    const res = await fetch(DJANGO_STAFF_API+encodeURIComponent(originalEmail)+'/', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      errEl.textContent = errData.email ? '⚠ این ایمیل قبلاً برای یه کارمند دیگه ثبت شده' : 'ذخیره ناموفق بود';
      errEl.style.display = 'block';
      return;
    }
  }catch(e){
    errEl.textContent = '⚠️ اتصال به سرور برقرار نشد';
    errEl.style.display = 'block';
    return;
  }
  closeEditStaffModal();
  await loadStaff();
}
async function addStaffMember(){
  const email=document.getElementById('newEmail').value.trim().toLowerCase();
  const name=document.getElementById('newName').value.trim();
  const mobile=document.getElementById('newMobile').value.trim();
  const role=document.getElementById('newRole').value;
  if(!email||!email.includes('@')){alert('⚠ ایمیل معتبر وارد کن');return;}
  try{
    const res = await fetch(DJANGO_STAFF_API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,name,mobile,role,active:true})});
    if(!res.ok){ const err = await res.json().catch(()=>({})); alert(err.email ? 'این ایمیل قبلاً ثبت شده' : 'خطا در ثبت'); return; }
  }catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); return; }
  document.getElementById('newEmail').value='';
  document.getElementById('newName').value='';
  document.getElementById('newMobile').value='';
  await loadStaff();
}
async function toggleStaffActive(email,active){
  try{ await fetch(DJANGO_STAFF_API+encodeURIComponent(email)+'/', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({active})}); }
  catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); }
  await loadStaff();
}
async function removeStaffMember(email){
  if(!confirm(`دسترسی «${email}» کاملاً حذف شود؟`))return;
  try{ await fetch(DJANGO_STAFF_API+encodeURIComponent(email)+'/', {method:'DELETE'}); }
  catch(e){ alert('⚠️ اتصال به سرور برقرار نشد'); }
  await loadStaff();
}

// ══════════════════════════════════════════════════════════════
// 🤖 وضعیت اتصال بات کارمندان — کپی از erp.html/ابزار (۱۴۰۵/۰۶/۱۸)
// ⚠️ طبق درخواست کاربر: همینجا، تو خودِ مدیریت کارمندان، باشه — نه فقط
// تو ERP — تا وقتی کارمندی اضافه/ویرایش می‌شه، همینجا هم دیده بشه.
// ══════════════════════════════════════════════════════════════
// ⚠️ (۱۴۰۵/۰۶/۱۸) renderStaffBotStatus حذف شد — منطقش ادغام شد تو
// botStatusCellHTML/renderTable (جدول یکپارچه، طبق دستور کاربر).
async function sendStaffBotInviteWhatsAppAdmin(staffId){
  try{
    const httpRes = await fetch('https://api.smartchipelec.com/api/bot/send-staff-invite/', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({staffId})
    });
    const res = await httpRes.json();
    if(!res || !res.ok){
      alert('⚠️ ساخت دعوت‌نامه ناموفق بود: '+(res?.error||'نامشخص'));
      return;
    }
    // ⚠️ لینک‌های تلگرام/بله رو مستقیم از خودِ متنی که سرور برگردونده استخراج
    // می‌کنیم (نه فرض‌کردن ساختار) — تا همیشه دقیقاً همونی باشه که واقعاً
    // ساخته شده، حتی اگه بعداً بک‌اند عوض بشه.
    const msg = res.message || '';
    await navigator.clipboard.writeText(msg).catch(()=>{});
    window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank');
    // ⚠️ (۱۴۰۵/۰۶/۱۸) دوباره از سرور رفرش می‌کنیم (نه فقط renderTable با
    // داده‌ی قدیمی) — چون تازه یه BotInvite جدید تو دیتابیس ساخته شده که
    // باید تو staffBotListM هم بیاد تا inviteSent=true نشون بده.
    await loadStaff();
  }catch(e){ alert('⚠️ خطای شبکه — دوباره امتحان کن'); }
}
init();
</script>
<script>
// ⚠️ (۱۴۰۵/۰۶/۱۸) ثبتِ سرویس‌ورکر برای قابلیتِ نصب (PWA)
// ⚠️ (۱۴۰۵/۰۷/۰۹) طبقِ تصمیمِ کاربر: PWA کاملاً برداشته شد — منشأِ چند خرابیِ واقعیِ اخیر بود.
// اگه قبلاً رویِ این مرورگر نصب شده باشه، فایلِ sw.js (که رویِ سرور با یک نسخه‌ی خودکارحذف‌کننده
// جایگزین شده) دفعه‌یِ بعد که این صفحه باز بشه، خودش رو کاملاً از مرورگر پاک می‌کنه.
</script>
