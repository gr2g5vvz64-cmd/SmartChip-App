<!DOCTYPE html>
<html lang="fa" dir="rtl" data-page-perm="access.manage">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){ downUntil = Date.now() + 5*60*1000; return orig(alt, init); });
  };
})();
</script>
<script src="./madar-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1218">
<title>👥 مرکز افراد — مدار</title>
<style>
:root{--bg:#0f1218;--card:#1a1e2a;--card2:#232838;--line:#323952;--ink:#f4f5f8;--soft:#9aa2bd;--acc:#f0a500;--ok:#34d399;--no:#f87171;--warn:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.7}
.wrap{max-width:none;margin:0 auto;padding:18px clamp(16px,2.4vw,48px) 110px}
a{color:var(--acc);text-decoration:none}
h1{font-size:21px;margin:6px 0 2px}.sub{color:var(--soft);font-size:12.5px;margin-bottom:12px}
.lay{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:10px}
input,select,button,textarea{font:inherit;color:var(--ink)}
input[type=search]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:8px}
.pp{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.pp:hover{background:var(--card2)}.pp.on{background:rgba(240,165,0,.14);border-color:var(--acc)}
.pp b{font-size:13px;display:block}.pp small{color:var(--soft);font-size:11px}
.av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc);flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.tab{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--soft)}
.tab.on{background:rgba(240,165,0,.18);border-color:var(--acc);color:var(--acc);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid #262c3d;flex-wrap:wrap}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:180px}.row .l b{font-size:13px}.row .l small{display:block;color:var(--soft);font-size:11.5px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#141821;border-color:var(--acc);font-weight:800}
.btn.bad{color:var(--no)}
select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.tag{font-size:11px;border-radius:8px;padding:0 8px;border:1px solid var(--line);color:var(--soft)}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.5)}.tag.no{color:var(--no);border-color:rgba(248,113,113,.5)}.tag.w{color:var(--warn);border-color:rgba(251,146,60,.5)}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{display:none}
.sw span{position:absolute;inset:0;background:#3a4156;border-radius:14px;cursor:pointer;transition:.15s}
.sw span::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span::after{right:21px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.kp div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:11.5px;color:var(--soft)}
.kp b{display:block;font-size:20px;color:var(--ink)}
.g{font-size:12px;font-weight:800;color:var(--soft);margin:14px 0 2px}
.empty{color:var(--soft);padding:20px;text-align:center}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:none;z-index:50}
@media (max-width:820px){.lay{grid-template-columns:1fr}.list{position:static;max-height:240px}}

/* ── نقش‌ها و تاریخچه (از پنلِ دسترسیِ قدیمی آمد) ── */
.topbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.topbar .tab{font-weight:700;padding:8px 16px}
.banner{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.45);color:#ffd7b0;border-radius:12px;padding:10px 14px;font-size:12.5px;margin:0 0 12px}
.banner.good{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.4);color:#b9f3da}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card2);color:var(--soft);border:0;padding:7px 14px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--acc);color:#141821;font-weight:800}
.legend{color:var(--soft);font-size:11.5px;margin:0 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.mwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:72vh}
table.m{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px}
table.m th,table.m td{border-bottom:1px solid #262c3d;border-left:1px solid #262c3d;padding:0;text-align:center;background:var(--card)}
table.m thead th{position:sticky;top:0;z-index:3;background:#202637;font-size:11.5px;padding:8px 6px;min-width:82px;line-height:1.5}
table.m th.rowh{position:sticky;right:0;z-index:2;background:#202637;text-align:right;padding:8px 12px;min-width:230px;max-width:260px}
table.m thead th.rowh{z-index:4}
table.m tr.grp th{background:#171b26;color:var(--acc);text-align:right;padding:6px 12px;font-size:12px;position:sticky;right:0}
.rl{font-weight:700}.rd{color:var(--soft);font-size:11px;font-weight:400}
.cell{width:100%;height:42px;border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--ok);position:relative}
.cell.no{color:var(--no)}.cell.lock{cursor:default;opacity:.55}
.cell.mod::after{content:"";position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.cell:hover:not(.lock){background:rgba(255,255,255,.05)}
.plist{display:grid;gap:8px}
.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.prow .t{flex:1;min-width:200px}.prow .t b{font-size:13.5px}.prow .t div{color:var(--soft);font-size:11.5px}
.tg{position:relative;width:48px;height:26px;border-radius:13px;background:#3a4156;border:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--ok)}.tg.on::after{right:25px}
.mod-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-inline-start:6px}
.grpt{color:var(--acc);font-weight:800;font-size:12.5px;margin:14px 2px 6px}
table.log{width:100%;border-collapse:collapse;font-size:12.5px}
table.log th,table.log td{padding:8px 10px;border-bottom:1px solid #262c3d;text-align:right}
table.log th{color:var(--soft);font-weight:600}
</style>
<script src="./madar-theme.js"></script>

<body>
<div class="wrap">
  <a href="index.html" style="font-size:12.5px">← صفحه‌یِ اصلی</a>
  <h1>👥 مرکز افراد</h1>
  <div class="sub">برایِ هر نفر یک جا: مشخصات و نقش، دسترسی‌ها، اتصالِ بله و پیام‌ها، تفویض‌ها. پنلِ دسترسی، مدیریتِ کارمندان و ورودِ امن همه همین‌جاست.</div>
  <div class="topbar" id="topbar"><span class="tab on" data-v="people">👤 افراد</span><span class="tab" data-v="roles">🧩 نقش‌ها (چه کسی چه ببیند)</span><span class="tab" data-v="log">🕘 تاریخچهٔ تغییرِ دسترسی</span><span class="tab" data-v="auth">🔐 ورودهای امن</span></div>
  <div id="extra" style="display:none"></div>
  <div class="lay" id="layPeople">
    <aside class="card list"><button class="btn pri" id="newBtn" style="width:100%;margin-bottom:8px">＋ کارمندِ تازه</button><input type="search" id="q" placeholder="🔍 جستجوی نام…"><div id="plist"><div class="empty">در حالِ بارگذاری…</div></div></aside>
    <main class="card" id="pane"><div class="empty">یک نفر را از فهرست انتخاب کنید.</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const API='https://api.smartchipelec.com';
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function myEmail(){ try{ return localStorage.getItem('smartchip_user_email')||localStorage.getItem('smartchip_erp_email')||''; }catch(e){ return ''; } }
function toast(t,err){ const e=$('toast'); e.textContent=(err?'⚠️ ':'')+t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2600); }
async function call(path,body){
  const em=myEmail();
  const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({actor_email:em},body))}:{cache:'no-store'};
  const url=API+path+(body?'':((path.includes('?')?'&':'?')+'email='+encodeURIComponent(em)));
  const r=await fetch(url,opt); let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j||j.ok===false) throw new Error((j&&j.error)||('خطا '+r.status));
  return j;
}
const nname=s=>String(s||'').replace(/‌/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').split(/\s+/).filter(Boolean).join(' ');
let D=null, STRUCT=null, DEL=null, SEL=null, TAB='profile', Q='';

async function init(){
  try{
    D=await call('/api/access/admin/matrix/');
  }catch(e){ $('plist').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'<br>این صفحه فقط برایِ مدیریت است.</div>'; return; }
  STRUCT=await call('/api/org/structure/').catch(()=>null);
  DEL=await call('/api/delegations/stats/?scope=all').catch(()=>null);
  drawList();
  const h=decodeURIComponent((location.hash||'').slice(1)); if(h){ const p=D.staff.find(s=>s.email.toLowerCase()===h.toLowerCase()); if(p) pick(p.email); }
}
const roleLabel=k=>((D.roles||[]).find(r=>r.key===k)||{label:k}).label;
function drawList(){
  const l=D.staff.filter(s=>!Q||nname(s.name+' '+s.email).includes(nname(Q)));
  $('plist').innerHTML=l.map(s=>`<div class="pp ${SEL&&SEL.toLowerCase()===s.email.toLowerCase()?'on':''}" data-e="${esc(s.email)}"><span class="av">${esc((s.name||'?').trim()[0])}</span><span><b>${esc(s.name)}</b><small>${esc(roleLabel(s.role))}</small></span></div>`).join('')||'<div class="empty">پیدا نشد</div>';
  $('plist').querySelectorAll('.pp').forEach(e=>e.onclick=()=>pick(e.dataset.e));
}
$('newBtn').onclick=newStaff;
$('q').oninput=e=>{ Q=e.target.value; drawList(); };
function me(){ return D.staff.find(s=>s.email.toLowerCase()===(SEL||'').toLowerCase()); }
function pick(email){ SEL=email; history.replaceState(null,'','#'+encodeURIComponent(email)); drawList(); render(); }
function render(){
  const p=me(); if(!p) return;
  const T=[['profile','🪪 مشخصات و نقش'],['perms','🔑 دسترسی‌ها'],['bale','💬 اتصال بله و پیام‌ها'],['deleg','🤝 تفویض‌ها']];
  $('pane').innerHTML=`<div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:46px;height:46px;font-size:20px">${esc((p.name||'?')[0])}</span><div><h1 style="margin:0">${esc(p.name)}</h1><div class="sub" style="margin:0" dir="ltr">${esc(p.email)}</div></div></div>
    <div class="tabs">${T.map(t=>`<span class="tab ${TAB===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</span>`).join('')}</div><div id="tabBody"><div class="empty">…</div></div>`;
  $('pane').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ TAB=t.dataset.t; render(); });
  ({profile:tProfile,perms:tPerms,bale:tBale,deleg:tDeleg}[TAB])(p);
}

/* ───── ۱) مشخصات و نقش ───── */
function myAssign(p){
  const out=[]; ((STRUCT&&STRUCT.units)||[]).forEach(u=>(u.positions||[]).forEach(po=>(po.people||[]).forEach(a=>{
    if(a.staff&&String(a.staff.email||'').toLowerCase()===p.email.toLowerCase()) out.push({id:a.id,unit:u.name,icon:u.icon,title:po.title,kind:po.kind_label,primary:a.is_primary});
  })));
  return out;
}
async function sapi(method,path,body){
  const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const m=j&&(j.detail||j.error||Object.values(j).flat().join(' ')); throw new Error(m||('خطا '+r.status)); }
  return j;
}
const ROLE_OPTS=()=>(D.roles||[]).filter(r=>r.key!=='admin');
async function tProfile(p){
  let full={}; try{ full=await sapi('GET','/api/staff/staff/'+encodeURIComponent(p.email)+'/'); }catch(e){}
  const as=myAssign(p), canEdit=STRUCT&&STRUCT.can_edit;
  const pos=[]; ((STRUCT&&STRUCT.units)||[]).forEach(u=>(u.positions||[]).forEach(po=>pos.push([po.id,(u.icon||'')+' '+u.name+' — '+po.title])));
  $('tabBody').innerHTML=`
   <div class="g">🪪 مشخصات</div>
   <div class="row"><div class="l"><b>ایمیل (ورود)</b><small>با همین ایمیل وارد می‌شود</small></div><input id="fEmail" value="${esc(full.email||p.email)}" dir="ltr" style="background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:200px"></div>
   <div class="row"><div class="l"><b>نام</b></div><input id="fName" value="${esc(full.name||p.name)}" style="background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:200px"></div>
   <div class="row"><div class="l"><b>موبایل</b></div><input id="fMob" value="${esc(full.mobile||'')}" dir="ltr" style="background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:200px"></div>
   <div class="row"><div class="l"><b>نقشِ دسترسی</b><small>تعیین می‌کند چه صفحه‌هایی برایِ این نفر باز است</small></div>
     <select id="fRole">${ROLE_OPTS().map(r=>`<option value="${esc(r.key)}" ${r.key===(full.role||p.role)?'selected':''}>${esc(r.label)}</option>`).join('')}</select></div>
   <div class="row"><div class="l"><b>فعال</b><small>غیرفعال = دیگر نمی‌تواند وارد شود</small></div><label class="sw"><input type="checkbox" id="fAct" ${full.active===false?'':'checked'}><span></span></label></div>
   <div class="row"><span class="sub" style="margin:0">دستگاه‌هایِ واردشده و خروج: تبِ بالایِ صفحه «🔐 ورودهای امن».</span><button class="btn bad" id="fDel">حذفِ کامل</button><button class="btn pri" id="fSave">ذخیره</button></div>
   <div class="g">🏢 سِمَت‌ها در سازمان</div>
   ${as.length?as.map(a=>`<div class="row"><div class="l"><b>${esc(a.icon||'')} ${esc(a.unit)} — ${esc(a.title)}</b><small>${esc(a.kind||'')}${a.primary?' · اصلی':''}</small></div>${canEdit?`<button class="btn bad" data-un="${a.id}">برداشتن</button>`:''}</div>`).join(''):'<div class="empty" style="padding:8px">سِمَتی ندارد</div>'}
   ${canEdit&&pos.length?`<div class="row"><select id="posSel">${pos.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select><button class="btn pri" id="posAdd">＋ افزودنِ سِمَت</button></div>`:''}`;
  $('fSave').onclick=async()=>{
    const role=$('fRole').value; if(role!==(full.role||p.role)&&!confirm('نقشِ دسترسیِ این نفر عوض می‌شود. ادامه؟')) return;
    const ne=$('fEmail').value.trim().toLowerCase(); if(!ne||ne.indexOf('@')<1){ toast('ایمیلِ معتبر بنویسید',true); return; }
    try{ await sapi('PATCH','/api/staff/staff/'+encodeURIComponent(p.email)+'/',{email:ne,name:$('fName').value.trim(),mobile:$('fMob').value.trim(),role,active:$('fAct').checked});
      D=await call('/api/access/admin/matrix/'); toast('ذخیره شد'); SEL=ne; history.replaceState(null,'','#'+encodeURIComponent(ne)); drawList(); render(); }catch(e){ toast(/email|unique|exist/i.test(e.message)?'این ایمیل برایِ نفرِ دیگری ثبت شده':e.message,true); }
  };
  $('fDel').onclick=async()=>{
    if(!confirm('دسترسیِ «'+p.name+'» کاملاً حذف شود؟\n(اگر فقط نمی‌خواهید وارد شود، «فعال» را خاموش کنید.)')) return;
    try{ await sapi('DELETE','/api/staff/staff/'+encodeURIComponent(p.email)+'/'); D=await call('/api/access/admin/matrix/'); SEL=null; history.replaceState(null,'',location.pathname); $('pane').innerHTML='<div class="empty">حذف شد. یک نفر را از فهرست انتخاب کنید.</div>'; drawList(); toast('حذف شد'); }catch(e){ toast(e.message,true); }
  };
  $('tabBody').querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{ if(!confirm('این سِمَت برداشته شود؟')) return;
    try{ await call('/api/org/unassign/',{assignment_id:+b.dataset.un}); STRUCT=await call('/api/org/structure/'); toast('برداشته شد'); tProfile(p);}catch(e){ toast(e.message,true);} });
  const add=$('posAdd'); if(add) add.onclick=async()=>{ try{ await call('/api/org/assign/',{staff_email:p.email,position_id:+$('posSel').value}); STRUCT=await call('/api/org/structure/'); toast('افزوده شد'); tProfile(p);}catch(e){ toast(e.message,true);} };
}
async function newStaff(){
  const email=prompt('ایمیلِ کارمندِ تازه:'); if(!email) return;
  const name=prompt('نام و نام خانوادگی:'); if(!name) return;
  try{ await sapi('POST','/api/staff/staff/',{email:email.trim().toLowerCase(),name:name.trim(),role:'sales_expert',active:true});
    D=await call('/api/access/admin/matrix/'); drawList(); pick(email.trim().toLowerCase()); toast('ساخته شد — نقش و سِمَت را تنظیم کنید'); }catch(e){ toast(e.message,true); }
}

/* ───── ۲) دسترسی‌ها ───── */
async function tPerms(p){
  $('tabBody').innerHTML='<div class="empty">در حالِ بارگذاری…</div>';
  let pv; try{ pv=await call('/api/access/admin/preview/?target='+encodeURIComponent(p.email)); }catch(e){ $('tabBody').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>'; return; }
  const ov=(D.overrides||{})[p.email.toLowerCase()]||{}, locked=['owner','admin'].includes(p.role);
  const groups={}; (D.perms||[]).forEach(x=>(groups[x.group]=groups[x.group]||[]).push(x));
  let h=locked?'<div class="sub">مدیریت همیشه همه‌چیز دارد و تغییر نمی‌کند.</div>':'<div class="sub">«پیش‌فرض» یعنی مطابقِ نقش. با «مجاز» یا «ممنوع» فقط برایِ همین نفر استثنا می‌گذارید.</div>';
  Object.keys(groups).forEach(g=>{
    h+=`<div class="g">${esc(g)}</div>`+groups[g].map(x=>{
      const e=pv.perms[x.key]||{allowed:false,source:''}, st=ov[x.key]===undefined?'default':(ov[x.key]?'allow':'deny');
      return `<div class="row"><div class="l"><b>${esc(x.label)}</b><small>${esc(x.desc||'')}</small></div><span class="tag ${e.allowed?'ok':'no'}">${e.allowed?'دارد':'ندارد'}</span>${locked?'':`<select data-p="${esc(x.key)}"><option value="default" ${st==='default'?'selected':''}>پیش‌فرضِ نقش</option><option value="allow" ${st==='allow'?'selected':''}>مجاز</option><option value="deny" ${st==='deny'?'selected':''}>ممنوع</option></select>`}</div>`;
    }).join('');
  });
  $('tabBody').innerHTML=h;
  $('tabBody').querySelectorAll('select[data-p]').forEach(s=>s.onchange=async()=>{
    try{ await call('/api/access/admin/user/',{email:p.email,perm:s.dataset.p,state:s.value}); D=await call('/api/access/admin/matrix/'); toast('ذخیره شد'); tPerms(p);}catch(e){ toast(e.message,true); }
  });
}

/* ───── ۳) اتصال بله و پیام‌ها ───── */
async function tBale(p){
  $('tabBody').innerHTML='<div class="empty">در حالِ بارگذاری…</div>';
  let d; try{ d=await call('/api/announce/prefs/?target='+encodeURIComponent(p.email)); }catch(e){ $('tabBody').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>'; return; }
  let bots=[]; try{ bots=await (await fetch(API+'/api/bot/staff-list/')).json(); }catch(e){}
  let full={}; try{ full=await sapi('GET','/api/staff/staff/'+encodeURIComponent(p.email)+'/'); }catch(e){}
  const bi=(Array.isArray(bots)?bots:[]).find(x=>String(x.id)===String(full.id)), invited=!!(bi&&bi.inviteSent);
  const sw=(k,t,s)=>`<div class="row"><div class="l"><b>${t}</b><small>${s}</small></div><label class="sw"><input type="checkbox" data-k="${k}" ${d[k]?'checked':''}><span></span></label></div>`;
  $('tabBody').innerHTML=`
   <div class="row"><div class="l"><b>اتصال</b><small>اگر وصل نیست، کارمند باید در بله به بات پیام بدهد (راهنما: «وصل کردنِ بله/تلگرام»).</small></div>
     <span class="tag ${d.bale?'ok':'no'}">بله: ${d.bale?'وصل':'وصل نیست'}</span><span class="tag ${d.telegram?'ok':'w'}">تلگرام: ${d.telegram?'وصل':'—'}</span>
     ${(d.bale||d.telegram)?'':`<button class="btn" id="inv" ${full.id?'':'disabled'}>${invited?'⏳ دعوت رفته — دوباره بفرست':'📲 ارسالِ دعوت (واتس‌اپ)'}</button>`}
     <button class="btn" id="tst" ${(d.bale||d.telegram)?'':'disabled'}>✉️ پیامِ آزمایشی</button></div>
   <div class="g">🔔 کدام پیام‌ها برایش بیاید؟</div>
   ${sw('morning','🌅 خلاصه‌یِ صبحگاهی','یک پیام در صبح: کارهایِ امروز، تأخیرها، جلسه‌ها')}
   ${sw('urgent','🚨 فوری‌ها','دیرکرد و موردهایِ بسیار مهم، بلافاصله')}
   ${sw('meetings','🗓 یادآوریِ جلسه‌ها','۲۴ ساعت و ۱ ساعت پیش از جلسه')}`;
  $('tabBody').querySelectorAll('input[data-k]').forEach(c=>c.onchange=async()=>{ try{ await call('/api/announce/prefs/',{target:p.email,[c.dataset.k]:c.checked}); toast('ذخیره شد'); }catch(e){ toast(e.message,true); c.checked=!c.checked; } });
  const iv=$('inv'); if(iv) iv.onclick=async()=>{ iv.disabled=true; try{
      const r=await sapi('POST','/api/bot/send-staff-invite/',{staffId:full.id}); if(!r||!r.ok) throw new Error((r&&r.error)||'ساختِ دعوت ناموفق بود');
      const msg=r.message||''; try{ await navigator.clipboard.writeText(msg); }catch(e){} window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); toast('دعوت ساخته شد — متن کپی شد و واتس‌اپ باز شد'); tBale(p);
    }catch(e){ toast(e.message,true); iv.disabled=false; } };
  const t=$('tst'); if(t) t.onclick=async()=>{ t.disabled=true; try{ const r=await call('/api/announce/test/',{email:p.email}); toast(r.sent===false?'ارسال نشد':'ارسال شد'); }catch(e){ toast(e.message,true); } t.disabled=false; };
}

/* ───── ۴) تفویض‌ها ───── */
function tDeleg(p){
  const row=DEL&&(DEL.people||[]).find(x=>nname(x.name)===nname(p.name));
  if(!DEL){ $('tabBody').innerHTML='<div class="empty">آمارِ تفویض در دسترس نیست.</div>'; return; }
  $('tabBody').innerHTML=row?`<div class="sub">۳۰ روزِ اخیر — «پیگیری و تحویل»</div>
   <div class="kp"><div><b>${fa(row.open)}</b>باز</div><div><b style="color:${row.overdue?'var(--no)':'inherit'}">${fa(row.overdue)}</b>عقب‌افتاده</div><div><b>${fa(row.done30)}</b>انجام‌شده</div><div><b>${row.avg_hours==null?'—':fa(row.avg_hours)}</b>میانگینِ ساعت</div><div><b>${row.ontime_pct==null?'—':fa(row.ontime_pct)+'٪'}</b>به‌موقع</div></div>
   <div class="row" style="margin-top:12px"><span class="sub" style="margin:0">جزئیات و ثبتِ پیگیریِ تازه در «یادآوری‌ها» است.</span><a class="btn" href="reminders.html">یادآوری‌ها ›</a></div>`
   :'<div class="empty">این نفر در ۳۰ روزِ اخیر تفویضی نداشته.</div>';
}

/* ───── نمایِ بالا: افراد | نقش‌ها | تاریخچه ───── */
let TOPV='people', rview=(innerWidth<800?'one':'all'), oneRole='sales_expert';
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('fa-IR',{calendar:'persian',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function defaultOf(role,perm){ const p=(D.perms||[]).find(x=>x.key===perm); return !!p && p.default_roles.includes(role); }
function grantOf(role,perm){ const g=D.grants&&D.grants[role]; return g && Object.prototype.hasOwnProperty.call(g,perm) ? g[perm] : null; }
function roleVal(role,perm){ const r=D.roles.find(x=>x.key===role); if(r&&r.locked) return true; const g=grantOf(role,perm); return g===null?defaultOf(role,perm):g; }
function pgroups(){ const g=[]; D.perms.forEach(p=>{ let x=g.find(y=>y.name===p.group); if(!x){ x={name:p.group,items:[]}; g.push(x); } x.items.push(p); }); return g; }
function showTop(v){
  TOPV=v; history.replaceState(null,'',v==='people'?(SEL?'#'+encodeURIComponent(SEL):location.pathname):'#'+v);
  document.querySelectorAll('#topbar .tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('layPeople').style.display=v==='people'?'':'none'; $('extra').style.display=v==='people'?'none':'';
  if(v==='roles') viewRoles(); else if(v==='log') viewLog(); else if(v==='auth') viewAuth();
}
document.querySelectorAll('#topbar .tab').forEach(t=>t.onclick=()=>{ if(D) showTop(t.dataset.v); });
function modeBanner(){
  const m=D.mode;
  return m==='on' ? '<div class="banner good">🔒 قفلِ ورود روشن است — محدودیت‌هایِ این بخش در سرور هم اجرا می‌شود.</div>'
    : '<div class="banner">⚠️ قفلِ ورود الان روی حالتِ <b>'+esc(m)+'</b> است: تنظیم‌ها در منو، کاشی‌ها و داشبوردها اثر دارد، ولی سرور تا وقتی <code>MADAR_AUTH_MODE=on</code> نشود جلویِ درخواستِ مستقیم را نمی‌گیرد.</div>';
}
function viewRoles(){
  const roleOpts=D.roles.filter(r=>!r.locked).map(r=>`<option value="${r.key}" ${r.key===oneRole?'selected':''}>${esc(r.label)}</option>`).join('');
  let h=modeBanner()+`<div class="sub">مشخص کنید هر نقش چه بخش‌ها و عملیاتی را ببیند. تغییرِ یک نفر به‌تنهایی در تبِ «🔑 دسترسی‌ها»یِ همان نفر است. مدیریت همیشه همه‌چیز دارد.</div>
    <div class="tools"><div class="seg"><button data-v="all" class="${rview==='all'?'on':''}">جدولِ کلی</button><button data-v="one" class="${rview==='one'?'on':''}">فقط یک نقش</button></div>
    ${rview==='one'?`<select id="rolePick">${roleOpts}</select>`:''}</div>
    <div class="legend"><span><b style="color:var(--ok)">✔</b> مجاز</span><span><b style="color:var(--no)">✖</b> ممنوع</span><span><i class="mod-dot" style="margin:0 4px 0 0"></i> نقطه‌یِ نارنجی = با پیش‌فرض فرق دارد (با کلیکِ دوباره به پیش‌فرض برمی‌گردد)</span></div>`;
  h+=rview==='all'?matrixHtml():oneHtml();
  $('extra').innerHTML=h;
  $('extra').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ rview=b.dataset.v; viewRoles(); });
  const rp=$('rolePick'); if(rp) rp.onchange=()=>{ oneRole=rp.value; viewRoles(); };
  $('extra').querySelectorAll('[data-role][data-p]').forEach(el=>el.onclick=()=>{ if(el.classList.contains('lock')) return; toggleRole(el.dataset.role,el.dataset.p); });
}
function matrixHtml(){
  let t='<div class="mwrap"><table class="m"><thead><tr><th class="rowh">مجوز</th>'+D.roles.map(r=>`<th>${esc(r.label)}${r.locked?'<div class="rd">همه‌چیز</div>':''}</th>`).join('')+'</tr></thead><tbody>';
  pgroups().forEach(g=>{
    t+=`<tr class="grp"><th colspan="${D.roles.length+1}">${esc(g.name)}</th></tr>`;
    g.items.forEach(p=>{
      t+=`<tr><th class="rowh"><div class="rl">${esc(p.label)}</div><div class="rd">${esc(p.desc)}</div></th>`+D.roles.map(r=>{
        const v=roleVal(r.key,p.key), mod=!r.locked && v!==defaultOf(r.key,p.key);
        return `<td><button class="cell ${v?'':'no'} ${r.locked?'lock':''} ${mod?'mod':''}" data-role="${r.key}" data-p="${p.key}" title="${esc(r.label)} — ${esc(p.label)}">${v?'✔':'✖'}</button></td>`;
      }).join('')+'</tr>';
    });
  });
  return t+'</tbody></table></div>';
}
function oneHtml(){
  let h='<div class="card"><div class="plist">';
  pgroups().forEach(g=>{
    h+=`<div class="grpt">${esc(g.name)}</div>`;
    g.items.forEach(p=>{
      const v=roleVal(oneRole,p.key), mod=v!==defaultOf(oneRole,p.key);
      h+=`<div class="prow"><div class="t"><b>${esc(p.label)}</b>${mod?'<i class="mod-dot" title="با پیش‌فرض فرق دارد"></i>':''}<div>${esc(p.desc)}</div></div>
        <button class="tg ${v?'on':''}" data-role="${oneRole}" data-p="${p.key}" aria-label="${esc(p.label)}"></button></div>`;
    });
  });
  return h+'</div></div>';
}
async function toggleRole(role,perm){
  const cur=roleVal(role,perm), want=!cur, def=defaultOf(role,perm);
  const state=(want===def)?'default':(want?'allow':'deny');
  try{
    await call('/api/access/admin/role/',{role,perm,state});
    D.grants=D.grants||{}; D.grants[role]=D.grants[role]||{};
    if(state==='default') delete D.grants[role][perm]; else D.grants[role][perm]=(state==='allow');
    (D.log=D.log||[]).unshift({at:new Date().toISOString(),actor:'شما',kind:'role',target:role,perm,old:'—',new:state});
    toast('ذخیره شد'); viewRoles();
  }catch(e){ toast(e.message,true); }
}
function viewLog(){
  const lab=k=>(D.perms.find(p=>p.key===k)||{label:k}).label;
  const st={default:'پیش‌فرض',allow:'✔ مجاز',deny:'✖ ممنوع'};
  const L=D.log||[];
  const rows=L.map(l=>`<tr><td>${esc(fmtDate(l.at))}</td><td>${esc(l.actor)}</td><td>${l.kind==='role'?'نقش: '+esc(roleLabel(l.target)):'فرد: '+esc((D.staff.find(s=>s.email.toLowerCase()===String(l.target).toLowerCase())||{name:l.target}).name)}</td><td>${esc(lab(l.perm))}</td><td>${esc(st[l.old]||l.old)} ← <b>${esc(st[l.new]||l.new)}</b></td></tr>`).join('');
  $('extra').innerHTML=L.length?`<div class="card" style="overflow:auto"><table class="log"><thead><tr><th>زمان</th><th>توسطِ</th><th>برایِ</th><th>مجوز</th><th>تغییر</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">هنوز تغییری ثبت نشده</div>';
}

/* ───── ۵) ورودهای امن (از «مدیریتِ کارمندان» آمد) ───── */
const AUTH_API=API+'/api/staff/auth/';
function authAgo(iso){
  if(!iso) return '—';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<2) return 'همین الان'; if(m<60) return fa(m)+' دقیقه پیش';
  const h=Math.round(m/60); if(h<48) return fa(h)+' ساعت پیش';
  return fa(Math.round(h/24))+' روز پیش';
}
async function viewAuth(){
  $('extra').innerHTML='<div class="empty">در حالِ بارگذاری…</div>';
  let ss,ml,all=[];
  try{
    const [a,b,c]=await Promise.all([fetch(AUTH_API+'sessions/'),fetch(AUTH_API+'miss-log/'),fetch(API+'/api/staff/staff/')]);
    if(a.status===403||a.status===401){ $('extra').innerHTML='<div class="empty">این بخش فقط برایِ مدیریت است.</div>'; return; }
    ss=await a.json(); ml=b.ok?await b.json():{rows:[]}; all=c.ok?await c.json():[];
  }catch(e){ $('extra').innerHTML='<div class="empty">بخشِ ورودهایِ امن هنوز روی سرور نصب نشده.</div>'; return; }
  const mode=ss.mode||'log';
  const modeTxt={off:'خاموش — بدونِ بررسی',log:'مرحله‌یِ اول — بررسی و ثبت، بدونِ رد کردن',on:'قفل روشن — فقط با ورودِ امن'}[mode];
  const modeCol={off:'var(--soft)',log:'var(--acc)',on:'var(--ok)'}[mode];
  const by={}; (ss.sessions||[]).forEach(x=>(by[x.email]=by[x.email]||{name:x.name,list:[]}).list.push(x));
  const logged=new Set(Object.keys(by).map(e=>e.toLowerCase()));
  const notYet=(all||[]).filter(s=>s.active!==false&&!logged.has(String(s.email).toLowerCase()));
  let h=`<div class="sub">حالتِ فعلی: <b style="color:${modeCol}">${modeTxt}</b> · تغییر با متغیرِ <code>MADAR_AUTH_MODE</code> در Render (off / log / on)</div>`;
  if(mode!=='on') h+=`<div class="banner">📌 <b>قدمِ بعدی:</b> وقتی همه حداقل یک بار وارد شدند: Render ← سرویسِ <b>smartchip-backend</b> ← Environment ← <code>MADAR_AUTH_MODE</code> را از <code>log</code> به <code>on</code> بدهید ← Save. اگر مشکلی شد، برگردانید روی <code>log</code>.</div>`;
  h+=notYet.length?`<div class="banner">هنوز با ورودِ امن وارد نشده‌اند: <b>${notYet.map(s=>esc(s.name||s.email)).join('، ')}</b> — قبل از روشن کردنِ قفل، هر کدام یک بار وارد شوند.</div>`
    :'<div class="banner good">✅ همه‌یِ کارمندانِ فعال حداقل یک بار با ورودِ امن وارد شده‌اند.</div>';
  h+=`<div class="card" style="overflow:auto"><table class="log"><thead><tr><th>کارمند</th><th>دستگاه</th><th>آخرین استفاده</th><th>IP</th><th></th></tr></thead><tbody>`+
    (Object.keys(by).length?Object.entries(by).map(([email,g])=>g.list.map((x,i)=>`<tr>${i===0?`<td rowspan="${g.list.length}"><b>${esc(g.name||email)}</b><div class="rd" dir="ltr">${esc(email)}</div><button class="btn" style="font-size:11px;padding:2px 8px;margin-top:4px" data-all="${esc(email)}">خروج از همه‌یِ دستگاه‌ها</button></td>`:''}
      <td>${esc(x.device||'—')}</td><td>${authAgo(x.last_used_at)}</td><td dir="ltr">${esc(x.ip||'')}</td><td><button class="btn" style="font-size:11px;padding:2px 8px" data-rv="${x.id}">خروج</button></td></tr>`).join('')).join('')
    :'<tr><td colspan="5" class="empty">هنوز کسی با ورودِ امن وارد نشده</td></tr>')+`</tbody></table></div>
    <div class="g">درخواست‌هایِ بدونِ ورود <span style="font-weight:400">— اگر قفل روشن بود، این‌ها رد می‌شدند</span></div>`+
    ((ml.rows||[]).length?`<div class="card" style="overflow:auto"><table class="log"><thead><tr><th>مسیر</th><th>نوع</th><th>دلیل</th><th>تعداد</th><th>آخرین بار</th></tr></thead><tbody>${ml.rows.map(r=>`<tr><td dir="ltr" style="text-align:left">${esc(r.path)}</td><td>${esc(r.method)}</td><td>${r.reason==='missing'?'بدونِ ورود':'ورودِ نامعتبر'}</td><td>${fa(r.count)}</td><td>${authAgo(r.last_seen)}</td></tr>`).join('')}</tbody></table></div><button class="btn" id="mclr" style="margin-top:8px">پاک کردنِ این فهرست</button>`
    :'<div class="banner good">✅ درخواستِ بدونِ ورودی ثبت نشده.</div>');
  $('extra').innerHTML=h;
  const post=async(path,body)=>{ const r=await fetch(AUTH_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}); if(!r.ok) toast('انجام نشد',true); viewAuth(); };
  $('extra').querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{ if(confirm('این دستگاه از مدار خارج شود؟')) post('sessions/'+b.dataset.rv+'/revoke/'); });
  $('extra').querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{ if(confirm('همه‌یِ دستگاه‌هایِ '+b.dataset.all+' خارج شوند؟ (مثلاً گوشیِ گم‌شده یا پایانِ همکاری)')) post('revoke-all/',{email:b.dataset.all}); });
  const mc=$('mclr'); if(mc) mc.onclick=()=>{ if(confirm('فهرست پاک شود؟')) post('miss-log/clear/'); };
}
MadarAccess.ready(async()=>{ await init(); const h=decodeURIComponent((location.hash||'').slice(1)); if(D&&(h==='roles'||h==='log'||h==='auth')) showTop(h); });
</script>
