<!DOCTYPE html>
<html lang="fa" dir="rtl" data-page-perm="page.customers">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){ downUntil = Date.now() + 5*60*1000; return orig(alt, init); });
  };
})();
</script>
<script src="./madar-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1218">
<title>👤 مشتریان — مدار</title>
<style>
:root{--bg:#0f1218;--card:#1a1e2a;--card2:#232838;--line:#323952;--ink:#f4f5f8;--soft:#9aa2bd;--acc:#f0a500;--ok:#34d399;--no:#f87171;--warn:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 110px}
a{color:var(--acc);text-decoration:none}
h1{font-size:21px;margin:6px 0 2px}h2{font-size:15px;margin:22px 0 8px}.sub{color:var(--soft);font-size:12.5px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#141821;border-color:var(--acc);font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kp div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:11.5px;color:var(--soft)}
.kp b{display:block;font-size:22px;color:var(--ink)}.kp b.bad{color:var(--no)}.kp b.good{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:7px 9px;border-bottom:1px solid #262c3d;text-align:right}th{color:var(--soft);font-weight:600}
.tag{font-size:11px;border-radius:8px;padding:0 8px;border:1px solid var(--line);color:var(--soft);display:inline-block;margin:1px}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.5)}.tag.no{color:var(--no);border-color:rgba(248,113,113,.5)}.tag.w{color:var(--warn);border-color:rgba(251,146,60,.5)}
.empty{color:var(--soft);text-align:center;padding:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:none;z-index:50}
.box{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.35);border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:12px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--card2)}tbody tr.on{background:rgba(240,165,0,.14)}
.cnt{color:var(--soft);font-size:12px}
</style>
<script src="./madar-theme.js"></script>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="font-size:12.5px">← صفحه‌یِ اصلی</a>
  <h1>👤 مشتریان</h1>
  <div class="sub">فهرستِ همه‌یِ مشتریان. در نام، کد، موبایل، صنف، استان یا کارشناس جستجو کنید؛ روی هر مشتری بزنید تا کارتِ یکپارچه‌اش (لید، دفترِ ارزی، چک، وصول) بالا باز شود. <a href="customer-audit.html" data-perm="access.manage">🩺 سلامتِ نام‌ها (مدیریت)</a></div>

  <div class="card" id="cardBox" style="display:none"><div class="row" style="justify-content:space-between"><b>🪪 کارتِ مشتری</b><button class="btn" id="closeCard">بستن</button></div><div id="prof" style="margin-top:8px"></div></div>

  <div class="card">
    <div class="fl">
      <input id="q" placeholder="🔍 جستجو: نام، کد، موبایل…" style="min-width:280px;flex:1" autofocus>
      <select id="fCat"><option value="">همه‌یِ صنف‌ها</option></select>
      <select id="fProv"><option value="">همه‌یِ استان‌ها</option></select>
      <select id="fPri"><option value="">همه‌یِ اولویت‌ها</option></select>
      <select id="fStaff"><option value="">همه‌یِ کارشناس‌ها</option></select>
      <label class="cnt"><input type="checkbox" id="fHid"> نمایشِ مخفی‌ها</label>
    </div>
    <div class="cnt" id="cnt">در حالِ بارگذاری…</div>
    <div style="overflow:auto"><table><thead><tr><th>مشتری</th><th>کد</th><th>صنف</th><th>استان</th><th>موبایل</th><th>اولویت</th><th>کارشناس</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="more" style="display:none">نمایشِ بیشتر</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="./madar-customer-card.js"></script>
<script>
const API='https://api.smartchipelec.com';
const $=id=>document.getElementById(id);
const fa=MadarCC.fa, esc=MadarCC.esc, N=MadarCC.norm;
function myEmail(){ try{ return localStorage.getItem('smartchip_user_email')||localStorage.getItem('smartchip_erp_email')||''; }catch(e){ return ''; } }
function toast(t,err){ const e=$('toast'); e.textContent=(err?'⚠️ ':'')+t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2600); }
async function call(path){
  const em=myEmail();
  const r=await fetch(API+path+((path.includes('?')?'&':'?')+'email='+encodeURIComponent(em)),{cache:'no-store'}); let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j||j.ok===false){ const er=new Error((j&&j.error)||('خطا '+r.status)); er.data=j; throw er; }
  return j;
}
let ALL=[], VIEW=[], SHOWN=0, SELID=null; const PAGE=100;
function fillSel(id,vals){ const el=$(id); const first=el.firstElementChild; el.innerHTML=''; el.appendChild(first); [...new Set(vals.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'fa')).forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); }); }
async function load(){
  try{ const d=await call('/api/customers/identity/list/'); ALL=d.customers.map(c=>Object.assign(c,{k:N([c.name,c.abbr,c.mobile,c.category,c.province,c.staff].join(' '))})); }
  catch(e){ $('cnt').innerHTML='⚠️ '+esc(e.message); return; }
  fillSel('fCat',ALL.map(c=>c.category)); fillSel('fProv',ALL.map(c=>c.province)); fillSel('fPri',ALL.map(c=>c.priority)); fillSel('fStaff',ALL.map(c=>c.staff));
  filter();
  const h=decodeURIComponent((location.hash||'').slice(1)); if(h) openCard({name:h});
}
function filter(){
  const toks=N($('q').value).split(' ').filter(Boolean), cat=$('fCat').value, pr=$('fProv').value, pi=$('fPri').value, st=$('fStaff').value, hid=$('fHid').checked;
  VIEW=ALL.filter(c=>(hid||!c.hidden)&&(!cat||c.category===cat)&&(!pr||c.province===pr)&&(!pi||c.priority===pi)&&(!st||c.staff===st)&&toks.every(t=>c.k.includes(t)));
  SHOWN=0; $('tb').innerHTML=''; draw();
}
function draw(){
  const next=VIEW.slice(SHOWN,SHOWN+PAGE);
  $('tb').insertAdjacentHTML('beforeend',next.map(c=>`<tr data-id="${c.id}" class="${c.id===SELID?'on':''}"><td><b>${esc(c.name)}</b>${c.hidden?' <span class="tag w">مخفی</span>':''}</td><td>${esc(c.abbr)}</td><td>${esc(c.category)}</td><td>${esc(c.province)}</td><td dir="ltr" style="text-align:right">${esc(c.mobile)}</td><td>${esc(c.priority)}</td><td>${esc(c.staff)}</td></tr>`).join(''));
  SHOWN+=next.length;
  $('cnt').textContent=fa(VIEW.length)+' مشتری از '+fa(ALL.length)+(SHOWN<VIEW.length?' — '+fa(SHOWN)+' تا نمایش داده شد':'');
  $('more').style.display=SHOWN<VIEW.length?'':'none';
  $('tb').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>openCard({id:+tr.dataset.id}));
}
async function openCard(q){
  SELID=q.id||null; $('cardBox').style.display=''; $('prof').innerHTML='<div class="empty">…</div>'; scrollTo({top:0,behavior:'smooth'});
  document.querySelectorAll('#tb tr').forEach(tr=>tr.classList.toggle('on',+tr.dataset.id===SELID));
  try{
    const d=await call('/api/customers/identity/profile/?'+(q.id?'id='+q.id:'name='+encodeURIComponent(q.name)));
    $('prof').innerHTML=MadarCC.html(d); history.replaceState(null,'','#'+encodeURIComponent(d.customer.name));
  }catch(e){ $('prof').innerHTML='<div class="empty">⚠️ '+esc(e.message)+'</div>'; }
}
['q','fCat','fProv','fPri','fStaff','fHid'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',filter));
$('more').onclick=draw; $('closeCard').onclick=()=>{ $('cardBox').style.display='none'; SELID=null; history.replaceState(null,'',location.pathname); document.querySelectorAll('#tb tr.on').forEach(t=>t.classList.remove('on')); };
MadarAccess.ready(()=>load());
</script>
<script src="./madar-help.js" defer></script>
</body>
</html>
