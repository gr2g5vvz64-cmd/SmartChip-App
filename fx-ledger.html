  }));
  main.querySelectorAll('[data-unlock-exp]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ مطمئنید می‌خواید قفل رو باز کنید؟')) return;
    const res = await fetch(FX_API+'expenses/'+b.dataset.unlockExp+'/unlock/', {method:'POST'});
    if(!res.ok){ showToast('❌ بازکردنِ قفل ناموفق بود'); return; }
    showToast('✅ قفل باز شد');
    renderSupplierLedger(main);
  }));
  main.querySelectorAll('[data-show-breakdown]').forEach(b=>b.addEventListener('click', ()=>{
    const hid = +b.dataset.showBreakdown;
    const h = state.hawales.find(x=>x.id===hid);
    const bd = data.hawaleBreakdown[hid];
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>جزئیاتِ خرجِ حواله‌ی ${h.date}</h3>
        <p class="page-desc">کلِ این حواله: ${fmtYuan(bd.totalYuan)} — این‌طور خرج شده:</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>فاکتورِ خرید</th><th>مقدارِ گرفته‌شده (یوان)</th></tr></thead>
            <tbody>
              ${bd.spentItems.map(item=>`<tr><td>فاکتور #${item.invoiceId}</td><td class="num">${fmtYuan(item.yuan)}</td></tr>`).join('')}
              ${bd.remainingYuan>0.01 ? `<tr><td style="color:var(--ink-soft)">مانده‌ی تخصیص‌نیافته</td><td class="num" style="color:var(--ink-soft)">${fmtYuan(bd.remainingYuan)}</td></tr>` : ''}
            </tbody>
          </table>
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" id="closeBreakdownBtn">بستن</button></div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#closeBreakdownBtn').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  }));
}

// ⚠️ سرچ ساده‌ی تأمین‌کننده — از اسامیِ قبلاً استفاده‌شده (نه CRM، چون
// تأمین‌کننده جزو مشتریان نیست)
function getKnownSupplierNames(){
  return [...new Set([...state.hawales.map(h=>h.supplier_name), ...state.expenses.map(e=>e.supplier_name)])].filter(Boolean);
}
function getKnownCustomerNames(){
  return [...new Set([...state.orders.map(o=>o.customer_name), ...state.payments.map(p=>p.customer_name)])].filter(Boolean);
}

function openExpenseModal(existing, presetSupplier){
  const today = todayShamsi();
  const isEdit = !!existing;
  const knownSuppliers = getKnownSupplierNames();

  // ⚠️ (۱۴۰۵/۰۶/۲۹) طبق درخواستِ صریحِ کاربر: ثبتِ جدید حالا چندردیفیه
  // (چند آیتم زیرِ یه سندِ مشترک، هرکدوم مستقل با FIFOِ خودش تسویه
  // می‌شه) — ولی ویرایشِ یه رکوردِ *موجود* دقیقاً همونِ فرمِ کاملِ قبلی
  // می‌مونه (با لینکِ دستیِ حواله)، چون این برایِ یه رکوردِ مشخصه و
  // چندردیفی‌کردنِ ویرایش معنی نداره.
  if(isEdit) return openExpenseModalSingle(existing, presetSupplier);
  return openExpenseModalMultiRow(presetSupplier);
}

// ⚠️ فرمِ کاملِ تک‌ردیفیِ قدیمی — فقط برایِ ویرایش، عیناً دست‌نخورده
function openExpenseModalSingle(existing, presetSupplier){
  const today = todayShamsi();
  const isEdit = !!existing;
  const knownSuppliers = getKnownSupplierNames();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? 'ویرایش هزینه' : 'ثبت هزینه‌ی تأمین‌کننده'}</h3>
      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>تأمین‌کننده</td><td>نام تأمین‌کننده — ممکن است چند تأمین‌کننده‌ی مختلف داشته باشید، هرکدام مانده‌ی یوانیِ جدای خودشان را دارند</td></tr>
          <tr><td>پارت‌نامبر</td><td>هر خرید یک قلمِ مشخص است — پارت‌نامبرش را تایپ کنید تا از گوگل‌شیت پیشنهاد بیاید</td></tr>
          <tr><td>خرید کالا / جابجایی جنس / کارمزد حواله</td><td>همه یوانی‌اند — اگر یکی از این‌ها را ندارید، صفر بگذارید</td></tr>
          <tr><td>هزینه‌ی حمل</td><td>ریالی است، و اختیاری — فقط اگر این خرید هزینه‌ی حمل دارد پر کنید</td></tr>
          <tr><td>وضعیت پرداخت حمل</td><td>اگر هزینه‌ی حمل را هنوز پرداخت نکرده‌اید (مثلاً یک ماه بعد پرداخت می‌شود)، تیک نزنید</td></tr>
        </table>
      </div>
      <div class="field" style="margin-bottom:10px"><label>تأمین‌کننده</label>
        <input id="eSupplier" type="text" list="knownSuppliersList" value="${existing ? existing.supplier_name : (presetSupplier||'')}" placeholder="مثلاً: کلافی">
        <datalist id="knownSuppliersList">${knownSuppliers.map(s=>`<option value="${s}">`).join('')}</datalist>
      </div>
      <div class="field" style="margin-bottom:6px"><label>لینک به یک یا چند حواله‌ی خاص (اختیاری)</label>
        <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:6px">اگه می‌خواید این فاکتور دقیقاً از یک یا چند حواله‌ی مشخص کسر بشه (مثلاً وقتی مبلغِ فاکتور زیاده و چندتا حواله باید بهش برسه)، هرچندتا که خواستید تیک بزنید — وگرنه خودکار طبقِ ترتیبِ تاریخ (FIFO) تسویه می‌شه</div>
        <input id="eHawaleFilter" type="text" placeholder="🔍 فیلتر با تاریخ (اختیاری)...">
      </div>
      <div id="eHawalePickerBox" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:14px"></div>
      <div class="field" style="margin-bottom:10px">
        <label style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">
          <span>پارت‌نامبر</span>
          <span style="display:flex;gap:4px">
            <button type="button" class="btn btn-ghost btn-sm" id="syncPartsBtnLast100InModal" style="font-size:10px;padding:3px 7px">⚡ فقط جدیدها</button>
            <button type="button" class="btn btn-ghost btn-sm" id="syncPartsBtnInModal" style="font-size:10px;padding:3px 7px">🔄 ارسالِ کاملِ همه</button>
          </span>
        </label>
        <input id="ePartNumber" type="text" value="${existing ? existing.part_number||'' : ''}" placeholder="حداقل ۲ حرف تایپ کنید...">
        <div id="ePartNumberResults" style="position:relative"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>تاریخ (شمسی)</label><input id="eDate" type="text" value="${existing ? existing.date : today}" placeholder="1405-06-18"></div>
      <div class="form-row">
        <div class="field"><label>تعداد (اختیاری)</label><input id="eQty" type="text" class="num" value="${existing && existing.quantity!=null ? fmt(existing.quantity,2) : ''}" placeholder="مثلاً 100"></div>
        <div class="field"><label>فیِ خرید — واحد (یوان، اختیاری)</label><input id="eUnitPrice" type="text" class="num" value="${existing && existing.unit_price_yuan!=null ? fmt(existing.unit_price_yuan,4) : ''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>خرید کالا (یوان)</label><input id="eGoods" type="text" class="num" value="${existing ? fmt(existing.goods_yuan,4) : '0'}"></div>
        <div class="field"><label>جابجایی جنس (یوان)</label><input id="eShipping" type="text" class="num" value="${existing ? fmt(existing.shipping_yuan,4) : '0'}"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>کارمزد جابجایی حواله (یوان)</label><input id="eTransferFee" type="text" class="num" value="${existing ? fmt(existing.transfer_fee_yuan,4) : '0'}"></div>
      <div class="form-row">
        <div class="field"><label>هزینه‌ی حمل (ریال، اختیاری)</label><input id="eFreight" type="text" class="num" value="${existing && existing.freight_rial ? fmt(existing.freight_rial,0) : ''}" placeholder="خالی = این خرید حمل ندارد"></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:22px">
          <input type="checkbox" id="eFreightPaid" ${existing && existing.freight_paid ? 'checked' : ''}> <label for="eFreightPaid" style="margin:0">هزینه‌ی حمل پرداخت شده</label>
        </div>
      </div>
      <div class="field"><label>توضیح (اختیاری)</label><input id="eNote" type="text" value="${existing ? existing.note||'' : ''}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveExpenseBtn">${isEdit?'ذخیره تغییرات':'ثبت هزینه'}</button>
        <button class="btn btn-ghost" id="cancelExpenseBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelExpenseBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#eDate'));
  wirePartNumberAutocomplete(backdrop.querySelector('#ePartNumber'), backdrop.querySelector('#ePartNumberResults'));
  backdrop.querySelector('#syncPartsBtnInModal').addEventListener('click', (e)=>fxSyncPartsFromSheet(e.target));
  backdrop.querySelector('#syncPartsBtnLast100InModal').addEventListener('click', (e)=>fxSyncPartsFromSheet(e.target, true));

  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ کاربر: چند حواله (۲ تا، ۱۰ تا، هرچقدر)
  // می‌تونن به یه فاکتورِ خریدِ خاص لینک بشن — قبلاً فقط یه <select> تکی
  // بود. اینجا هم‌الگو با پیکرِ گروهیِ سمتِ مشتریه.
  //
  // ⚠️ درسِ حیاتیِ باگِ قبلی: selectedHawaleIds باید از وضعیتِ *موجود*
  // مقداردهیِ اولیه بشه (نه خالی) — وگرنه بازکردن‌وذخیره‌کردنِ بی‌ربطِ
  // این فرم، لینک‌های واقعی رو پاک می‌کنه.
  const selectedHawaleIds = new Set(
    existing ? state.hawales.filter(h=>h.manual_expense===existing.id).map(h=>h.id) : []
  );
  function renderHawalePicker(filterText){
    const supplierName = backdrop.querySelector('#eSupplier').value.trim();
    const q = (filterText||'').trim();
    const candidates = state.hawales.filter(h =>
      h.supplier_name===supplierName &&
      (h.manual_expense===null || h.manual_expense===undefined || selectedHawaleIds.has(h.id)) &&
      (!q || h.date.includes(q))
    );
    const box = backdrop.querySelector('#eHawalePickerBox');
    if(!supplierName){ box.innerHTML = '<div style="font-size:11px;color:var(--ink-soft);text-align:center;padding:8px">اول نامِ تأمین‌کننده رو بنویسید</div>'; return; }
    if(candidates.length===0){ box.innerHTML = '<div style="font-size:11px;color:var(--ink-soft);text-align:center;padding:8px">هیچ حواله‌ی بدونِ‌لینکی برای این تأمین‌کننده پیدا نشد</div>'; return; }
    box.innerHTML = candidates.map(h=>`
      <label style="display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:11.5px;cursor:pointer">
        <input type="checkbox" data-pick-hawale="${h.id}" ${selectedHawaleIds.has(h.id)?'checked':''}>
        <span>${h.date} — ${fmtRial(h.totalRial)} (نرخ ${fmt(h.rate_at_hawale,0)})</span>
      </label>`).join('');
    box.querySelectorAll('[data-pick-hawale]').forEach(cb=>cb.addEventListener('change', ()=>{
      const hid = +cb.dataset.pickHawale;
      if(cb.checked) selectedHawaleIds.add(hid); else selectedHawaleIds.delete(hid);
    }));
  }
  renderHawalePicker('');
  backdrop.querySelector('#eSupplier').addEventListener('input', ()=>renderHawalePicker(backdrop.querySelector('#eHawaleFilter').value));
  backdrop.querySelector('#eHawaleFilter').addEventListener('input', (e)=>renderHawalePicker(e.target.value));

  backdrop.querySelector('#saveExpenseBtn').addEventListener('click', async ()=>{
    let supplierName = backdrop.querySelector('#eSupplier').value.trim();
    const date = backdrop.querySelector('#eDate').value.trim();
    const partNumber = backdrop.querySelector('#ePartNumber').value.trim();
    const qtyStr = backdrop.querySelector('#eQty').value.replace(/,/g,'').trim();
    const unitPriceStr = backdrop.querySelector('#eUnitPrice').value.replace(/,/g,'').trim();
    const goods = parseFloat(backdrop.querySelector('#eGoods').value.replace(/,/g,'')) || 0;
    const shipping = parseFloat(backdrop.querySelector('#eShipping').value.replace(/,/g,'')) || 0;
    const transferFee = parseFloat(backdrop.querySelector('#eTransferFee').value.replace(/,/g,'')) || 0;
    const freightStr = backdrop.querySelector('#eFreight').value.replace(/,/g,'').trim();
    const freight = freightStr ? parseFloat(freightStr) : null;
    const freightPaid = backdrop.querySelector('#eFreightPaid').checked;
    const note = backdrop.querySelector('#eNote').value.trim();
    if(!supplierName || !date || (goods===0 && shipping===0 && transferFee===0) || goods<0 || shipping<0 || transferFee<0 || (freight!==null && freight<0)){ showToast('نام تأمین‌کننده، تاریخ، و حداقل یکی از هزینه‌های یوانیِ مثبت را وارد کنید'); return; }

    const similar = findSimilarExistingName(supplierName, getKnownSupplierNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه تأمین‌کننده با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله، همون «${similar}».\n«انصراف» = نه، این واقعاً تأمین‌کننده‌ی جدیدیه.`);
      if(useExisting) supplierName = similar;
    }

    const body = {supplier_name:supplierName, part_number:partNumber, date, goods_yuan:goods, shipping_yuan:shipping, transfer_fee_yuan:transferFee, freight_rial:freight, freight_paid:freightPaid, note,
      quantity: qtyStr?parseFloat(qtyStr):null, unit_price_yuan: unitPriceStr?parseFloat(unitPriceStr):null};
    const d = isEdit ? await apiUpdate('expenses', existing.id, body) : await apiCreate('expenses', body);
    if(!d) return;

    // ⚠️ (۱۴۰۵/۰۶/۱۸) لینک‌کردنِ گروهیِ چند حواله به این فاکتورِ خرید —
    // برعکسِ رابطه رو تنظیم می‌کنیم (روی خودِ حواله، manual_expense).
    // previouslyLinked با وضعیتِ *موجود* مقداردهیِ اولیه شده بود (نه
    // خالی)، پس اگه کاربر دست نزنه، toLink/toUnlink هردو خالی می‌مونن.
    const previouslyLinked = isEdit ? new Set(state.hawales.filter(h=>h.manual_expense===existing.id).map(h=>h.id)) : new Set();
    const toLink = [...selectedHawaleIds].filter(hid => !previouslyLinked.has(hid));
    const toUnlink = [...previouslyLinked].filter(hid => !selectedHawaleIds.has(hid));
    for(const hid of toLink) await apiUpdate('hawales', hid, {manual_expense: d.id});
    for(const hid of toUnlink) await apiUpdate('hawales', hid, {manual_expense: null});
    if(toLink.length || toUnlink.length) showToast(`✅ ثبت شد — ${toLink.length} حواله لینک شد`);

    backdrop.remove();
    currentSupplier = supplierName;
    renderMain();
  });
}

// ⚠️ (۱۴۰۵/۰۶/۲۹) فرمِ جدیدِ چندردیفی — طبق درخواستِ صریحِ کاربر: چند
// آیتم (مثلاً ۳۰تا) رو زیرِ یه سندِ مشترک، بدونِ بازکردن‌وبستنِ مودال
// ۳۰ بار، ثبت کنه. هر ردیف یه FxExpense کاملاً مستقل می‌شه (با FIFOِ
// خودش تسویه می‌شه)، فقط doc_number مشترک دارن برایِ نمایشِ گروهی.
function openExpenseModalMultiRow(presetSupplier){
  const today = todayShamsi();
  const knownSuppliers = getKnownSupplierNames();
  let rows = [{partNumber:'', qty:'', unitPrice:'', shipping:'0', transferFee:'0', note:''}];
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';

  function rowsHtml(){
    return rows.map((r,i)=>`
      <tr data-row="${i}">
        <td style="position:relative;min-width:140px">
          <input data-f="partNumber" data-row-i="${i}" type="text" value="${r.partNumber}" placeholder="پارت‌نامبر..." style="width:100%">
          <div data-part-results="${i}" style="position:relative"></div>
        </td>
        <td style="min-width:70px"><input data-f="qty" data-row-i="${i}" type="text" class="num" value="${r.qty}" placeholder="تعداد" style="width:100%"></td>
        <td style="min-width:80px"><input data-f="unitPrice" data-row-i="${i}" type="text" class="num" value="${r.unitPrice}" placeholder="فیِ خرید" style="width:100%"></td>
        <td style="min-width:80px"><input data-f="shipping" data-row-i="${i}" type="text" class="num" value="${r.shipping}" style="width:100%"></td>
        <td style="min-width:80px"><input data-f="transferFee" data-row-i="${i}" type="text" class="num" value="${r.transferFee}" style="width:100%"></td>
        <td style="min-width:100px"><input data-f="note" data-row-i="${i}" type="text" value="${r.note}" placeholder="اضافات" style="width:100%"></td>
        <td style="width:30px">${rows.length>1?`<button type="button" class="icon-btn" data-remove-row="${i}">✕</button>`:''}</td>
      </tr>`).join('');
  }

  function draw(){
    backdrop.innerHTML = `
      <div class="modal modal-landscape">
        <h3>ثبتِ سندِ خرید — چند آیتم</h3>
        <div class="field" style="margin-bottom:10px"><label>تأمین‌کننده</label>
          <input id="eSupplier" type="text" list="knownSuppliersList" value="${presetSupplier||''}" placeholder="مثلاً: کلافی">
          <datalist id="knownSuppliersList">${knownSuppliers.map(s=>`<option value="${s}">`).join('')}</datalist>
        </div>
        <div class="field" style="margin-bottom:10px"><label>تاریخ (شمسی)</label><input id="eDate" type="text" value="${today}"></div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <button type="button" class="btn btn-ghost btn-sm" id="syncPartsBtnLast100InModal" style="font-size:10.5px">⚡ فقط جدیدها</button>
          <button type="button" class="btn btn-ghost btn-sm" id="syncPartsBtnInModal" style="font-size:10.5px">🔄 ارسالِ کاملِ همه</button>
        </div>
        <div style="overflow-x:auto;margin-bottom:8px">
          <table class="data-table" style="min-width:600px">
            <thead><tr>
              <th>پارت‌نامبر</th><th>تعداد</th><th>فیِ خرید (یوان)</th><th>جابجاییِ کالا (یوان)</th><th>جابجاییِ حواله (یوان)</th><th>اضافات</th><th></th>
            </tr></thead>
            <tbody id="rowsContainer">${rowsHtml()}</tbody>
          </table>
        </div>
        <button type="button" class="btn btn-ghost" id="addRowBtn" style="margin-bottom:14px">+ افزودنِ آیتمِ بعدی</button>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px">همه‌ی آیتم‌ها زیرِ یه شماره‌سندِ مشترک ثبت می‌شن — تویِ دفترِ تأمین‌کننده، هم تک‌تک هم به‌صورتِ جمعِ کل قابلِ‌دیدنن. تسویه‌ی هرکدوم مستقل و خودکار (FIFO) انجام می‌شه.</div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="saveExpenseBtn">ثبتِ همه (${rows.length} آیتم)</button>
          <button class="btn btn-ghost" id="cancelExpenseBtn">انصراف</button>
        </div>
      </div>`;
    backdrop.querySelector('#cancelExpenseBtn').addEventListener('click',()=>backdrop.remove());
    wireShamsiDatePicker(backdrop.querySelector('#eDate'));
    const syncBtn = backdrop.querySelector('#syncPartsBtnInModal');
    if(syncBtn) syncBtn.addEventListener('click', (e)=>fxSyncPartsFromSheet(e.target));
    const syncBtnLast100 = backdrop.querySelector('#syncPartsBtnLast100InModal');
    if(syncBtnLast100) syncBtnLast100.addEventListener('click', (e)=>fxSyncPartsFromSheet(e.target, true));

    backdrop.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input', ()=>{
      const i = +inp.dataset.rowI; const f = inp.dataset.f;
      rows[i][f] = inp.value;
    }));
    backdrop.querySelectorAll('[data-row-i][data-f="partNumber"]').forEach(inp=>{
      wirePartNumberAutocomplete(inp, backdrop.querySelector(`[data-part-results="${inp.dataset.rowI}"]`));
    });
    backdrop.querySelectorAll('[data-remove-row]').forEach(b=>b.addEventListener('click', ()=>{
      rows.splice(+b.dataset.removeRow, 1); draw();
    }));
    backdrop.querySelector('#addRowBtn').addEventListener('click', ()=>{
      rows.push({partNumber:'', qty:'', unitPrice:'', shipping:'0', transferFee:'0', note:''}); draw();
    });
    backdrop.querySelector('#saveExpenseBtn').addEventListener('click', onSave);
  }

  async function onSave(){
    let supplierName = backdrop.querySelector('#eSupplier').value.trim();
    const date = backdrop.querySelector('#eDate').value.trim();
    if(!supplierName || !date){ showToast('نامِ تأمین‌کننده و تاریخ را وارد کنید'); return; }

    const similar = findSimilarExistingName(supplierName, getKnownSupplierNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه تأمین‌کننده با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله، همون «${similar}».\n«انصراف» = نه، این واقعاً تأمین‌کننده‌ی جدیدیه.`);
      if(useExisting) supplierName = similar;
    }

    const validRows = rows.filter(r=>{
      const qty = parseFloat(r.qty)||0, up = parseFloat(r.unitPrice)||0, sh = parseFloat(r.shipping)||0, tf = parseFloat(r.transferFee)||0;
      return r.partNumber.trim() && (qty*up + sh + tf) > 0;
    });
    if(validRows.length===0){ showToast('حداقل یک آیتمِ معتبر (پارت‌نامبر + مبلغِ مثبت) لازم است'); return; }

    // ⚠️ شماره‌سندِ مشترک — بر مبنایِ تاریخ+زمانِ ثبت، یکتا برایِ این دسته
    const docNumber = `${date}-${Date.now().toString().slice(-6)}`;
    let okCount = 0;
    for(const r of validRows){
      const qty = parseFloat(r.qty)||null, up = parseFloat(r.unitPrice)||null;
      const goods = (qty && up) ? qty*up : 0;
      const shipping = parseFloat(r.shipping)||0, transferFee = parseFloat(r.transferFee)||0;
      const body = {
        supplier_name:supplierName, part_number:r.partNumber.trim(), date,
        goods_yuan:goods, shipping_yuan:shipping, transfer_fee_yuan:transferFee,
        freight_rial:null, freight_paid:false, note:r.note.trim(),
        quantity:qty, unit_price_yuan:up, doc_number:docNumber,
      };
      const d = await apiCreate('expenses', body);
      if(d) okCount++;
    }
    showToast(`✅ ${okCount} از ${validRows.length} آیتم ثبت شد`);
    backdrop.remove();
    currentSupplier = supplierName;
    renderMain();
  }

  draw();
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
}

function openAccountModal(existing){

  // اولیه (برای راحتیِ اداهِ کار)
  const knownOwners = [...new Set(['حمیدرضا','عباس','زهرا حسین‌پور','غفاریان', ...state.accounts.map(a=>a.owner)])];

      <div class="field" style="margin-bottom:10px"><label>مالک</label>
        <input id="accOwner" type="text" list="knownOwnersList" value="${existing?existing.owner:''}" placeholder="مثلاً: حمیدرضا">
        <datalist id="knownOwnersList">${knownOwners.map(o=>`<option value="${o}">`).join('')}</datalist>
      </div>
      <div class="field" style="margin-bottom:10px"><label>نام بانک</label><input id="accBank" type="text" value="${existing?existing.bank_name:''}" placeholder="مثلاً: بانک ملی"></div>
      <div class="field" style="margin-bottom:10px"><label>شماره حساب (اختیاری)</label><input id="accNumber" type="text" value="${existing?existing.account_number||'':''}"></div>
      <div class="field" style="margin-bottom:10px"><label>مانده‌ی اولیه (ریال) — اگر از قبل موجودی داشته</label><input id="accOpeningBalance" type="text" class="num" value="${existing&&existing.opening_balance ? fmt(existing.opening_balance,0) : '0'}"></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="accActive" ${!existing || existing.active ? 'checked' : ''}> <label for="accActive" style="margin:0">فعال</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveAccBtn">${isEdit?'ذخیره تغییرات':'افزودن'}</button>
        <button class="btn btn-ghost" id="cancelAccBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelAccBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireLiveNumberFormat(backdrop.querySelector('#accOpeningBalance'));
  backdrop.querySelector('#saveAccBtn').addEventListener('click', async ()=>{
    let owner = backdrop.querySelector('#accOwner').value.trim();
    const bankName = backdrop.querySelector('#accBank').value.trim();
    const accountNumber = backdrop.querySelector('#accNumber').value.trim();
    const active = backdrop.querySelector('#accActive').checked;
    if(!owner){ showToast('نامِ مالک را وارد کنید'); return; }

    const similar = findSimilarExistingName(owner, knownOwners.filter(o=>o!==owner));
    if(similar){
      const useExisting = confirm(`⚠️ یه مالکِ حساب با نامِ خیلی مشابه («${similar}») از قبل هست. منظورتون همونه؟\n\n«تأیید» = بله.\n«انصراف» = نه، این واقعاً شخصِ جدیدیه.`);
      if(useExisting) owner = similar;
    }
    if(!bankName){ showToast('نام بانک را وارد کنید'); return; }
    const openingBalance = parseFloat(backdrop.querySelector('#accOpeningBalance').value.replace(/,/g,'')) || 0;
    if(openingBalance < 0){ showToast('مانده‌ی اولیه نمی‌تواند منفی باشد'); return; }

    renderAccounts(document.getElementById('main'));
  });
}

      <p class="page-desc">مانده‌ی اولیه: ${fmtRial(data.openingBalance)} — هر ردیف یه تراکنش، با مانده‌ی تجمعیِ بعدش</p>
    </div>
    <div class="toolbar" style="margin-bottom:10px"><div></div><input id="accountLedgerSearchInput" type="text" placeholder="🔍 جستجو در همه‌ی ستون‌ها..." value="${accountLedgerSearchQuery}" style="min-width:200px"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-right">تاریخ</th><th class="col-right">شرح</th><th>بدهکار (ریال)</th><th>بستانکار (ریال)</th><th>مانده</th><th></th></tr></thead>
        <tbody>
          ${events.length===0 ? `<tr class="empty-row"><td colspan="6">${accountLedgerSearchQuery?'چیزی پیدا نشد':'هنوز تراکنشی ثبت نشده'}</td></tr>` :
          events.map(e=>{
            let actions = '';
            if(e.type==='payment') actions = `<button class="icon-btn" data-edit-ledger-payment="${e.id}">ویرایش</button> <button class="icon-btn" data-del-ledger-payment="${e.id}">حذف</button>`;
            else if(e.type==='income') actions = `<button class="icon-btn" data-edit-ledger-income="${e.id}">ویرایش</button> <button class="icon-btn" data-del-ledger-income="${e.id}">حذف</button>`;
            else if(e.type==='adjustment') actions = `<button class="icon-btn" data-edit-ledger-adj="${e.id}">ویرایش</button> <button class="icon-btn" data-del-ledger-adj="${e.id}">حذف</button>`;
            else if(e.type==='transfer_in'||e.type==='transfer_out') actions = `<button class="icon-btn" data-edit-ledger-transfer="${e.id}">ویرایش</button> <button class="icon-btn" data-del-ledger-transfer="${e.id}">حذف</button>`;
            else if(e.type==='contribution') actions = `<button class="icon-btn" data-edit-ledger-contrib="${e.hawaleId}" title="مشارکت فقط از طریقِ فرمِ خودِ حواله قابلِ‌ویرایشه">ویرایش از طریقِ حواله</button>`;
            return `<tr>
            <td class="date-cell">${e.date}</td>
            <td class="col-right">${e.desc}</td>
            <td class="num">${e.debit!==null ? fmtRial(e.debit) : '—'}</td>
            <td class="num">${e.credit!==null ? fmtRial(e.credit) : '—'}</td>
            <td class="num" style="font-weight:700">${fmtRial(e.runningBalance)}</td>
            <td>${actions}</td>
          </tr>`;
          }).join('')}
        </tbody>
        ${events.length>0 ? `<tfoot><tr style="font-weight:800;background:var(--surface)">
          <td colspan="2" style="text-align:left">جمعِ کل</td>
          <td class="num">${fmtRial(events.reduce((s,e)=>s+Number(e.debit||0),0))}</td>
          <td class="num">${fmtRial(events.reduce((s,e)=>s+Number(e.credit||0),0))}</td>
          <td colspan="2"></td>
        </tr></tfoot>` : ''}
      </table>
    </div>
  `;
  main.querySelector('#backAccountBtn').addEventListener('click', ()=>{ currentAccount=null; renderMain(); });
  main.querySelector('#accountLedgerSearchInput').addEventListener('input', (e)=>{
    accountLedgerSearchQuery = e.target.value;
    renderAccountLedger(main);
  });
  main.querySelectorAll('[data-edit-ledger-payment]').forEach(b=>b.addEventListener('click', ()=>{
    openPaymentModal(state.payments.find(x=>x.id==b.dataset.editLedgerPayment));
  }));
  main.querySelectorAll('[data-del-ledger-payment]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ این واریزی حذف شود؟')) return;
    if(await apiDelete('payments', b.dataset.delLedgerPayment)) renderAccountLedger(main);
  }));
  main.querySelectorAll('[data-edit-ledger-income]').forEach(b=>b.addEventListener('click', ()=>{
    openIncomeModal(state.incomes.find(x=>x.id==b.dataset.editLedgerIncome));
  }));
  main.querySelectorAll('[data-del-ledger-income]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ این سندِ درآمد حذف شود؟')) return;
    if(await apiDelete('customer-incomes', b.dataset.delLedgerIncome)) renderAccountLedger(main);
  }));
  main.querySelectorAll('[data-edit-ledger-adj]').forEach(b=>b.addEventListener('click', ()=>{
    openAdjustmentModal(currentAccount, state.adjustments.find(x=>x.id==b.dataset.editLedgerAdj));
  }));
  main.querySelectorAll('[data-del-ledger-adj]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ این تعدیل حذف شود؟')) return;
    if(await apiDelete('account-adjustments', b.dataset.delLedgerAdj)) renderAccountLedger(main);
  }));
  main.querySelectorAll('[data-edit-ledger-transfer]').forEach(b=>b.addEventListener('click', ()=>{
    openTransferModal(state.transfers.find(x=>x.id==b.dataset.editLedgerTransfer));
  }));
  main.querySelectorAll('[data-del-ledger-transfer]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ این جابجایی حذف شود؟')) return;
    if(await apiDelete('account-transfers', b.dataset.delLedgerTransfer)) renderAccountLedger(main);
  }));
  main.querySelectorAll('[data-edit-ledger-contrib]').forEach(b=>b.addEventListener('click', ()=>{
    const hawale = state.hawales.find(x=>x.id==b.dataset.editLedgerContrib);
    if(hawale) openHawaleModal(hawale);
    else showToast('حواله‌ی مربوطه پیدا نشد');
  }));
}

// ⚠️ (۱۴۰۵/۰۶/۲۳) طبق طراحیِ دقیقِ کاربر: صفحه‌ی ردیابیِ «پیش‌پرداختِ
// سرمایه‌ای» — کاملاً موازی و بی‌اثر رو محاسباتِ اصلی؛ فقط برایِ شفافیت
// که «الان چقدر از پولِ خودم، بدونِ برگشت، بیرونه».
let capitalAdvancesSearchQuery = '';
async function renderCapitalAdvances(main){
  await loadAll();
  let filtered = sortByDateDesc(state.capitalAdvances);
  if(capitalAdvancesSearchQuery.trim()){
    filtered = filtered.filter(a=>matchesSearch([a.date, a.customer_name, a.rate_at_advance, a.rial_amount, a.remainingRial], capitalAdvancesSearchQuery));
  }
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">پیش‌پرداخت‌های سرمایه‌ای</h1>
      <p class="page-desc">وقتی برای پیش‌بردنِ کارِ مشتری، از سرمایه/حسابِ خودتون (نه واریزیِ خودِ مشتری) حواله زدید — این صفحه ردیابی می‌کنه چقدر بیرونه و کِی/با چه سود یا زیانی برمی‌گرده</p>
    </div>
    <div class="toolbar"><div></div><input id="capAdvSearchInput" type="text" placeholder="🔍 جستجو در همه‌ی ستون‌ها..." value="${capitalAdvancesSearchQuery}" style="min-width:220px"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-right">تاریخ</th><th>مشتری</th><th>نرخِ همان روز</th><th>مبلغِ اصلی (ریال)</th><th>تسویه‌شده (ریال)</th><th>مانده (ریال)</th><th>وضعیت</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr class="empty-row"><td colspan="8">${capitalAdvancesSearchQuery ? 'چیزی پیدا نشد' : 'هنوز پیش‌پرداختی ثبت نشده — این خودکار موقعِ ثبتِ حواله ساخته می‌شه اگه واریزیِ مشتری کافی نباشه'}</td></tr>` :
          filtered.map(a=>{
            const isSettled = a.remainingRial <= 10;
            return `<tr>
              <td class="date-cell">${a.date}</td>
              <td>${a.customer_name}</td>
              <td class="num">${fmt(a.rate_at_advance,0)}</td>
              <td class="num">${fmtRial(a.rial_amount)}</td>
              <td class="num">${fmtRial(a.settled_rial)}</td>
              <td class="num" style="font-weight:700">${fmtRial(a.remainingRial)}</td>
              <td>${isSettled ? '<span class="status-chip closed">✅ تسویه‌شده</span>' : '<span class="status-chip open">⏳ بازِ‌سرمایه</span>'}</td>
              <td>
                ${a.settlements.length ? `<button class="icon-btn" data-show-settlements="${a.id}">📋 جزئیاتِ تسویه</button>` : ''}
                <button class="icon-btn" data-edit-capadv="${a.id}">ویرایش</button>
                <button class="icon-btn" data-del-capadv="${a.id}">حذف</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
        ${filtered.length>0 ? `<tfoot><tr style="font-weight:800;background:var(--surface)">
          <td colspan="3" style="text-align:left">جمعِ کل</td>
          <td class="num">${fmtRial(filtered.reduce((s,a)=>s+Number(a.rial_amount||0),0))}</td>
          <td class="num">${fmtRial(filtered.reduce((s,a)=>s+Number(a.settled_rial||0),0))}</td>
          <td class="num">${fmtRial(filtered.reduce((s,a)=>s+Number(a.remainingRial||0),0))}</td>
          <td colspan="2"></td>
        </tr></tfoot>` : ''}
      </table>
    </div>
  `;
  main.querySelector('#capAdvSearchInput').addEventListener('input', (e)=>{
    capitalAdvancesSearchQuery = e.target.value;
    renderCapitalAdvances(main);
  });
  main.querySelectorAll('[data-show-settlements]').forEach(b=>b.addEventListener('click', ()=>{
    const adv = state.capitalAdvances.find(x=>x.id==b.dataset.showSettlements);
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>جزئیاتِ تسویه — ${adv.customer_name}</h3>
        <p class="page-desc">هر بار این مشتری پول واریز کرد، به‌اندازه‌ی موردنیاز از این پیش‌پرداخت کسر شده — با نرخِ همون روزِ واریز، در مقایسه با نرخِ روزی که شما از سرمایه‌ی خودتون گذاشتید:</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>تاریخِ تسویه</th><th>مبلغ (ریال)</th><th>یوان با نرخِ سرمایه‌گذاری</th><th>یوان با نرخِ روزِ واریز</th><th>سود/زیانِ نوسان (یوان)</th></tr></thead>
            <tbody>
              ${adv.settlements.map(s=>`<tr>
                <td class="date-cell">${s.date}</td>
                <td class="num">${fmtRial(s.rialAmount)}</td>
                <td class="num">${fmtYuan(s.yuanAtAdvanceRate)}</td>
                <td class="num">${s.yuanAtPaymentRate!=null ? fmtYuan(s.yuanAtPaymentRate) : '—'}</td>
                <td class="num" style="font-weight:700;color:${s.yuanDiff>0?'var(--rial)':'var(--danger)'}">${s.yuanDiff!=null ? (s.yuanDiff>0?'+':'')+fmtYuan(s.yuanDiff) : '—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" id="closeSettlementsBtn">بستن</button></div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#closeSettlementsBtn').addEventListener('click', ()=>backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  }));
  main.querySelectorAll('[data-edit-capadv]').forEach(b=>b.addEventListener('click', ()=>{
    openCapitalAdvanceModal(state.capitalAdvances.find(x=>x.id==b.dataset.editCapadv));
  }));
  main.querySelectorAll('[data-del-capadv]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ مطمئنید می‌خواید این پیش‌پرداختِ سرمایه‌ای را حذف کنید؟')) return;
    const ok = await apiDelete('capital-advances', b.dataset.delCapadv);
    if(!ok) return;
    renderCapitalAdvances(main);
  }));
}

function openCapitalAdvanceModal(existing){
  if(!existing) return;
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>ویرایشِ پیش‌پرداختِ سرمایه‌ای</h3>
      <div class="field" style="margin-bottom:10px"><label>مشتری</label><input id="capAdvCustomer" type="text" value="${existing.customer_name}"></div>
      <div class="form-row">
        <div class="field"><label>تاریخ (شمسی)</label><input id="capAdvDate" type="text" value="${existing.date}"></div>
        <div class="field"><label>نرخِ همان روز</label><input id="capAdvRate" type="text" class="num" value="${fmt(existing.rate_at_advance,0)}"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>مبلغِ اصلی (ریال)</label><input id="capAdvAmount" type="text" class="num" value="${fmt(existing.rial_amount,0)}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveCapAdvBtn">ذخیره تغییرات</button>
        <button class="btn btn-ghost" id="cancelCapAdvBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelCapAdvBtn').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#capAdvDate'));
  wireLiveNumberFormat(backdrop.querySelector('#capAdvRate'));
  wireLiveNumberFormat(backdrop.querySelector('#capAdvAmount'));
  backdrop.querySelector('#saveCapAdvBtn').addEventListener('click', async ()=>{
    const body = {
      customer_name: backdrop.querySelector('#capAdvCustomer').value.trim(),
      date: backdrop.querySelector('#capAdvDate').value.trim(),
      rate_at_advance: parseFloat(backdrop.querySelector('#capAdvRate').value.replace(/,/g,'')),
      rial_amount: parseFloat(backdrop.querySelector('#capAdvAmount').value.replace(/,/g,'')),
    };
    const d = await apiUpdate('capital-advances', existing.id, body);
    if(!d) return;
    showToast('✅ ذخیره شد');
    backdrop.remove();
    renderMain();
  });
}

// ⚠️ (۱۴۰۵/۰۶/۲۶) طبق درخواستِ صریحِ کاربر: تعدیلِ مستقیمِ یوانیِ
// تأمین‌کننده — بدونِ هیچ ریال/نرخ/حساب، فقط مستقیم بدهکارتر یا
// بستانکارتر می‌کنه، به تشخیصِ خودِ کاربر.
function openYuanAdjustmentModal(supplierName){
  const today = todayShamsi();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>تعدیلِ مستقیمِ یوانی — ${supplierName}</h3>
      <p class="page-desc">این فقط رو مانده‌ی یوانیِ همینِ تأمین‌کننده اثر می‌ذاره — هیچ ریال، نرخ، حساب، یا مشتری‌ای درگیر نمی‌شه.</p>
      <div class="field" style="margin-bottom:10px"><label>نوع</label>
        <select id="yuanAdjType">
          <option value="debit">بدهکار — طلبِ ما از تأمین‌کننده زیاد بشه</option>
          <option value="credit">بستانکار — طلبِ ما از تأمین‌کننده کم بشه</option>
        </select>
      </div>
      <div class="form-row">
        <div class="field"><label>تاریخ (شمسی)</label><input id="yuanAdjDate" type="text" value="${today}" placeholder="1405-06-26"></div>
        <div class="field"><label>مبلغ (یوان)</label><input id="yuanAdjAmount" type="text" class="num" placeholder="مثلاً 500"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>توضیح کوتاه (اختیاری)</label><input id="yuanAdjNote" type="text"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveYuanAdjBtn">ثبتِ تعدیل</button>
        <button class="btn btn-ghost" id="cancelYuanAdjBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelYuanAdjBtn').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#yuanAdjDate'));
  backdrop.querySelector('#saveYuanAdjBtn').addEventListener('click', async ()=>{
    const date = backdrop.querySelector('#yuanAdjDate').value.trim();
    const yuanAmount = parseFloat(backdrop.querySelector('#yuanAdjAmount').value.replace(/,/g,''));
    const adjustmentType = backdrop.querySelector('#yuanAdjType').value;
    const note = backdrop.querySelector('#yuanAdjNote').value.trim();
    if(!date || !yuanAmount || yuanAmount<=0){ showToast('تاریخ و مبلغِ مثبت را وارد کنید'); return; }
    const body = {supplier_name:supplierName, date, adjustment_type:adjustmentType, yuan_amount:yuanAmount, note};
    const d = await apiCreate('supplier-yuan-adjustments', body);
    if(!d) return;
    showToast('✅ تعدیل ثبت شد');
    backdrop.remove();
    renderMain();
  });
}

// ---- Boot ----
(async function(){
  await loadAll();
  render();
})();
</script>
