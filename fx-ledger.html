<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ⚠️ (۱۴۰۵/۰۶/۱۸) تگ‌های PWA -->
<link rel="manifest" href="./manifest-fxledger.json">
<meta name="theme-color" content="#0e7d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر ارزی">
<link rel="apple-touch-icon" href="./icons/fxledger-192.png">
<title>دفتر ارزی اسمارت‌چیپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ کندیِ لود: فونت قبلاً به‌صورتِ
     render-blocking (<link rel="stylesheet"> ساده) لود می‌شد — یعنی
     صفحه تا دانلودِ کاملِ فونت از fonts.googleapis.com (که ممکنه از
     ایران کند/غیرقابل‌دسترس باشه) معلق می‌موند. الان با الگوی استاندارد
     preload+onload، فونت در پس‌زمینه لود می‌شه بدونِ معطل‌کردنِ رندرِ
     اولیه‌ی صفحه. -->
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    /* ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ ناهماهنگیِ رنگی — طبقِ گزارشِ کاربر: این پالت
       عیناً از فایلِ اولیه‌ی کاربر به ارث رسیده بود و هیچ‌وقت با پالتِ
       یکپارچه‌ی آبیِ CRM/ERP هماهنگ نشده بود (همون الگوی مشکلی که قبلاً
       تو index.html/mobile.html هم پیدا و فیکس شده بود). --border قدیمی
       (#E1E4EA) هم کنتراستِ خیلی کمی با پس‌زمینه‌ی سفید داشت، برای همینم
       خطوطِ جدول عملاً نامرئی بودن.
    */
    --ink:#0f1f36;
    --ink-soft:#3f5875;
    --ink-faint:#6b84a3;
    --paper:#a9c8ec;
    --surface:#c3dbf3;
    --border:#7ea3cc;
    --rial:#0e7d6b;
    --rial-soft:#d5e8e4;
    --yuan:#b45309;
    --yuan-soft:#f5e6d3;
    --danger:#dc2626;
    --danger-soft:#fbdddb;
    --accent:#0e7d6b;
    --card:#c3dbf3;
    --radius:12px;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
  }
  .num{ font-feature-settings:"tnum" 1, "lnum" 1; direction:ltr; unicode-bidi:isolate; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ صریحِ کاربر: در کلِ دفترِ ارزی، همه‌ی
     ستون‌ها به‌جز «تاریخ» و «شرح/توضیح» باید وسط‌چین باشن */
  table td, table th{ text-align:center; }
  /* ⚠️ (۱۴۰۵/۰۶/۲۳) طبق درخواستِ صریحِ کاربر: جداسازیِ بصریِ گروهِ
     ستون‌های ریالی از گروهِ ستون‌های یوانی تو جدولِ «دفترِ کامل» */
  .col-group-rial{ background:#FFF7E8 }
  .col-group-end{ border-left:2.5px solid var(--border)!important }
  .date-cell{ font-feature-settings:"tnum" 1, "lnum" 1; direction:ltr; unicode-bidi:isolate; text-align:right; }
  th.col-right, td.col-right{ text-align:right !important; }
  .app{ display:flex; min-height:100vh; }
  /* Sidebar */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--ink); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:24px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand-title{ font-weight:800; font-size:16px; letter-spacing:.2px; }
  .brand-sub{ font-size:12px; color:#9AA3B2; margin-top:4px; }
  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:9px;
    color:#C7CCD6; font-size:14px; cursor:pointer; border:none; background:none; text-align:right; font-family:inherit;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.active{ background:#fff; color:var(--ink); font-weight:600; }
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0; }
  .sidebar-foot{ padding:14px 20px; font-size:11px; color:#7C8494; border-top:1px solid rgba(255,255,255,.08); }

  /* Main */
  .main{ flex:1; min-width:0; padding:28px 32px 60px; }
  .page-head{ margin-bottom:22px; }
  .page-title{ font-size:21px; font-weight:800; margin:0 0 4px; }
  .page-desc{ font-size:13px; color:var(--ink-soft); margin:0; }

  .grid{ display:grid; gap:14px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .stat-card{ display:flex; flex-direction:column; gap:6px; }
  .stat-label{ font-size:12.5px; color:var(--ink-soft); }
  .stat-value{ font-size:22px; font-weight:800; }
  .stat-value.rial{ color:var(--rial); }
  .stat-value.yuan{ color:var(--yuan); }
  .stat-hint{ font-size:11.5px; color:var(--ink-faint); }
  .tag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; }
  .tag.rial{ background:var(--rial-soft); color:var(--rial); }
  .tag.yuan{ background:var(--yuan-soft); color:var(--yuan); }
  .tag.danger{ background:var(--danger-soft); color:var(--danger); }
  .tag.neutral{ background:var(--paper); color:var(--ink-soft); }

  .section-title{ font-size:14.5px; font-weight:700; margin:28px 0 10px; display:flex; align-items:center; justify-content:space-between; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; }
  .empty-row td{ text-align:center; color:var(--ink-faint); padding:26px; font-size:13px; }

  .btn{ font-family:inherit; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#2A2F3A; }
  .btn-ghost{ background:var(--paper); color:var(--ink); }
  .btn-ghost:hover{ background:#E4E8EE; }
  .btn-danger-text{ background:none; color:var(--danger); padding:4px 8px; font-size:12px; }
  .btn-danger-text:hover{ text-decoration:underline; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:15px; padding:4px 6px; border-radius:6px; }
  .icon-btn:hover{ background:var(--paper); color:var(--danger); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .seg{ display:inline-flex; background:var(--paper); border-radius:9px; padding:3px; gap:2px; }
  .seg button{ font-family:inherit; border:none; background:none; padding:7px 13px; font-size:12.5px; border-radius:7px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }

  .form-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    font-family:inherit; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13.5px; background:#fff; color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid #C7CCD6; outline-offset:0; border-color:#B7BEC9; }
  .field input.num, .field textarea{ direction:rtl; }
  .field small.calc{ font-size:11.5px; color:var(--ink-faint); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,22,28,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:14px; padding:22px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-size:15.5px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-start; margin-top:16px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-size:32px; margin-bottom:8px; }

  .mobile-tabs{ display:none; }
  @media(max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; }
    .brand{ border-bottom:none; padding:14px 16px; }
    .nav{ flex-direction:row; overflow-x:auto; padding:8px 10px; flex:1; }
    .nav-item{ white-space:nowrap; }
    .sidebar-foot{ display:none; }
    .main{ padding:18px; }
    .form-grid{ grid-template-columns:1fr 1fr; }
  }
  .customer-balance-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .link-pill{ font-size:11px; padding:2px 8px; border-radius:99px; background:var(--paper); color:var(--ink-soft); }
  .warn-note{ font-size:12px; color:var(--ink-soft); background:var(--paper); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .load-screen{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--ink-soft); font-size:14px; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست کاربر: خطوط جدول همه‌جا واضح‌تر */
  table, th, td { border: 1px solid var(--border) !important; }
  table { border-collapse: collapse !important; }
  /* جدول راهنمای فیلدها — بالای هر فرم، توضیح می‌ده کجا چی بنویسیم */
  .field-guide{ background:#F5F7FA; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:11.5px; color:var(--ink-soft); }
  .field-guide table{ width:100%; font-size:11px; }
  .field-guide th{ text-align:right; padding:4px 6px; color:var(--ink); }
  .field-guide td{ padding:4px 6px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ کاربر: طراحیِ landscape برای فرم‌های
     ثبتِ حواله/فاکتور — عریض‌تر، فیلدها کنارِ هم به‌جای زیرِ هم */
  .modal.modal-landscape{ max-width:760px; }
  .form-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
  @media(max-width:700px){ .modal.modal-landscape{ max-width:420px; } .form-grid-3{ grid-template-columns:1fr; } }
  .contrib-row{ display:grid; grid-template-columns:2fr 1fr auto; gap:8px; align-items:center; margin-bottom:6px; }
  .status-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
  .status-chip.closed{ background:var(--rial-soft); color:var(--rial); }
  .status-chip.open{ background:var(--yuan-soft); color:var(--yuan); }
</style>
</head>
<body>
<div id="root"><div class="load-screen">در حال بارگذاری…</div></div>
<div class="toast" id="toast"></div>
<script>
// ══════════════════════════════════════════════════════════════
// دفتر ارزی SmartChip — نسخه‌ی متصل به بک‌اند واقعی (۱۴۰۵/۰۶/۱۸)
// ⚠️ ذخیره‌سازی واقعی (Django)، نه لوکال‌استوریج مرورگر — طبق تصمیم کاربر.
// ══════════════════════════════════════════════════════════════
const FX_API = 'https://smartchip-backend.onrender.com/api/fxledger/';
const CRM_CUSTOMERS_API = 'https://smartchip-backend.onrender.com/api/customers/customers/';

// ── شمسی: تبدیل و فرمت (بدون کتابخانه‌ی خارجی، همون الگوریتم استانداردِ رایج) ──
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  jy += Math.floor((days-1)/365); if(days > 365) days = (days-1)%365;
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097); days %= 146097;
  let leap = true;
  if(days > 36524){ days--; gy += 100*Math.floor(days/36524); days %= 36524; if(days >= 365) days++; else leap=false; }
  gy += 4*Math.floor(days/1461); days %= 1461;
  if(days > 365){ leap=false; gy += Math.floor((days-1)/365); days = (days-1)%365; }
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let gd = days+1;
  let gm;
  for(gm=1; gm<13; gm++){ const next = (gm===12)?366:g_d_m[gm]+((gm===2&&leap)?1:0); if(days < next) break; }
  // fallback ساده — کافیه برای این پروژه (تبدیل تک‌روزه، نه محاسبات تقویمیِ پیچیده)
  const d = new Date(gy, 0, 1); d.setDate(d.getDate() + days);
  return [d.getFullYear(), d.getMonth()+1, d.getDate()];
}
function todayShamsi(){
  const now = new Date();
  const [jy,jm,jd] = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return `${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`;
}
function shamsiSortVal(s){
  if(!s) return 0;
  // ⚠️ (۱۴۰۵/۰۶/۱۸) فرمت از / به - تغییر کرد؛ اینجا هر دو رو می‌پذیریم تا
  // داده‌ی قدیمی (اگه با / ثبت شده بود) هم درست مرتب بشه
  const [y,m,d] = s.split(/[-/]/).map(Number);
  return y*400 + m*31 + d;
}
// ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ صریحِ کاربر: وقتی چند سند تو یه روز ثبت
// می‌شن، باید به همون ترتیبی که وارد کردید تو جدول بمونن — نه به ترتیبِ
// اتفاقی. چون `id` دیتابیس همیشه با ترتیبِ واقعیِ زمانِ ثبت افزایش پیدا
// می‌کنه (رکوردِ جدیدتر، آی‌دیِ بزرگ‌تر می‌گیره)، از همون به‌عنوانِ
// تای‌بریکر (وقتی تاریخ‌ها برابرن) استفاده می‌کنیم.
function sortByDateDesc(list){
  return [...list].sort((a,b)=> shamsiSortVal(b.date)-shamsiSortVal(a.date) || (b.id-a.id));
}
function sortByDateAsc(list){
  return [...list].sort((a,b)=> shamsiSortVal(a.date)-shamsiSortVal(b.date) || (a.id-b.id));
}
// ⚠️ (۱۴۰۵/۰۶/۲۲) طبق درخواستِ صریحِ کاربر: سرچ باید همه‌ی ستون‌های
// نمایش‌داده‌شده رو پوشش بده (نه فقط یکی‌دو تا) — این تابعِ عمومی، یه
// آرایه از مقادیرِ دلخواه (متن، عدد، هرچی) می‌گیره و همه‌شونو با query
// چک می‌کنه.
function matchesSearch(values, query){
  const q = (query||'').trim();
  if(!q) return true;
  return values.some(v => v!==null && v!==undefined && String(v).includes(q));
}

// ⚠️ (۱۴۰۵/۰۶/۱۸) عیناً کپی از crm.html — طبق دستور صریح کاربر: نرمال‌سازیِ
// نامِ مشتری/تأمین‌کننده باید دقیقاً همون منطقِ CRM باشه، تا یه نامِ مشابه
// (ی فارسی/ي عربی، ک/ك) به‌عنوان دو موجودیتِ جدا حساب نشه.
function fa2en(s){ return (s||'').toString().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function normalizeFa(s){
  return fa2en((s||'').toString().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase());
}
// اگه یه نامِ مشابه (نرمال‌شده یکسان، ولی رشته‌ی خام فرق داره) از قبل تو
// لیستِ knownNames باشه، همونو برمی‌گردونه — تا بشه به کاربر پیشنهاد داد
function findSimilarExistingName(typedName, knownNames){
  const nq = normalizeFa(typedName);
  if(!nq) return null;
  const match = knownNames.find(n => normalizeFa(n) === nq && n !== typedName);
  return match || null;
}

// ⚠️ (۱۴۰۵/۰۶/۱۸) تقویمِ شمسیِ کلیکی — طبق درخواست صریح کاربر: فرمتِ
// یک‌نواخت YYYY-MM-DD، انتخاب با کلیک (نه تایپِ دستی).
function jalaliLeapSimple(jy){
  // روشِ ساده و قابل‌اتکا: تبدیل به میلادی و برگشت، چک کن روزِ ۳۰ اسفند معتبره یا نه
  const g1 = jalaliToGregorian(jy, 12, 30);
  const back = gregorianToJalali(g1[0], g1[1], g1[2]);
  return back[1] === 12 && back[2] === 30;
}
function daysInJalaliMonth(jy, jm){
  if(jm <= 6) return 31;
  if(jm <= 11) return 30;
  return jalaliLeapSimple(jy) ? 30 : 29;
}
const JALALI_MONTH_NAMES = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAY_NAMES = ['ش','ی','د','س','چ','پ','ج']; // شنبه تا جمعه

function openShamsiCalendarPicker(inputEl){
  document.querySelectorAll('.shamsi-cal-popup').forEach(p=>p.remove());
  let [vy,vm] = (inputEl.value || todayShamsi()).split(/[-/]/).map(Number);
  if(!vy){ const t = todayShamsi().split('-').map(Number); vy=t[0]; vm=t[1]; }

  const popup = document.createElement('div');
  popup.className = 'shamsi-cal-popup';
  popup.style.cssText = 'position:absolute;z-index:100;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:10px;width:260px;';
  const rect = inputEl.getBoundingClientRect();
  popup.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  popup.style.left = (window.scrollX + rect.left) + 'px';

  function renderCalendar(){
    const firstOfMonthG = jalaliToGregorian(vy, vm, 1);
    const jsDate = new Date(firstOfMonthG[0], firstOfMonthG[1]-1, firstOfMonthG[2]);
    const jsWeekday = jsDate.getDay(); // 0=یکشنبه تو جاوااسکریپت
    const startOffset = (jsWeekday + 1) % 7; // تبدیل به اندیسِ هفته‌ی ایرانی: شنبه=0
    const totalDays = daysInJalaliMonth(vy, vm);
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += '<div></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSelected = inputEl.value === dateStr;
      cells += `<div data-pick-day="${dateStr}" style="text-align:center;padding:5px 0;border-radius:6px;cursor:pointer;font-size:11px;${isSelected?'background:var(--accent);color:#fff;':''}">${d}</div>`;
    }
    popup.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <button type="button" id="calPrevBtn" style="border:none;background:none;cursor:pointer;font-size:14px">‹</button>
        <div style="font-size:12px;font-weight:700">${JALALI_MONTH_NAMES[vm-1]} ${vy}</div>
        <button type="button" id="calNextBtn" style="border:none;background:none;cursor:pointer;font-size:14px">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
        ${JALALI_WEEKDAY_NAMES.map(w=>`<div style="text-align:center;font-size:9px;color:var(--ink-soft)">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
      <button type="button" id="calTodayBtn" style="width:100%;margin-top:8px;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:11px;cursor:pointer">امروز</button>
    `;
    popup.querySelector('#calPrevBtn').addEventListener('click', ()=>{ vm--; if(vm<1){vm=12;vy--;} renderCalendar(); });
    popup.querySelector('#calNextBtn').addEventListener('click', ()=>{ vm++; if(vm>12){vm=1;vy++;} renderCalendar(); });
    popup.querySelector('#calTodayBtn').addEventListener('click', ()=>{
      inputEl.value = todayShamsi();
      inputEl.dispatchEvent(new Event('input'));
      popup.remove();
    });
    popup.querySelectorAll('[data-pick-day]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pickDay;
      inputEl.dispatchEvent(new Event('input'));
      popup.remove();
    }));
  }
  renderCalendar();
  document.body.appendChild(popup);
  // ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ گزارش‌شده: کلیک رو دکمه‌ی prev/next
  // باعثِ صدازدنِ renderCalendar می‌شد که popup.innerHTML رو کامل عوض
  // می‌کنه — یعنی دکمه‌ای که کلیک شده بود از DOM جدا می‌شد، و وقتی
  // closeHandler (پایین‌تر) چک می‌کرد popup.contains(e.target)، چون اون
  // دکمه‌ی قدیمی دیگه بخشی از DOM نبود، false برمی‌گشت و پاپ‌آپ اشتباهاً
  // بسته می‌شد. فیکس: کلیکِ داخلِ popup اصلاً به document نمی‌رسه.
  popup.addEventListener('click', (e)=>e.stopPropagation());
  setTimeout(()=>{
    document.addEventListener('click', function closeHandler(e){
      if(!popup.contains(e.target) && e.target!==inputEl){ popup.remove(); document.removeEventListener('click', closeHandler); }
    });
  }, 0);
}

// ── فرمت اعداد — سه‌رقم‌سه‌رقم، طبق درخواست صریح کاربر در همه‌جا ──
function fmt(n, digits){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const d = digits === undefined ? 0 : digits;
  let s = Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست صریح کاربر: صفرهای اضافیِ بعدِ اعشار حذف
  // بشن — ۲۳۹۸.۰۰۰۰ بشه ۲۳۹۸، ۱۲۳۵.۰۹۸۰ بشه ۱۲۳۵.۰۹۸
  if(s.includes('.')){
    s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  return s;
}
// ⚠️ (۱۴۰۵/۰۶/۲۶) طبق درخواستِ صریحِ کاربر: بخشِ صحیحِ عدد Bold، بخشِ
// اعشاری معمولی — تا وضوح بیشتر بشه. این تابعِ *جدا*ست (نه خودِ `fmt`)
// چون `fmt` خامِ خودش تو مقادیرِ فرم‌ها (`value="${fmt(...)}"`) هم
// استفاده می‌شه که آنجا نباید HTML برگرده، فقط عددِ خام.
function fmtBoldInt(s){
  if(s === '—') return s;
  const parts = s.split('.');
  return parts.length===1 ? `<b>${parts[0]}</b>` : `<b>${parts[0]}</b>.${parts[1]}`;
}
function fmtRial(n){ return fmtBoldInt(fmt(n,0)) + ' ریال'; }
function fmtYuan(n){ return fmtBoldInt(fmt(n,4)) + ' ¥'; }

}

// ⚠️ (۱۴۰۵/۰۶/۲۲) طبق گزارشِ کاربر: وقتی سرورِ رایگانِ رندر تازه داره
// بیدار می‌شه (بعدِ خواب)، بعضی از اولین درخواست‌ها با خطای شبکه‌ی
// موقتی (ERR_CONNECTION_RESET) شکست می‌خورن — نه یه خطای واقعی، فقط یه
// لحظه‌ی گذرا. قبلاً یه شکستِ ساده، کلِ لودِ صفحه رو می‌شکست. الان با
// چند بار تلاشِ خودکار (با تأخیرِ فزاینده)، این نوسان‌های موقتی رو
// نادیده می‌گیریم.
// ⚠️ (۱۴۰۵/۰۶/۲۵) فیکسِ باگِ واقعی: نسخه‌ی قبلی فقط ۳ بار تلاش می‌کرد
// (جمعاً ~۹ ثانیه) — ولی بیدارشدنِ کاملِ سرورِ رایگانِ رندر از خواب
// می‌تونه ۳۰-۶۰ ثانیه طول بکشه. یعنی این retry هیچ‌وقت به‌اندازه‌ی کافی
// صبر نمی‌کرد و شکستِ واقعی رو نشون می‌داد، درصورتی‌که چند ثانیه‌ی
// دیگه صبر کافی بود. الان تا ۸ بار تلاش می‌کنه (جمعاً حدودِ ۹۰ ثانیه).
async function fetchWithRetry(url, options, retries=8, delayMs=2000){
  for(let i=0; i<retries; i++){
    try{
      return await fetch(url, options);
    }catch(err){
      if(i === retries-1) throw err;
      if(i === 1) showToast('⏳ سرور در حالِ بیدارشدنه، لطفاً صبر کنید...');
      await new Promise(r=>setTimeout(r, delayMs*(i+1)));
    }
  }
}

// ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست کاربر — بازاستفاده‌ی عیناً از دو endpoint
// واقعی که از قبل تو ERP/CRM کار می‌کنن (نه چیزِ جدید): همگام‌سازیِ
// پارت‌نامبرها از گوگل‌شیتِ Verified_Weights + سرچِ آیتم.
const FX_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyz1l8LxL4urZ_OGWpAoaeh3P7vgez6EZiPMvzCO2V9USoepWBagiH-KQ32l_mNi82o/exec';
// ⚠️ (۱۴۰۵/۰۶/۲۹) فیکسِ باگِ واقعیِ گزارش‌شده توسطِ کاربر: این fetch به
// گوگل‌اپس‌اسکریپت قبلاً هیچ مهلتِ زمانی نداشت — اگه Apps Script کند
// می‌شد یا گیر می‌کرد، این تابع *بی‌نهایت* معلق می‌موند (نه خطا می‌داد
// نه جواب)، و چون خودِ توست هم فقط ۲.۵ ثانیه می‌موند، کاربر هیچ اثری
// از این گیرکردن نمی‌دید — دقیقاً حالتی که گزارش شد («۲ دقیقه صبر
// کردم، هیچی نیومد»). الان بعدِ ۶۰ ثانیه خودکار قطع می‌شه و catch
// می‌ره، پس همیشه به مودالِ نتیجه (موفق یا خطا) می‌رسه.
async function fxSheetCall(action, data = {}){
  try{
    const payloadStr = JSON.stringify(data);
    const url = FX_SHEET_URL + '?action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(payloadStr) + '&t=' + Date.now();
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 60000);
    const res = await fetch(url, { method:'GET', redirect:'follow', signal: controller.signal });
    clearTimeout(timeoutId);
    return await res.json();
  }catch(e){ return null; }
}
// ⚠️ (۱۴۰۵/۰۶/۲۹) فیکسِ باگِ واقعیِ گزارش‌شده توسطِ کاربر: قبلاً نتیجه‌ی
// sync (چه موفق، چه ناموفق) فقط ۲.۵ ثانیه تویِ یه توستِ گذرا نشون داده
// می‌شد و بعد گم می‌شد — برایِ عملیاتی به این حیاتی (که کارِ روزمره
// بهش وابسته‌ست)، این کافی نبود. الان نتیجه تو یه مودال می‌مونه تا
// خودِ کاربر ببندتش، و اگه خطا بود، جزئیاتِ کاملش (وضعیتِ HTTP، متنِ
// خامِ پاسخ اگه JSON نبود) رو هم نشون می‌ده.
function showPersistentResultModal(title, bodyHtml, isError){
  document.querySelectorAll('.sync-result-modal').forEach(m=>m.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop sync-result-modal';
  backdrop.innerHTML = `
    <div class="modal">
      <h3 style="color:${isError?'var(--danger)':'var(--ok)'}">${title}</h3>
      <div style="font-size:12.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;background:var(--surface);border-radius:8px;padding:10px">${bodyHtml}</div>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn btn-primary" id="closeSyncResultBtn">باشه</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#closeSyncResultBtn').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
}
// ⚠️ (۱۴۰۵/۰۶/۲۹) طبق درخواستِ صریحِ کاربر: با ~۳۲هزار پارت، فرستادنِ
// *همه* رو هر بار (حتی با دسته‌بندی) کاری غیرضروری و کندیه. به‌جایِ
// حدسِ عددی («۱۰۰ آخر»)، الان دقیقاً از جنگو می‌پرسیم کدوم پارت‌نامبرها
// از قبل هستن، و فقط چیزهایی که *واقعاً* جدیدن (صرفِ‌نظر از تعداد یا
// موقعیت‌شون تو شیت) فرستاده می‌شن.
// - onlyNew=false (پیش‌فرض): ارسالِ کاملِ همه (برایِ اولین‌بار، یا وقتی
//   می‌خواید آپدیت‌هایِ آیتم‌هایِ موجود رو هم دوباره sync کنید)
// - onlyNew=true: فقط پارت‌هایی که تو جنگو نیستن — دقیق، نه حدسی
//
// ⚠️ محدودیتِ فنی: چون به کدِ خودِ Apps Scriptِ گوگل‌شیت دسترسی نداریم،
// نمی‌تونیم ازش بخوایم *فقط* آخرین ردیف‌ها رو بخونه — همچنان باید کلِ
// شیت رو بخونه (همون ۱۵-۴۵ ثانیه)، فقط از این‌بار به بعد، فقط پارت‌هایِ
// واقعاً جدید به سرورِ جنگو فرستاده می‌شن (که بخشِ کند و پرتکرار بود).
// ⚠️ (۱۴۰۵/۰۶/۲۹) طبق درخواستِ صریحِ کاربر: به‌جایِ حدسِ عددی («۱۰۰
// آخر»)، حالا `onlyNew=true` دقیقاً چک می‌کنه کدوم پارت‌نامبرهایِ
// گوگل‌شیت *واقعاً* تو جنگو نیستن (نه فرضِ اینکه «آخرِ لیست»)، و فقط
// همون‌هارو می‌فرسته — صرفِ‌نظر از تعداد یا موقعیت‌شون تو شیت.
async function fxSyncPartsFromSheet(btn, onlyNew){
  if(btn) btn.disabled = true;
  showToast('⏳ در حال خوندنِ گوگل‌شیت (ممکنه ۱۵ تا ۴۵ ثانیه طول بکشه)...');
  try{
    const res = await fxSheetCall('getAllItemWeights');
    let items = (res && res.items) || [];
    if(!items.length){
      showPersistentResultModal(
        '⚠️ چیزی از گوگل‌شیت خونده نشد',
        'یا Apps Script بعدِ ۶۰ ثانیه جواب نداد (تایم‌اوت)، یا خودش یه خطا/پاسخِ خالی برگردوند.\n\nپاسخِ خامِ Apps Script:\n' + JSON.stringify(res, null, 2),
        true
      );
      if(btn) btn.disabled=false; return;
    }
    const totalReadFromSheet = items.length;
    if(onlyNew){
      showToast('⏳ در حال چک‌کردنِ پارت‌نامبرهایِ موجود در جنگو...');
      let existingSet;
      try{
        const existRes = await fetch('https://smartchip-backend.onrender.com/api/items/existing-part-numbers/');
        const existData = await existRes.json();
        existingSet = new Set((existData.partNumbers || []).map(p => (p||'').trim().toLowerCase()));
      }catch(existErr){
        showPersistentResultModal('❌ نتونستیم لیستِ پارت‌نامبرهایِ موجود رو از سرور بگیریم', 'پیام:\n' + existErr.message, true);
        if(btn) btn.disabled=false; return;
      }
      items = items.filter(it => !existingSet.has(((it.partNumber)||'').trim().toLowerCase()));
      if(!items.length){
        showPersistentResultModal('✅ چیزِ جدیدی پیدا نشد', `کلِ ${totalReadFromSheet} پارتِ گوگل‌شیت از قبل تو جنگو هستن — چیزِ جدیدی برای ارسال نبود.`, false);
        if(btn) btn.disabled=false; return;
      }
    }

    const CHUNK_SIZE = 2000;
    const chunks = [];
    for(let i=0; i<items.length; i+=CHUNK_SIZE) chunks.push(items.slice(i, i+CHUNK_SIZE));

    let totalCreated = 0, totalUpdated = 0;
    for(let ci=0; ci<chunks.length; ci++){
      showToast(chunks.length>1 ? `⏳ ارسالِ دسته‌ی ${ci+1} از ${chunks.length} (${items.length} پارت)...` : `⏳ ارسالِ ${items.length} پارت به سرور...`);
      const syncRes = await fetch('https://smartchip-backend.onrender.com/api/items/sync/', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items: chunks[ci]}),
      });
      const rawText = await syncRes.text();
      let data;
      try{ data = JSON.parse(rawText); }
      catch(parseErr){
        showPersistentResultModal(
          `❌ پاسخِ سرور معتبر نبود (دسته‌ی ${ci+1} از ${chunks.length} — وضعیتِ HTTP: ${syncRes.status})`,
          `تا اینجا: ${totalCreated} جدید، ${totalUpdated} آپدیت‌شده با موفقیت ثبت شد.\n\nمتنِ خامِ پاسخِ همین دسته (ممکنه صفحه‌ی خطایِ سرور باشه):\n\n` + rawText.substring(0, 2000),
          true
        );
        if(btn) btn.disabled=false; return;
      }
      if(!data.ok){
        showPersistentResultModal(
          `❌ همگام‌سازی در دسته‌ی ${ci+1} از ${chunks.length} ناموفق بود`,
          `تا اینجا: ${totalCreated} جدید، ${totalUpdated} آپدیت‌شده با موفقیت ثبت شد.\n\nپیامِ خطایِ سرور:\n` + (data.error || JSON.stringify(data, null, 2)),
          true
        );
        if(btn) btn.disabled=false; return;
      }
      totalCreated += data.created || 0;
      totalUpdated += data.updated || 0;
    }
    const modeLine = onlyNew ? `حالت: فقط پارت‌هایِ واقعاً جدید (${items.length} تا از کلِ ${totalReadFromSheet} پارتِ گوگل‌شیت)` : `حالت: ارسالِ کاملِ همه (${totalReadFromSheet} پارت)`;
    showPersistentResultModal('✅ همگام‌سازی تمام شد', `${modeLine}\nتعدادِ ارسال‌شده: ${items.length}${chunks.length>1?`\nدر ${chunks.length} دسته ارسال شد`:''}\nپارتِ جدید: ${totalCreated}\nپارتِ آپدیت‌شده: ${totalUpdated}`, false);
  }catch(e){
    showPersistentResultModal('❌ خطایِ اتصال یا اجرا', 'پیام:\n' + e.message + '\n\nStack:\n' + (e.stack||'—'), true);
  }
  if(btn) btn.disabled = false;
}
async function fxSearchItems(q){
  if(!q || q.trim().length<1) return [];
  try{
    const data = await fetch('https://smartchip-backend.onrender.com/api/items/search/?q='+encodeURIComponent(q.trim()));
    const j = await data.json();
    return (j && j.items) || [];
  }catch(e){ return []; }
}
// ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست کاربر: فرمتِ زنده (سه‌رقم‌سه‌رقم) موقعِ
// خودِ تایپ، نه فقط تو نمایش. موقعیتِ کرسر رو با شمردنِ تعدادِ رقم‌های
// قبل از کرسر حفظ می‌کنیم، تا تایپ‌کردن دست‌وپاگیر نشه.
// ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ گزارش‌شده توسطِ کاربر: نسخه‌ی قبلی این
// تابع، موقعیتِ کرسر رو فقط با شمردنِ «تعدادِ ارقام قبل از کرسر» حساب
// می‌کرد — بدونِ درنظرگرفتنِ خودِ نقطه‌ی اعشار! نتیجه: وقتی کاربر نقطه یا
// رقمِ بعدِ اعشار تایپ می‌کرد، کرسر اشتباهاً وسطِ بخشِ صحیح می‌موند، و
// رقمِ بعدی به‌جای بعدِ اعشار، وسطِ عدد درج می‌شد (مثلاً ۴۲۶۹.۶ می‌شد
// ۴۲۶۹۶). فیکس: موقعیتِ کرسر رو نسبت‌به‌بخشِ (صحیح یا اعشاری) که توشه
// جدا محاسبه می‌کنیم، تست شد با شبیه‌سازیِ کاملِ تایپِ حرف‌به‌حرف.
function wireLiveNumberFormat(inputEl){
  inputEl.addEventListener('input', ()=>{
    const oldValue = inputEl.value;
    const cursorPos = inputEl.selectionStart;
    const raw = oldValue.replace(/[^\d.]/g,'');
    if(!raw){ inputEl.value=''; return; }

    // آیا کرسر تو بخشِ اعشاری (بعد از اولین نقطه) بود؟
    const firstDotIdx = oldValue.indexOf('.');
    const cursorInDecimalPart = firstDotIdx !== -1 && cursorPos > firstDotIdx;

    const rawParts = raw.split('.');
    const rawIntPart = rawParts[0];
    const rawDecPart = rawParts.length > 1 ? rawParts.slice(1).join('') : null; // اگه چند نقطه تایپ شده بود هم قاطی نشه

    const formattedInt = rawIntPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const formattedValue = rawDecPart !== null ? formattedInt + '.' + rawDecPart : formattedInt;
    inputEl.value = formattedValue;

    let newPos;
    if(cursorInDecimalPart){
      // تعدادِ رقم‌های اعشاریِ *قبل از کرسر* رو تو مقدارِ قدیم بشمر، بعد
      // همون تعداد رقم رو بعدِ نقطه‌ی جدید قرار بده
      const oldDecimalBeforeCursor = oldValue.slice(firstDotIdx+1, cursorPos).replace(/[^\d]/g,'').length;
      const newDotIdx = formattedValue.indexOf('.');
      newPos = newDotIdx + 1 + oldDecimalBeforeCursor;
    } else {
      // کرسر تو بخشِ صحیح بود — تعدادِ ارقامِ صحیحِ قبل از کرسر رو بشمر
      const oldIntBeforeCursor = oldValue.slice(0, cursorPos).replace(/[^\d]/g,'').length;
      let seen = 0; newPos = formattedInt.length;
      for(let i=0;i<formattedInt.length;i++){
        if(/\d/.test(formattedInt[i])) seen++;
        if(seen===oldIntBeforeCursor){ newPos=i+1; break; }
      }
    }
    inputEl.setSelectionRange(newPos, newPos);
  });
}

function wirePartNumberAutocomplete(inputEl, resultsBoxEl){
  let seq = 0;
  inputEl.addEventListener('input', async ()=>{
    const q = inputEl.value;
    if(q.trim().length<1){ resultsBoxEl.innerHTML=''; return; }
    const mySeq = ++seq;
    const items = await fxSearchItems(q);
    if(mySeq !== seq) return; // یه سرچِ جدیدتر تو راهه
    resultsBoxEl.innerHTML = items.length ? `<div style="position:absolute;top:2px;right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:8px;z-index:10;max-height:160px;overflow-y:auto">
      ${items.map(name=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-part="${name}">${name}</div>`).join('')}
    </div>` : '';
    resultsBoxEl.querySelectorAll('[data-pick-part]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pickPart;
      // ⚠️ (۱۴۰۵/۰۶/۲۹) فیکسِ باگِ واقعیِ گزارش‌شده توسطِ کاربر: قبلاً
      // اینجا فقط `.value` ست می‌شد، بدونِ صدازدنِ رویدادِ 'input' —
      // پس هر جایی که (مثلِ فرمِ چندردیفیِ خرید) رویِ رویدادِ 'input'
      // گوش می‌داد تا وضعیتِ داخلیِ خودشو آپدیت کنه، هیچ‌وقت از مقدارِ
      // *واقعاً انتخاب‌شده* باخبر نمی‌شد و برمی‌گشت به آخرین چیزی که
      // کاربر با دست تایپ کرده بود.
      inputEl.dispatchEvent(new Event('input', {bubbles:true}));
      resultsBoxEl.innerHTML = '';
    }));
  });
}

  wireRateBasisToggle(main, ()=>renderDashboard(main));
  main.querySelectorAll('[data-goto-lock]').forEach(b=>b.addEventListener('click', ()=>{
    currentTab = 'customers';
    currentCustomer = b.dataset.gotoLock;
    render();
  }));
  main.querySelectorAll('[data-goto-customer]').forEach(tr=>tr.addEventListener('click', ()=>{
    currentTab = 'customers';
    currentCustomer = tr.dataset.gotoCustomer;
    render();
  }));
}

// ---------- CUSTOMERS LIST ----------
async function renderCustomersList(main){
  const basis = state.settings.rateBasis;
  const g = await apiGetSummary(basis);
  if(!g){ main.innerHTML = '<p class="page-desc">❌ اتصال به سرور برقرار نشد</p>'; return; }
  const filteredCustomers = g.customers.filter(c=>matchesSearch([
    c.name, c.balanceYuan, c.balanceRial, c.unlinkedRial, c.openOrderId?'باز':'تسویه',
  ], customersListSearchQuery));
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">مشتریان</h1>
      <p class="page-desc">هر مشتری را باز کنید تا دفتر کامل تسویه (به‌سبک صورت‌حساب) را ببینید</p>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" id="addOrderGlobalBtn">+ ثبت فاکتور/پیش‌فاکتور</button>
      <div style="display:flex;gap:8px;align-items:center">${rateBasisToggle()}<input id="customersListSearchInput" type="text" placeholder="🔍 جستجو در همه‌ی ستون‌ها..." value="${customersListSearchQuery}" style="min-width:200px"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>مشتری</th><th>مانده (یوان)</th><th>معادل ریالی</th><th>ریالِ واریزی‌شده — هنوز حواله نشده</th><th>فاکتور باز</th><th></th></tr></thead>
        <tbody>
          ${filteredCustomers.length===0 ? `<tr class="empty-row"><td colspan="6">${customersListSearchQuery?'چیزی پیدا نشد':'هنوز مشتری‌ای در دفتر ثبت نشده — با «ثبت فاکتور/پیش‌فاکتور» شروع کنید'}</td></tr>` :
          filteredCustomers.map(c=>`<tr style="cursor:pointer" data-open-customer="${c.name}">
            <td><strong>${c.name}</strong></td>
            <td class="num">${fmtYuan(c.balanceYuan)}</td>
            <td class="num">${c.balanceRial!==null ? fmtRial(c.balanceRial) : '—'}</td>
            <td class="num">${c.unlinkedRial>0.01 ? fmtRial(c.unlinkedRial) : '—'}</td>
            <td>${c.openOrderId ? '<span class="status-chip open">باز</span>' : '<span class="status-chip closed">تسویه</span>'}</td>
            <td><button class="btn btn-ghost btn-sm">مشاهده دفتر ›</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  main.querySelector('#addOrderGlobalBtn').addEventListener('click', ()=>openOrderModal());
  wireRateBasisToggle(main, ()=>renderCustomersList(main));
  main.querySelector('#customersListSearchInput').addEventListener('input', (e)=>{
    customersListSearchQuery = e.target.value;
    renderCustomersList(main);
  });
  main.querySelectorAll('[data-open-customer]').forEach(tr=>tr.addEventListener('click', ()=>{
    currentCustomer = tr.dataset.openCustomer;
    renderMain();
  }));
}

// ---------- CUSTOMER LEDGER (دقیقاً به‌سبک عکس اکسل کاربر) ----------

    <div class="section-title">وضعیت فاکتورها</div>

    <div class="toolbar" style="margin-bottom:10px">
      <div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="customerEventsSearchInput" type="text" placeholder="🔍 جستجو در همه‌ی ستون‌ها..." value="${customerEventsSearchQuery}" style="min-width:200px">
        <button class="btn btn-ghost btn-sm" id="exportCustomerEventsBtn">📥 خروجی اکسلِ دفترِ کامل</button>
      </div>
    </div>
    <div class="table-wrap">
      <table style="text-align:center">
        <thead><tr>
          <th class="col-right" style="text-align:center">تاریخ</th><th class="col-right" style="text-align:center;max-width:110px">شرح</th>
          <th class="col-group-rial">بدهکار ریالی</th><th class="col-group-rial">بستانکار ریالی</th><th class="col-group-rial col-group-end">مانده‌ی ریالیِ شناخته‌شده</th>
          <th>بدهکار (یوان)</th><th>بستانکار (یوان)</th><th>مانده یوانی</th>

          ${(()=>{
            const filteredEvents = data.events.filter(e=>matchesSearch([
              e.date, e.desc, e.type==='order'?e.rial_debit:e.rial_credit, e.yuan_debit, e.yuan_credit,
              e.rate, e.runningYuan, e.runningRial, e.hawaleRate, e.depositRate, e.suggestedRate,

            return filteredEvents.length===0 ? `<tr class="empty-row"><td colspan="11">چیزی پیدا نشد</td></tr>` :

            <td class="num col-group-rial">${e.type!=='order' ? fmtRial(e.rial_credit) : '—'}</td>

      <div class="modal">
        <h3>چرا این واریزی چند نرخ دارد؟</h3>
        <p class="page-desc">این واریزی طبقِ روشِ FIFO بینِ چند حواله تقسیم شده — هر بخشش نرخِ همون حواله‌ای که ازش تسویه شده رو گرفته:</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>مبلغِ این بخش (ریال)</th><th>نرخِ همین بخش</th><th>معادلِ یوانی</th></tr></thead>
            <tbody>
              ${breakdown.map(b=>`<tr><td class="num">${fmtRial(b.rialAmount)}</td><td class="num">${fmt(b.rate,0)}</td><td class="num">${fmtYuan(b.rialAmount/b.rate)}</td></tr>`).join('')}

          </table>
        </div>

  main.querySelector('#customerEventsSearchInput').addEventListener('input', (e)=>{
    customerEventsSearchQuery = e.target.value;
    renderCustomerLedger(main);

      e.yuan_debit||'', e.yuan_credit||'', e.runningYuan,
      e.hawaleRate||'', e.depositRate||'', e.suggestedRate||'',

    xlsxDownload(`دفتر-کامل-${currentCustomer}.xlsx`, 'دفتر کامل', rows);

  wireRateBasisToggle(main, ()=>renderCustomerLedger(main));

    const res = await fetch(FX_API+'orders/'+b.dataset.lockOrder+'/lock/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({basis, today:todayShamsi()})});

    if(!res.ok){ showToast('❌ بازکردنِ قفل ناموفق بود'); return; }
    showToast('✅ قفل باز شد');
    renderCustomerLedger(main);
  }));
  main.querySelector('#addOrderBtn').addEventListener('click', ()=>openOrderModal(null, currentCustomer));
  main.querySelectorAll('[data-edit-order]').forEach(b=>b.addEventListener('click', ()=>{
    const o = data.orderStatus.find(x=>x.id==b.dataset.editOrder);

  main.querySelectorAll('[data-del-order]').forEach(b=>b.addEventListener('click', async ()=>{
    const o = data.orderStatus.find(x=>x.id==b.dataset.delOrder);

// ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ کندیِ لودشدن: قبلاً SheetJS تو <head>
// و بدونِ defer لود می‌شد — یعنی کلِ صفحه تا دانلودِ کاملِ این فایلِ
// خارجی (از cdnjs.cloudflare.com که ممکنه از ایران کند/غیرقابل‌دسترس
// باشه) معلق می‌موند. الان فقط وقتی واقعاً دکمه‌ی خروجی زده بشه، لود می‌شه.
let _xlsxLibPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLibPromise) return _xlsxLibPromise;
  _xlsxLibPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _xlsxLibPromise;
}
async function xlsxDownload(filename, sheetName, rows){
  try{
    showToast('⏳ در حال آماده‌سازیِ فایلِ اکسل...');
    await loadXlsxLib();
  }catch(e){
    showToast('❌ اتصال به کتابخانه‌ی اکسل برقرار نشد — اینترنتتون رو چک کنید');
    return;
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

      ${matches.map(m=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-cust="${m.name}">${m.name}</div>`).join('')}
    </div>` : '';
    custResults.querySelectorAll('[data-pick-cust]').forEach(el=>el.addEventListener('click', ()=>{
      selectedCustomerName = el.dataset.pickCust;
      custInput.value = selectedCustomerName;
      custResults.innerHTML = '';
    }));
  });

  backdrop.querySelector('#savePaymentBtn').addEventListener('click', async ()=>{
    selectedCustomerName = selectedCustomerName || custInput.value.trim();
    const accountId = backdrop.querySelector('#pAccount').value;
    const date = backdrop.querySelector('#pDate').value.trim();
    const rialAmount = parseFloat(backdrop.querySelector('#pAmount').value.replace(/,/g,''));
    const rateAtPayment = parseFloat(backdrop.querySelector('#pRate').value.replace(/,/g,''));
    const manualOrder = backdrop.querySelector('#pManualOrder').value || null;
    const hawaleId = backdrop.querySelector('#pHawale').value || null;
    const note = backdrop.querySelector('#pNote').value.trim();
    if(!selectedCustomerName || !date || !rialAmount || !rateAtPayment || rialAmount<0 || rateAtPayment<0){ showToast('همه‌ی فیلدهای الزامی و مثبت را پر کنید'); return; }
    // ⚠️ (۱۴۰۵/۰۶/۲۵) فیکسِ باگِ واقعیِ تکرارشونده: قبلاً هر عددِ غیرِصفر
    // (حتی ۱) به‌عنوانِ نرخ قبول می‌شد — که باعث شد چندبار (هم تو یه
    // migrationِ قدیمی، هم موقعِ ثبتِ دستی) نرخِ «۱» بشینه و کلِ محاسبه‌ی
    // یوانی رو خراب کنه. نرخِ واقعیِ یوان هیچ‌وقت زیرِ چند هزار تومان
    // نیست، پس هر عددِ کمتر از ۱۰۰۰ قطعاً اشتباهه.
    if(rateAtPayment < 1000){ showToast('❌ نرخِ واردشده نامعقول است — نرخِ واقعیِ روزِ واریز را وارد کنید (نه عددِ ۱ یا مشابه)'); return; }

    // ⚠️ (۱۴۰۵/۰۶/۱۸) چک نامِ مشابه — طبق دستور صریح کاربر: عیناً منطقِ CRM
    const similar = findSimilarExistingName(selectedCustomerName, getKnownCustomerNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه مشتری با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همون مشتریه؟\n\n«تأیید» = بله، همون «${similar}» است.\n«انصراف» = نه، این واقعاً مشتریِ جدیدیه («${selectedCustomerName}»).`);
      if(useExisting) selectedCustomerName = similar;
    }

    // ⚠️ چک ثبتِ تکراری — همون مشتری، همون تاریخ، همون مبلغ
    if(!isEdit){
      const dup = state.payments.find(p=>normalizeFa(p.customer_name)===normalizeFa(selectedCustomerName) && p.date===date && Number(p.rial_amount)===rialAmount);
      if(dup && !confirm(`⚠️ یه پرداختِ کاملاً مشابه (همون مشتری، همون تاریخ، همون مبلغ) قبلاً ثبت شده. مطمئنید می‌خواید دوباره ثبت کنید؟`)) return;
    }

    const body = {customer_name:selectedCustomerName, account:accountId, date, rial_amount:rialAmount, rate_at_payment:rateAtPayment, manual_order:manualOrder, hawale:hawaleId, note};
    const d = isEdit ? await apiUpdate('payments', existing.id, body) : await apiCreate('payments', body);
    if(!d) return;
    backdrop.remove();
    renderMain();
  });
}

    custResults.innerHTML = matches.length ? `<div style="position:absolute;top:2px;right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:8px;z-index:10;max-height:160px;overflow-y:auto">
      ${matches.map(m=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-cust="${m.name}">${m.name}</div>`).join('')}
    </div>` : '';
    custResults.querySelectorAll('[data-pick-cust]').forEach(el=>el.addEventListener('click', ()=>{
      selectedCustomerName = el.dataset.pickCust;
      custInput.value = selectedCustomerName;
      custResults.innerHTML = '';
    }));
  });

  backdrop.querySelector('#saveIncomeBtn').addEventListener('click', async ()=>{
    selectedCustomerName = selectedCustomerName || custInput.value.trim();
    const date = backdrop.querySelector('#incDate').value.trim();
    const rialAmount = parseFloat(backdrop.querySelector('#incAmount').value.replace(/,/g,''));
    const note = backdrop.querySelector('#incNote').value.trim();
    const accountId = backdrop.querySelector('#incAccount').value;
    if(!selectedCustomerName || !date || !rialAmount || rialAmount<0 || !accountId){ showToast('مشتری، حساب، تاریخ، و مبلغِ مثبت را وارد کنید'); return; }

    const similar = findSimilarExistingName(selectedCustomerName, getKnownCustomerNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه مشتری با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همون مشتریه؟\n\n«تأیید» = بله، همون «${similar}» است.\n«انصراف» = نه، این واقعاً مشتریِ جدیدیه («${selectedCustomerName}»).`);
      if(useExisting) selectedCustomerName = similar;
    }

    const body = {customer_name:selectedCustomerName, account:accountId, date, rial_amount:rialAmount, note};

    renderMain();
  });
}

  main.querySelectorAll('[data-edit-income]').forEach(b=>b.addEventListener('click', ()=>{

  main.querySelectorAll('[data-del-income]').forEach(b=>b.addEventListener('click', async ()=>{

// ---------- HAWALES (ترکیبی — چند حساب در یک حواله) ----------
let hawalesSearchQuery = '';
async function renderHawales(main){
  await loadAll();
  let filtered = sortByDateDesc(state.hawales);
  if(hawalesSearchQuery.trim()){
    const q = hawalesSearchQuery.trim();
    filtered = filtered.filter(h=>{
      const accNames = (h.contributions||[]).map(c=>{
        const acc = state.accounts.find(a=>a.id===c.account);
        return acc ? acc.displayName : '';
      });
      const linkedInfo = h.linkedPaymentsInfo || [];
      const linkedNames = [...new Set(linkedInfo.map(x=>x.customerName))];
      return matchesSearch([
        h.date, h.supplier_name, h.totalRial, h.rate_at_hawale, h.rate_at_customer_deposit,
        h.yuanAmount, ...accNames, ...linkedNames,
      ], q);
    });
  }
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">حواله‌ها به تأمین‌کننده</h1>
      <p class="page-desc">هر بار ریالِ موجود را به نرخ روز، حواله یوانی خریداری می‌کنید — می‌تواند از چند حساب (حتی چند نفر) هم‌زمان تأمین شود</p>

    <div class="toolbar">
      <button class="btn btn-primary" id="addHawaleBtn">+ ثبت حواله</button>

        <input id="hawalesSearchInput" type="text" placeholder="🔍 جستجو با تأمین‌کننده یا تاریخ..." value="${hawalesSearchQuery}" style="min-width:220px">
        <button class="btn btn-ghost btn-sm" id="exportHawalesBtn">📥 خروجی اکسل</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-right">تاریخ</th><th>تأمین‌کننده</th><th>حساب‌های مشارکت‌کننده</th><th>مبلغ کل ریالی</th><th>نرخِ حواله</th><th>نرخِ روزِ واریزِ مشتری</th><th>یوان خریداری‌شده</th><th>مانده‌ی تأمین‌کننده بعد از این (یوان)</th><th>واریزی‌های لینک‌شده</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr class="empty-row"><td colspan="10">${hawalesSearchQuery?'چیزی پیدا نشد':'حواله‌ای ثبت نشده است'}</td></tr>` :
          filtered.map(h=>{

            const linkedNames = [...new Set(linkedInfo.map(x=>x.customerName))];
            return `<tr>
            <td class="date-cell">${h.date}</td>
            <td><strong>${h.supplier_name}</strong>${h.affectsLockedOrder?' <span class="tag danger" title="این حواله به مشتری‌ای با فاکتورِ قفل‌شده مرتبط است — با احتیاط ویرایش کنید">🔒</span>':''}</td>
            <td>${h.contributions.map(c=>{
              const acc = state.accounts.find(a=>a.id===c.account);
              return `<div style="font-size:11px">${acc?acc.displayName:'⚠️ منبعِ نامعلوم'}: <span class="num">${fmt(c.rial_amount,0)}</span></div>`;
            }).join('')}</td>
            <td class="num">${fmtRial(h.totalRial)}</td>
            <td class="num">${fmt(h.rate_at_hawale,0)}</td>
            <td class="num">${h.rate_at_customer_deposit ? fmt(h.rate_at_customer_deposit,0) : '—'}</td>
            <td class="num">${fmtYuan(h.yuanAmount)}</td>

          </tr>`;

    if(h.affectsLockedOrder && !confirm('⚠️ این حواله به مشتری‌ای با فاکتورِ قفل‌شده (ثبت‌شده در هلو) مرتبط است. ویرایش ممکن است با نرخِ حسابداریِ قبلاً ثبت‌شده ناهماهنگ شود. مطمئنید؟')) return;
    openHawaleModal(h);
  }));
  main.querySelectorAll('[data-del-hawale]').forEach(b=>b.addEventListener('click', async ()=>{
    const h = state.hawales.find(x=>x.id==b.dataset.delHawale);
    const warnMsg = h.affectsLockedOrder
      ? '⚠️ این حواله به مشتری‌ای با فاکتورِ قفل‌شده مرتبط است. حذف ممکن است با نرخِ حسابداریِ قبلاً ثبت‌شده ناهماهنگ شود. مطمئنید حذف شود؟'
      : 'این حواله حذف شود؟ پرداخت‌های مرتبط به حالت «معلق» برمی‌گردند.';
    if(confirm(warnMsg)){
      const ok = await apiDelete('hawales', b.dataset.delHawale);
      if(!ok) return;
      renderHawales(main);
    }
  }));
  main.querySelectorAll('[data-hist-hawale]').forEach(b=>b.addEventListener('click', ()=>{
    showHistoryModal(state.hawales.find(x=>x.id==b.dataset.histHawale));
  }));
}

      <div class="form-row">
        <div class="field"><label>نرخِ خریدِ حواله (ریال به ازای هر یوان)</label><input id="hRate" type="text" class="num" value="${existing ? fmt(existing.rate_at_hawale,0) : ''}"></div>
        <div class="field"><label>نرخ در تاریخِ واریزِ مشتری (اختیاری)</label><input id="hRateAtDeposit" type="text" class="num" value="${existing && existing.rate_at_customer_deposit ? fmt(existing.rate_at_customer_deposit,0) : ''}"></div>
      </div>
      <div class="field" style="margin-bottom:6px"><label>حساب‌های مشارکت‌کننده و مبلغ هرکدام</label></div>
      <div id="contribRowsBox">${renderContribRows()}</div>
      <button class="btn btn-ghost btn-sm" id="addContribBtn" style="margin-bottom:14px">+ افزودن حساب</button>
      <div class="field" style="margin-bottom:10px"><label>تخصیصِ دستی به فاکتورِ خرید (اختیاری)</label>
        <select id="hManualExpense">
          <option value="">— خودکار (FIFO) —</option>
          ${state.expenses.filter(e=>e.supplier_name===(existing?existing.supplier_name:currentSupplier)).map(e=>`<option value="${e.id}" ${existing&&existing.manual_expense===e.id?'selected':''}>${e.date} — ${fmtYuan(e.totalYuan)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom:6px">
        <label>لینک‌کردنِ گروهیِ واریزی‌های مشتریان (اختیاری)</label>
        <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:6px">مثلاً: «۳ تا از واریزی‌های ویراتدبیر رو با این حواله تسویه کن» — می‌تونید هرچند تا که خواستید تیک بزنید، یا هیچ‌کدوم (اگه این حواله ربطی به مشتریِ خاصی نداره)</div>
        <input id="hPaymentFilter" type="text" placeholder="🔍 فیلتر با نامِ مشتری (اختیاری)...">
      </div>
      <div id="hPaymentPickerBox" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:14px"></div>

      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>تخصیصِ خودکار (FIFO)</td><td>وقتی مبلغِ حواله دقیقاً رو مرزِ یه واریزی تموم نمی‌شه — سیستم از قدیمی‌ترین واریزیِ هنوز-آزادِ این مشتری شروع می‌کنه و تا مبلغِ حواله رو کامل بپوشونه پیش می‌ره، حتی اگه لازم باشه یه واریزی رو بینِ این حواله و حواله‌ی بعدی تقسیم کنه</td></tr>
        </table>
      </div>
      <div class="form-row">
        <div class="field"><label>نامِ مشتری (برای تخصیصِ خودکار)</label>
          <input id="hAutoSplitCustomer" type="text" list="knownCustomersListH" placeholder="مثلاً: ویراتدبیر">
          <datalist id="knownCustomersListH">${[...new Set([...state.orders.map(o=>o.customer_name), ...state.payments.map(p=>p.customer_name)])].map(n=>`<option value="${n}">`).join('')}</datalist>
        </div>
        <div class="field"><label>مبلغی که باید پوشش داده بشه (ریال)</label><input id="hAutoSplitAmount" type="text" class="num"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="hAutoSplitBtn" style="margin-bottom:10px">🔄 محاسبه‌ی خودکار (FIFO)</button>
      <div id="hAutoSplitResultBox" style="margin-bottom:14px"></div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="saveHawaleBtn">${isEdit?'ذخیره تغییرات':'ثبت حواله'}</button>
        <button class="btn btn-ghost" id="cancelHawaleBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelHawaleBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#hDate'));
  wireLiveNumberFormat(backdrop.querySelector('#hRate'));
  wireLiveNumberFormat(backdrop.querySelector('#hRateAtDeposit'));
  wireLiveNumberFormat(backdrop.querySelector('#hAutoSplitAmount'));

  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق سناریوی دقیقِ کاربر: لیستِ پرداخت‌هایی که هنوز به
  // هیچ حواله‌ای وصل نشدن (payment.hawale===null) — قابلِ فیلتر با نامِ
  // مشتری، قابلِ انتخابِ گروهی (چک‌باکس).
  const selectedPaymentIds = new Set(isEdit ? state.payments.filter(p=>p.hawale==existing.id).map(p=>p.id) : []);
  function renderPaymentPicker(filterText){
    const q = (filterText||'').trim();
    const candidates = state.payments.filter(p => (p.hawale==null || selectedPaymentIds.has(p.id)) && (!q || p.customer_name.includes(q)));
    const box = backdrop.querySelector('#hPaymentPickerBox');
    if(candidates.length===0){ box.innerHTML = '<div style="font-size:11px;color:var(--ink-soft);text-align:center;padding:8px">هیچ واریزیِ بدون‌حواله‌ای پیدا نشد</div>'; return; }
    box.innerHTML = candidates.map(p=>`
      <label style="display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:11.5px;cursor:pointer">
        <input type="checkbox" data-pick-payment="${p.id}" ${selectedPaymentIds.has(p.id)?'checked':''}>
        <span>${p.customer_name} — ${p.date} — ${fmtRial(p.rial_amount)}</span>
      </label>`).join('');
    box.querySelectorAll('[data-pick-payment]').forEach(cb=>cb.addEventListener('change', ()=>{
      const pid = +cb.dataset.pickPayment;
      if(cb.checked) selectedPaymentIds.add(pid); else selectedPaymentIds.delete(pid);
    }));
  }
  renderPaymentPicker('');
  backdrop.querySelector('#hPaymentFilter').addEventListener('input', (e)=>renderPaymentPicker(e.target.value));

  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبقِ سناریوی دقیقِ کاربر: تخصیصِ خودکار (FIFO) —
  // از قدیمی‌ترین واریزیِ هنوز-آزادِ این مشتری شروع می‌کنه، با تقسیمِ
  // آخرین واریزی در صورتِ نیاز، تا مبلغِ خواسته‌شده رو کامل بپوشونه.
  let autoSplitResult = null; // {allocations:[{payment_id, amount, date, paymentTotalRial}], uncovered}
  backdrop.querySelector('#hAutoSplitBtn').addEventListener('click', async ()=>{
    const customerName = backdrop.querySelector('#hAutoSplitCustomer').value.trim();
    const amountStr = backdrop.querySelector('#hAutoSplitAmount').value.replace(/,/g,'').trim();
    if(!customerName || !amountStr){ showToast('نامِ مشتری و مبلغ را وارد کنید'); return; }
    const excludeParam = isEdit ? `&exclude_hawale_id=${existing.id}` : '';
    const res = await fetch(FX_API+`hawales/auto_split_preview/?customer=${encodeURIComponent(customerName)}&amount=${amountStr}${excludeParam}`);
    if(!res.ok){ showToast('❌ محاسبه ناموفق بود'); return; }
    autoSplitResult = await res.json();
    const box = backdrop.querySelector('#hAutoSplitResultBox');
    if(autoSplitResult.allocations.length===0){
      box.innerHTML = `<div style="padding:10px;border-radius:8px;background:var(--paper)"><div style="font-size:11.5px;color:var(--danger)">⚠️ هیچ واریزیِ آزادی برای <strong>${customerName}</strong> پیدا نشد — کلِ مبلغِ <strong>${fmtRial(autoSplitResult.uncovered)}</strong> از <strong>سرمایه/حسابِ خودِ شرکت</strong> برداشته می‌شه. این مبلغ خودکار تو صفحه‌ی «پیش‌پرداخت‌های سرمایه‌ای» ثبت می‌شه.</div></div>`;
      return;
    }
    box.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>تاریخِ واریزی</th><th>مبلغِ کلِ واریزی</th><th>مقدارِ تخصیص‌یافته به این حواله</th></tr></thead>
          <tbody>
            ${autoSplitResult.allocations.map(a=>`<tr>
              <td class="date-cell">${a.date}</td>
              <td class="num">${fmtRial(a.paymentTotalRial)}</td>
              <td class="num" style="font-weight:700">${fmtRial(a.amount)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="margin-top:8px;padding:10px;border-radius:8px;background:var(--paper)">
        <div style="font-size:11.5px">✅ از واریزیِ راکدِ خودِ <strong>${customerName}</strong> پوشش داده شد: <strong>${fmtRial(autoSplitResult.allocations.reduce((s,a)=>s+Number(a.amount||0),0))}</strong></div>
        ${autoSplitResult.uncovered>0.01 ? `<div style="font-size:11.5px;color:var(--danger);margin-top:4px">⚠️ باقیِ مبلغ — <strong>${fmtRial(autoSplitResult.uncovered)}</strong> — چون واریزیِ آزادِ این مشتری کافی نبود، از <strong>سرمایه/حسابِ خودِ شرکت</strong> برداشته می‌شه. این مبلغ خودکار تو صفحه‌ی «پیش‌پرداخت‌های سرمایه‌ای» ثبت می‌شه تا وقتی این مشتری بعداً پول داد، خودکار تسویه بشه.</div>` : ''}
      </div>
    `;
  });

  function wireContribRows(){
    backdrop.querySelectorAll('[data-contrib-account]').forEach(sel=>sel.addEventListener('change',()=>{
      contribRows[+sel.dataset.contribAccount].account = sel.value;
    }));
    backdrop.querySelectorAll('[data-contrib-amount]').forEach(inp=>{
      wireLiveNumberFormat(inp);
      inp.addEventListener('input',()=>{
        contribRows[+inp.dataset.contribAmount].rial_amount = inp.value.replace(/,/g,'');
      });
    });
    backdrop.querySelectorAll('[data-remove-contrib]').forEach(b=>b.addEventListener('click',()=>{
      if(contribRows.length<=1) return;
      contribRows.splice(+b.dataset.removeContrib, 1);
      backdrop.querySelector('#contribRowsBox').innerHTML = renderContribRows();
      wireContribRows();
    }));
  }
  wireContribRows();
  backdrop.querySelector('#addContribBtn').addEventListener('click', ()=>{
    contribRows.push({account:state.accounts[0]?.id||'', rial_amount:''});
    backdrop.querySelector('#contribRowsBox').innerHTML = renderContribRows();
    wireContribRows();
  });

  backdrop.querySelector('#saveHawaleBtn').addEventListener('click', async ()=>{
    let supplierName = backdrop.querySelector('#hSupplier').value.trim();
    const date = backdrop.querySelector('#hDate').value.trim();
    const rate = parseFloat(backdrop.querySelector('#hRate').value.replace(/,/g,''));
    const note = backdrop.querySelector('#hNote').value.trim();
    // ⚠️ (۱۴۰۵/۰۶/۲۶) طبق درخواستِ کاربر: دیگه `r.account &&` بلاک نمی‌کنه —
    // چون یه ردیف با حسابِ خالی («منبعِ نامعلوم») هم باید معتبر باشه؛
    // فقط مبلغِ مثبت لازمه. account:'' رو به null تبدیل می‌کنیم.
    const validContribs = contribRows.filter(r=>parseFloat(r.rial_amount)>0).map(r=>({account:r.account||null, rial_amount:parseFloat(r.rial_amount)}));
    if(!supplierName || !date || !rate || rate<0 || validContribs.length===0){ showToast('نام تأمین‌کننده، تاریخ، نرخِ مثبت، و حداقل یک حساب با مبلغ معتبر را وارد کنید'); return; }

    const similar = findSimilarExistingName(supplierName, getKnownSupplierNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه تأمین‌کننده با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله، همون «${similar}».\n«انصراف» = نه، این واقعاً تأمین‌کننده‌ی جدیدیه.`);
      if(useExisting) supplierName = similar;
    }
    if(!isEdit){
      const totalRial = validContribs.reduce((s,c)=>s+c.rial_amount,0);
      const dup = state.hawales.find(h=>normalizeFa(h.supplier_name)===normalizeFa(supplierName) && h.date===date && Math.abs(Number(h.totalRial)-totalRial)<1);
      if(dup && !confirm('⚠️ یه حواله‌ی کاملاً مشابه (همون تأمین‌کننده، همون تاریخ، همون مبلغ) قبلاً ثبت شده. مطمئنید دوباره ثبت کنید؟')) return;
    }

    const manualExpense = backdrop.querySelector('#hManualExpense').value || null;
    const rateAtDepositStr = backdrop.querySelector('#hRateAtDeposit').value.replace(/,/g,'').trim();
    const rateAtDeposit = rateAtDepositStr ? parseFloat(rateAtDepositStr) : null;
    if(rateAtDeposit !== null && rateAtDeposit < 0){ showToast('نرخِ روزِ واریز نمی‌تواند منفی باشد'); return; }
    // ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ حیاتیِ واقعی: قبلاً اگه کاربر دکمه‌ی
    // «محاسبه‌ی خودکار» رو نمی‌زد، اینجا آرایه‌ی *خالی* فرستاده می‌شد،
    // که بک‌اند اونو «همه‌ی تخصیص‌های قبلی رو پاک کن» تفسیر می‌کرد —
    // یعنی فقط با بازکردن‌وذخیره‌کردنِ یه حواله (بدونِ دست‌زدن به بخشِ
    // تخصیص)، همه‌ی لینک‌های واقعیش پاک می‌شد! فیکس: اگه کاربر تو همینِ
    // جلسه دکمه رو نزده (autoSplitResult === null)، اصلاً کلیدِ
    // paymentAllocations رو به body اضافه نکن — تا بک‌اند (که چک می‌کنه
    // `is not None`) دست‌نخورده نگهش داره.
    const body = {supplier_name:supplierName, date, rate_at_hawale:rate, rate_at_customer_deposit:rateAtDeposit, manual_expense:manualExpense, note, contributions:validContribs};
    if(autoSplitResult){
      body.paymentAllocations = autoSplitResult.allocations.map(a=>({payment: a.payment_id, rial_amount: a.amount}));
      // ⚠️ (۱۴۰۵/۰۶/۲۳) طبق طراحیِ دقیقِ کاربر: اگه واریزیِ آزادِ این
      // مشتری کافی نبود، مابه‌التفاوت از سرمایه/حسابِ خودِ شرکت برداشته
      // شده — خودکار یه رکوردِ «پیش‌پرداختِ سرمایه‌ای» ثبت می‌شه.
      if(autoSplitResult.uncovered > 0.01){
        const custName = backdrop.querySelector('#hAutoSplitCustomer').value.trim();
        body.capitalAdvance = {customerName: custName, rialAmount: autoSplitResult.uncovered};
      }
    }
    const d = isEdit ? await apiUpdate('hawales', existing.id, body) : await apiCreate('hawales', body);
    if(!d) return;

    // ⚠️ (۱۴۰۵/۰۶/۱۸) لینک‌کردنِ گروهیِ پرداخت‌های انتخاب‌شده به این حواله
    const newHawaleId = d.id;
    const previouslyLinked = isEdit ? new Set(state.payments.filter(p=>p.hawale==existing.id).map(p=>p.id)) : new Set();
    const toLink = [...selectedPaymentIds].filter(pid => !previouslyLinked.has(pid));
    const toUnlink = [...previouslyLinked].filter(pid => !selectedPaymentIds.has(pid));
    for(const pid of toLink) await apiUpdate('payments', pid, {hawale: newHawaleId});
    for(const pid of toUnlink) await apiUpdate('payments', pid, {hawale: null});
    if(toLink.length || toUnlink.length) showToast(`✅ حواله ثبت شد — ${toLink.length} واریزی لینک شد`);

    backdrop.remove();
    renderHawales(document.getElementById('main'));
  });
}

// ---------- SUPPLIER (هزینه‌ی ترکیبی — خرید+جابجایی+کارمزد یوانی، + حمل ریالی جدا) ----------
// ---------- SUPPLIERS LIST (طبق تصمیم کاربر: تأمین‌کننده فقط کلافی نیست) ----------
let currentSupplier = null;
let currentAccount = null;

async function renderSupplier(main){
  currentSupplier ? renderSupplierLedger(main) : renderSuppliersList(main);
}

async function renderSuppliersList(main){
  const basis = state.settings.rateBasis;
  const g = await apiGetSummary(basis);
  if(!g){ main.innerHTML = '<p class="page-desc">❌ اتصال به سرور برقرار نشد</p>'; return; }
  const filteredSuppliers = g.suppliers.filter(s=>matchesSearch([
    s.name, s.yuanBought, s.expenseYuan, s.yuanBalance, s.unpaidFreightRial,
  ], suppliersListSearchQuery));
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">تأمین‌کنندگان</h1>
      <p class="page-desc">هر تأمین‌کننده مانده‌ی یوانیِ کاملاً جدای خودش را دارد — روی هرکدام بزنید تا دفترش را ببینید</p>
    </div>
    <div class="toolbar"><div></div><input id="suppliersListSearchInput" type="text" placeholder="🔍 جستجو در همه‌ی ستون‌ها..." value="${suppliersListSearchQuery}" style="min-width:200px"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>تأمین‌کننده</th><th>یوان خریداری‌شده</th><th>یوان خرج‌شده</th><th>مانده (یوان)</th><th>مانده‌ی حمل پرداخت‌نشده</th><th></th></tr></thead>
        <tbody>
          ${filteredSuppliers.length===0 ? `<tr class="empty-row"><td colspan="6">${suppliersListSearchQuery?'چیزی پیدا نشد':'هنوز تأمین‌کننده‌ای ثبت نشده — از تب «حواله‌ها» یا «ثبت هزینه» شروع کنید'}</td></tr>` :
          filteredSuppliers.map(s=>`<tr style="cursor:pointer" data-open-supplier="${s.name}">
            <td><strong>${s.name}</strong></td>
            <td class="num">${fmtYuan(s.yuanBought)}</td>
            <td class="num">${fmtYuan(s.expenseYuan)}</td>
            <td class="num" style="font-weight:700">${fmtYuan(s.yuanBalance)}</td>
            <td class="num">${fmtRial(s.unpaidFreightRial)}</td>
            <td><button class="btn btn-ghost btn-sm">مشاهده دفتر ›</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  main.querySelector('#suppliersListSearchInput').addEventListener('input', (e)=>{
    suppliersListSearchQuery = e.target.value;
    renderSuppliersList(main);
  });
  main.querySelectorAll('[data-open-supplier]').forEach(tr=>tr.addEventListener('click', ()=>{
    currentSupplier = tr.dataset.openSupplier;
    renderMain();
  }));
}

async function apiGetSupplierLedger(supplier){ const r = await fetch(FX_API+'supplier-ledger/?supplier='+encodeURIComponent(supplier)); return r.ok ? r.json() : null; }
async function apiGetAccountLedger(accountId){ const r = await fetch(FX_API+'account-ledger/?account='+accountId); return r.ok ? r.json() : null; }

async function renderSupplierLedger(main){
  await loadAll();
  const sName = currentSupplier;
  const data = await apiGetSupplierLedger(sName);
  if(!data){ main.innerHTML = '<p class="page-desc">❌ خطا در بارگذاری دفتر</p>'; return; }
  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق سؤالِ کاربر: تقارن با سمتِ مشتری — همون مانده‌ی
  // ریالیِ واقعی (فقط اعدادِ مطمئن) + مانده‌ی یوانی، از آخرین رویدادِ دفتر
  const lastEvent = data.events.length ? data.events[data.events.length-1] : null;
  const realRialBalance = lastEvent ? lastEvent.runningRial : 0;
  const realYuanBalance = lastEvent ? lastEvent.runningYuan : 0;
  let expenses = sortByDateDesc(state.expenses.filter(e=>e.supplier_name===sName));
  const totalFreight = expenses.reduce((s,e)=>s+Number(e.freight_rial||0),0);
  const unpaidFreight = expenses.filter(e=>!e.freight_paid).reduce((s,e)=>s+Number(e.freight_rial||0),0);
  if(supplierExpenseSearchQuery.trim()){
    const q = supplierExpenseSearchQuery.trim();
    expenses = expenses.filter(e=>matchesSearch([
      e.date, e.part_number, e.doc_number, e.quantity, e.goods_yuan, e.shipping_yuan, e.transfer_fee_yuan, e.totalYuan,
      e.freight_rial, e.freight_paid ? 'پرداخت‌شده' : 'در انتظار',
    ], q));
  }
  const filteredInvoices = data.invoiceStatus.filter(o=>matchesSearch([
    o.date, o.yuanAmount, o.remainingYuan, o.closed?'تسویه‌شده':'باز', o.weightedAvgRate, o.rialEquivalentForAccounting, o.isLocked?'قفل‌شده':'',
  ], supplierInvoicesSearchQuery));
  const hawalesForSupplier = sortByDateAsc(state.hawales.filter(h=>h.supplier_name===sName));
  const filteredHawaleStatus = hawalesForSupplier.filter(h=>{
    const bd = data.hawaleBreakdown[h.id] || {totalYuan:h.yuanAmount, spentYuan:0, remainingYuan:h.yuanAmount};
    return matchesSearch([h.date, bd.totalYuan, bd.spentYuan, bd.remainingYuan], supplierHawaleStatusSearchQuery);
  });
  const filteredSupplierEvents = data.events.filter(e=>matchesSearch([
    e.date, e.docNumber, e.desc, e.type==='hawale'?e.rial_credit:null, e.yuan_debit, e.yuan_credit, e.rate,
    e.runningYuan, e.runningRial, e.diagnosis, e.docGroup,
  ], supplierEventsSearchQuery));
