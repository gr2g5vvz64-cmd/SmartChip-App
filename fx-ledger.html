<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر ارزی اسمارت‌چیپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ ناهماهنگیِ رنگی — طبقِ گزارشِ کاربر: این پالت
       عیناً از فایلِ اولیه‌ی کاربر به ارث رسیده بود و هیچ‌وقت با پالتِ
       یکپارچه‌ی آبیِ CRM/ERP هماهنگ نشده بود (همون الگوی مشکلی که قبلاً
       تو index.html/mobile.html هم پیدا و فیکس شده بود). --border قدیمی
       (#E1E4EA) هم کنتراستِ خیلی کمی با پس‌زمینه‌ی سفید داشت، برای همینم
       خطوطِ جدول عملاً نامرئی بودن.
    */
    --ink:#0f1f36;
    --ink-soft:#3f5875;
    --ink-faint:#6b84a3;
    --paper:#a9c8ec;
    --surface:#c3dbf3;
    --border:#7ea3cc;
    --rial:#0e7d6b;
    --rial-soft:#d5e8e4;
    --yuan:#b45309;
    --yuan-soft:#f5e6d3;
    --danger:#dc2626;
    --danger-soft:#fbdddb;
    --accent:#0e7d6b;
    --card:#c3dbf3;
    --radius:12px;
    --sidebar-w:236px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
  }
  .num{ font-feature-settings:"tnum" 1, "lnum" 1; direction:ltr; unicode-bidi:isolate; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ صریحِ کاربر: در کلِ دفترِ ارزی، همه‌ی
     ستون‌ها به‌جز «تاریخ» و «شرح/توضیح» باید وسط‌چین باشن */
  table td, table th{ text-align:center; }
  .date-cell{ font-feature-settings:"tnum" 1, "lnum" 1; direction:ltr; unicode-bidi:isolate; text-align:right; }
  th.col-right, td.col-right{ text-align:right !important; }
  .app{ display:flex; min-height:100vh; }
  /* Sidebar */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--ink); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:24px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08); }
  .brand-title{ font-weight:800; font-size:16px; letter-spacing:.2px; }
  .brand-sub{ font-size:12px; color:#9AA3B2; margin-top:4px; }
  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:9px;
    color:#C7CCD6; font-size:14px; cursor:pointer; border:none; background:none; text-align:right; font-family:inherit;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.active{ background:#fff; color:var(--ink); font-weight:600; }
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0; }
  .sidebar-foot{ padding:14px 20px; font-size:11px; color:#7C8494; border-top:1px solid rgba(255,255,255,.08); }

  /* Main */
  .main{ flex:1; min-width:0; padding:28px 32px 60px; }
  .page-head{ margin-bottom:22px; }
  .page-title{ font-size:21px; font-weight:800; margin:0 0 4px; }
  .page-desc{ font-size:13px; color:var(--ink-soft); margin:0; }

  .grid{ display:grid; gap:14px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .stat-card{ display:flex; flex-direction:column; gap:6px; }
  .stat-label{ font-size:12.5px; color:var(--ink-soft); }
  .stat-value{ font-size:22px; font-weight:800; }
  .stat-value.rial{ color:var(--rial); }
  .stat-value.yuan{ color:var(--yuan); }
  .stat-hint{ font-size:11.5px; color:var(--ink-faint); }
  .tag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; }
  .tag.rial{ background:var(--rial-soft); color:var(--rial); }
  .tag.yuan{ background:var(--yuan-soft); color:var(--yuan); }
  .tag.danger{ background:var(--danger-soft); color:var(--danger); }
  .tag.neutral{ background:var(--paper); color:var(--ink-soft); }

  .section-title{ font-size:14.5px; font-weight:700; margin:28px 0 10px; display:flex; align-items:center; justify-content:space-between; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; }
  .empty-row td{ text-align:center; color:var(--ink-faint); padding:26px; font-size:13px; }

  .btn{ font-family:inherit; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:#2A2F3A; }
  .btn-ghost{ background:var(--paper); color:var(--ink); }
  .btn-ghost:hover{ background:#E4E8EE; }
  .btn-danger-text{ background:none; color:var(--danger); padding:4px 8px; font-size:12px; }
  .btn-danger-text:hover{ text-decoration:underline; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:15px; padding:4px 6px; border-radius:6px; }
  .icon-btn:hover{ background:var(--paper); color:var(--danger); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .seg{ display:inline-flex; background:var(--paper); border-radius:9px; padding:3px; gap:2px; }
  .seg button{ font-family:inherit; border:none; background:none; padding:7px 13px; font-size:12.5px; border-radius:7px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }

  .form-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    font-family:inherit; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13.5px; background:#fff; color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid #C7CCD6; outline-offset:0; border-color:#B7BEC9; }
  .field input.num, .field textarea{ direction:rtl; }
  .field small.calc{ font-size:11.5px; color:var(--ink-faint); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,22,28,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:14px; padding:22px; width:100%; max-width:420px; }
  .modal h3{ margin:0 0 14px; font-size:15.5px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-start; margin-top:16px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-size:32px; margin-bottom:8px; }

  .mobile-tabs{ display:none; }
  @media(max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; }
    .brand{ border-bottom:none; padding:14px 16px; }
    .nav{ flex-direction:row; overflow-x:auto; padding:8px 10px; flex:1; }
    .nav-item{ white-space:nowrap; }
    .sidebar-foot{ display:none; }
    .main{ padding:18px; }
    .form-grid{ grid-template-columns:1fr 1fr; }
  }
  .customer-balance-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .link-pill{ font-size:11px; padding:2px 8px; border-radius:99px; background:var(--paper); color:var(--ink-soft); }
  .warn-note{ font-size:12px; color:var(--ink-soft); background:var(--paper); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; z-index:100; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .load-screen{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--ink-soft); font-size:14px; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست کاربر: خطوط جدول همه‌جا واضح‌تر */
  table, th, td { border: 1px solid var(--border) !important; }
  table { border-collapse: collapse !important; }
  /* جدول راهنمای فیلدها — بالای هر فرم، توضیح می‌ده کجا چی بنویسیم */
  .field-guide{ background:#F5F7FA; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:11.5px; color:var(--ink-soft); }
  .field-guide table{ width:100%; font-size:11px; }
  .field-guide th{ text-align:right; padding:4px 6px; color:var(--ink); }
  .field-guide td{ padding:4px 6px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  /* ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ کاربر: طراحیِ landscape برای فرم‌های
     ثبتِ حواله/فاکتور — عریض‌تر، فیلدها کنارِ هم به‌جای زیرِ هم */
  .modal.modal-landscape{ max-width:760px; }
  .form-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
  @media(max-width:700px){ .modal.modal-landscape{ max-width:420px; } .form-grid-3{ grid-template-columns:1fr; } }
  .contrib-row{ display:grid; grid-template-columns:2fr 1fr auto; gap:8px; align-items:center; margin-bottom:6px; }
  .status-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
  .status-chip.closed{ background:var(--rial-soft); color:var(--rial); }
  .status-chip.open{ background:var(--yuan-soft); color:var(--yuan); }
</style>
</head>
<body>
<div id="root"><div class="load-screen">در حال بارگذاری…</div></div>
<div class="toast" id="toast"></div>
<script>
// ══════════════════════════════════════════════════════════════
// دفتر ارزی SmartChip — نسخه‌ی متصل به بک‌اند واقعی (۱۴۰۵/۰۶/۱۸)
// ⚠️ ذخیره‌سازی واقعی (Django)، نه لوکال‌استوریج مرورگر — طبق تصمیم کاربر.
// ══════════════════════════════════════════════════════════════
const FX_API = 'https://smartchip-backend.onrender.com/api/fxledger/';
const CRM_CUSTOMERS_API = 'https://smartchip-backend.onrender.com/api/customers/customers/';

// ── شمسی: تبدیل و فرمت (بدون کتابخانه‌ی خارجی، همون الگوریتم استانداردِ رایج) ──
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  jy += Math.floor((days-1)/365); if(days > 365) days = (days-1)%365;
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
function jalaliToGregorian(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097); days %= 146097;
  let leap = true;
  if(days > 36524){ days--; gy += 100*Math.floor(days/36524); days %= 36524; if(days >= 365) days++; else leap=false; }
  gy += 4*Math.floor(days/1461); days %= 1461;
  if(days > 365){ leap=false; gy += Math.floor((days-1)/365); days = (days-1)%365; }
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let gd = days+1;
  let gm;
  for(gm=1; gm<13; gm++){ const next = (gm===12)?366:g_d_m[gm]+((gm===2&&leap)?1:0); if(days < next) break; }
  // fallback ساده — کافیه برای این پروژه (تبدیل تک‌روزه، نه محاسبات تقویمیِ پیچیده)
  const d = new Date(gy, 0, 1); d.setDate(d.getDate() + days);
  return [d.getFullYear(), d.getMonth()+1, d.getDate()];
}
function todayShamsi(){
  const now = new Date();
  const [jy,jm,jd] = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  return `${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`;
}
function shamsiSortVal(s){
  if(!s) return 0;
  // ⚠️ (۱۴۰۵/۰۶/۱۸) فرمت از / به - تغییر کرد؛ اینجا هر دو رو می‌پذیریم تا
  // داده‌ی قدیمی (اگه با / ثبت شده بود) هم درست مرتب بشه
  const [y,m,d] = s.split(/[-/]/).map(Number);
  return y*400 + m*31 + d;
}

// ⚠️ (۱۴۰۵/۰۶/۱۸) عیناً کپی از crm.html — طبق دستور صریح کاربر: نرمال‌سازیِ
// نامِ مشتری/تأمین‌کننده باید دقیقاً همون منطقِ CRM باشه، تا یه نامِ مشابه
// (ی فارسی/ي عربی، ک/ك) به‌عنوان دو موجودیتِ جدا حساب نشه.
function fa2en(s){ return (s||'').toString().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function normalizeFa(s){
  return fa2en((s||'').toString().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase());
}
// اگه یه نامِ مشابه (نرمال‌شده یکسان، ولی رشته‌ی خام فرق داره) از قبل تو
// لیستِ knownNames باشه، همونو برمی‌گردونه — تا بشه به کاربر پیشنهاد داد
function findSimilarExistingName(typedName, knownNames){
  const nq = normalizeFa(typedName);
  if(!nq) return null;
  const match = knownNames.find(n => normalizeFa(n) === nq && n !== typedName);
  return match || null;
}

// ⚠️ (۱۴۰۵/۰۶/۱۸) تقویمِ شمسیِ کلیکی — طبق درخواست صریح کاربر: فرمتِ
// یک‌نواخت YYYY-MM-DD، انتخاب با کلیک (نه تایپِ دستی).
function jalaliLeapSimple(jy){
  // روشِ ساده و قابل‌اتکا: تبدیل به میلادی و برگشت، چک کن روزِ ۳۰ اسفند معتبره یا نه
  const g1 = jalaliToGregorian(jy, 12, 30);
  const back = gregorianToJalali(g1[0], g1[1], g1[2]);
  return back[1] === 12 && back[2] === 30;
}
function daysInJalaliMonth(jy, jm){
  if(jm <= 6) return 31;
  if(jm <= 11) return 30;
  return jalaliLeapSimple(jy) ? 30 : 29;
}
const JALALI_MONTH_NAMES = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAY_NAMES = ['ش','ی','د','س','چ','پ','ج']; // شنبه تا جمعه

function openShamsiCalendarPicker(inputEl){
  document.querySelectorAll('.shamsi-cal-popup').forEach(p=>p.remove());
  let [vy,vm] = (inputEl.value || todayShamsi()).split(/[-/]/).map(Number);
  if(!vy){ const t = todayShamsi().split('-').map(Number); vy=t[0]; vm=t[1]; }

  const popup = document.createElement('div');
  popup.className = 'shamsi-cal-popup';
  popup.style.cssText = 'position:absolute;z-index:100;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:10px;width:260px;';
  const rect = inputEl.getBoundingClientRect();
  popup.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  popup.style.left = (window.scrollX + rect.left) + 'px';

  function renderCalendar(){
    const firstOfMonthG = jalaliToGregorian(vy, vm, 1);
    const jsDate = new Date(firstOfMonthG[0], firstOfMonthG[1]-1, firstOfMonthG[2]);
    const jsWeekday = jsDate.getDay(); // 0=یکشنبه تو جاوااسکریپت
    const startOffset = (jsWeekday + 1) % 7; // تبدیل به اندیسِ هفته‌ی ایرانی: شنبه=0
    const totalDays = daysInJalaliMonth(vy, vm);
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += '<div></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isSelected = inputEl.value === dateStr;
      cells += `<div data-pick-day="${dateStr}" style="text-align:center;padding:5px 0;border-radius:6px;cursor:pointer;font-size:11px;${isSelected?'background:var(--accent);color:#fff;':''}">${d}</div>`;
    }
    popup.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <button type="button" id="calPrevBtn" style="border:none;background:none;cursor:pointer;font-size:14px">‹</button>
        <div style="font-size:12px;font-weight:700">${JALALI_MONTH_NAMES[vm-1]} ${vy}</div>
        <button type="button" id="calNextBtn" style="border:none;background:none;cursor:pointer;font-size:14px">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
        ${JALALI_WEEKDAY_NAMES.map(w=>`<div style="text-align:center;font-size:9px;color:var(--ink-soft)">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
      <button type="button" id="calTodayBtn" style="width:100%;margin-top:8px;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:11px;cursor:pointer">امروز</button>
    `;
    popup.querySelector('#calPrevBtn').addEventListener('click', ()=>{ vm--; if(vm<1){vm=12;vy--;} renderCalendar(); });
    popup.querySelector('#calNextBtn').addEventListener('click', ()=>{ vm++; if(vm>12){vm=1;vy++;} renderCalendar(); });
    popup.querySelector('#calTodayBtn').addEventListener('click', ()=>{
      inputEl.value = todayShamsi();
      inputEl.dispatchEvent(new Event('input'));
      popup.remove();
    });
    popup.querySelectorAll('[data-pick-day]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pickDay;
      inputEl.dispatchEvent(new Event('input'));
      popup.remove();
    }));
  }
  renderCalendar();
  document.body.appendChild(popup);
  // ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ گزارش‌شده: کلیک رو دکمه‌ی prev/next
  // باعثِ صدازدنِ renderCalendar می‌شد که popup.innerHTML رو کامل عوض
  // می‌کنه — یعنی دکمه‌ای که کلیک شده بود از DOM جدا می‌شد، و وقتی
  // closeHandler (پایین‌تر) چک می‌کرد popup.contains(e.target)، چون اون
  // دکمه‌ی قدیمی دیگه بخشی از DOM نبود، false برمی‌گشت و پاپ‌آپ اشتباهاً
  // بسته می‌شد. فیکس: کلیکِ داخلِ popup اصلاً به document نمی‌رسه.
  popup.addEventListener('click', (e)=>e.stopPropagation());
  setTimeout(()=>{
    document.addEventListener('click', function closeHandler(e){
      if(!popup.contains(e.target) && e.target!==inputEl){ popup.remove(); document.removeEventListener('click', closeHandler); }
    });
  }, 0);
}

function fmt(n, digits){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const d = digits === undefined ? 0 : digits;
  let s = Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست صریح کاربر: صفرهای اضافیِ بعدِ اعشار حذف
  // بشن — ۲۳۹۸.۰۰۰۰ بشه ۲۳۹۸، ۱۲۳۵.۰۹۸۰ بشه ۱۲۳۵.۰۹۸
  if(s.includes('.')){
    s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  return s;
}
function fmtRial(n){ return fmt(n,0) + ' ریال'; }
function fmtYuan(n){ return fmt(n,4) + ' ¥'; }

function showToast(msg){

}

// ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواست کاربر: فرمتِ زنده (سه‌رقم‌سه‌رقم) موقعِ
// خودِ تایپ، نه فقط تو نمایش. موقعیتِ کرسر رو با شمردنِ تعدادِ رقم‌های
// قبل از کرسر حفظ می‌کنیم، تا تایپ‌کردن دست‌وپاگیر نشه.
// ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ گزارش‌شده توسطِ کاربر: نسخه‌ی قبلی این
// تابع، موقعیتِ کرسر رو فقط با شمردنِ «تعدادِ ارقام قبل از کرسر» حساب
// می‌کرد — بدونِ درنظرگرفتنِ خودِ نقطه‌ی اعشار! نتیجه: وقتی کاربر نقطه یا
// رقمِ بعدِ اعشار تایپ می‌کرد، کرسر اشتباهاً وسطِ بخشِ صحیح می‌موند، و
// رقمِ بعدی به‌جای بعدِ اعشار، وسطِ عدد درج می‌شد (مثلاً ۴۲۶۹.۶ می‌شد
// ۴۲۶۹۶). فیکس: موقعیتِ کرسر رو نسبت‌به‌بخشِ (صحیح یا اعشاری) که توشه
// جدا محاسبه می‌کنیم، تست شد با شبیه‌سازیِ کاملِ تایپِ حرف‌به‌حرف.
function wireLiveNumberFormat(inputEl){
  inputEl.addEventListener('input', ()=>{
    const oldValue = inputEl.value;
    const cursorPos = inputEl.selectionStart;
    const raw = oldValue.replace(/[^\d.]/g,'');
    if(!raw){ inputEl.value=''; return; }

    // آیا کرسر تو بخشِ اعشاری (بعد از اولین نقطه) بود؟
    const firstDotIdx = oldValue.indexOf('.');
    const cursorInDecimalPart = firstDotIdx !== -1 && cursorPos > firstDotIdx;

    const rawParts = raw.split('.');
    const rawIntPart = rawParts[0];
    const rawDecPart = rawParts.length > 1 ? rawParts.slice(1).join('') : null; // اگه چند نقطه تایپ شده بود هم قاطی نشه

    const formattedInt = rawIntPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const formattedValue = rawDecPart !== null ? formattedInt + '.' + rawDecPart : formattedInt;
    inputEl.value = formattedValue;

    let newPos;
    if(cursorInDecimalPart){
      // تعدادِ رقم‌های اعشاریِ *قبل از کرسر* رو تو مقدارِ قدیم بشمر، بعد
      // همون تعداد رقم رو بعدِ نقطه‌ی جدید قرار بده
      const oldDecimalBeforeCursor = oldValue.slice(firstDotIdx+1, cursorPos).replace(/[^\d]/g,'').length;
      const newDotIdx = formattedValue.indexOf('.');
      newPos = newDotIdx + 1 + oldDecimalBeforeCursor;
    } else {
      // کرسر تو بخشِ صحیح بود — تعدادِ ارقامِ صحیحِ قبل از کرسر رو بشمر
      const oldIntBeforeCursor = oldValue.slice(0, cursorPos).replace(/[^\d]/g,'').length;
      let seen = 0; newPos = formattedInt.length;
      for(let i=0;i<formattedInt.length;i++){
        if(/\d/.test(formattedInt[i])) seen++;
        if(seen===oldIntBeforeCursor){ newPos=i+1; break; }
      }
    }
    inputEl.setSelectionRange(newPos, newPos);
  });
}

function wirePartNumberAutocomplete(inputEl, resultsBoxEl){
  let seq = 0;
  inputEl.addEventListener('input', async ()=>{
    const q = inputEl.value;
    if(q.trim().length<1){ resultsBoxEl.innerHTML=''; return; }
    const mySeq = ++seq;
    const items = await fxSearchItems(q);
    if(mySeq !== seq) return; // یه سرچِ جدیدتر تو راهه
    resultsBoxEl.innerHTML = items.length ? `<div style="position:absolute;top:2px;right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:8px;z-index:10;max-height:160px;overflow-y:auto">
      ${items.map(name=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-part="${name}">${name}</div>`).join('')}
    </div>` : '';
    resultsBoxEl.querySelectorAll('[data-pick-part]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pickPart;
      resultsBoxEl.innerHTML = '';
    }));
  });
}

  // مشخص شده) ساخته می‌شه، نه حدس یا تخمین. این عدد از آخرین رویدادِ

    </div>
    <div class="grid grid-2" style="margin-bottom:16px">

  }));
  main.querySelectorAll('[data-unlock-order]').forEach(b=>b.addEventListener('click', async ()=>{

  backdrop.className='modal-backdrop';
  let selectedCustomerName = existing ? existing.customer_name : (presetCustomer||'');
  backdrop.innerHTML = `
    <div class="modal modal-landscape">
      <h3>${isEdit ? 'ویرایش فاکتور/پیش‌فاکتور' : 'ثبت فاکتور/پیش‌فاکتورِ یوانی'}</h3>
      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>مشتری</td><td>مشتری‌ای که با این فاکتور بدهکار می‌شود — از همون لیستِ اولویت‌دارِ CRM</td></tr>
          <tr><td>نوع</td><td>فاکتور (قطعی) یا پیش‌فاکتور — هر دو یه مبلغِ یوانی می‌سازن که مشتری بدهکارش می‌شود</td></tr>
          <tr><td>مبلغ (یوان)</td><td>مبلغِ کلِ فاکتور/پیش‌فاکتور، به یوان</td></tr>
        </table>
      </div>
      <div class="form-grid-3">
        ${presetCustomer ? `<div class="field"><label>مشتری</label><input type="text" value="${presetCustomer}" disabled></div>` : `
        <div class="field"><label>مشتری</label>
          <input id="oCustomer" type="text" value="${selectedCustomerName}" placeholder="حداقل ۲ حرف تایپ کنید...">
          <div id="oCustomerResults" style="position:relative"></div>
        </div>`}
        <div class="field"><label>نوع</label>
          <select id="oType">
            <option value="proforma" ${existing&&existing.order_type==='proforma'?'selected':''}>پیش‌فاکتور</option>
            <option value="invoice" ${existing&&existing.order_type==='invoice'?'selected':''}>فاکتور</option>
          </select>
        </div>
        <div class="field"><label>شماره (اختیاری)</label><input id="oNo" type="text" value="${existing?existing.invoice_no||'':''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>تاریخ (شمسی)</label><input id="oDate" type="text" value="${existing?existing.date:today}" placeholder="1405-06-18"></div>
        <div class="field"><label>مبلغ (یوان)</label><input id="oAmount" type="text" class="num" value="${existing?fmt(existing.yuan_amount,4):''}"></div>
      </div>
      <div class="field"><label>توضیح (اختیاری)</label><input id="oNote" type="text" value="${existing?existing.note||'':''}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveOrderBtn">${isEdit?'ذخیره تغییرات':'ثبت'}</button>
        <button class="btn btn-ghost" id="cancelOrderBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelOrderBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#oDate'));
  wireLiveNumberFormat(backdrop.querySelector('#oAmount'));

  if(!presetCustomer){
    const custInput = backdrop.querySelector('#oCustomer');
    const custResults = backdrop.querySelector('#oCustomerResults');
    custInput.addEventListener('input', async ()=>{
      const q = custInput.value.trim();
      if(q.length < 2){ custResults.innerHTML=''; return; }
      const matches = await searchCrmPriorityCustomers(q);
      custResults.innerHTML = matches.length ? `<div style="position:absolute;top:2px;right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:8px;z-index:10;max-height:160px;overflow-y:auto">
        ${matches.map(m=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-cust="${m.name}">${m.name}</div>`).join('')}
      </div>` : '';
      custResults.querySelectorAll('[data-pick-cust]').forEach(el=>el.addEventListener('click', ()=>{
        selectedCustomerName = el.dataset.pickCust;
        custInput.value = selectedCustomerName;
        custResults.innerHTML = '';
      }));
    });
  }

  backdrop.querySelector('#saveOrderBtn').addEventListener('click', async ()=>{
    if(!presetCustomer) selectedCustomerName = selectedCustomerName || backdrop.querySelector('#oCustomer').value.trim();
    const orderType = backdrop.querySelector('#oType').value;
    const invoiceNo = backdrop.querySelector('#oNo').value.trim();
    const date = backdrop.querySelector('#oDate').value.trim();
    const yuanAmount = parseFloat(backdrop.querySelector('#oAmount').value.replace(/,/g,''));
    const note = backdrop.querySelector('#oNote').value.trim();
    if(!selectedCustomerName || !date || !yuanAmount){ showToast('مشتری، تاریخ، و مبلغ را وارد کنید'); return; }

    const similar = findSimilarExistingName(selectedCustomerName, getKnownCustomerNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه مشتری با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله.\n«انصراف» = نه، این مشتریِ جدیدیه.`);
      if(useExisting) selectedCustomerName = similar;
    }

    const body = {customer_name:selectedCustomerName, order_type:orderType, invoice_no:invoiceNo, date, yuan_amount:yuanAmount, note};
    const d = isEdit ? await apiUpdate('orders', existing.id, body) : await apiCreate('orders', body);
    if(!d) return;
    backdrop.remove();
    currentCustomer = selectedCustomerName;
    renderMain();
  });
}

let paymentsSearchQuery = '';
let supplierExpenseSearchQuery = '';
// ⚠️ (۱۴۰۵/۰۶/۱۸) فیکسِ باگِ واقعیِ کندیِ لودشدن: قبلاً SheetJS تو <head>
// و بدونِ defer لود می‌شد — یعنی کلِ صفحه تا دانلودِ کاملِ این فایلِ
// خارجی (از cdnjs.cloudflare.com که ممکنه از ایران کند/غیرقابل‌دسترس
// باشه) معلق می‌موند. الان فقط وقتی واقعاً دکمه‌ی خروجی زده بشه، لود می‌شه.
let _xlsxLibPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLibPromise) return _xlsxLibPromise;
  _xlsxLibPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _xlsxLibPromise;
}
async function xlsxDownload(filename, sheetName, rows){
  try{
    showToast('⏳ در حال آماده‌سازیِ فایلِ اکسل...');
    await loadXlsxLib();
  }catch(e){
    showToast('❌ اتصال به کتابخانه‌ی اکسل برقرار نشد — اینترنتتون رو چک کنید');
    return;
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

      <button class="btn btn-primary" id="addPaymentBtn">+ ثبت پرداخت</button>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="paymentsSearchInput" type="text" placeholder="🔍 جستجو با نام مشتری یا تاریخ..." value="${paymentsSearchQuery}" style="min-width:220px">
        <button class="btn btn-ghost btn-sm" id="exportPaymentsBtn">📥 خروجی اکسل</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-right">تاریخ</th><th>مشتری</th><th>حساب دریافت‌کننده</th><th>مبلغ (ریال)</th><th>نرخ روز واریز</th><th>تخصیصِ دستی به فاکتور</th><th>وضعیتِ حواله</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr class="empty-row"><td colspan="8">${paymentsSearchQuery ? 'چیزی پیدا نشد' : 'پرداختی ثبت نشده است'}</td></tr>` :
          filtered.map(p=>{
            const acc = state.accounts.find(a=>a.id===p.account);
            const hawale = p.hawale ? state.hawales.find(h=>h.id===p.hawale) : null;
            return `<tr>
              <td class="date-cell">${p.date}</td>
              <td>${p.customer_name}${p.affectsLockedOrder?' <span class="tag danger" title="این مشتری فاکتورِ قفل‌شده دارد — با احتیاط ویرایش کنید">🔒</span>':''}</td>
              <td>${acc ? acc.displayName : '—'}</td>
              <td class="num">${fmtRial(p.rial_amount)}</td>
              <td class="num">${fmt(p.rate_at_payment,0)}</td>
              <td>${p.manual_order ? '<span class="tag danger">فاکتور #'+p.manual_order+' (دستی)</span>' : '<span class="tag neutral">خودکار (FIFO)</span>'}</td>
              <td>${hawale ? `<span class="status-chip closed" title="${hawale.date} — ${hawale.supplier_name}">✅ لینک‌شده</span>` : '<span class="status-chip open">⏳ بدونِ حواله</span>'}</td>
              <td><button class="icon-btn" data-edit-payment="${p.id}">ویرایش</button> <button class="icon-btn" data-del-payment="${p.id}">حذف</button> <button class="icon-btn" data-hist-payment="${p.id}">📜</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  main.querySelector('#paymentsSearchInput').addEventListener('input', (e)=>{
    paymentsSearchQuery = e.target.value;
    renderPayments(main);
  });
  main.querySelector('#exportPaymentsBtn').addEventListener('click', ()=>{
    const rows = [['تاریخ','مشتری','حساب','مبلغ ریالی','نرخ روز واریز','تخصیص دستی','توضیح']];
    filtered.forEach(p=>{
      const acc = state.accounts.find(a=>a.id===p.account);
      rows.push([p.date, p.customer_name, acc?acc.displayName:'', p.rial_amount, p.rate_at_payment, p.manual_order||'خودکار', p.note||'']);
    });
    xlsxDownload('پرداخت‌های-مشتریان.xlsx', 'پرداخت‌ها', rows);
  });
  main.querySelector('#addPaymentBtn').addEventListener('click', ()=>openPaymentModal());
  main.querySelectorAll('[data-edit-payment]').forEach(b=>b.addEventListener('click',()=>{
    const p = state.payments.find(x=>x.id==b.dataset.editPayment);
    if(p.affectsLockedOrder && !confirm('⚠️ این مشتری فاکتورِ قفل‌شده (ثبت‌شده در هلو) دارد. ویرایشِ این پرداخت ممکن است با نرخِ حسابداریِ قبلاً ثبت‌شده ناهماهنگ شود. مطمئنید؟')) return;
    openPaymentModal(p);
  }));
  main.querySelectorAll('[data-del-payment]').forEach(b=>b.addEventListener('click', async ()=>{
    const p = state.payments.find(x=>x.id==b.dataset.delPayment);
    const warnMsg = p.affectsLockedOrder
      ? '⚠️ این مشتری فاکتورِ قفل‌شده (ثبت‌شده در هلو) دارد. حذفِ این پرداخت ممکن است با نرخِ حسابداریِ قبلاً ثبت‌شده ناهماهنگ شود. مطمئنید حذف شود؟'
      : 'این پرداخت حذف شود؟';
    if(confirm(warnMsg)){
      const ok = await apiDelete('payments', b.dataset.delPayment);
      if(!ok) return;
      renderPayments(main);
    }
  }));
  main.querySelectorAll('[data-hist-payment]').forEach(b=>b.addEventListener('click', ()=>{
    showHistoryModal(state.payments.find(x=>x.id==b.dataset.histPayment));
  }));
}

function openPaymentModal(existing){
  const today = todayShamsi();
  const isEdit = !!existing;
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? 'ویرایش پرداخت' : 'ثبت پرداخت مشتری'}</h3>
      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>مشتری</td><td>حداقل ۲ حرف از اسم را تایپ کنید تا از لیست مشتریانِ اولویت‌دار CRM پیشنهاد بیاید</td></tr>
          <tr><td>نرخ روز واریز</td><td>نرخِ یوان به ریال، دقیقاً همان روزی که مشتری پول را واریز کرده</td></tr>
          <tr><td>تخصیص دستی</td><td>خالی بگذارید تا خودکار (FIFO) به قدیمی‌ترین فاکتورِ باز تخصیص یابد؛ فقط اگر می‌خواهید این پرداخت را به یک فاکتور خاص بدهید، انتخاب کنید</td></tr>
        </table>
      </div>
      <div class="field" style="margin-bottom:10px"><label>مشتری</label>
        <input id="pCustomer" type="text" value="${existing ? existing.customer_name : ''}" placeholder="حداقل ۲ حرف تایپ کنید...">
        <div id="pCustomerResults" style="position:relative"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>حساب دریافت‌کننده</label>
        <select id="pAccount">${state.accounts.map(a=>`<option value="${a.id}" ${existing&&existing.account===a.id?'selected':''}>${a.displayName}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <div class="field"><label>تاریخ واریز (شمسی)</label><input id="pDate" type="text" value="${existing ? existing.date : today}" placeholder="1405-06-18"></div>
        <div class="field"><label>مبلغ واریزی (ریال)</label><input id="pAmount" type="text" class="num" value="${existing ? fmt(existing.rial_amount,0) : ''}"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>نرخ یوان در روز واریز (ریال)</label><input id="pRate" type="text" class="num" value="${existing ? fmt(existing.rate_at_payment,0) : ''}"></div>
        <div class="field"><label>تخصیصِ دستی به فاکتور (اختیاری)</label>
          <select id="pManualOrder">
            <option value="">— خودکار (FIFO) —</option>
            ${state.orders.filter(o=>o.customer_name===(existing?existing.customer_name:'')).map(o=>`<option value="${o.id}" ${existing&&existing.manual_order===o.id?'selected':''}>${o.date} — ${fmtYuan(o.yuan_amount)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>حواله‌ای که این پرداخت باهاش تسویه شده (اختیاری)</label>
        <select id="pHawale">
          <option value="">— هنوز حواله‌ای برای این نزده‌ام —</option>
          ${state.hawales.map(h=>`<option value="${h.id}" ${existing&&existing.hawale===h.id?'selected':''}>${h.date} — ${h.supplier_name} — ${fmtRial(h.totalRial)} (نرخ ${fmt(h.rate_at_hawale,0)})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>توضیح (اختیاری)</label><input id="pNote" type="text" value="${existing ? existing.note||'' : ''}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="savePaymentBtn">${isEdit?'ذخیره تغییرات':'ثبت پرداخت'}</button>
        <button class="btn btn-ghost" id="cancelPaymentBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelPaymentBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#pDate'));
  wireLiveNumberFormat(backdrop.querySelector('#pAmount'));
  wireLiveNumberFormat(backdrop.querySelector('#pRate'));

  // سرچ زنده‌ی مشتری از CRM
  let selectedCustomerName = existing ? existing.customer_name : '';
  const custInput = backdrop.querySelector('#pCustomer');
  const custResults = backdrop.querySelector('#pCustomerResults');
  custInput.addEventListener('input', async ()=>{
    const q = custInput.value.trim();
    if(q.length < 2){ custResults.innerHTML=''; return; }
    const matches = await searchCrmPriorityCustomers(q);
    custResults.innerHTML = matches.length ? `<div style="position:absolute;top:2px;right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:8px;z-index:10;max-height:160px;overflow-y:auto">
      ${matches.map(m=>`<div style="padding:8px 10px;cursor:pointer;font-size:12px" data-pick-cust="${m.name}">${m.name}</div>`).join('')}
    </div>` : '';
    custResults.querySelectorAll('[data-pick-cust]').forEach(el=>el.addEventListener('click', ()=>{
      selectedCustomerName = el.dataset.pickCust;
      custInput.value = selectedCustomerName;
      custResults.innerHTML = '';
    }));
  });

  backdrop.querySelector('#savePaymentBtn').addEventListener('click', async ()=>{
    selectedCustomerName = selectedCustomerName || custInput.value.trim();
    const accountId = backdrop.querySelector('#pAccount').value;
    const date = backdrop.querySelector('#pDate').value.trim();
    const rialAmount = parseFloat(backdrop.querySelector('#pAmount').value.replace(/,/g,''));
    const rateAtPayment = parseFloat(backdrop.querySelector('#pRate').value.replace(/,/g,''));
    const manualOrder = backdrop.querySelector('#pManualOrder').value || null;
    const hawaleId = backdrop.querySelector('#pHawale').value || null;
    const note = backdrop.querySelector('#pNote').value.trim();
    if(!selectedCustomerName || !date || !rialAmount || !rateAtPayment){ showToast('همه‌ی فیلدهای الزامی را پر کنید'); return; }

    // ⚠️ (۱۴۰۵/۰۶/۱۸) چک نامِ مشابه — طبق دستور صریح کاربر: عیناً منطقِ CRM
    const similar = findSimilarExistingName(selectedCustomerName, getKnownCustomerNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه مشتری با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همون مشتریه؟\n\n«تأیید» = بله، همون «${similar}» است.\n«انصراف» = نه، این واقعاً مشتریِ جدیدیه («${selectedCustomerName}»).`);
      if(useExisting) selectedCustomerName = similar;
    }

    // ⚠️ چک ثبتِ تکراری — همون مشتری، همون تاریخ، همون مبلغ
    if(!isEdit){
      const dup = state.payments.find(p=>normalizeFa(p.customer_name)===normalizeFa(selectedCustomerName) && p.date===date && Number(p.rial_amount)===rialAmount);
      if(dup && !confirm(`⚠️ یه پرداختِ کاملاً مشابه (همون مشتری، همون تاریخ، همون مبلغ) قبلاً ثبت شده. مطمئنید می‌خواید دوباره ثبت کنید؟`)) return;
    }

    const body = {customer_name:selectedCustomerName, account:accountId, date, rial_amount:rialAmount, rate_at_payment:rateAtPayment, manual_order:manualOrder, hawale:hawaleId, note};
    const d = isEdit ? await apiUpdate('payments', existing.id, body) : await apiCreate('payments', body);
    if(!d) return;
    backdrop.remove();
    renderPayments(document.getElementById('main'));
  });
}

// ---------- HAWALES (ترکیبی — چند حساب در یک حواله) ----------
let hawalesSearchQuery = '';
async function renderHawales(main){
  await loadAll();
  let filtered = [...state.hawales].sort((a,b)=>shamsiSortVal(b.date)-shamsiSortVal(a.date));
  if(hawalesSearchQuery.trim()){
    const q = hawalesSearchQuery.trim();
    filtered = filtered.filter(h=>h.supplier_name.includes(q) || h.date.includes(q));
  }
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">حواله‌ها به تأمین‌کننده</h1>
      <p class="page-desc">هر بار ریالِ موجود را به نرخ روز، حواله یوانی خریداری می‌کنید — می‌تواند از چند حساب (حتی چند نفر) هم‌زمان تأمین شود</p>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" id="addHawaleBtn">+ ثبت حواله</button>

        <button class="btn btn-ghost btn-sm" id="exportHawalesBtn">📥 خروجی اکسل</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th class="col-right">تاریخ</th><th>تأمین‌کننده</th><th>حساب‌های مشارکت‌کننده</th><th>مبلغ کل ریالی</th><th>نرخِ حواله</th><th>نرخِ روزِ واریزِ مشتری</th><th>یوان خریداری‌شده</th><th>واریزی‌های لینک‌شده</th><th></th></tr></thead>
        <tbody>
          ${filtered.length===0 ? `<tr class="empty-row"><td colspan="9">${hawalesSearchQuery?'چیزی پیدا نشد':'حواله‌ای ثبت نشده است'}</td></tr>` :
          filtered.map(h=>{

            return `<tr>
            <td class="date-cell">${h.date}</td>
            <td><strong>${h.supplier_name}</strong>${h.affectsLockedOrder?' <span class="tag danger" title="این حواله به مشتری‌ای با فاکتورِ قفل‌شده مرتبط است — با احتیاط ویرایش کنید">🔒</span>':''}</td>

              const acc = state.accounts.find(a=>a.id===c.account);
              return `<div style="font-size:11px">${acc?acc.displayName:'—'}: <span class="num">${fmt(c.rial_amount,0)}</span></div>`;
            }).join('')}</td>
            <td class="num">${fmtRial(h.totalRial)}</td>
            <td class="num">${fmt(h.rate_at_hawale,0)}</td>
            <td class="num">${h.rate_at_customer_deposit ? fmt(h.rate_at_customer_deposit,0) : '—'}</td>
            <td class="num">${fmtYuan(h.yuanAmount)}</td>
            <td>${linkedPayments.length ? `<span class="status-chip closed" title="${linkedNames.join('، ')}">${linkedPayments.length} واریزی — ${linkedNames.join('، ')}</span>` : '<span class="status-chip open">بدونِ لینک</span>'}</td>
            <td><button class="icon-btn" data-edit-hawale="${h.id}">ویرایش</button> <button class="icon-btn" data-del-hawale="${h.id}">حذف</button> <button class="icon-btn" data-hist-hawale="${h.id}">📜</button></td>
          </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="warn-note">برای تخصیصِ دستیِ یک پرداخت به این حواله (یا فاکتور خاص)، به تب «پرداخت‌های مشتریان» بروید.</div>
  `;
  main.querySelector('#hawalesSearchInput').addEventListener('input', (e)=>{
    hawalesSearchQuery = e.target.value;
    renderHawales(main);
  });
  main.querySelector('#exportHawalesBtn').addEventListener('click', ()=>{
    const rows = [['تاریخ','تأمین‌کننده','مبلغ کل ریالی','نرخ حواله','یوان خریداری‌شده','توضیح']];
    filtered.forEach(h=>rows.push([h.date, h.supplier_name, h.totalRial, h.rate_at_hawale, h.yuanAmount, h.note||'']));

    if(confirm(warnMsg)){
      const ok = await apiDelete('hawales', b.dataset.delHawale);
      if(!ok) return;
      renderHawales(main);
    }
  }));
  main.querySelectorAll('[data-hist-hawale]').forEach(b=>b.addEventListener('click', ()=>{
    showHistoryModal(state.hawales.find(x=>x.id==b.dataset.histHawale));
  }));
}

        </select>
      </div>
      <div class="field" style="margin-bottom:6px">
        <label>لینک‌کردنِ گروهیِ واریزی‌های مشتریان (اختیاری)</label>
        <div style="font-size:10.5px;color:var(--ink-soft);margin-bottom:6px">مثلاً: «۳ تا از واریزی‌های ویراتدبیر رو با این حواله تسویه کن» — می‌تونید هرچند تا که خواستید تیک بزنید، یا هیچ‌کدوم (اگه این حواله ربطی به مشتریِ خاصی نداره)</div>
        <input id="hPaymentFilter" type="text" placeholder="🔍 فیلتر با نامِ مشتری (اختیاری)...">
      </div>
      <div id="hPaymentPickerBox" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:14px"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveHawaleBtn">${isEdit?'ذخیره تغییرات':'ثبت حواله'}</button>
        <button class="btn btn-ghost" id="cancelHawaleBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelHawaleBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#hDate'));
  wireLiveNumberFormat(backdrop.querySelector('#hRate'));
  wireLiveNumberFormat(backdrop.querySelector('#hRateAtDeposit'));

  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق سناریوی دقیقِ کاربر: لیستِ پرداخت‌هایی که هنوز به
  // هیچ حواله‌ای وصل نشدن (payment.hawale===null) — قابلِ فیلتر با نامِ
  // مشتری، قابلِ انتخابِ گروهی (چک‌باکس).
  const selectedPaymentIds = new Set(isEdit ? state.payments.filter(p=>p.hawale==existing.id).map(p=>p.id) : []);
  function renderPaymentPicker(filterText){
    const q = (filterText||'').trim();
    const candidates = state.payments.filter(p => (p.hawale==null || selectedPaymentIds.has(p.id)) && (!q || p.customer_name.includes(q)));
    const box = backdrop.querySelector('#hPaymentPickerBox');
    if(candidates.length===0){ box.innerHTML = '<div style="font-size:11px;color:var(--ink-soft);text-align:center;padding:8px">هیچ واریزیِ بدون‌حواله‌ای پیدا نشد</div>'; return; }
    box.innerHTML = candidates.map(p=>`
      <label style="display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:11.5px;cursor:pointer">
        <input type="checkbox" data-pick-payment="${p.id}" ${selectedPaymentIds.has(p.id)?'checked':''}>
        <span>${p.customer_name} — ${p.date} — ${fmtRial(p.rial_amount)}</span>
      </label>`).join('');
    box.querySelectorAll('[data-pick-payment]').forEach(cb=>cb.addEventListener('change', ()=>{
      const pid = +cb.dataset.pickPayment;
      if(cb.checked) selectedPaymentIds.add(pid); else selectedPaymentIds.delete(pid);
    }));
  }
  renderPaymentPicker('');
  backdrop.querySelector('#hPaymentFilter').addEventListener('input', (e)=>renderPaymentPicker(e.target.value));

  function wireContribRows(){
    backdrop.querySelectorAll('[data-contrib-account]').forEach(sel=>sel.addEventListener('change',()=>{
      contribRows[+sel.dataset.contribAccount].account = sel.value;
    }));
    backdrop.querySelectorAll('[data-contrib-amount]').forEach(inp=>{
      wireLiveNumberFormat(inp);
      inp.addEventListener('input',()=>{
        contribRows[+inp.dataset.contribAmount].rial_amount = inp.value.replace(/,/g,'');
      });
    });
    backdrop.querySelectorAll('[data-remove-contrib]').forEach(b=>b.addEventListener('click',()=>{
      if(contribRows.length<=1) return;
      contribRows.splice(+b.dataset.removeContrib, 1);
      backdrop.querySelector('#contribRowsBox').innerHTML = renderContribRows();
      wireContribRows();
    }));
  }
  wireContribRows();
  backdrop.querySelector('#addContribBtn').addEventListener('click', ()=>{
    contribRows.push({account:state.accounts[0]?.id||'', rial_amount:''});
    backdrop.querySelector('#contribRowsBox').innerHTML = renderContribRows();
    wireContribRows();
  });

  backdrop.querySelector('#saveHawaleBtn').addEventListener('click', async ()=>{
    let supplierName = backdrop.querySelector('#hSupplier').value.trim();
    const date = backdrop.querySelector('#hDate').value.trim();
    const rate = parseFloat(backdrop.querySelector('#hRate').value.replace(/,/g,''));
    const note = backdrop.querySelector('#hNote').value.trim();
    const validContribs = contribRows.filter(r=>r.account && parseFloat(r.rial_amount)>0).map(r=>({account:r.account, rial_amount:parseFloat(r.rial_amount)}));
    if(!supplierName || !date || !rate || validContribs.length===0){ showToast('نام تأمین‌کننده، تاریخ، نرخ، و حداقل یک حساب با مبلغ معتبر را وارد کنید'); return; }

    const similar = findSimilarExistingName(supplierName, getKnownSupplierNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه تأمین‌کننده با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله، همون «${similar}».\n«انصراف» = نه، این واقعاً تأمین‌کننده‌ی جدیدیه.`);
      if(useExisting) supplierName = similar;
    }
    if(!isEdit){
      const totalRial = validContribs.reduce((s,c)=>s+c.rial_amount,0);
      const dup = state.hawales.find(h=>normalizeFa(h.supplier_name)===normalizeFa(supplierName) && h.date===date && Math.abs(Number(h.totalRial)-totalRial)<1);
      if(dup && !confirm('⚠️ یه حواله‌ی کاملاً مشابه (همون تأمین‌کننده، همون تاریخ، همون مبلغ) قبلاً ثبت شده. مطمئنید دوباره ثبت کنید؟')) return;
    }

    const manualExpense = backdrop.querySelector('#hManualExpense').value || null;
    const rateAtDepositStr = backdrop.querySelector('#hRateAtDeposit').value.replace(/,/g,'').trim();
    const rateAtDeposit = rateAtDepositStr ? parseFloat(rateAtDepositStr) : null;
    const body = {supplier_name:supplierName, date, rate_at_hawale:rate, rate_at_customer_deposit:rateAtDeposit, manual_expense:manualExpense, note, contributions:validContribs};
    const d = isEdit ? await apiUpdate('hawales', existing.id, body) : await apiCreate('hawales', body);
    if(!d) return;

    // ⚠️ (۱۴۰۵/۰۶/۱۸) لینک‌کردنِ گروهیِ پرداخت‌های انتخاب‌شده به این حواله
    const newHawaleId = d.id;
    const previouslyLinked = isEdit ? new Set(state.payments.filter(p=>p.hawale==existing.id).map(p=>p.id)) : new Set();
    const toLink = [...selectedPaymentIds].filter(pid => !previouslyLinked.has(pid));
    const toUnlink = [...previouslyLinked].filter(pid => !selectedPaymentIds.has(pid));
    for(const pid of toLink) await apiUpdate('payments', pid, {hawale: newHawaleId});
    for(const pid of toUnlink) await apiUpdate('payments', pid, {hawale: null});
    if(toLink.length || toUnlink.length) showToast(`✅ حواله ثبت شد — ${toLink.length} واریزی لینک شد`);

    backdrop.remove();
    renderHawales(document.getElementById('main'));
  });
}

async function apiGetSupplierLedger(supplier){ const r = await fetch(FX_API+'supplier-ledger/?supplier='+encodeURIComponent(supplier)); return r.ok ? r.json() : null; }

      <div class="card stat-card"><div class="stat-label">مازادِ یوانی (اگه هست)</div><div class="stat-value yuan num">${data.excessYuan>0.01 ? fmtYuan(data.excessYuan) : '—'}</div></div>

      <table>
        <thead><tr><th class="col-right">تاریخ</th><th>مبلغِ فاکتور (یوان)</th><th>مانده (یوان)</th><th>وضعیتِ تسویه</th><th>نرخِ میانگینِ وزنی (برای هلو)</th><th>معادلِ ریالیِ حسابداری</th><th>قفل</th><th></th></tr></thead>

          ${data.invoiceStatus.length===0 ? `<tr class="empty-row"><td colspan="8">هنوز هزینه/فاکتورِ خریدی ثبت نشده</td></tr>` :
          data.invoiceStatus.map(o=>`<tr>
            <td class="date-cell">${o.date}</td>
            <td class="num">${fmtYuan(o.yuanAmount)}</td>
            <td class="num">${fmtYuan(o.remainingYuan)}</td>
            <td>${o.closed ? '<span class="status-chip closed">✅ تسویه‌شده</span>' : '<span class="status-chip open">⏳ باز</span>'}</td>
            <td class="num">${o.weightedAvgRate ? fmt(o.weightedAvgRate,0) : '—'}</td>
            <td class="num">${o.rialEquivalentForAccounting ? fmtRial(o.rialEquivalentForAccounting) : '—'}</td>
            <td>${o.isLocked
              ? '<span class="status-chip closed">🔒 قفل‌شده</span> <button class="icon-btn" data-unlock-exp="'+o.id+'" style="font-size:10px">بازکردن</button>'
              : (o.closed ? '<button class="btn btn-primary btn-sm" data-lock-exp="'+o.id+'">🔒 قفل کن (ثبت در هلو)</button>' : '<span style="color:var(--ink-soft);font-size:11px">هنوز بسته نشده</span>')}</td>

      <div style="display:flex;gap:8px;align-items:center">

    const e = state.expenses.find(x=>x.id==b.dataset.editExp);

    if(st && st.isLocked && !confirm('⚠️ این فاکتورِ خرید قفل شده (تو هلو ثبت شده). ویرایش ممکنه با نرخِ حسابداریِ ثبت‌شده ناهماهنگ بشه. مطمئنید؟')) return;
    openExpenseModal(e);
  }));
  main.querySelectorAll('[data-del-exp]').forEach(b=>b.addEventListener('click', async ()=>{
    const st = data.invoiceStatus.find(x=>x.id==b.dataset.delExp);
    const warnMsg = (st && st.isLocked)
      ? '⚠️ این فاکتورِ خرید قفل شده (تو هلو ثبت شده). حذفش ممکنه با حسابداریِ رسمی ناهماهنگ بشه. مطمئنید حذف بشه؟'
      : 'این هزینه/فاکتورِ خرید حذف شود؟';
    if(confirm(warnMsg)){
      const ok = await apiDelete('expenses', b.dataset.delExp);
      if(!ok) return;
      renderSupplierLedger(main);
    }
  }));
  main.querySelectorAll('[data-hist-exp]').forEach(b=>b.addEventListener('click', ()=>{
    showHistoryModal(data.invoiceStatus.find(x=>x.id==b.dataset.histExp) || state.expenses.find(x=>x.id==b.dataset.histExp));
  }));
  main.querySelectorAll('[data-lock-exp]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('این نرخ رو الان تو هلو ثبت کردید؟ بعد از قفل‌کردن، این عدد دیگه با تغییرِ حواله‌های قدیمی خودکار عوض نمی‌شه.')) return;
    const res = await fetch(FX_API+'expenses/'+b.dataset.lockExp+'/lock/', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({today:todayShamsi()})});
    const d = await res.json();
    if(!res.ok){ showToast('❌ '+(d.error||'قفل‌کردن ناموفق بود')); return; }
    showToast('✅ فاکتورِ خرید قفل شد');
    renderSupplierLedger(main);
  }));
  main.querySelectorAll('[data-unlock-exp]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('⚠️ مطمئنید می‌خواید قفل رو باز کنید؟')) return;
    const res = await fetch(FX_API+'expenses/'+b.dataset.unlockExp+'/unlock/', {method:'POST'});
    if(!res.ok){ showToast('❌ بازکردنِ قفل ناموفق بود'); return; }
    showToast('✅ قفل باز شد');
    renderSupplierLedger(main);
  }));
}

// ⚠️ سرچ ساده‌ی تأمین‌کننده — از اسامیِ قبلاً استفاده‌شده (نه CRM، چون
// تأمین‌کننده جزو مشتریان نیست)
function getKnownSupplierNames(){
  return [...new Set([...state.hawales.map(h=>h.supplier_name), ...state.expenses.map(e=>e.supplier_name)])].filter(Boolean);
}
function getKnownCustomerNames(){
  return [...new Set([...state.orders.map(o=>o.customer_name), ...state.payments.map(p=>p.customer_name)])].filter(Boolean);
}

function openExpenseModal(existing, presetSupplier){
  const today = todayShamsi();
  const isEdit = !!existing;
  const knownSuppliers = getKnownSupplierNames();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? 'ویرایش هزینه' : 'ثبت هزینه‌ی تأمین‌کننده'}</h3>
      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>تأمین‌کننده</td><td>نام تأمین‌کننده — ممکن است چند تأمین‌کننده‌ی مختلف داشته باشید، هرکدام مانده‌ی یوانیِ جدای خودشان را دارند</td></tr>
          <tr><td>پارت‌نامبر</td><td>هر خرید یک قلمِ مشخص است — پارت‌نامبرش را تایپ کنید تا از گوگل‌شیت پیشنهاد بیاید</td></tr>
          <tr><td>خرید کالا / جابجایی جنس / کارمزد حواله</td><td>همه یوانی‌اند — اگر یکی از این‌ها را ندارید، صفر بگذارید</td></tr>
          <tr><td>هزینه‌ی حمل</td><td>ریالی است، و اختیاری — فقط اگر این خرید هزینه‌ی حمل دارد پر کنید</td></tr>
          <tr><td>وضعیت پرداخت حمل</td><td>اگر هزینه‌ی حمل را هنوز پرداخت نکرده‌اید (مثلاً یک ماه بعد پرداخت می‌شود)، تیک نزنید</td></tr>
        </table>
      </div>
      <div class="field" style="margin-bottom:10px"><label>تأمین‌کننده</label>
        <input id="eSupplier" type="text" list="knownSuppliersList" value="${existing ? existing.supplier_name : (presetSupplier||'')}" placeholder="مثلاً: کلافی">
        <datalist id="knownSuppliersList">${knownSuppliers.map(s=>`<option value="${s}">`).join('')}</datalist>
      </div>
      <div class="field" style="margin-bottom:10px"><label>پارت‌نامبر</label>
        <input id="ePartNumber" type="text" value="${existing ? existing.part_number||'' : ''}" placeholder="حداقل ۲ حرف تایپ کنید...">
        <div id="ePartNumberResults" style="position:relative"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>تاریخ (شمسی)</label><input id="eDate" type="text" value="${existing ? existing.date : today}" placeholder="1405-06-18"></div>
      <div class="form-row">
        <div class="field"><label>خرید کالا (یوان)</label><input id="eGoods" type="text" class="num" value="${existing ? fmt(existing.goods_yuan,4) : '0'}"></div>
        <div class="field"><label>جابجایی جنس (یوان)</label><input id="eShipping" type="text" class="num" value="${existing ? fmt(existing.shipping_yuan,4) : '0'}"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>کارمزد جابجایی حواله (یوان)</label><input id="eTransferFee" type="text" class="num" value="${existing ? fmt(existing.transfer_fee_yuan,4) : '0'}"></div>
      <div class="form-row">
        <div class="field"><label>هزینه‌ی حمل (ریال، اختیاری)</label><input id="eFreight" type="text" class="num" value="${existing && existing.freight_rial ? fmt(existing.freight_rial,0) : ''}" placeholder="خالی = این خرید حمل ندارد"></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:22px">
          <input type="checkbox" id="eFreightPaid" ${existing && existing.freight_paid ? 'checked' : ''}> <label for="eFreightPaid" style="margin:0">هزینه‌ی حمل پرداخت شده</label>
        </div>
      </div>
      <div class="field"><label>توضیح (اختیاری)</label><input id="eNote" type="text" value="${existing ? existing.note||'' : ''}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveExpenseBtn">${isEdit?'ذخیره تغییرات':'ثبت هزینه'}</button>
        <button class="btn btn-ghost" id="cancelExpenseBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelExpenseBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#eDate'));
  wirePartNumberAutocomplete(backdrop.querySelector('#ePartNumber'), backdrop.querySelector('#ePartNumberResults'));
  backdrop.querySelector('#saveExpenseBtn').addEventListener('click', async ()=>{
    let supplierName = backdrop.querySelector('#eSupplier').value.trim();
    const date = backdrop.querySelector('#eDate').value.trim();
    const partNumber = backdrop.querySelector('#ePartNumber').value.trim();
    const goods = parseFloat(backdrop.querySelector('#eGoods').value.replace(/,/g,'')) || 0;
    const shipping = parseFloat(backdrop.querySelector('#eShipping').value.replace(/,/g,'')) || 0;
    const transferFee = parseFloat(backdrop.querySelector('#eTransferFee').value.replace(/,/g,'')) || 0;
    const freightStr = backdrop.querySelector('#eFreight').value.replace(/,/g,'').trim();
    const freight = freightStr ? parseFloat(freightStr) : null;
    const freightPaid = backdrop.querySelector('#eFreightPaid').checked;
    const note = backdrop.querySelector('#eNote').value.trim();
    if(!supplierName || !date || (goods===0 && shipping===0 && transferFee===0)){ showToast('نام تأمین‌کننده، تاریخ، و حداقل یکی از هزینه‌های یوانی را وارد کنید'); return; }

    const similar = findSimilarExistingName(supplierName, getKnownSupplierNames());
    if(similar){
      const useExisting = confirm(`⚠️ یه تأمین‌کننده با نامِ خیلی مشابه («${similar}») از قبل تو دفتر هست. منظورتون همونه؟\n\n«تأیید» = بله، همون «${similar}».\n«انصراف» = نه، این واقعاً تأمین‌کننده‌ی جدیدیه.`);
      if(useExisting) supplierName = similar;
    }

    const body = {supplier_name:supplierName, part_number:partNumber, date, goods_yuan:goods, shipping_yuan:shipping, transfer_fee_yuan:transferFee, freight_rial:freight, freight_paid:freightPaid, note};
    const d = isEdit ? await apiUpdate('expenses', existing.id, body) : await apiCreate('expenses', body);
    if(!d) return;
    backdrop.remove();
    currentSupplier = supplierName;
    renderMain();
  });
}

// ---------- ACCOUNTS (چندگانه — هر شخص می‌تواند چند حساب داشته باشد) ----------
async function renderAccounts(main){
  await loadAll();
  const basis = state.settings.rateBasis;
  const g = await apiGetSummary(basis);
  const balanceMap = {};
  if(g) g.accounts.forEach(a=>{ balanceMap[a.name] = a; }); // نگاشت با نام چون g.accounts فقط id نداره؛ فالبک با محاسبه دستی زیر
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">حساب‌های بانکی</h1>
      <p class="page-desc">هر شخص می‌تواند چند حساب داشته باشد — مثلاً هم ملی هم ملت. مانده شامل مانده‌ی اولیه + دریافتی‌ها − حواله‌ها + تعدیلات است</p>
    </div>
    <div class="toolbar"><button class="btn btn-primary" id="addAccBtn">+ افزودن حساب</button><div></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>مالک</th><th>نام بانک</th><th>شماره حساب</th><th>مانده‌ی اولیه</th><th>مانده‌ی فعلی</th><th>فعال</th><th></th></tr></thead>
        <tbody>
          ${state.accounts.length===0 ? `<tr class="empty-row"><td colspan="7">حسابی ثبت نشده است</td></tr>` :
          state.accounts.map(a=>{
            const stat = balanceMap[a.displayName];
            return `<tr>
              <td>${a.owner}</td>
              <td>${a.bank_name}</td>
              <td class="num">${a.account_number||'—'}</td>
              <td class="num">${fmtRial(a.opening_balance)}</td>
              <td class="num" style="font-weight:700">${stat ? fmtRial(stat.balance) : '—'}</td>
              <td>${a.active ? '<span class="status-chip closed">فعال</span>' : '<span class="status-chip open">غیرفعال</span>'}</td>
              <td><button class="icon-btn" data-edit-acc="${a.id}">ویرایش</button> <button class="icon-btn" data-del-acc="${a.id}">حذف</button> <button class="icon-btn" data-adj-acc="${a.id}">💰 هزینه/درآمدِ متفرقه</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  main.querySelector('#addAccBtn').addEventListener('click', ()=>openAccountModal());
  main.querySelectorAll('[data-edit-acc]').forEach(b=>b.addEventListener('click',()=>{
    const a = state.accounts.find(x=>x.id==b.dataset.editAcc);
    openAccountModal(a);
  }));
  main.querySelectorAll('[data-del-acc]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('این حساب حذف شود؟ (اگر تراکنشی دارد، حذف انجام نمی‌شود)')){
      const ok = await apiDelete('accounts', b.dataset.delAcc);
      if(!ok) return;
      renderAccounts(main);
    }
  }));
  main.querySelectorAll('[data-adj-acc]').forEach(b=>b.addEventListener('click', ()=>{
    openAdjustmentModal(b.dataset.adjAcc);
  }));
}

function openAdjustmentModal(accountId){
  const today = todayShamsi();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>ثبتِ هزینه/درآمدِ متفرقه</h3>
      <div class="field-guide">
        <table>
          <tr><th>فیلد</th><th>توضیح</th></tr>
          <tr><td>نوع</td><td>هزینه = از حساب کم می‌شود؛ درآمد = به حساب اضافه می‌شود</td></tr>
          <tr><td>توضیح</td><td>اختیاری و خیلی کوتاه — این مورد ربطی به مشتری/تأمین‌کننده ندارد و ریزش نگه‌داری نمی‌شود، فقط مانده به‌روز می‌شود</td></tr>
        </table>
      </div>
      <div class="form-row">
        <div class="field"><label>نوع</label>
          <select id="adjType"><option value="expense">هزینه (کسر از حساب)</option><option value="income">درآمد (افزوده به حساب)</option></select>
        </div>
        <div class="field"><label>تاریخ (شمسی)</label><input id="adjDate" type="text" value="${today}"></div>
      </div>
      <div class="field" style="margin-bottom:10px"><label>مبلغ (ریال)</label><input id="adjAmount" type="text" class="num"></div>
      <div class="field"><label>توضیح کوتاه (اختیاری)</label><input id="adjNote" type="text"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveAdjBtn">ثبت</button>
        <button class="btn btn-ghost" id="cancelAdjBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelAdjBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireShamsiDatePicker(backdrop.querySelector('#adjDate'));
  wireLiveNumberFormat(backdrop.querySelector('#adjAmount'));
  backdrop.querySelector('#saveAdjBtn').addEventListener('click', async ()=>{
    const adjustmentType = backdrop.querySelector('#adjType').value;
    const date = backdrop.querySelector('#adjDate').value.trim();
    const amount = parseFloat(backdrop.querySelector('#adjAmount').value.replace(/,/g,''));
    const note = backdrop.querySelector('#adjNote').value.trim();
    if(!date || !amount){ showToast('تاریخ و مبلغ را وارد کنید'); return; }
    const d = await apiCreate('account-adjustments', {account:accountId, date, adjustment_type:adjustmentType, amount, note});
    if(!d) return;
    showToast('✅ ثبت شد و مانده به‌روز شد');
    backdrop.remove();
    renderAccounts(document.getElementById('main'));
  });
}

function openAccountModal(existing){
  const isEdit = !!existing;
  // ⚠️ (۱۴۰۵/۰۶/۱۸) طبق درخواستِ کاربر: دیگه محدود به ۴ نفرِ ثابت نیست —
  // پیشنهادها از نام‌هایی که تا‌الان استفاده شده، به‌علاوه‌ی همون ۴ نفرِ
  // اولیه (برای راحتیِ اداهِ کار)
  const knownOwners = [...new Set(['حمیدرضا','عباس','زهرا حسین‌پور','غفاریان', ...state.accounts.map(a=>a.owner)])];
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isEdit ? 'ویرایش حساب' : 'افزودن حساب بانکی'}</h3>
      <div class="field" style="margin-bottom:10px"><label>مالک</label>
        <input id="accOwner" type="text" list="knownOwnersList" value="${existing?existing.owner:''}" placeholder="مثلاً: حمیدرضا">
        <datalist id="knownOwnersList">${knownOwners.map(o=>`<option value="${o}">`).join('')}</datalist>
      </div>
      <div class="field" style="margin-bottom:10px"><label>نام بانک</label><input id="accBank" type="text" value="${existing?existing.bank_name:''}" placeholder="مثلاً: بانک ملی"></div>
      <div class="field" style="margin-bottom:10px"><label>شماره حساب (اختیاری)</label><input id="accNumber" type="text" value="${existing?existing.account_number||'':''}"></div>
      <div class="field" style="margin-bottom:10px"><label>مانده‌ی اولیه (ریال) — اگر از قبل موجودی داشته</label><input id="accOpeningBalance" type="text" class="num" value="${existing&&existing.opening_balance ? fmt(existing.opening_balance,0) : '0'}"></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="accActive" ${!existing || existing.active ? 'checked' : ''}> <label for="accActive" style="margin:0">فعال</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveAccBtn">${isEdit?'ذخیره تغییرات':'افزودن'}</button>
        <button class="btn btn-ghost" id="cancelAccBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancelAccBtn').addEventListener('click',()=>backdrop.remove());
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  wireLiveNumberFormat(backdrop.querySelector('#accOpeningBalance'));
  backdrop.querySelector('#saveAccBtn').addEventListener('click', async ()=>{
    let owner = backdrop.querySelector('#accOwner').value.trim();
    const bankName = backdrop.querySelector('#accBank').value.trim();
    const accountNumber = backdrop.querySelector('#accNumber').value.trim();
    const active = backdrop.querySelector('#accActive').checked;
    if(!owner){ showToast('نامِ مالک را وارد کنید'); return; }

    const similar = findSimilarExistingName(owner, knownOwners.filter(o=>o!==owner));
    if(similar){
      const useExisting = confirm(`⚠️ یه مالکِ حساب با نامِ خیلی مشابه («${similar}») از قبل هست. منظورتون همونه؟\n\n«تأیید» = بله.\n«انصراف» = نه، این واقعاً شخصِ جدیدیه.`);
      if(useExisting) owner = similar;
    }
    if(!bankName){ showToast('نام بانک را وارد کنید'); return; }
    const openingBalance = parseFloat(backdrop.querySelector('#accOpeningBalance').value.replace(/,/g,'')) || 0;
    const body = {owner, bank_name:bankName, account_number:accountNumber, opening_balance:openingBalance, active};
    const d = isEdit ? await apiUpdate('accounts', existing.id, body) : await apiCreate('accounts', body);
    if(!d) return;
    backdrop.remove();
    renderAccounts(document.getElementById('main'));
  });
}

// ---------- SETTINGS ----------
async function renderSettings(main){
  main.innerHTML = `
    <div class="page-head">
      <h1 class="page-title">تنظیمات</h1>
      <p class="page-desc">نرخ روزِ مرجع — برای نمایش معادل ریالیِ مانده‌ی مشتریان در داشبورد</p>
    </div>
    <div class="card" style="max-width:420px">
      <div class="field" style="margin-bottom:10px"><label>نرخ فعلی یوان (ریال)</label>
        <input id="currentRateInput" type="text" class="num" value="${state.settings.currentRate ? fmt(state.settings.currentRate,0) : ''}">
      </div>
      <button class="btn btn-primary" id="saveRateBtn">ذخیره نرخ</button>
    </div>
  `;
  main.querySelector('#saveRateBtn').addEventListener('click', async ()=>{
    const v = parseFloat(main.querySelector('#currentRateInput').value.replace(/,/g,''));
    const ok = await apiPatchSettings({current_rate: isNaN(v) ? null : v});
    if(!ok){ showToast('❌ ذخیره ناموفق بود'); return; }
    state.settings.currentRate = isNaN(v) ? null : v;
    showToast('نرخ ذخیره شد');
  });
}

// ---- Boot ----
(async function(){
  await loadAll();
  render();
})();
</script>
