<script>
/* ⚠️ (۱۴۰۵/۰۷/۰۸) سرورِ مدار: api.smartchipelec.com (از طریقِ Cloudflare — بدونِ فیلترشکن).
   اگه این آدرس وصل نشد، همون درخواست خودکار با آدرسِ قدیمیِ Render تکرار می‌شه و تا ۵ دقیقه مستقیم از اون می‌ره. */
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.madarApiFallbackActive = function(){ return Date.now() < downUntil; };
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){
      if(init && init.signal && init.signal.aborted) throw err;   // مهلتی که خودِ صفحه گذاشته — دست نمی‌زنیم
      downUntil = Date.now() + 5*60*1000;
      return orig(alt, init);
    });
  };
})();
</script>

<title>🔔 یادآوری‌ها — اسمارت‌چیپ</title>
<!-- ⚠️ (۱۴۰۵/۰۷/۰۸) آیکونِ تبِ مرورگر — همون زنگِ سفید رویِ بنفشِ آیکونِ اپ، داخلِ همین فایل -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='#7C3AED'/%3E%3Cpath d='M32 12c-1.7 0-3 1.3-3 3v1.4C22.6 17.8 18 23.4 18 30v9l-4 5v2h36v-2l-4-5v-9c0-6.6-4.6-12.2-11-13.6V15c0-1.7-1.3-3-3-3z' fill='#fff'/%3E%3Ccircle cx='32' cy='52' r='4.5' fill='#fff'/%3E%3C/svg%3E">

<script>try{if(localStorage.getItem('smartchip_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
  /* ═══ سیستمِ طراحیِ «دفترچه‌ی رومیزی» — سرمه‌ای + کاغذیِ گرم + طلایی‌مسی ═══ */
  /* ⚠️ (۱۴۰۵/۰۷/۱۹) تمِ تیره (پیش‌فرضِ مدار) + روشن با دکمه‌یِ 🌙/☀️ — کلیدِ مشترک با صفحه‌یِ اصلی (smartchip_theme) */
  :root{
    --ink:#f4f5f8; --paper:#0f1117; --card:#232838; --line:#3d4560;
    --ink-soft:#9aa2bd; --brass:#f0a500; --brass-deep:#ffcf5a;
    --teal:#2fbf9b; --brick:#ef4444; --brick-soft:#3a1f22;
    --teal-soft:#16352f; --grey-soft:#1a1e2a;
    --dot-rem:#f0a500; --dot-ir-hol:#5b9bf0; --dot-cn-hol:#ef6b5b;
    color-scheme:dark;
  }
  html[data-theme="light"]{
    /* ⚠️ (۱۴۰۵/۰۶/۲۹) طبق درخواستِ صریحِ کاربر: دقیقاً همون پالتِ
       آبیِ حالتِ روشنِ CRM (نه یه چیزِ الهام‌گرفته) — --line تیره‌تر
       از استانداردِ خودِ CRM انتخاب شده چون کاربر صریحاً خواسته
       کادرها خیلی پررنگ‌تر و واضح‌تر باشن. */
    --ink:#0f1f36; --paper:#a9c8ec; --card:#c3dbf3; --line:#4a6f96;
    --ink-soft:#3f5875; --brass:#0e7d6b; --brass-deep:#0a5c50;
    --teal:#0e7d6b; --brick:#a83b33; --brick-soft:#f4e4e1;
    --teal-soft:#d3ece7; --grey-soft:#b3cdea;
    /* ⚠️ (۱۴۰۵/۰۷/۰۲) طبق درخواستِ صریحِ کاربر: سه‌رنگِ اختصاصیِ
       دایره‌هایِ زیرِ تاریخ در تقویم — نارنجی=یادآوری، آبی=تعطیلیِ
       شمسی (جمعه + رسمی)، قرمز=تعطیلیِ چین. */
    --dot-rem:#e08a1e; --dot-ir-hol:#2f6fb0; --dot-cn-hol:#c0392b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Vazirmatn,Tahoma,sans-serif; background:var(--paper); color:var(--ink);
    padding:0 14px 24px; max-width:520px; margin:0 auto;
    font-feature-settings:"tnum" 1, "lnum" 1;
  }
  .day-header{ display:flex; align-items:baseline; gap:14px; padding:22px 0 16px; border-bottom:3px solid var(--ink) }
  .day-header .big-day{ font-size:44px; font-weight:800; line-height:1; color:var(--ink) }
  .day-header .day-meta{ display:flex; flex-direction:column; gap:2px }
  .day-header .day-meta .month{ font-size:14px; font-weight:700; color:var(--ink) }
  .day-header .day-meta .app-name{ font-size:11px; color:var(--ink-soft) }

  .seg{ display:flex; gap:2px; overflow-x:auto; margin:16px 0 14px; border-bottom:1.5px solid var(--line) }
  .seg button{
    flex:0 0 auto; border:none; background:none; padding:9px 12px; font-size:12px; cursor:pointer;
    color:var(--ink-soft); white-space:nowrap; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
    font-family:inherit;
  }
  .seg button.active{ color:var(--ink); font-weight:700; border-bottom-color:var(--brass) }

  .btn{ padding:11px 14px; border-radius:8px; border:none; font-size:13px; cursor:pointer; font-weight:700; font-family:inherit }
  .btn-primary{ background:var(--ink); color:var(--paper); width:100%; letter-spacing:.2px }
  .btn-ghost{ background:var(--card); border:1.5px solid var(--line); color:var(--ink) }
  .btn-danger{ background:var(--brick-soft); color:var(--brick) }

  .card{ background:var(--card); border:2.5px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:0 2px 5px rgba(15,31,54,.12) }
  .card > .card-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:6px }
  .card > .card-title.warn{ color:var(--brick) }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px }
  .field label{ font-size:11px; color:var(--ink-soft); font-weight:600 }
  input,select,textarea{
    font-family:inherit; padding:10px 11px; border:1.5px solid var(--line); border-radius:7px;
    font-size:13px; background:var(--card); color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass) }
  textarea{ resize:vertical; min-height:50px }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:9px }

  .type-seg{ display:flex; gap:6px; margin-bottom:12px }
  .type-seg button{ flex:1; padding:10px; border-radius:7px; border:1.5px solid var(--line); background:var(--card); font-size:12px; cursor:pointer; font-family:inherit; font-weight:600; color:var(--ink-soft) }
  .type-seg button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink) }

  .timeline{ position:relative; padding-inline-start:22px }
  .timeline::before{ content:''; position:absolute; right:6px; top:6px; bottom:6px; width:1.5px; background:var(--line) }
  .t-item{ position:relative; padding:10px 12px; margin-bottom:10px; background:#dcebf9; border:2.5px solid var(--line); border-radius:8px; box-shadow:0 2px 5px rgba(15,31,54,.15) }
  .t-item:last-child{ margin-bottom:0 }
  .t-item::before{
    content:''; position:absolute; right:-20.5px; top:16px; width:10px; height:10px; border-radius:50%;
    background:var(--brass); border:2px solid var(--paper); box-shadow:0 0 0 1.5px var(--brass);
  }
  .t-item.st-done::before{ background:var(--teal); box-shadow:0 0 0 1.5px var(--teal) }
  .t-item.st-cancelled::before{ background:var(--brick); box-shadow:0 0 0 1.5px var(--brick) }
  .t-item.st-archived::before{ background:var(--ink-soft); box-shadow:0 0 0 1.5px var(--ink-soft) }
  .t-item.st-done,.t-item.st-cancelled,.t-item.st-archived{ opacity:.65 }

  .t-time{ font-size:11px; font-weight:700; color:var(--brass-deep); font-feature-settings:"tnum" 1 }
  .t-title{ font-size:14px; font-weight:700; color:var(--ink); margin-top:2px }
  .t-meta{ font-size:11px; color:var(--ink-soft); margin-top:2px }
  .t-note{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; white-space:pre-wrap; background:var(--grey-soft); border-radius:6px; padding:6px 8px }
  .t-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }
  .status-chip{ display:inline-block; font-size:10px; font-weight:700; border-radius:5px; padding:2px 7px; margin-inline-start:6px }
  .status-chip.done{ background:var(--teal-soft); color:var(--teal) }
  .status-chip.cancelled{ background:var(--brick-soft); color:var(--brick) }
  .status-chip.archived{ background:var(--grey-soft); color:var(--ink-soft) }
  .tag-recur{ display:inline-block; font-size:10px; font-weight:700; background:#F3E9D6; color:var(--brass-deep); border-radius:5px; padding:2px 7px; margin-inline-start:6px }

  .icon-btn{ border:1.5px solid var(--line); background:var(--card); border-radius:6px; padding:5px 9px; font-size:11px; cursor:pointer; font-family:inherit; color:var(--ink) }
  .icon-btn:hover{ border-color:var(--brass) }

  .empty{ text-align:center; color:var(--ink-soft); font-size:12px; padding:28px 10px }

  .cal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px }
  .cal-head button{ border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:6px 11px; font-size:14px; cursor:pointer; color:var(--ink) }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px }
  .cal-wd{ text-align:center; font-size:10px; color:var(--ink-soft); padding:2px 0; font-weight:700 }
  .cal-day{
    height:50px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:7px; font-size:11.5px; cursor:pointer; border:1.5px solid transparent; position:relative; padding:3px 2px;
    font-feature-settings:"tnum" 1; gap:1px;
  }
  .cal-day .day-num{ font-size:12px }
  .cal-day .hol-tag{ font-size:11px; line-height:1 }
  .cal-day .dots-row{ position:absolute; bottom:3px; display:flex; gap:2px }
  .cal-day .cal-dot{ width:4px; height:4px; border-radius:50% }
  .cal-day .cal-dot.dot-rem{ background:var(--dot-rem) }
  .cal-day .cal-dot.dot-ir-hol{ background:var(--dot-ir-hol) }
  .cal-day .cal-dot.dot-cn-hol{ background:var(--dot-cn-hol) }
  .cal-day.today{ border-color:var(--brass); font-weight:800; background:#FBF3E7 }
  .cal-day.has-rem{ background:var(--grey-soft) }
  .cal-day.today.has-rem{ background:#FBF3E7 }
  .cal-day.friday .day-num{ color:var(--dot-ir-hol); font-weight:800 }
  .cal-day.selected{ border-color:var(--ink); box-shadow:0 0 0 1.5px var(--ink) }
  .cal-day .g-date{ font-size:8px; color:var(--ink-soft); line-height:1.2 }
  .cal-day .dot{ width:5px; height:5px; border-radius:50%; position:absolute; top:2px; left:2px }
  .cal-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--ink-soft); margin-top:10px }
  .cal-legend span{ display:flex; align-items:center; gap:4px }
  .cal-legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block }
  .hol-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; padding:8px 0; border-bottom:1px solid var(--line) }
.hol-t{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0 } .hol-d{ color:var(--ink-soft); font-size:11.5px; white-space:nowrap; text-align:left }
.hol-n{ font-size:10.5px; opacity:.85 }
.hol-badge{ font-size:10px; font-weight:800; border-radius:6px; padding:1px 8px; border:1.5px solid var(--line); background:var(--card) }
.hol-badge.cn{ background:#f6d6d3; border-color:var(--dot-cn-hol); color:#8a1f17 } .hol-badge.ir{ background:#d6e4f7; border-color:var(--dot-ir-hol); color:#1d4575 } .hol-badge.lunar{ background:#e7e0f3; border-color:#7d6bb0; color:#4b3a85 }
  .hol-row:last-child{ border-bottom:none }

  .toast{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink);
    color:var(--paper); padding:9px 18px; border-radius:8px; font-size:12px; opacity:0; pointer-events:none;
    transition:.25s; z-index:400;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(28,35,51,.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px }
  .modal{ background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:400px; max-height:90vh; overflow-y:auto }
  .modal h3{ margin:0 0 14px; font-size:16px; font-weight:800; color:var(--ink) }

  /* ═══ (۱۴۰۵/۰۷/۰۵) طراحیِ جدید — «روزِ من» (تایم‌لاین) + کارتِ «کارِ بعدی» + نوارِ پایین ═══ */
  body{ padding-bottom:110px }
  .hd{ display:flex; justify-content:space-between; align-items:center; padding:20px 2px 4px }
  .hd .hd-l{ display:flex; flex-direction:column }
  .hd .hd-wd{ font-size:12.5px; color:var(--ink-soft); font-weight:600 }
  .hd .hd-date{ display:flex; align-items:baseline; gap:8px }
  .hd .big-day{ font-size:40px; font-weight:900; line-height:1.1 }
  .hd .month{ font-size:15px; font-weight:800 }
  .ring{ position:relative; width:62px; height:62px; flex-shrink:0 }
  .ring span{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; font-weight:900; line-height:1.1 }
  .ring small{ font-size:9px; font-weight:600; color:var(--ink-soft) }
  .quick-row{ display:flex; gap:7px; margin:8px 0 2px }
  .bf-chips{ display:flex; flex-wrap:wrap; gap:6px }
  .bf-chip{ border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:16px; padding:5px 11px; font-size:12px; cursor:pointer; font-family:inherit }
  .bf-chip.on{ border-color:var(--ink); background:var(--ink); color:var(--card); font-weight:700 }
  .bf-chip.on::before{ content:'✓ ' }
  .bf-hint{ font-size:11px; color:var(--ink-soft); margin-top:5px; line-height:1.7 }
  .gcal-box{ background:var(--grey-soft); border-radius:10px; padding:12px; margin-bottom:12px; line-height:1.9 }
  .gcal-box ol{ margin:6px 0 0; padding-right:18px }
  .gcal-code{ width:100%; height:120px; direction:ltr; text-align:left; font-family:ui-monospace,Consolas,monospace; font-size:10.5px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--card); color:var(--ink); resize:vertical }
  .chip-btn{ border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:20px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit }
  .week{ display:flex; align-items:center; gap:4px; margin:12px 0 4px }
  .week-arrow{ border:none; background:none; font-size:18px; color:var(--ink-soft); cursor:pointer; padding:4px; font-family:inherit }
  .week-days{ flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:4px }
  .wd{ border:1.5px solid transparent; background:var(--card); border-radius:13px; padding:6px 0 5px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; font-family:inherit; color:var(--ink) }
  .wd .w{ font-size:10.5px; color:var(--ink-soft) } .wd .n{ font-size:15px; font-weight:800 }
  .wd .d{ width:5px; height:5px; border-radius:50%; background:transparent }
  .wd.has .d{ background:var(--dot-rem) }
  .wd.is-today{ border-color:var(--brass) }
  .wd.sel{ background:var(--ink); color:var(--paper) } .wd.sel .w{ color:var(--paper); opacity:.8 } .wd.sel.has .d{ background:var(--paper) }
  .wd.fri .n{ color:var(--dot-ir-hol) } .wd.sel.fri .n{ color:var(--paper) }
  .sec-label{ font-size:12px; font-weight:800; color:var(--ink-soft); margin:16px 2px 7px; display:flex; justify-content:space-between; align-items:center }
  .next-card{ background:var(--ink); color:var(--paper); border-radius:20px; padding:18px; margin-top:14px; box-shadow:0 6px 18px rgba(15,31,54,.25) }
  .next-card .nc-top{ display:flex; justify-content:space-between; align-items:center; font-size:12px; opacity:.85 }
  .next-card .nc-time{ font-size:32px; font-weight:900; color:#8fe3cf; line-height:1.2; margin-top:4px }
  .next-card .nc-title{ font-size:18px; font-weight:800; margin-top:4px; line-height:1.5 }
  .next-card .nc-sub{ font-size:12.5px; opacity:.8; margin-top:4px }
  .next-card .nc-btns{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:14px }
  .next-card .nc-btns button{ border:1.5px solid rgba(169,200,236,.35); background:transparent; color:var(--paper); border-radius:11px; padding:10px 0; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit }
  .next-card .nc-btns .nc-done{ grid-column:1/3; background:#8fe3cf; color:var(--ink); border:none; font-size:14.5px; padding:12px 0 }
  .over-box{ background:var(--brick-soft); border:2px solid var(--brick); border-radius:14px; padding:10px; margin-top:14px }
  .over-box .ob-head{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:800; color:var(--brick); margin-bottom:8px }
  .over-box .ob-head button{ border:none; background:var(--brick); color:#fff; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit }
  .tl-row{ display:flex; gap:9px; margin-bottom:8px }
  .tl-time{ width:44px; flex-shrink:0; font-size:12.5px; font-weight:800; color:var(--ink-soft); padding-top:13px; text-align:center; font-feature-settings:"tnum" 1 }
  .tl-time.now{ color:var(--brass) }
  .r-row{ flex:1; min-width:0; background:#dcebf9; border:2px solid var(--line); border-radius:13px; overflow:hidden }
  .r-row.is-now{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(14,125,107,.18) }
  .over-box .r-row{ background:#fff7f5; border-color:#d9a19b; margin-bottom:6px }
  .r-main{ display:flex; align-items:center; gap:10px; padding:10px 11px; cursor:pointer }
  .r-check{ width:25px; height:25px; border-radius:50%; border:2.5px solid var(--line); background:transparent; flex-shrink:0; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff }
  .r-check:hover{ border-color:var(--brass); background:rgba(14,125,107,.12) }
  .r-check.done{ background:var(--teal); border-color:var(--teal) }
  .r-icon{ width:25px; height:25px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px }
  .r-body{ flex:1; min-width:0 }
  .r-title{ font-size:14px; font-weight:700; line-height:1.5 }
  .st-done .r-title,.st-cancelled .r-title{ text-decoration:line-through; opacity:.6 }
  .r-sub{ display:flex; flex-wrap:wrap; gap:5px; margin-top:3px }
  .r-cust{ font-size:11px; background:var(--card); color:var(--ink); border-radius:6px; padding:1px 7px; font-weight:600 }
  .r-when{ font-size:11px; color:var(--ink-soft); font-weight:700; white-space:nowrap }
  .r-now{ font-size:10px; font-weight:900; color:#fff; background:var(--brass); border-radius:6px; padding:2px 7px }

<script>
// ⚠️ (۱۴۰۵/۰۶/۲۸) طبق تصمیمِ صریحِ کاربر: این PWA دیگه به دیتابیسِ
// جداگانه‌ی خودش وصل نیست — مستقیم به همون worklog که از قبل تویِ
// CRM/ERP/Mobile استفاده می‌شه وصل می‌شه، تا دیتا یکی و مشترک بمونه.
const FREE_API = 'https://api.smartchipelec.com/api/worklog/free-reminders/';
const RECUR_API = 'https://api.smartchipelec.com/api/worklog/recurring-reminders/';
// ⚠️ فقط یادآوری‌های خودِ همین کارمند نشون داده می‌شه (نه کلِ تیم) —
// یادآوری‌هایِ تیمی جای جداگانه‌ای (تبِ CRM) دیده می‌شن، نه اینجا.
// ⚠️ (۱۴۰۵/۰۷/۱۹) نامِ کاربر دیگر در کد ثابت نیست (قبلاً نامِ مدیر بود؛ برایِ هر کارمندِ دیگر یادآوری‌هایِ مدیر را نشان می‌داد).
//   از ورودِ امن می‌آید؛ resolveMyName() پیش از اولین بارگذاری مقدارش را پر می‌کند.
let MY_NAME = (window.MadarAuth && MadarAuth.name && MadarAuth.name()) || '';
async function resolveMyName(){
  if(MY_NAME) return MY_NAME;
  try{
    await Promise.race([ new Promise(res=>{ if(window.MadarAccess&&MadarAccess.ready) MadarAccess.ready(res); else res(); }), new Promise(res=>setTimeout(res,3000)) ]);
    if(window.MadarAccess && MadarAccess.name && MadarAccess.name()) MY_NAME = MadarAccess.name();
  }catch(e){}
  if(!MY_NAME){
    try{
      const em = (localStorage.getItem('smartchip_user_email')||localStorage.getItem('smartchip_erp_email')||'').toLowerCase();
      const r = await fetch('https://api.smartchipelec.com/api/staff/staff/'); const j = await r.json();
      const me = (Array.isArray(j)?j:[]).find(x=>x && String(x.email||'').toLowerCase()===em);
      if(me && me.name) MY_NAME = String(me.name).trim();
    }catch(e){}
  }
  return MY_NAME;
}

// ══════════════════════════════════════════════════════════════
// تقویمِ شمسیِ کامل — عیناً همون الگوریتمِ محک‌شده‌ی CRM/ERP
// ══════════════════════════════════════════════════════════════
function fn(n){ return String(n).replace(/\d/g, x=>'۰۱۲۳۴۵۶۷۸۹'[x]); }
// ⚠️ (۱۴۰۵/۰۷/۰۴) فیکسِ تقویم: الگوریتمِ قبلی (چرخه‌ی ۲۸۲۰ساله) با تقویمِ رسمی در بعضی سال‌ها یک روز فرق داشت
// (مثلاً ۱۴۰۴ رو کبیسه می‌دونست و اسفندِ ۱۴۰۵ رو ۳۰ روزه). الان الگوریتمِ رسمی (جدولِ «شکست‌ها»، همونِ کتابخونه‌ی
// jalaali و jdatetimeِ بک‌اند). خروجی‌ها با همون قراردادِ قبلی‌ان، پس بقیه‌ی کد دست نمی‌خوره.
function _jdiv(a,b){return ~~(a/b);} function _jmod(a,b){return a-~~(a/b)*b;}
function _jalCal(jy){
  // ⚠️ جدول داخلِ تابع (نه const سراسری): اگه اسکریپت قبل از رسیدن به این خط به خطا بخوره، تابعِ hoist‌شده باز هم کار می‌کنه
  const _JB=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  let gy=jy+621,leapJ=-14,jp=_JB[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<_JB.length;i++){jm=_JB[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+_jdiv(jump,33)*8+_jdiv(_jmod(jump,33),4);jp=jm;}
  n=jy-jp;leapJ=leapJ+_jdiv(n,33)*8+_jdiv(_jmod(n,33)+3,4);if(_jmod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=_jdiv(gy,4)-_jdiv((_jdiv(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+_jdiv(jump+4,33)*33;leap=_jmod(_jmod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march};}
function _g2dn(gy,gm,gd){let d=_jdiv((gy+_jdiv(gm-8,6)+100100)*1461,4)+_jdiv(153*_jmod(gm+9,12)+2,5)+gd-34840408;return d-_jdiv(_jdiv(gy+100100+_jdiv(gm-8,6),100)*3,4)+752;}
function _dn2g(jdn){let j=4*jdn+139361631;j=j+_jdiv(_jdiv(4*jdn+183187720,146097)*3,4)*4-3908;const i=_jdiv(_jmod(j,1461),4)*5+308;const gd=_jdiv(_jmod(i,153),5)+1;const gm=_jmod(_jdiv(i,153),12)+1;return{gy:_jdiv(j,1461)-100100+_jdiv(8-gm,6),gm,gd};}
function _j2dn(jy,jm,jd){const r=_jalCal(jy);return _g2dn(r.gy,3,r.march)+(jm-1)*31-_jdiv(jm,7)*(jm-7)+jd-1;}
function _dn2j(jdn){const g=_dn2g(jdn);let jy=g.gy-621;const r=_jalCal(jy);let k=jdn-_g2dn(g.gy,3,r.march),jm,jd;
  if(k>=0){if(k<=185){jm=1+_jdiv(k,31);jd=_jmod(k,31)+1;return{y:jy,m:jm,d:jd};}k-=186;}
  else{jy-=1;k+=179;if(r.leap===1)k+=1;}
  jm=7+_jdiv(k,30);jd=_jmod(k,30)+1;return{y:jy,m:jm,d:jd};}
function isLeapS(y){return _jalCal(y).leap===0;}
function sDim(y,m){ if(m<12) return m<=6?31:30; return isLeapS(y)?30:29; }
function sToJD(y,m,d){return _j2dn(y,m,d);}
function gToJD(y,m,d){ return 367*y-Math.floor(7*(y+Math.floor((m+9)/12))/4)-Math.floor(3*(Math.floor((y+(m-9)/7)/100)+1)/4)+Math.floor(275*m/9)+d+1721029; }
function jdToS(jd){return _dn2j(Math.floor(jd+0.5));}
function jdToG(jd){ const j=Math.floor(jd); const d=new Date((j-2440588)*86400000); return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate()}; }

function todayShamsi(){
  const now = new Date();

  return `${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}`;
}
function tomorrowShamsi(){
  const now = new Date(); now.setDate(now.getDate()+1);
  const s = jdToS(gToJD(now.getFullYear(), now.getMonth()+1, now.getDate()));
  return `${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}`;
}

function normalizeFree(r){
  let status = 'open';
  if(r.archived) status = 'archived';
  else if(r.canceled) status = 'cancelled';
  else if(r.done) status = 'done';
  const bf = beforeLabel(r.remind_before);
  return { _type:'free', id:r.id, title:r.desc, customer:r.customer, date:r.date, time:r.time||'',
           note:[r.category ? `دسته: ${r.category}` : '', bf].filter(Boolean).join(' — '), status, raw:r };
}
// ⚠️ (۱۴۰۵/۰۷/۰۷) «یادآوریِ قبل از موعد» — دقیقه‌ها؛ هم پیامِ بله/تلگرام، هم هشدارِ گوگل کلندر/آیفون
const BEFORE_OPTS = [[15,'۱۵ دقیقه'],[60,'۱ ساعت'],[120,'۲ ساعت'],[1440,'۱ روز'],[2880,'۲ روز'],[4320,'۳ روز'],[10080,'۱ هفته']];
function beforeText(m){ m=+m; if(m%1440===0) return fn(m/1440)+' روز'; if(m%60===0) return fn(m/60)+' ساعت'; return fn(m)+' دقیقه'; }
function beforeLabel(list){
  const u=[...new Set((list||[]).map(Number).filter(n=>n>0))].sort((a,b)=>b-a);
  return u.length ? '⏳ ' + u.map(beforeText).join('، ') + ' قبل' : '';
}
function beforeChipsHtml(selected){
  const sel=new Set((selected||[]).map(Number));
  const extra=[...sel].filter(m=>!BEFORE_OPTS.some(o=>o[0]===m)).map(m=>[m,beforeText(m)]);
  return [...BEFORE_OPTS, ...extra].sort((a,b)=>a[0]-b[0]).map(([m,l])=>`<button type="button" class="bf-chip ${sel.has(m)?'on':''}" data-bf="${m}">${l}</button>`).join('');
}
function normalizeRecurring(r){
  let status = 'open';
  if(r.archived) status = 'archived';
  else if(r.canceled) status = 'cancelled';
  const bf = beforeLabel([...(r.remind_before||[]), ...((r.warn_days||[]).map(d=>d*1440))]);
  const warnPart = bf ? ` — ${bf}` : '';
  return { _type:'recurring', id:r.id, title:r.title, customer:r.customer, date:r.next_date, time:r.time||'',
           note:(r.note ? `${r.note} — ` : '') + `هر ${r.interval} روز` + warnPart, status, raw:r };
}

// ⚠️ (۱۴۰۵/۰۶/۲۹) فیکسِ باگِ واقعی: این fetch قبلاً فقط یه‌بار تلاش
// می‌کرد — اگه سرورِ رایگانِ رندر کند بیدار می‌شد (تا ۶۰-۹۰ ثانیه)، این
// PWA بلافاصله شکست می‌خورد و هیچ‌وقت دوباره امتحان نمی‌کرد، درصورتی‌که
// دفترِ ارزی و لانچر از قبل این مکانیزم رو دارن. الان تا ۸ بار تلاش
// می‌کنه (جمعاً حدودِ ۹۰ ثانیه) — دقیقاً همون الگو.
async function fetchWithRetry(url, options, retries=8, delayMs=2000){
  for(let i=0; i<retries; i++){
    try{
      return await fetch(url, options);
    }catch(err){
      if(i === retries-1) throw err;
      if(i === 1) showToast('⏳ سرور در حالِ بیدارشدنه، لطفاً صبر کنید...');
      await new Promise(r=>setTimeout(r, delayMs*(i+1)));
    }
  }
}
async function apiFetchArray(url){
  try{
    const r = await fetchWithRetry(url);
    if(!r.ok) return [];
    const data = await r.json();
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.results)) return data.results;
    return [];
  }catch(e){ return []; }
}

    return r.json();

}

async function dgLoadPeople(){
  if(dgPeople) return dgPeople;
  let staff = [];
  try{ const r = await fetchWithRetry(DG_STAFF_API); if(r.ok){ const j = await r.json(); staff = (Array.isArray(j)?j:[]).filter(s=>s && s.active!==false && s.name).map(s=>String(s.name).trim()); } }catch(e){}
  const pick = (first)=>{
    const hits = staff.filter(n=>dgNorm(n).split(' ')[0]===dgNorm(first));
    if(MY_NAME && first===dgNorm(MY_NAME).split(' ')[0] && !hits.includes(MY_NAME)) hits.unshift(MY_NAME);
    return hits.length ? [...new Set(hits)] : [first];
  };
  const uniq = (arr)=>[...new Set(arr)];
  dgPeople = {responsibles: uniq(DG_FIRST_RESPONSIBLES.flatMap(pick)), doers: uniq(DG_FIRST_DOERS.flatMap(pick)), fromServer: staff.length>0};
  return dgPeople;
}
async function dgLoadCustomers(){
  if(dgCustomers) return dgCustomers;
  try{
    const r = await fetchWithRetry(DG_CUSTOMERS_API); const j = r.ok ? await r.json() : [];
    dgCustomers = (Array.isArray(j)?j:[]).filter(c=>c && c.name).map(c=>({name:String(c.name).trim(), priority:c.priority?String(c.priority):''}));
    const seen = new Set(); dgCustomers = dgCustomers.filter(c=>{ const k=dgNorm(c.name); if(seen.has(k)) return false; seen.add(k); return true; });
  }catch(e){ dgCustomers = null; return []; }

}

    : r.status==='delivered' ? `<span class="dg-chip done">✅ تحویل شد</span>` : `<span class="dg-chip off">🚫 لغو</span>`;
  const late = r.overdue ? `<span class="dg-chip late">🔴 ${fn(r.overdue_days)} روز دیرکرد</span>` : '';
  const subs = dgSubs(r), openSubs = subs.filter(x=>!x.done), archSubs = subs.filter(x=>x.done);
  const cc = dgCustOpenCount(r);
  const titleHtml = subs.length
    ? `<div class="r-title dg-tl">${openSubs.length ? openSubs.map(x=>`<div class="dg-tline">– ${escHtml(x.text)}</div>`).join('') : '<div class="dg-tline dg-dim">همه‌یِ موضوع‌ها بسته شد</div>'}</div>`
    : `<div class="r-title" style="white-space:pre-line">${escHtml(r.title)}</div>`;
  const canTick = r.status==='waiting' || r.status==='answered';
  const subHtml = subs.length ? `<div class="dg-subs">
    ${openSubs.map(x=>`<label class="dg-sub"><input type="checkbox" ${canTick?'':'disabled'} data-dg-sub="${x.id}" data-dg-id="${r.id}"><span>${escHtml(x.text)}</span></label>`).join('')}
    ${archSubs.length ? `<details class="dg-arch"><summary>📁 بایگانیِ موضوع‌ها (${fn(archSubs.length)})</summary>${archSubs.map(x=>`<div class="dg-asub">☑ <b>${escHtml(x.text)}</b>${x.note?`<div class="dg-note">💬 ${escHtml(x.note)}</div>`:''}<div class="dg-dim">${x.done_at?fmtDateHuman(x.done_at):''} · ${escHtml(x.done_by||'')} ${canTick?`<button type="button" class="icon-btn dg-b" data-dg-sub-open="${x.id}" data-dg-id="${r.id}">↩ بازگرداندن</button>`:''}</div></div>`).join('')}</details>` : ''}
  </div>` : '';
  const lines = [];
  lines.push(`<div class="dg-line">🧑‍💼 <b>مسئولِ پیگیری:</b> ${escHtml(r.owner_name)}${dgIsMe(r.owner_name)?' <span class="dg-dim">(شما)</span>':''}</div>`);
  lines.push(`<div class="dg-line">🧑 <b>پیگیری‌کننده:</b> ${escHtml(r.delegate_name)}${dgIsMe(r.delegate_name)?' <span class="dg-dim">(شما)</span>':''}</div>`);
  const at = dgAssignedText(r); if(at) lines.push(`<div class="dg-line dg-dim">🕒 <b>زمانِ ارجاع:</b> ${at}</div>`);
  if(r.customer) lines.push(`<div class="dg-line">🏢 <b>مشتری:</b> ${escHtml(r.customer)}</div>`);
  if((r.status==='waiting' || r.status==='answered') && r.ask_due_date) lines.push(`<div class="dg-line">📅 <b>موعدِ تحویلِ پیگیری:</b> ${fmtDateHuman(r.ask_due_date)}${r.ask_due_time?' · '+fn(r.ask_due_time):''}</div>`);
  if(r.status==='waiting' && r.waiting_days>0) lines.push(`<div class="dg-line dg-dim">⏱ ${fn(r.waiting_days)} روز از ارجاع گذشته</div>`);
  if(r.answer_text) lines.push(`<div class="dg-answer">💬 <b>نتیجه‌یِ پیگیری:</b> ${escHtml(r.answer_text)}</div>`);
  if(r.detail) lines.push(`<div class="dg-line dg-dim">${escHtml(r.detail)}</div>`);
  const hist = (r.history||[]).map(h=>`<div class="dg-h"><b>${DG_EVENTS[h.event]||escHtml(h.event)}</b> ${escHtml(h.text||'')} <span class="dg-dim">${dgWhen(h.at)}</span></div>`).join('');
  const when = opts.showDate ? (item.date ? fmtDateHuman(item.date) + (item.time ? ' · '+fn(item.time) : '') : '') : (opts.whenText||'');
  const icon = r.status==='answered' ? '📦' : (r.status==='waiting' ? '⏳' : (r.status==='delivered' ? '✅' : '🚫'));
  const who = r.status==='answered' ? `${escHtml(r.delegate_name)} ← ${escHtml(r.owner_name)}` : `${escHtml(r.owner_name)} ← ${escHtml(r.delegate_name)}`;
  return `<div class="r-row dg-card st-${item.status}${r.overdue?' dg-late':''}${opts.isNow?' is-now':''}" data-item-key="${key}">
    <div class="r-main" data-toggle-row>
      <span class="r-icon">${icon}</span>
      <div class="r-body">${titleHtml}<div class="dg-chips">${badge}${late}${openSubs.length>1?`<span class="dg-chip wait">${fn(openSubs.length)} موضوعِ باز</span>`:''}${r.customer?`<span class="dg-chip cust">${escHtml(r.customer)}${cc>1?` · ${fn(cc)} کارِ باز`:''}</span>`:''}</div>
        <div class="dg-sum">${who}</div></div>
      ${opts.isNow ? '<span class="r-now">بعدی</span>' : (when ? `<span class="r-when">${when}</span>` : '')}
    </div>
    <div class="r-more">${subHtml}<div class="dg-lines">${lines.join('')}</div>
      <details class="dg-hist"><summary>🕘 تاریخچه (${fn((r.history||[]).length)})</summary>${hist||'<div class="dg-dim">—</div>'}</details>
      <div class="t-actions">${dgButtons(item)}</div></div>
  </div>`;
}

function dgNextButtons(item){
  const r = item.raw, id = r.id;
  if(r.status==='waiting') return `<button class="nc-done" data-dg-act="answer" data-dg-id="${id}">✅ ثبتِ نتیجه</button><button data-dg-act="postpone" data-dg-id="${id}">⏰ ۱ روز بعد</button>`;
  return `<button class="nc-done" data-dg-act="${dgIsMe(r.owner_name)?'deliver':'reopen'}" data-dg-id="${id}">${dgIsMe(r.owner_name)?'📦 تحویل گرفتم':'↩️ هنوز کامل نیست'}</button><button data-dg-act="postpone" data-dg-id="${id}">⏰ ۱ روز بعد</button>`;
}

function updateDelegBadge(){
  const el = document.getElementById('dgBadge'); if(!el) return;
  const late = allItems.filter(x=>x._type==='deleg' && x.raw.overdue).length;
  el.textContent = late ? fn(late) : ''; el.style.display = late ? '' : 'none';
}

function renderDelegations(main){
  const all = allItems.filter(x=>x._type==='deleg');
  const open = all.filter(x=>x.status==='open');
  const waiting = open.filter(x=>x.raw.status==='waiting'), deliver = open.filter(x=>x.raw.status==='answered'), late = open.filter(x=>x.raw.overdue);
  const closed = all.filter(x=>x.status!=='open');
  const sets = {open, waiting, deliver, late, closed};
  let list = (sets[dgFilter] || open).slice().sort((a,b)=> (b.raw.overdue?1:0)-(a.raw.overdue?1:0) || ((a.date||'9999')+(a.time||'00:00')).localeCompare((b.date||'9999')+(b.time||'00:00')));
  if(listSearchQuery.trim()){
    const q = dgNorm(listSearchQuery);
    list = list.filter(x=>[x.raw.title, x.raw.delegate_name, x.raw.owner_name, x.raw.customer, x.raw.answer_text].some(v=>dgNorm(v).includes(q)));
  }
  const stat = (k, icon, label, n, cls) => `<button type="button" class="dg-stat ${cls} ${dgFilter===k?'on':''}" data-dg-filter="${k}"><span class="n">${fn(n)}</span><span class="l">${icon} ${label}</span></button>`;
  const chip = (k, label, n) => `<button type="button" class="${dgFilter===k?'active':''}" data-dg-filter="${k}">${label}${n!=null?` (${fn(n)})`:''}</button>`;
  main.innerHTML = `
    <div class="page-title">🤝 پیگیری و تحویل</div>
    <div class="dg-intro">مسئولِ پیگیری کار را به یک پیگیری‌کننده ارجاع می‌دهد؛ پیگیری‌کننده نتیجه را ثبت می‌کند و مسئول آن را تحویل می‌گیرد. هر مرحله در بله اطلاع می‌دهد.</div>
    <button class="btn btn-primary" data-dg-new style="margin-bottom:12px">+ ثبتِ پیگیری</button>
    <div class="dg-stats">${stat('waiting','⏳','در حال پیگیری',waiting.length,'wait')}${stat('deliver','📦','منتظرِ تحویل',deliver.length,'ans')}${stat('late','🔴','دیرکرد',late.length,'late')}</div>
    <div class="hist-seg" style="margin:10px 0">${chip('open','همه‌یِ باز',open.length)}${chip('closed','✔️ بسته‌شده',closed.length)}</div>
    <div class="field" style="margin-bottom:10px"><input id="listSearchInput" type="text" placeholder="🔍 جستجو در موضوع، نام، مشتری، نتیجه…" value="${escHtml(listSearchQuery)}"></div>
    <div class="r-list">${list.length ? list.map(x=>renderDelegRow(x,{showDate:true})).join('') : `<div class="empty">${all.length ? 'در این فیلتر چیزی نیست ✨' : 'هنوز پیگیری‌ای ثبت نشده.<br>روی «+ ثبتِ پیگیری» بزن.'}</div>`}</div>`;
  main.querySelector('[data-dg-new]').addEventListener('click', ()=>openDelegModal(null));
  main.querySelectorAll('[data-dg-filter]').forEach(b=>b.addEventListener('click', ()=>{ dgFilter = (dgFilter===b.dataset.dgFilter && b.classList.contains('dg-stat')) ? 'open' : b.dataset.dgFilter; renderMain(); }));
  const inp = main.querySelector('#listSearchInput');
  inp.addEventListener('input', (e)=>{
    listSearchQuery = e.target.value; const pos = e.target.selectionStart; renderMain();
    const again = document.getElementById('listSearchInput'); if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
  });
}

function openSubSheet(r, sub, cb){
  const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h3>☑️ بستنِ موضوع</h3>
    <div class="dg-line" style="margin-bottom:8px"><b>${escHtml(sub.text)}</b>${r.customer?`<br><span class="dg-dim">مشتری: ${escHtml(r.customer)}</span>`:''}</div>
    <div class="field"><label>هر چه گفت / نتیجه‌ی کار <span class="dg-dim">(با تاریخ بایگانی می‌شود)</span></label><textarea id="dgSubNote" rows="4" placeholder="مثلاً: قیمت ۳٫۲ دلار شد، مشتری قبول کرد"></textarea></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="btn btn-primary" id="dgSubSave">☑️ ثبت و بایگانی</button>
      <button class="btn btn-ghost" id="dgSubCancel">انصراف</button>
    </div></div>`;
  document.body.appendChild(backdrop);
  const cancel = ()=>{ backdrop.remove(); if(cb) cb.checked = false; };
  backdrop.querySelector('#dgSubCancel').addEventListener('click', cancel);
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) cancel(); });
  backdrop.querySelector('#dgSubSave').addEventListener('click', async ()=>{
    const d = await dgCall('POST', `${r.id}/sub/${sub.id}/`, dgActor({done:true, note: backdrop.querySelector('#dgSubNote').value.trim()}));
    if(!d) return;
    backdrop.remove();
    showToast(d.status==='delivered' ? '✅ همه‌ی موضوع‌ها بسته شد — پیگیری بسته شد' : '☑️ بایگانی شد');
    await refreshData(); renderMain();
  });
  setTimeout(()=>{ const t = backdrop.querySelector('#dgSubNote'); if(t) t.focus(); }, 50);
}

function wireDelegButtons(container){
  container.querySelectorAll('[data-dg-sub]').forEach(cb=>{
    if(cb.dataset.dgWired) return; cb.dataset.dgWired = '1';
    cb.addEventListener('click', e=>e.stopPropagation());
    cb.addEventListener('change', ()=>{
      if(!cb.checked) return;
      const it = allItems.find(x=>x._type==='deleg' && x.id===+cb.dataset.dgId); if(!it) return;
      const sub = dgSubs(it.raw).find(x=>x.id===+cb.dataset.dgSub); if(!sub){ cb.checked = false; return; }
      openSubSheet(it.raw, sub, cb);
    });
  });
  container.querySelectorAll('[data-dg-sub-open]').forEach(b=>{
    if(b.dataset.dgWired) return; b.dataset.dgWired = '1';
    b.addEventListener('click', async e=>{
      e.stopPropagation();
      const d = await dgCall('POST', `${+b.dataset.dgId}/sub/${+b.dataset.dgSubOpen}/`, dgActor({done:false}));
      if(d){ showToast('↩️ موضوع دوباره باز شد'); await refreshData(); renderMain(); }
    });
  });
  container.querySelectorAll('[data-dg-act]').forEach(b=>{
    if(b.dataset.dgWired) return; b.dataset.dgWired = '1';
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = +b.dataset.dgId, act = b.dataset.dgAct;
      const it = allItems.find(x=>x._type==='deleg' && x.id===id); if(!it) return;
      const r = it.raw;
      const finish = async (msg)=>{ showToast(msg); await refreshData(); renderMain(); };
      if(act==='answer') return openDelegAnswerSheet(r);
      if(act==='edit') return openDelegModal(r);
      if(act==='copy-chase'){
        const text = dgChaseText(r);
        try{ await navigator.clipboard.writeText(text); showToast('📋 پیام کپی شد'); }catch(_){ window.prompt('پیام را کپی کنید:', text); }
        return;
      }
      b.disabled = true;
      let d = null;
      if(act==='deliver'){
        if(!confirm(`نتیجه‌یِ «${r.title}» را تحویل گرفتی؟`)){ b.disabled = false; return; }
        d = await dgCall('POST', `${id}/deliver/`, dgActor());
        if(d) return finish('✅ تحویل گرفته شد — بسته شد');
      } else if(act==='postpone'){
        d = await dgCall('POST', `${id}/postpone/`, dgActor({days:1}));
        if(d) return finish('⏰ یک روز عقب افتاد');
      } else if(act==='reopen'){
        d = await dgCall('POST', `${id}/reopen/`, dgActor());
        if(d) return finish('↩️ دوباره «در حال پیگیری» شد');
      } else if(act==='cancel'){
        if(!confirm('این پیگیری لغو شود؟ (در «بسته‌شده» می‌ماند)')){ b.disabled = false; return; }
        d = await dgCall('POST', `${id}/cancel/`, dgActor());
        if(d) return finish('🚫 لغو شد');
      } else if(act==='del'){
        if(!confirm('حذفِ کاملِ این پیگیری؟ دیگر قابلِ بازیابی نیست (برایِ نگه‌داشتنِ سابقه «لغو» را بزنید).')){ b.disabled = false; return; }
        d = await dgCall('DELETE', `${id}/`);
        if(d) return finish('🗑️ حذف شد');
      }
      b.disabled = false;
    });
  });
}

// ثبتِ نتیجه‌یِ پیگیری
function openDelegAnswerSheet(r){
  const needs = dgNeedsDelivery(r), owner = dgIsMe(r.owner_name);
  const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h3>✅ ثبتِ نتیجه‌یِ پیگیری</h3>
    <div class="dg-line" style="margin-bottom:8px"><b style="white-space:pre-line">${escHtml(r.title)}</b>${r.customer?`<br><span class="dg-dim">مشتری: ${escHtml(r.customer)}</span>`:''}<br><span class="dg-dim">پیگیری‌کننده: ${escHtml(r.delegate_name)} · مسئول: ${escHtml(r.owner_name)}</span></div>
    <div class="field"><label>نتیجه‌یِ پیگیری</label><textarea id="dgAns" placeholder="مثلاً: ۱۲٫۵ دلار، موجود است"></textarea></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button class="btn btn-primary" id="dgAnsSave">${needs ? `ثبتِ نتیجه — به ${escHtml(r.owner_name)} اطلاع داده می‌شود` : 'ثبتِ نتیجه و بستنِ کار'}</button>
      ${(needs && owner) ? `<button class="btn btn-ghost" id="dgAnsClose">ثبتِ نتیجه و همین الان تحویل گرفتم</button>` : ''}
      <button class="btn btn-ghost" id="dgAnsCancel">انصراف</button>
    </div></div>`;
  document.body.appendChild(backdrop);
  const send = async (close)=>{
    const d = await dgCall('POST', `${r.id}/answer/`, dgActor({answer_text: backdrop.querySelector('#dgAns').value.trim(), close: !!close}));
    if(!d) return;
    backdrop.remove(); showToast(d.status==='answered' ? `✅ ثبت شد — به ${r.owner_name} اطلاع داده شد` : '✅ ثبت شد — کار بسته شد');
    await refreshData(); renderMain();
  };
  backdrop.querySelector('#dgAnsSave').addEventListener('click', ()=>send(false));
  const c = backdrop.querySelector('#dgAnsClose'); if(c) c.addEventListener('click', ()=>send(true));
  backdrop.querySelector('#dgAnsCancel').addEventListener('click', ()=>backdrop.remove());
}

// فرمِ «ثبتِ پیگیری» — دقیقاً فیلدهایی که حمیدرضا خواست، به همان ترتیب
function openDelegModal(existing){
  const isEdit = !!existing, e = existing || {};
  const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <h3>${isEdit ? 'ویرایشِ پیگیری' : '🤝 ثبتِ پیگیری'}</h3>
    <div class="field"><label>مسئولِ پیگیری</label><select id="dgOwner"><option value="">در حال گرفتنِ فهرست…</option></select></div>
    <div class="field"><label>پیگیری‌کننده</label><select id="dgDoer"><option value="">در حال گرفتنِ فهرست…</option></select></div>
    <div class="row2">
      <div class="field"><label>تاریخِ ارجاع <span class="dg-dim">(خودکار — قابلِ ویرایش)</span></label><input id="dgAssignedDate" type="text" readonly value="${escHtml(isEdit && e.assigned_date ? e.assigned_date : todayShamsi())}"></div>
      <div class="field"><label>ساعتِ ارجاع</label><input id="dgAssignedTime" type="time" value="${escHtml(isEdit && e.assigned_time ? e.assigned_time : (()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');})())}"></div>
    </div>
    <div class="field dg-ac"><label>مشتری <span class="dg-dim">(جستجو در همه‌یِ مشتریانِ مدار)</span></label><input id="dgCust" type="text" autocomplete="off" placeholder="نامِ مشتری را بنویس…" value="${escHtml(e.customer||'')}"><div id="dgCustList" class="dg-ac-list" style="display:none"></div><div id="dgCustHint" class="dg-dim"></div></div>
    <div class="field"><label>موضوعِ پیگیری <span class="dg-dim">(هر خط = یک موضوعِ جدا؛ هر کدام جدا تیک و بایگانی می‌شود)</span></label><textarea id="dgTitle" rows="4" maxlength="3000" placeholder="مثلاً: قیمتِ برد X را بگیر&#10;(چند موضوع؟ هر کدام در یک خط — با Enter یا Shift+Enter)" style="width:100%;resize:vertical;min-height:70px;font:inherit;line-height:1.8;white-space:pre-wrap">${escHtml(e.title||'')}</textarea></div>
    <div class="row2">
      <div class="field"><label>موعدِ تحویلِ پیگیری</label><input id="dgDue" type="text" readonly value="${escHtml(e.ask_due_date||tomorrowShamsi())}"></div>
      <div class="field"><label>ساعت (اختیاری)</label><input id="dgDueTime" type="time" value="${escHtml(e.ask_due_time||'')}"></div>
    </div>
    <div class="field"><label>نتیجه‌یِ پیگیری <span class="dg-dim">(بعداً هم می‌شود ثبت کرد)</span></label><textarea id="dgResult" placeholder="خالی بگذار تا پیگیری‌کننده بعداً ثبت کند">${escHtml(e.answer_text||'')}</textarea></div>
    <div id="dgErr" role="alert" style="display:none;margin-top:8px;padding:9px 12px;border-radius:10px;background:rgba(224,69,58,.14);border:1px solid rgba(224,69,58,.5);color:#ff9a92;font-size:12.5px;line-height:1.8"></div>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary" id="dgSave">${isEdit?'ذخیره':'ثبت'}</button><button class="btn btn-ghost" id="dgCancel">انصراف</button></div></div>`;
  document.body.appendChild(backdrop);
  const q = s=>backdrop.querySelector(s);
  const dueEl = q('#dgDue'); dueEl.addEventListener('click', ()=>openCalendarPicker(dueEl));
  // ── فهرستِ افراد (مسئول و پیگیری‌کننده) ──
  const fillSelect = (sel, names, selected, placeholder)=>{
    sel.innerHTML = (placeholder?`<option value="">${placeholder}</option>`:'') + names.map(n=>`<option value="${escHtml(n)}" ${dgNorm(n)===dgNorm(selected||'')?'selected':''}>${escHtml(n)}</option>`).join('');
    if(selected && !names.some(n=>dgNorm(n)===dgNorm(selected))) sel.insertAdjacentHTML('beforeend', `<option value="${escHtml(selected)}" selected>${escHtml(selected)}</option>`);
  };
  dgLoadPeople().then(p=>{
    if(!document.body.contains(backdrop)) return;
    fillSelect(q('#dgOwner'), p.responsibles, isEdit ? e.owner_name : (p.responsibles.find(n=>dgIsMe(n)) || p.responsibles[0]));

  });
  // زمانِ ارجاع: پیش‌فرض «همین الان» و قابلِ ویرایش (اگر قبلاً گفته‌اید، تاریخ/ساعتِ واقعی را بگذارید).

  const asgDate = q('#dgAssignedDate'), asgTime = q('#dgAssignedTime');
  let asgTouched = false;
  asgDate.addEventListener('click', ()=>{ openCalendarPicker(asgDate); asgTouched = true; });
  asgTime.addEventListener('input', ()=>{ asgTouched = true; });
  q('#dgDoer').addEventListener('change', ()=>{
    if(asgTouched || !q('#dgDoer').value) return;
    if(isEdit && q('#dgDoer').value === e.delegate_name) return;
    const n = new Date(); asgDate.value = todayShamsi(); asgTime.value = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  });
  // ── مشتری: جستجو + تکمیلِ خودکار ──
  const list = q('#dgCustList'), cust = q('#dgCust'), hint = q('#dgCustHint');
  const closeList = ()=>{ list.style.display = 'none'; };
  const drawList = ()=>{
    const v = dgNorm(cust.value);
    if(!dgCustomers){ list.style.display = 'none'; hint.textContent = ''; return; }
    const matches = (v ? dgCustomers.filter(c=>dgNorm(c.name).includes(v)) : dgCustomers.filter(c=>c.priority)).sort((a,b)=>{ const sa=dgNorm(a.name).startsWith(v)?0:1, sb=dgNorm(b.name).startsWith(v)?0:1; return sa-sb || (b.priority?1:0)-(a.priority?1:0); }).slice(0,8);
    list.innerHTML = matches.map(c=>`<button type="button" class="dg-ac-it" data-name="${escHtml(c.name)}">${escHtml(c.name)}${c.priority?` <span class="dg-ac-pri">اولویت ${fn(c.priority)}</span>`:''}</button>`).join('');
    list.style.display = matches.length ? '' : 'none';
    list.querySelectorAll('.dg-ac-it').forEach(b=>b.addEventListener('mousedown', ev=>{ ev.preventDefault(); cust.value = b.dataset.name; closeList(); hint.textContent = ''; }));
    const exact = dgCustomers.some(c=>dgNorm(c.name)===v);
    hint.textContent = (v && !exact && !matches.length) ? 'این نام در مشتریانِ مدار نیست — همان‌طور که نوشتی ذخیره می‌شود.' : '';
  };
  dgLoadCustomers().then(()=>{ if(document.body.contains(backdrop)) drawList(); closeList(); });
  cust.addEventListener('input', drawList); cust.addEventListener('focus', drawList); cust.addEventListener('blur', ()=>setTimeout(closeList,150));
  q('#dgCancel').addEventListener('click', ()=>backdrop.remove());
  q('#dgSave').addEventListener('click', async ()=>{
    const body = { owner_name:q('#dgOwner').value, delegate_name:q('#dgDoer').value, customer:cust.value.trim(), title:q('#dgTitle').value.trim(),
      ask_due_date:dueEl.value.trim(), ask_due_time:q('#dgDueTime').value, answer_text:q('#dgResult').value.trim() };
    const asgChanged = !isEdit || asgTouched || (e.assigned_date !== asgDate.value) || (e.assigned_time !== asgTime.value);
    if(asgChanged && asgDate.value){ body.assigned_date = asgDate.value.trim(); body.assigned_time = asgTime.value || ''; }
    const errBox = q('#dgErr'); errBox.style.display = 'none';
    if(!body.owner_name){ showToast('مسئولِ پیگیری را انتخاب کن'); return; }
    if(!body.delegate_name){ showToast('پیگیری‌کننده را انتخاب کن'); return; }
    if(!body.title){ showToast('موضوعِ پیگیری را بنویس'); return; }
    if(!body.ask_due_date){ showToast('موعدِ تحویلِ پیگیری را انتخاب کن'); return; }
    if(!isEdit){ body.asked_date = todayShamsi(); }
    if(isEdit && body.answer_text === (e.answer_text||'')) delete body.answer_text;     // نتیجه دست‌نخورده → دوباره ثبت نشود
    const d = isEdit ? await dgCall('PATCH', `${existing.id}/`, dgActor(body)) : await dgCall('POST', '', dgActor(body));
    if(!d){ errBox.textContent = '❌ ' + (window._dgLastErr || 'ثبت نشد — دوباره امتحان کن'); errBox.style.display = ''; return; }
    backdrop.remove(); showToast(isEdit ? '✅ ذخیره شد' : '✅ ثبت شد — به پیگیری‌کننده در بله اطلاع داده شد');
    if(!isEdit) dgFilter = 'open';
    await refreshData(); renderMain();
  });
  setTimeout(()=>{ const t = q('#dgTitle'); if(t && !isEdit) t.focus(); }, 60);
}

let allItems = [];
let currentTab = 'today';
let listSearchQuery = '';
// ⚠️ (۱۴۰۵/۰۷/۰۵) وضعیتِ طراحیِ جدید
let selDay = null;          // روزِ انتخاب‌شده در نوارِ هفته (پیش‌فرض: امروز)
let weekOffset = 0;         // هفته‌ی جاری = ۰
let showDoneToday = false;  // باز/بسته بودنِ لیستِ «انجام‌شده‌هایِ امروز»
let historyFilter = 'done'; // تبِ «سابقه»: done | cancelled | archived
const WEEKDAY_FULL = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
let calYear, calMonth;
let selectedCalDate = null;
{
  const t = todayShamsi().split('-').map(Number);
  calYear = t[0]; calMonth = t[1];
}

function fmtDateHuman(dateStr){
  if(!dateStr || String(dateStr).split('-').length<3) return '';
  const [y,m,d] = String(dateStr).split('-').map(Number);
  return fn(`${d} ${SMONTHS[m-1]} ${y}`);
}

// ⚠️ (۱۴۰۵/۰۶/۲۸) عملیاتِ وضعیت — برایِ «آزاد» و «دوره‌ای» متفاوته،
// چون آزاد یه فیلدِ `done` جدا داره، دوره‌ای نداره (هیچ‌وقت «تکمیل»
// نمی‌شه، فقط باز/کنسل/بایگانی، چون خودش تکرار می‌شه)
function statusActions(item){
  if(item._type === 'deleg') return [];     // 🤝 دکمه‌هایِ خودش را دارد (dgButtons)
  if(item._type === 'free'){
    if(item.status==='open') return [{label:'✔️ تکمیل', body:{done:true}}, {label:'❌ کنسل', body:{canceled:true}}];
    if(item.status==='done' || item.status==='cancelled') return [{label:'↩️ بازگردانی به باز', body:{done:false, canceled:false}}, {label:'📦 بایگانی', body:{archived:true}}];
    return [{label:'↩️ بازگردانی به باز', body:{archived:false}}];
  } else {
    if(item.status==='open') return [{label:'❌ کنسل', body:{canceled:true}}];
    if(item.status==='cancelled') return [{label:'↩️ بازگردانی به باز', body:{canceled:false}}, {label:'📦 بایگانی', body:{archived:true}}];
    return [{label:'↩️ بازگردانی به باز', body:{archived:false}}];
  }
}

function renderItem(item){
  if(item._type === 'deleg') return renderDelegRow(item, {});
  const chip = item.status!=='open' ? `<span class="status-chip ${item.status}">${STATUS_LABEL[item.status]}</span>` : '';
  const actions = statusActions(item).map(a=>`<button class="icon-btn" data-set-status="${item._type}-${item.id}">${a.label}</button>`).join('');
  return `<div class="t-item st-${item.status}" data-item-key="${item._type}-${item.id}">
    <div class="t-time">${item.time || fmtDateHuman(item.date)}</div>
    <div class="t-title">${item.title||'(بدون عنوان)'}${chip}${item._type==='recurring'?`<span class="tag-recur">🔁 دوره‌ای</span>`:''}</div>
    <div class="t-meta">${item.customer?`مشتری: ${item.customer}`:''}${item.time?' — '+fmtDateHuman(item.date):''}</div>
    ${item.note?`<div class="t-note">${item.note}</div>`:''}
    <div class="t-actions">
      ${actions}
      <button class="icon-btn" data-del-key="${item._type}-${item.id}">🗑️ حذف</button>
    </div>
  </div>`;
}

function renderList(items){
  if(items.length===0) return `<div class="empty">چیزی نیست</div>`;
  return `<div class="timeline">${items.map(renderItem).join('')}</div>`;
}

async function loadAllItems(){
  const [freeRaw, recurRaw, dgRaw] = await Promise.all([apiFetchArray(FREE_API), apiFetchArray(RECUR_API), apiFetchArray(DG_API + '?owner=' + encodeURIComponent(MY_NAME))]);
  // ⚠️ طبقِ تصمیمِ کاربر: فقط یادآوریِ آزادِ *خودش* — دوره‌ای فعلاً
  // فیلدِ assignee نداره (طبقِ خودِ مدلِ worklog)، پس همه‌ش نشون داده می‌شه
  const myFree = freeRaw.filter(r=>r.assignee_name === MY_NAME).map(normalizeFree);
  const recurring = recurRaw.map(normalizeRecurring);
  const deleg = dgRaw.map(normalizeDeleg);     // 🤝 پیگیری و تحویل
  return [...myFree, ...recurring, ...deleg];
}

// ⚠️ (۱۴۰۵/۰۷/۰۲) فیکسِ کاراییِ واقعیِ گزارش‌شده: قبلاً renderMain
// هر بار (سوییچِ تب، هر حرفِ تایپ‌شده تویِ جستجو، جابجاییِ ماهِ تقویم)
// کلِ دیتا رو دوباره از سرور می‌گرفت. الان رفرش‌کردنِ دیتا از خودِ
// رندر جدا شده: renderMain فقط از allItemsِ همین الان تویِ حافظه
// رندر می‌کنه؛ فقط بعدِ افزودن/ویرایش/حذف/تغییرِ وضعیت واقعاً به
// سرور نیاز داریم، پس فقط اونجاها refreshData صدا زده می‌شه.
async function refreshData(){
  allItems = await loadAllItems();
}

// ══════ (۱۴۰۵/۰۷/۰۵) طراحیِ جدید: «روزِ من» ══════
function sStr(o){ return `${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`; }
function sParse(str){ const [y,m,d]=str.split('-').map(Number); return {y,m,d}; }
function sJdn(str){ const o=sParse(str); return sToJD(o.y,o.m,o.d); }
function satIndex(str){ return (sJdn(str)+2)%7; }   // ۰ = شنبه … ۶ = جمعه
function nowHM(){ const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
function hmToMin(hm){ const [h,m]=(hm||'0:0').split(':').map(Number); return h*60+(m||0); }
function escHtml(x){ return String(x==null?'':x).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sortByTime(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); }

function renderHeaderAndRing(){
  const today = todayShamsi(); const t = sParse(today);
  const wdEl = document.getElementById('hdWeekday');
  if(wdEl) wdEl.textContent = `${WEEKDAY_FULL[satIndex(today)]} · یادآوری‌های حمیدرضا`;
  document.getElementById('bigDayNum').textContent = fn(t.d);
  document.getElementById('dayMonthYear').textContent = SMONTHS[t.m-1] + ' ' + fn(t.y);
  const todays = allItems.filter(r=>r.date===today && (r.status==='open' || r.status==='done'));
  const done = todays.filter(r=>r.status==='done').length, total = todays.length;
  const C = 2*Math.PI*25, frac = total ? done/total : 0;
  const ring = document.getElementById('progressRing');
  if(ring) ring.innerHTML = `<svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
      <circle cx="31" cy="31" r="25" fill="none" stroke="var(--card)" stroke-width="7"/>
      <circle cx="31" cy="31" r="25" fill="none" stroke="var(--brass)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 31 31)"/></svg>
      <span>${fn(done)}/${fn(total)}<small>امروز</small></span>`;
}

// یک ردیفِ یادآوری — با کلیک باز می‌شه و همون دکمه‌هایِ قبلی (تکمیل/کنسل/بایگانی/حذف) رو نشون می‌ده
function renderRow(item, opts={}){
  if(item._type === 'deleg') return renderDelegRow(item, opts);
  const key = `${item._type}-${item.id}`;
  let lead;
  if(item._type==='free' && item.status==='open') lead = `<button class="r-check" data-quick-done="${key}" aria-label="انجام شد"></button>`;
  else if(item.status==='done') lead = `<span class="r-check done">✓</span>`;
  else if(item._type==='recurring') lead = `<span class="r-icon" title="دوره‌ای">🔁</span>`;
  else lead = `<span class="r-icon">•</span>`;
  const chip = item.status!=='open' && !opts.hideChip ? `<span class="status-chip ${item.status}">${STATUS_LABEL[item.status]}</span>` : '';
  const when = opts.showDate ? (item.date ? fmtDateHuman(item.date) + (item.time?' · '+fn(item.time):'') : 'بدون تاریخ') : (opts.whenText||'');
  const actions = statusActions(item).map(a=>`<button class="icon-btn" data-set-status="${key}">${a.label}</button>`).join('');
  return `<div class="r-row st-${item.status}${opts.isNow?' is-now':''}" data-item-key="${key}">
    <div class="r-main" data-toggle-row>
      ${lead}
      <div class="r-body">
        <div class="r-title">${escHtml(item.title||'(بدون عنوان)')}${chip}</div>
        ${(item.customer || item._type==='recurring') ? `<div class="r-sub">${item.customer?`<span class="r-cust">${escHtml(item.customer)}</span>`:''}${item._type==='recurring'?`<span class="tag-recur" style="margin:0">🔁 دوره‌ای</span>`:''}</div>` : ''}
      </div>
      ${opts.isNow ? '<span class="r-now">بعدی</span>' : (when ? `<span class="r-when">${when}</span>` : '')}
    </div>
    <div class="r-more">
      ${item.note?`<div class="t-note" style="margin-top:0">${escHtml(item.note)}</div>`:''}
      <div class="t-actions">${actions}<button class="icon-btn" data-del-key="${key}">🗑️ حذف</button></div>
    </div>
  </div>`;
}

function pickNextItem(list){
  const nm = hmToMin(nowHM());
  const timed = list.filter(r=>r.time).sort(sortByTime);
  const soon = timed.find(r=>hmToMin(r.time) >= nm - 15);
  return soon || list.find(r=>!r.time) || timed[timed.length-1] || null;
}

function renderNextCard(item){
  if(!item) return '';
  const key = `${item._type}-${item.id}`;
  let top = 'کارِ بعدیِ تو';
  if(item.time){
    const diff = hmToMin(item.time) - hmToMin(nowHM());
    if(diff > 60) top += ` · ${fn(Math.floor(diff/60))} ساعت و ${fn(diff%60)} دقیقه دیگه`;
    else if(diff > 0) top += ` · ${fn(diff)} دقیقه دیگه`;
    else if(diff >= -15) top += ' · همین الان';
    else top += ' · زمانش گذشته';
  }
  const btns = item._type==='deleg' ? dgNextButtons(item) : item._type==='free'
    ? `<button class="nc-done" data-quick-done="${key}">✓ انجام شد</button>
       <button data-snooze="${key}" data-snooze-kind="hour">⏰ ۱ ساعت بعد</button>
       <button data-snooze="${key}" data-snooze-kind="tomorrow">↪ فردا</button>`
    : `<button data-toggle-next style="grid-column:1/3">🔁 یادآوریِ دوره‌ای — جزئیات در لیستِ پایین</button>`;
  return `<div class="next-card">
    <div class="nc-top"><span>${top}</span>${item.customer?`<span>👤 ${escHtml(item.customer)}</span>`:''}</div>
    <div class="nc-time">${item.time ? fn(item.time) : 'امروز'}</div>
    <div class="nc-title">${escHtml(item.title||'(بدون عنوان)')}</div>
    ${item.note?`<div class="nc-sub">${escHtml(item.note)}</div>`:''}
    <div class="nc-btns">${btns}</div>
  </div>`;
}

function renderWeekStrip(){
  const today = todayShamsi();
  const startJ = sJdn(today) - satIndex(today) + weekOffset*7;
  const openDates = new Set(allItems.filter(r=>r.status==='open').map(r=>r.date));
  let cells = '';
  for(let i=0;i<7;i++){
    const ds = sStr(jdToS(startJ+i)); const d = sParse(ds).d;
    const cls = ['wd', ds===selDay?'sel':'', ds===today?'is-today':'', openDates.has(ds)?'has':'', i===6?'fri':''].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-pick-day="${ds}"><span class="w">${WEEKDAY_NAMES[i]}</span><span class="n">${fn(d)}</span><span class="d"></span></button>`;
  }
  return `<div class="week"><button class="week-arrow" data-week="-1" aria-label="هفته‌ی قبل">›</button><div class="week-days">${cells}</div><button class="week-arrow" data-week="1" aria-label="هفته‌ی بعد">‹</button></div>`;
}

function renderTimeline(list, nowKey){
  if(!list.length) return `<div class="empty">برایِ این روز یادآوریِ بازی نیست ✨</div>`;
  const buckets = [['صبح', r=>r.time && hmToMin(r.time)<720], ['بعدازظهر', r=>r.time && hmToMin(r.time)>=720 && hmToMin(r.time)<1020], ['عصر و شب', r=>r.time && hmToMin(r.time)>=1020], ['بدونِ ساعت', r=>!r.time]];
  return buckets.map(([label, f])=>{
    const xs = list.filter(f).sort(sortByTime);
    if(!xs.length) return '';
    return `<div class="sec-label">${label}</div>` + xs.map(r=>{
      const isNow = `${r._type}-${r.id}`===nowKey;
      return `<div class="tl-row"><div class="tl-time${isNow?' now':''}">${r.time?fn(r.time):'—'}</div>${renderRow(r,{isNow})}</div>`;
    }).join('');
  }).join('');
}

function renderToday(main){
  const today = todayShamsi();
  if(!selDay) selDay = today;
  const isToday = selDay===today;
  const openOnly = allItems.filter(r=>r.status==='open');
  const dayOpen = openOnly.filter(r=>r.date===selDay).sort(sortByTime);
  const overdue = isToday ? openOnly.filter(r=>r.date && r.date<today).sort((a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00'))) : [];
  const doneDay = allItems.filter(r=>r.date===selDay && r.status==='done');
  const next = isToday ? pickNextItem(dayOpen) : null;
  const nextKey = next ? `${next._type}-${next.id}` : null;
  const freeOver = overdue.filter(r=>r._type==='free');
  const dayTitle = isToday ? 'برنامه‌ی امروز' : (selDay===tomorrowShamsi() ? 'برنامه‌ی فردا' : `برنامه‌ی ${WEEKDAY_FULL[satIndex(selDay)]} ${fmtDateHuman(selDay)}`);
  main.innerHTML = `
    <div class="today-grid"><div class="tg-side">
    ${renderWeekStrip()}
    ${renderNextCard(next)}
    ${overdue.length ? `<div class="over-box"><div class="ob-head"><span>⚠️ عقب‌افتاده (${fn(overdue.length)})</span>${freeOver.length?`<button data-move-overdue>همه به امروز</button>`:''}</div>
      ${overdue.map(r=>renderRow(r,{whenText:fmtDateHuman(r.date)})).join('')}</div>` : ''}
    </div><div class="tg-main">
    <div class="sec-label" style="font-size:14px;color:var(--ink);margin-top:18px"><span>${dayTitle}</span><span style="font-size:11.5px;color:var(--ink-soft)">${fn(dayOpen.length)} کار <button class="btn btn-ghost btn-sm" type="button" data-new-reminder style="margin-inline-start:8px">＋ یادآوریِ جدید</button></span></div>
    ${renderTimeline(dayOpen, nextKey)}
    ${doneDay.length ? `<button class="done-bar" data-toggle-done><span>✓ ${fn(doneDay.length)} کار ${isToday?'امروز':''} انجام شد</span><span>${showDoneToday?'بستن':'نمایش'}</span></button>
      ${showDoneToday ? `<div style="margin-top:8px;display:flex;flex-direction:column;gap:7px">${doneDay.map(r=>renderRow(r,{hideChip:true, whenText:r.time?fn(r.time):''})).join('')}</div>` : ''}` : ''}
    </div></div>
  `;
}

function renderFlatList(main, statuses, title, extraTop){
  let filtered = allItems.filter(r=>statuses.includes(r.status))
    .sort((a,b)=> ((a.date||'9999')+(a.time||'00:00')).localeCompare((b.date||'9999')+(b.time||'00:00')));
  if(listSearchQuery.trim()){
    const q = listSearchQuery.trim().toLowerCase();
    filtered = filtered.filter(r => (r.title||'').toLowerCase().includes(q) || (r.customer||'').toLowerCase().includes(q) || (r.note||'').toLowerCase().includes(q));
  }
  main.innerHTML = `
    <div class="page-title add-row"><span>${title}</span>${statuses.includes('open') ? '<button class="btn btn-ghost btn-sm" type="button" data-new-reminder>＋ یادآوریِ جدید</button>' : ''}</div>
    ${extraTop||''}
    <div class="field" style="margin-bottom:10px"><input id="listSearchInput" type="text" placeholder="🔍 جستجو در عنوان، مشتری، توضیح..." value="${escHtml(listSearchQuery)}"></div>
    <div class="r-list">${filtered.length ? filtered.map(r=>renderRow(r,{showDate:true, hideChip:true})).join('') : '<div class="empty">چیزی نیست</div>'}</div>`;
  const inp = main.querySelector('#listSearchInput');
  inp.addEventListener('input', (e)=>{
    listSearchQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderMain();
    const again = document.getElementById('listSearchInput');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} }
  });
  const _nr = main.querySelector('[data-new-reminder]'); if(_nr) _nr.addEventListener('click', ()=>openReminderModal(null));
}

function wireNewButtons(container){
  container.querySelectorAll('[data-new-reminder]').forEach(b=>{ if(b.dataset.nrWired) return; b.dataset.nrWired='1'; b.addEventListener('click', ()=>openReminderModal(null)); });
  main.querySelectorAll('[data-toggle-row]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('button')) return;
    el.parentElement.classList.toggle('open');
  }));
  main.querySelectorAll('[data-quick-done]').forEach(b=>b.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const [type, id] = b.dataset.quickDone.split('-');
    b.disabled = true;
    const ok = await apiUpdate(type, id, {done:true});
    if(ok){ showToast('✅ آفرین! انجام شد'); await refreshData(); renderMain(); } else b.disabled = false;
  }));
  main.querySelectorAll('[data-snooze]').forEach(b=>b.addEventListener('click', async ()=>{
    const [type, id] = b.dataset.snooze.split('-');
    let body;
    if(b.dataset.snoozeKind==='tomorrow') body = {date: tomorrowShamsi()};
    else {
      const t = hmToMin(nowHM()) + 60;
      if(t >= 24*60){ body = {date: tomorrowShamsi(), time: '09:00'}; }
      else body = {time: `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`};
    }
    const ok = await apiUpdate(type, id, body);
    if(ok){ showToast(b.dataset.snoozeKind==='tomorrow' ? '↪ رفت برایِ فردا' : '⏰ یک ساعت عقب افتاد'); await refreshData(); renderMain(); }
  }));
  const mv = main.querySelector('[data-move-overdue]');
  if(mv) mv.addEventListener('click', async ()=>{
    const today = todayShamsi();
    const list = allItems.filter(r=>r._type==='free' && r.status==='open' && r.date && r.date<today);
    if(!confirm(`${fn(list.length)} یادآوریِ عقب‌افتاده به امروز منتقل بشه؟`)) return;
    mv.disabled = true;
    for(const r of list) await apiUpdate('free', r.id, {date: today});
    showToast('✅ به امروز منتقل شدن'); await refreshData(); renderMain();
  });
  const td = main.querySelector('[data-toggle-done]');
  if(td) td.addEventListener('click', ()=>{ showDoneToday = !showDoneToday; renderMain(); });
  const tn = main.querySelector('[data-toggle-next]');
  if(tn) tn.addEventListener('click', ()=>{ const el = main.querySelector('.r-row.is-now'); if(el){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth', block:'center'}); } });
  main.querySelectorAll('[data-pick-day]').forEach(b=>b.addEventListener('click', ()=>{ selDay = b.dataset.pickDay; showDoneToday = false; renderMain(); }));
  main.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click', ()=>{
    weekOffset += +b.dataset.week;
    const today = todayShamsi();
    selDay = weekOffset===0 ? today : sStr(jdToS(sJdn(today) - satIndex(today) + weekOffset*7));
    renderMain();
  }));
  main.querySelectorAll('[data-hist]').forEach(b=>b.addEventListener('click', ()=>{ historyFilter = b.dataset.hist; renderMain(); }));
}

function renderMain(){
  const main = document.getElementById('main');
  main.className = 'tab-' + currentTab;
  renderHeaderAndRing();
  if(currentTab === 'today'){
    renderToday(main);
  } else if(currentTab === 'open'){
    renderFlatList(main, ['open'], 'همه‌ی یادآوری‌هایِ باز');
  } else if(currentTab === 'history'){
    const seg = `<div class="hist-seg">${[['done','✓ تکمیل‌شده'],['cancelled','✕ کنسل‌شده'],['archived','📦 بایگانی']].map(([k,l])=>`<button data-hist="${k}" class="${historyFilter===k?'active':''}">${l}</button>`).join('')}</div>`;
    renderFlatList(main, [historyFilter], 'سابقه', seg);
  } else if(currentTab === 'calendar'){
    renderCalendar(main);
  } else if(currentTab === 'deleg'){
    renderDelegations(main);
  }
  wireItemButtons(main);
  wireNewButtons(main);
  updateDelegBadge();
}

// ⚠️ (۱۴۰۵/۰۷/۱۵) ایموجیِ پرچم در ویندوز به‌صورتِ حروفِ «CN/IR» دیده می‌شود (و خودِ متنِ تعطیلی هم پرچم داشت) → حذف؛ به‌جایش نشانِ متنیِ رنگی
const fxStripFlags = s => String(s||'').replace(/[\u{1F1E6}-\u{1F1FF}]/gu,'').replace(/\s+/g,' ').trim();
function fxGroupHolidays(list){
  const groups = [];
  list.forEach(h=>{
    const kind = []; if(h.fixedH) kind.push('ir'); if(h.lunarH) kind.push('lunar'); if(h.cnH) kind.push('cn');
    const label = [h.fixedH, h.lunarH, h.cnH].filter(Boolean).map(fxStripFlags).join(' / ');
    const key = kind.join('+') + '|' + label, last = groups[groups.length-1];
    if(last && last.key === key && h.d === last.to + 1) last.to = h.d; else groups.push({key, kind, label, from:h.d, to:h.d});
  });
  return groups;
}
function renderCalendar(main){
  const firstOfMonthG = jalaliToGregorian(calYear, calMonth, 1);
  const jsDate = new Date(firstOfMonthG.y, firstOfMonthG.m-1, firstOfMonthG.d);
  const startOffset = (jsDate.getDay() + 1) % 7;
  const totalDays = sDim(calYear, calMonth);
  const today = todayShamsi();

  const itemsByDate = {};
  allItems.filter(r=>r.status==='open').forEach(r=>{ if(r.date) (itemsByDate[r.date] = itemsByDate[r.date]||[]).push(r); });

  const monthHolidays = [];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div></div>';
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sk = `${calYear}-${calMonth}-${d}`;
    const ik = `${calMonth}/${d}`;
    const fixedH = IR_H[ik] || null;
    const lunarH = IR_LUNAR_H[sk] || null;
    const cnH = CN_S[sk] || null;
    const hasRem = !!itemsByDate[dateStr];
    // ⚠️ (۱۴۰۵/۰۷/۰۲) طبق درخواستِ صریحِ کاربر: جمعه هم مثلِ یه
    // تعطیلیِ رسمیِ شمسی (هفتگی) درنظر گرفته می‌شه — هم رنگِ خودِ
    // عددِ روز، هم دایره‌یِ آبیِ زیرش.
    const isFriday = ((startOffset + d - 1) % 7) === 6;
    const isIrHoliday = !!(fixedH || lunarH || isFriday);
    if(fixedH||lunarH||cnH) monthHolidays.push({d, fixedH, lunarH, cnH});
    let holTag = '';
    if(fixedH||lunarH||cnH){
      // ⚠️ (۱۴۰۵/۰۶/۲۹) فیکسِ باگِ واقعیِ گزارش‌شده: نمایشِ متنِ کاملِ
      // اسمِ تعطیلی داخلِ سلولِ کوچیکِ تقویم (خصوصاً موبایل) باعثِ
      // سرریزِ بصری و به‌هم‌ریختگیِ کاملِ چیدمان می‌شد — خصوصاً وقتی
      // چندین روزِ پیاپی (مثلِ هفته‌ی ملیِ چین) همه‌شون برچسب داشتن.
      // الان فقط خودِ ایموجیِ پرچم تو سلول می‌مونه؛ اسمِ کاملِ تعطیلی
      // همچنان تو تولتیپ (hover/tap) و لیستِ «تعطیلاتِ این ماه» هست.
      const flagIcons = [fixedH?'🇮🇷':'', lunarH?'🌙':'', cnH?'🇨🇳':''].filter(Boolean).join('');
      const cls = (fixedH||lunarH) && cnH ? 'both' : ((fixedH||lunarH) ? 'ir' : 'cn');
      holTag = `<span class="hol-tag ${cls}" title="${[fixedH,lunarH,cnH].filter(Boolean).join(' / ')}">${flagIcons}</span>`;
    }
    // ⚠️ (۱۴۰۵/۰۷/۰۲) طبق درخواستِ صریحِ کاربر: سه دایره‌ی مجزا —
    // نارنجی=یادآوریِ بازِ همون روز، آبی=تعطیلیِ شمسی (جمعه یا رسمی)،
    // قرمز=تعطیلیِ چین. هر روز می‌تونه هم‌زمان چندتاشو داشته باشه.
    const dotsRow = (hasRem||isIrHoliday||cnH) ? `<span class="dots-row">
      ${hasRem?'<span class="cal-dot dot-rem" title="یادآوریِ باز"></span>':''}
      ${isIrHoliday?'<span class="cal-dot dot-ir-hol" title="تعطیلیِ شمسی"></span>':''}
      ${cnH?'<span class="cal-dot dot-cn-hol" title="تعطیلیِ چین"></span>':''}
    </span>` : '';
    const g = jalaliToGregorian(calYear, calMonth, d);
    const tipH = [fixedH,lunarH,cnH].filter(Boolean).map(fxStripFlags).join(' / ');
    cells += `<div class="cal-day ${dateStr===today?'today':''} ${hasRem?'has-rem':''} ${isFriday?'friday':''} ${dateStr===selectedCalDate?'selected':''}" data-cal-day="${dateStr}"${tipH?` title="${escHtml(tipH)}"`:''}>
      <span class="day-num">${fn(d)}</span>
      <span class="g-date">${g.m}/${g.d}</span>
      ${dotsRow}
    </div>`;
  }

  main.innerHTML = `
    <div class="cal-layout"><div class="cl-main">
    <div class="card">
      <div class="cal-head">
        <button id="calPrev">‹</button>
        <div style="font-weight:700">${SMONTHS[calMonth-1]} ${fn(calYear)}</div>
        <button id="calNext">›</button>
      </div>
      <div class="cal-grid" style="margin-bottom:6px">${WEEKDAY_NAMES.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div style="margin:10px 0 4px"><button class="btn btn-ghost btn-sm" id="calSyncBtn2" type="button" title="نمایشِ یادآوری‌ها در تقویمِ گوشی و گوگل">🔗 اتصال به تقویمِ گوشی و گوگل</button></div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--dot-rem)"></span>یادآوریِ باز</span>
        <span><span class="dot" style="background:var(--dot-ir-hol)"></span>تعطیلیِ شمسی (جمعه/رسمی)</span>
        <span><span class="dot" style="background:var(--dot-cn-hol)"></span>تعطیلِ چین</span>
        <span>📅 عددِ کوچیک = تاریخِ میلادی</span>
      </div>
    </div>
    </div><div class="cl-side">
    <div id="calDayDetail"></div>
    <div class="card">
      <div class="card-title">تعطیلاتِ این ماه</div>
      ${monthHolidays.length ? fxGroupHolidays(monthHolidays).map(g=>{
        const badges = g.kind.map(k=>`<span class="hol-badge ${k}">${k==='cn'?'چین':(k==='lunar'?'قمری':'ایران')}</span>`).join('');
        const range = g.to > g.from ? `${fn(g.from)} تا ${fn(g.to)} ${SMONTHS[calMonth-1]} <span class="hol-n">(${fn(g.to-g.from+1)} روز)</span>` : `${fn(g.from)} ${SMONTHS[calMonth-1]}`;
        return `<div class="hol-row"><div class="hol-t">${badges}<span>${escHtml(g.label)}</span></div><div class="hol-d">${range}</div></div>`;
      }).join('') : '<div class="empty">این ماه تعطیلی ندارد ✅</div>'}
    </div>
    </div></div>
  `;
  const _cs = main.querySelector('#calSyncBtn2'); if(_cs) _cs.addEventListener('click', ()=>openCalendarSyncModal());
  main.querySelector('#calPrev').addEventListener('click', ()=>{ calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderMain(); });
  main.querySelector('#calNext').addEventListener('click', ()=>{ calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderMain(); });
  function showDayDetail(dateStr){
    const items = itemsByDate[dateStr] || [];
    const detail = main.querySelector('#calDayDetail');
    detail.innerHTML = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700">${fmtDateHuman(dateStr)}</div>
        <button class="btn btn-ghost btn-sm" id="calAddForDayBtn" style="width:auto;font-size:11px;padding:6px 10px">+ یادآوریِ جدید برایِ این روز</button>
      </div>
      ${items.length?renderList(items):'<div class="empty">یادآوری‌ای برای این روز نیست</div>'}
    </div>`;
    detail.querySelector('#calAddForDayBtn').addEventListener('click', ()=>openReminderModal(null, dateStr));
    wireItemButtons(detail);
  }
  main.querySelectorAll('[data-cal-day]').forEach(el=>el.addEventListener('click', ()=>{
    const dateStr = el.dataset.calDay;
    selectedCalDate = dateStr;
    main.querySelectorAll('.cal-day.selected').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');
    showDayDetail(dateStr);
  }));
  // ⚠️ (۱۴۰۵/۰۷/۰۲) فیکسِ باگِ واقعیِ گزارش‌شده: قبلاً وقتی از داخلِ
  // جزئیاتِ یه روز، یادآوری‌ای تکمیل/کنسل/حذف می‌شد، renderMain کلِ
  // تقویم رو دوباره می‌ساخت و پنلِ جزئیات خالی می‌موند — باید دوباره
  // رویِ همون روز کلیک می‌کردید. الان اگه همون ماهِ نمایشی باشه،
  // پنلِ همون روز خودکار با دیتایِ تازه دوباره باز می‌شه.
  if(selectedCalDate && selectedCalDate.startsWith(`${calYear}-${String(calMonth).padStart(2,'0')}-`)){
    const selEl = main.querySelector(`[data-cal-day="${selectedCalDate}"]`);
    if(selEl) showDayDetail(selectedCalDate);
  }
}

function wireItemButtons(container){
  wireDelegButtons(container);
  container.querySelectorAll('[data-set-status]').forEach(b=>b.addEventListener('click', async ()=>{
    const [type, id] = b.dataset.setStatus.split('-');
    const item = allItems.find(x=>x._type===type && String(x.id)===id);
    const action = statusActions(item).find(a=>b.textContent.trim()===a.label);
    const ok = await apiUpdate(type, id, action.body);
    if(ok){ showToast('✅ وضعیت بروزرسانی شد'); await refreshData(); renderMain(); }
  }));
  container.querySelectorAll('[data-del-key]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('حذفِ کاملِ این یادآوری؟ این با «کنسل»/«بایگانی» فرق داره — دیگه هیچ‌جا قابلِ‌بازیابی نیست.')) return;
    const [type, id] = b.dataset.delKey.split('-');
    await apiDelete(type, id);
    await refreshData();
    renderMain();
  }));
}

// ⚠️ (۱۴۰۵/۰۶/۲۹) طبق توضیحِ صریحِ کاربر: «کارِ فردا» مفهوماً از
// «یادآوریِ آزاد» فرق داره — چیزی که همین الان به ذهن می‌رسه و باید
// *فردا* پیگیرش بشید، بدونِ نیازِ به بازکردنِ فرمِ کامل و انتخابِ
// تاریخ/نوع. این یه ثبتِ فوری‌ست: فقط عنوان می‌پرسه، بقیه خودکاره.
function openQuickTomorrowModal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>⚡ کارِ فردا</h3>
      <div class="field"><label>چی به ذهنت رسید که فردا باید پیگیرش بشی؟</label><input id="qtTitle" type="text" placeholder="مثلاً: پیگیریِ فاکتورِ شرکتِ الف" autofocus></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-primary" id="qtSaveBtn">ثبت برایِ فردا</button>
        <button class="btn btn-ghost" id="qtCancelBtn">انصراف</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#qtCancelBtn').addEventListener('click', ()=>backdrop.remove());
  const titleInput = backdrop.querySelector('#qtTitle');
  titleInput.focus();
  async function save(){
    const title = titleInput.value.trim();
    if(!title){ showToast('یه عنوان بنویس'); return; }
    const d = await apiCreate('free', {
      desc:title, customer:'', date:tomorrowShamsi(), time:'', category:'',
      assignee_name:MY_NAME, assigned_by_name:MY_NAME, done:false, canceled:false, archived:false,
    });
    if(!d) return;
    showToast('✅ برایِ فردا ثبت شد');
