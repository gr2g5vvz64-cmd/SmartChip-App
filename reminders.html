<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest-reminders.json">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>یادآوری‌ها — اسمارت‌چیپ</title>
<style>
  :root{ --accent:#7c3aed; --bg:#f3f0fb; --card:#fff; --border:#e2d9f7; --ink:#2a2140; --ink-soft:#7a6f96; --danger:#d0374c; --ok:#0e7d6b; --warn:#f59e0b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:12px;max-width:520px;margin:0 auto}
  h1{font-size:18px;margin:8px 0 4px}
  .sub{font-size:11px;color:var(--ink-soft);margin-bottom:14px}
  .seg{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:3px;margin-bottom:14px;overflow-x:auto}
  .seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap;color:var(--ink-soft)}
  .seg button.active{background:var(--accent);color:#fff}
  .card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
  .field label{font-size:11px;color:var(--ink-soft)}
  input,select,textarea{font-family:inherit;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:50px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{padding:10px 14px;border-radius:9px;border:none;font-size:13px;cursor:pointer;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff;width:100%}
  .btn-ghost{background:var(--card);border:1.5px solid var(--border);color:var(--ink)}
  .btn-danger{background:#fde8ea;color:var(--danger)}
  .type-seg{display:flex;gap:6px;margin-bottom:10px}
  .type-seg button{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12px;cursor:pointer}
  .type-seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .item{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:7px;background:#fff}
  .item.st-done{opacity:.6;border-color:#cfead4}
  .item.st-cancelled{opacity:.55;border-color:#f3d2d8}
  .item.st-archived{opacity:.45}
  .item-body{flex:1;min-width:0}
  .item-title{font-size:13.5px;font-weight:600}
  .item-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
  .item-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap}
  .item-actions{display:flex;flex-direction:column;gap:4px}
  .icon-btn{border:none;background:var(--bg);border-radius:6px;padding:4px 7px;font-size:10.5px;cursor:pointer}
  .status-chip{display:inline-block;font-size:9.5px;border-radius:5px;padding:1px 6px;margin-inline-start:5px}
  .status-chip.done{background:#e3f5ea;color:var(--ok)}
  .status-chip.cancelled{background:#fde8ea;color:var(--danger)}
  .status-chip.archived{background:#eee;color:#666}
  .tag-recur{display:inline-block;font-size:9.5px;background:#efe6ff;color:var(--accent);border-radius:5px;padding:1px 6px;margin-inline-start:5px}
  .empty{text-align:center;color:var(--ink-soft);font-size:12px;padding:20px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cal-head button{border:none;background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{text-align:center;font-size:9.5px;color:var(--ink-soft);padding:2px 0}
  .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:11px;cursor:pointer;border:1.5px solid transparent;position:relative;padding:2px}
  .cal-day.today{border-color:var(--accent);font-weight:700}
  .cal-day.has-rem{background:#efe6ff}
  .cal-day .g-date{font-size:7px;color:var(--ink-soft)}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;position:absolute;top:2px;left:2px}
  .cal-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--ink-soft);margin-top:8px}
  .cal-legend span{display:flex;align-items:center;gap:3px}
  .cal-legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .hol-row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid var(--border)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a2140;color:#fff;padding:8px 16px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:400}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
  .modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
</style>
</head>
<body>
<h1>⏰ یادآوری‌ها</h1>
<div class="sub" id="dateBadge"></div>

<div class="seg" id="mainTabs">
  <button data-tab="today" class="active">امروز/فردا</button>
  <button data-tab="open">باز</button>
  <button data-tab="done">تکمیل‌شده</button>
  <button data-tab="cancelled">کنسل‌شده</button>
  <button data-tab="archived">بایگانی</button>
  <button data-tab="calendar">تقویم</button>
</div>

<button class="btn btn-primary" id="addBtn" style="margin-bottom:14px">+ یادآوریِ جدید</button>

<div id="main"></div>

<div class="toast" id="toast"></div>

<script>
// ⚠️ (۱۴۰۵/۰۶/۲۸) طبق تصمیمِ صریحِ کاربر: این PWA دیگه به دیتابیسِ
// جداگانه‌ی خودش وصل نیست — مستقیم به همون worklog که از قبل تویِ
// CRM/ERP/Mobile استفاده می‌شه وصل می‌شه، تا دیتا یکی و مشترک بمونه.
const FREE_API = 'https://smartchip-backend.onrender.com/api/worklog/free-reminders/';
const RECUR_API = 'https://smartchip-backend.onrender.com/api/worklog/recurring-reminders/';
// ⚠️ فقط یادآوری‌های خودِ همین کارمند نشون داده می‌شه (نه کلِ تیم) —
// یادآوری‌هایِ تیمی جای جداگانه‌ای (تبِ CRM) دیده می‌شن، نه اینجا.
const MY_NAME = 'حمیدرضا چاوشی ابیانه';

// ══════════════════════════════════════════════════════════════
// تقویمِ شمسیِ کامل — عیناً همون الگوریتمِ محک‌شده‌ی CRM/ERP
// ══════════════════════════════════════════════════════════════
function fn(n){ return String(n).replace(/\d/g, x=>'۰۱۲۳۴۵۶۷۸۹'[x]); }
function isLeapS(y){ const base=y>=0?y-474:y-473; const jy=((base%2820)+2820)%2820+474; return(((jy*682)-110)%2816)<682; }
function sDim(y,m){ if(m<12) return m<=6?31:30; return isLeapS(y)?30:29; }
function sToJD(y,m,d){ const base=y>=0?y-474:y-473; const jy=((base%2820)+2820)%2820+474; const dbm=(m<=7?(m-1)*31:(m-1)*30+6); return d+dbm+Math.floor((jy*682-110)/2816)+(jy-1)*365+Math.floor(base/2820)*1029983+1948320; }
function gToJD(y,m,d){ return 367*y-Math.floor(7*(y+Math.floor((m+9)/12))/4)-Math.floor(3*(Math.floor((y+(m-9)/7)/100)+1)/4)+Math.floor(275*m/9)+d+1721029; }
function jdToS(jd){ const j=Math.floor(jd)+0.5; const dep=j-sToJD(475,1,1); const cyc=Math.floor(dep/1029983); const cr=dep%1029983; let yc=cr===1029982?2820:Math.floor((2134*Math.floor(cr/366)+2816*(cr%366)+2815)/1028522)+Math.floor(cr/366)+1; let year=yc+2820*cyc+474; if(year<=0)year--; const yd=j-sToJD(year,1,1)+1; let month=yd<=186?Math.ceil(yd/31):Math.ceil((yd-6)/30); let day=Math.floor(j-sToJD(year,month,1)+1); if(day<1){month--; if(month<1){month=12;year--;} day=Math.floor(j-sToJD(year,month,1)+1);} return {y:year,m:month,d:day}; }
function jdToG(jd){ const j=Math.floor(jd); const d=new Date((j-2440588)*86400000); return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, d:d.getUTCDate()}; }
const SMONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAY_NAMES = ['ش','ی','د','س','چ','پ','ج'];

function todayShamsi(){
  const now = new Date();
  const s = jdToS(gToJD(now.getFullYear(), now.getMonth()+1, now.getDate()));
  return `${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}`;
}
function tomorrowShamsi(){
  const now = new Date(); now.setDate(now.getDate()+1);
  const s = jdToS(gToJD(now.getFullYear(), now.getMonth()+1, now.getDate()));
  return `${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}`;
}
function jalaliToGregorian(jy,jm,jd){ return jdToG(sToJD(jy,jm,jd)); }

const IR_H={'1/1':'نوروز','1/2':'نوروز','1/3':'نوروز','1/4':'نوروز','1/12':'جمهوری اسلامی','1/13':'سیزده‌به‌در','3/14':'رحلت امام','3/15':'قیام ۱۵ خرداد','11/22':'پیروزی انقلاب','12/29':'ملی شدن نفت'};
const IR_LUNAR_H={
  '1404-2-4':'شهادت امام جعفر صادق','1404-3-16':'عید قربان','1404-3-24':'عید غدیر',
  '1404-4-14':'تاسوعا','1404-4-15':'عاشورا','1404-5-23':'اربعین',
  '1404-5-31':'رحلت پیامبر / شهادت امام حسن','1404-6-2':'شهادت امام رضا',
  '1404-6-10':'شهادت امام حسن عسکری','1404-6-19':'میلاد پیامبر',
  '1405-1-1':'عید فطر','1405-1-2':'عید فطر','1405-1-25':'شهادت امام جعفر صادق',
  '1405-3-6':'عید قربان','1405-3-14':'عید غدیر',
  '1405-4-3':'تاسوعا','1405-4-4':'عاشورا','1405-5-13':'اربعین',
  '1405-5-21':'رحلت پیامبر / شهادت امام حسن','1405-5-22':'شهادت امام رضا',
  '1405-5-30':'شهادت امام حسن عسکری','1405-6-8':'میلاد پیامبر',
  '1406-1-14':'شهادت امام جعفر صادق','1406-2-23':'عید قربان','1406-3-3':'عید غدیر',
  '1406-3-23':'تاسوعا','1406-3-24':'عاشورا','1406-5-2':'اربعین',
  '1406-5-10':'رحلت پیامبر / شهادت امام حسن','1406-5-11':'شهادت امام رضا',
  '1406-5-19':'شهادت امام حسن عسکری','1406-5-28':'میلاد پیامبر',
};
const CN_G={'2025-1-28':'عید بهار🧨','2025-1-29':'عید بهار🧨','2025-1-30':'عید بهار🧨','2025-1-31':'عید بهار🧨','2025-2-1':'عید بهار🧨','2025-2-2':'عید بهار🧨','2025-2-3':'عید بهار🧨','2025-2-4':'عید بهار🧨','2025-5-1':'روز کارگر','2025-5-2':'روز کارگر','2025-5-3':'روز کارگر','2025-5-4':'روز کارگر','2025-5-5':'روز کارگر','2025-10-1':'هفته ملی🇨🇳','2025-10-2':'هفته ملی🇨🇳','2025-10-3':'هفته ملی🇨🇳','2025-10-4':'هفته ملی🇨🇳','2025-10-5':'هفته ملی🇨🇳','2025-10-6':'هفته ملی🇨🇳','2025-10-7':'هفته ملی🇨🇳','2026-2-15':'عید بهار🧨','2026-2-16':'عید بهار🧨','2026-2-17':'عید بهار🧨','2026-2-18':'عید بهار🧨','2026-2-19':'عید بهار🧨','2026-2-20':'عید بهار🧨','2026-2-21':'عید بهار🧨','2026-2-22':'عید بهار🧨','2026-2-23':'عید بهار🧨','2026-5-1':'روز کارگر','2026-5-2':'روز کارگر','2026-5-3':'روز کارگر','2026-5-4':'روز کارگر','2026-5-5':'روز کارگر','2026-10-1':'هفته ملی🇨🇳','2026-10-2':'هفته ملی🇨🇳','2026-10-3':'هفته ملی🇨🇳','2026-10-4':'هفته ملی🇨🇳','2026-10-5':'هفته ملی🇨🇳','2026-10-6':'هفته ملی🇨🇳','2026-10-7':'هفته ملی🇨🇳'};
const CN_S={};
Object.entries(CN_G).forEach(([k,v])=>{ const [y,m,d]=k.split('-').map(Number); const s=jdToS(gToJD(y,m,d)); CN_S[`${s.y}-${s.m}-${s.d}`]=v; });

const STATUS_LABEL = {open:'باز', done:'تکمیل‌شده', cancelled:'کنسل‌شده', archived:'بایگانی'};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── تبدیلِ دیتایِ خامِ worklog به یه شکلِ یکسان برایِ نمایش ──
function normalizeFree(r){
  let status = 'open';
  if(r.archived) status = 'archived';
  else if(r.canceled) status = 'cancelled';
  else if(r.done) status = 'done';
  return { _type:'free', id:r.id, title:r.desc, customer:r.customer, date:r.date, time:r.time||'',
           note:r.category ? `دسته: ${r.category}` : '', status, raw:r };
}
function normalizeRecurring(r){
  let status = 'open';
  if(r.archived) status = 'archived';
  else if(r.canceled) status = 'cancelled';
  return { _type:'recurring', id:r.id, title:r.title, customer:r.customer, date:r.next_date, time:r.time||'',
           note:r.note ? `${r.note} — هر ${r.interval} روز` : `هر ${r.interval} روز`, status, raw:r };
}

async function apiFetchArray(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return [];
    const data = await r.json();
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.results)) return data.results;
    return [];
  }catch(e){ return []; }
}

async function apiUpdate(type, id, body){
  const url = (type==='free'?FREE_API:RECUR_API) + id + '/';
  const r = await fetch(url, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok){ showToast('❌ ویرایش ناموفق'); return null; }
  return r.json();
}
async function apiCreate(type, body){
  const url = type==='free' ? FREE_API : RECUR_API;
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok){ showToast('❌ ثبت ناموفق'); return null; }
  return r.json();
}
async function apiDelete(type, id){
  const url = (type==='free'?FREE_API:RECUR_API) + id + '/';
  const r = await fetch(url, {method:'DELETE'});
  return r.ok;
}

let allItems = [];
let currentTab = 'today';
let calYear, calMonth;
{
  const t = todayShamsi().split('-').map(Number);
  calYear = t[0]; calMonth = t[1];
}

function fmtDateHuman(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${d} ${SMONTHS[m-1]} ${y}`;
}

// ⚠️ (۱۴۰۵/۰۶/۲۸) عملیاتِ وضعیت — برایِ «آزاد» و «دوره‌ای» متفاوته،
// چون آزاد یه فیلدِ `done` جدا داره، دوره‌ای نداره (هیچ‌وقت «تکمیل»
// نمی‌شه، فقط باز/کنسل/بایگانی، چون خودش تکرار می‌شه)
function statusActions(item){
  if(item._type === 'free'){
    if(item.status==='open') return [{label:'✔️ تکمیل', body:{done:true}}, {label:'❌ کنسل', body:{canceled:true}}];
    if(item.status==='done' || item.status==='cancelled') return [{label:'↩️ بازگردانی به باز', body:{done:false, canceled:false}}, {label:'📦 بایگانی', body:{archived:true}}];
    return [{label:'↩️ بازگردانی به باز', body:{archived:false}}];
  } else {
    if(item.status==='open') return [{label:'❌ کنسل', body:{canceled:true}}];
    if(item.status==='cancelled') return [{label:'↩️ بازگردانی به باز', body:{canceled:false}}, {label:'📦 بایگانی', body:{archived:true}}];
    return [{label:'↩️ بازگردانی به باز', body:{archived:false}}];
  }
}

function renderItem(item){
  const chip = item.status!=='open' ? `<span class="status-chip ${item.status}">${STATUS_LABEL[item.status]}</span>` : '';
  const actions = statusActions(item).map(a=>`<button class="icon-btn" data-set-status="${item._type}-${item.id}">${a.label}</button>`).join('');
  return `<div class="item st-${item.status}" data-item-key="${item._type}-${item.id}">
    <div class="item-body">
      <div class="item-title">${item.title||'(بدون عنوان)'}${chip}${item._type==='recurring'?`<span class="tag-recur">🔁 دوره‌ای</span>`:''}</div>
      <div class="item-meta">${item.customer?`مشتری: ${item.customer} — `:''}${fmtDateHuman(item.date)}${item.time?' — ساعت '+item.time:''}</div>
      ${item.note?`<div class="item-note">${item.note}</div>`:''}
    </div>
    <div class="item-actions">
      ${actions}
      <button class="icon-btn" data-del-key="${item._type}-${item.id}">🗑️</button>
    </div>
  </div>`;
}

function renderList(items){
  if(items.length===0) return `<div class="empty">چیزی نیست</div>`;
  return items.map(renderItem).join('');
}

async function loadAllItems(){
  const [freeRaw, recurRaw] = await Promise.all([apiFetchArray(FREE_API), apiFetchArray(RECUR_API)]);
  // ⚠️ طبقِ تصمیمِ کاربر: فقط یادآوریِ آزادِ *خودش* — دوره‌ای فعلاً
  // فیلدِ assignee نداره (طبقِ خودِ مدلِ worklog)، پس همه‌ش نشون داده می‌شه
  const myFree = freeRaw.filter(r=>r.assignee_name === MY_NAME).map(normalizeFree);
  const recurring = recurRaw.map(normalizeRecurring);
  return [...myFree, ...recurring];
}

async function renderMain(){
  const main = document.getElementById('main');
  allItems = await loadAllItems();
  const today = todayShamsi();
  const tomorrow = tomorrowShamsi();

  if(currentTab === 'today'){
    const openOnly = allItems.filter(r=>r.status==='open');
    const todays = openOnly.filter(r=>r.date===today);
    const tomorrows = openOnly.filter(r=>r.date===tomorrow);
    const overdue = openOnly.filter(r=>r.date && r.date<today);
    main.innerHTML = `
      ${overdue.length ? `<div class="card"><div style="font-weight:700;color:var(--danger);margin-bottom:8px">⚠️ گذشته و هنوز باز</div>${renderList(overdue)}</div>` : ''}
      <div class="card"><div style="font-weight:700;margin-bottom:8px">امروز</div>${renderList(todays)}</div>
      <div class="card"><div style="font-weight:700;margin-bottom:8px">فردا</div>${renderList(tomorrows)}</div>
    `;
  } else if(['open','done','cancelled','archived'].includes(currentTab)){
    const filtered = allItems.filter(r=>r.status===currentTab)
      .sort((a,b)=> (a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00')));
    main.innerHTML = `<div class="card">${renderList(filtered)}</div>`;
  } else if(currentTab === 'calendar'){
    renderCalendar(main);
  }
  wireItemButtons(main);
}

function renderCalendar(main){
  const firstOfMonthG = jalaliToGregorian(calYear, calMonth, 1);
  const jsDate = new Date(firstOfMonthG.y, firstOfMonthG.m-1, firstOfMonthG.d);
  const startOffset = (jsDate.getDay() + 1) % 7;
  const totalDays = sDim(calYear, calMonth);
  const today = todayShamsi();

  const itemsByDate = {};
  allItems.filter(r=>r.status==='open').forEach(r=>{ if(r.date) (itemsByDate[r.date] = itemsByDate[r.date]||[]).push(r); });

  const monthHolidays = [];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div></div>';
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sk = `${calYear}-${calMonth}-${d}`;
    const ik = `${calMonth}/${d}`;
    const fixedH = IR_H[ik] || null;
    const lunarH = IR_LUNAR_H[sk] || null;
    const cnH = CN_S[sk] || null;
    const hasRem = !!itemsByDate[dateStr];
    if(fixedH||lunarH||cnH) monthHolidays.push({d, fixedH, lunarH, cnH});
    let dotColor = '';
    if(fixedH||lunarH||cnH) dotColor = ((fixedH||lunarH)&&cnH) ? 'var(--warn)' : ((fixedH||lunarH)?'var(--ok)':'var(--danger)');
    const g = jalaliToGregorian(calYear, calMonth, d);
    cells += `<div class="cal-day ${dateStr===today?'today':''} ${hasRem?'has-rem':''}" data-cal-day="${dateStr}">
      ${dotColor?`<span class="dot" style="background:${dotColor}"></span>`:''}
      <span>${fn(d)}</span>
      <span class="g-date">${g.m}/${g.d}</span>
    </div>`;
  }

  main.innerHTML = `
    <div class="card">
      <div class="cal-head">
        <button id="calPrev">‹</button>
        <div style="font-weight:700">${SMONTHS[calMonth-1]} ${fn(calYear)}</div>
        <button id="calNext">›</button>
      </div>
      <div class="cal-grid" style="margin-bottom:6px">${WEEKDAY_NAMES.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--ok)"></span>تعطیلِ ایران</span>
        <span><span class="dot" style="background:var(--danger)"></span>تعطیلِ چین</span>
        <span><span class="dot" style="background:var(--warn)"></span>هردو</span>
        <span>📅 عددِ کوچیک = تاریخِ میلادی</span>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">تعطیلاتِ این ماه</div>
      ${monthHolidays.length ? monthHolidays.map(h=>{
        const flags = [h.fixedH?'🇮🇷':'', h.lunarH?'🌙':'', h.cnH?'🇨🇳':''].filter(Boolean).join(' ');
        const labels = [h.fixedH, h.lunarH, h.cnH].filter(Boolean).join(' / ');
        return `<div class="hol-row"><span>${flags} ${labels}</span><span style="color:var(--ink-soft)">${fn(calMonth)}/${fn(h.d)}</span></div>`;
      }).join('') : '<div class="empty">این ماه تعطیلی ندارد ✅</div>'}
    </div>
    <div id="calDayDetail"></div>
  `;
  main.querySelector('#calPrev').addEventListener('click', ()=>{ calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderMain(); });
  main.querySelector('#calNext').addEventListener('click', ()=>{ calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderMain(); });
  main.querySelectorAll('[data-cal-day]').forEach(el=>el.addEventListener('click', ()=>{
    const dateStr = el.dataset.calDay;
    const items = itemsByDate[dateStr] || [];
    const detail = main.querySelector('#calDayDetail');
    detail.innerHTML = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700">${fmtDateHuman(dateStr)}</div>
        <button class="btn btn-ghost btn-sm" id="calAddForDayBtn" style="width:auto;font-size:11px;padding:6px 10px">+ یادآوریِ جدید برایِ این روز</button>
      </div>
      ${items.length?renderList(items):'<div class="empty">یادآوری‌ای برای این روز نیست</div>'}
    </div>`;
    detail.querySelector('#calAddForDayBtn').addEventListener('click', ()=>openReminderModal(null, dateStr));
    wireItemButtons(detail);
  }));
}

function wireItemButtons(container){
  container.querySelectorAll('[data-set-status]').forEach(b=>b.addEventListener('click', async ()=>{
    const [type, id] = b.dataset.setStatus.split('-');
    const item = allItems.find(x=>x._type===type && String(x.id)===id);
    const action = statusActions(item).find(a=>b.textContent.trim()===a.label);
    const ok = await apiUpdate(type, id, action.body);
    if(ok){ showToast('✅ وضعیت بروزرسانی شد'); renderMain(); }
  }));
  container.querySelectorAll('[data-del-key]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('حذفِ کاملِ این یادآوری؟ این با «کنسل»/«بایگانی» فرق داره — دیگه هیچ‌جا قابلِ‌بازیابی نیست.')) return;
    const [type, id] = b.dataset.delKey.split('-');
    await apiDelete(type, id);
    renderMain();
  }));
}

function openReminderModal(existing, presetDate){
  let modalType = existing ? existing._type : 'free';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  function draw(){
    const isEdit = !!existing;
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${isEdit?'ویرایشِ یادآوری':'یادآوریِ جدید'}</h3>
        ${!isEdit ? `
        <div class="type-seg">
          <button type="button" data-pick-type="free" class="${modalType==='free'?'active':''}">آزاد (یک‌بار)</button>
          <button type="button" data-pick-type="recurring" class="${modalType==='recurring'?'active':''}">دوره‌ای</button>
        </div>` : ''}
        <div class="field"><label>${modalType==='free'?'شرح':'عنوان'}</label><input id="rTitle" type="text" value="${existing ? (existing.title||'') : ''}"></div>
        <div class="field"><label>مشتری (اختیاری)</label><input id="rCustomer" type="text" value="${existing?.customer||''}"></div>
        <div class="row2">
          <div class="field"><label>تاریخِ ${modalType==='free'?'یادآوری':'شروع/موعدِ بعدی'} (شمسی)</label><input id="rDate" type="text" readonly value="${existing?.date||presetDate||todayShamsi()}" placeholder="1405-06-26"></div>
          <div class="field"><label>ساعت (اختیاری)</label><input id="rTime" type="time" value="${existing?.raw?.time||''}"></div>
        </div>
        ${modalType==='recurring' ? `<div class="field"><label>هر چند روز تکرار بشه؟</label><input id="rInterval" type="number" min="1" value="${existing?.raw?.interval||30}"></div>` : ''}
        <div class="field"><label>${modalType==='free'?'دسته (اختیاری)':'یادداشت (اختیاری)'}</label><textarea id="rNote">${modalType==='free' ? (existing?.raw?.category||'') : (existing?.raw?.note||'')}</textarea></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-primary" id="rSaveBtn">${isEdit?'ذخیره':'ثبت'}</button>
          <button class="btn btn-ghost" id="rCancelBtn">انصراف</button>
        </div>
      </div>`;
    backdrop.querySelector('#rCancelBtn').addEventListener('click', ()=>backdrop.remove());
    if(!isEdit){
      backdrop.querySelectorAll('[data-pick-type]').forEach(b=>b.addEventListener('click', ()=>{
        modalType = b.dataset.pickType; draw();
      }));
    }
    const dateInput = backdrop.querySelector('#rDate');
    dateInput.addEventListener('click', ()=>openCalendarPicker(dateInput));
    backdrop.querySelector('#rSaveBtn').addEventListener('click', async ()=>{
      const title = backdrop.querySelector('#rTitle').value.trim();
      const customer = backdrop.querySelector('#rCustomer').value.trim();
      const date = dateInput.value.trim();
      const time = backdrop.querySelector('#rTime').value;
      const noteVal = backdrop.querySelector('#rNote').value.trim();
      if(!title || !date){ showToast('عنوان/شرح و تاریخ را وارد کنید'); return; }
      let body, type;
      if(modalType === 'free'){
        type = 'free';
        body = { desc:title, customer, date, time, category: noteVal, assignee_name: MY_NAME, assigned_by_name: MY_NAME };
        if(!existing){ body.done=false; body.canceled=false; body.archived=false; }
      } else {
        type = 'recurring';
        const interval = parseInt(backdrop.querySelector('#rInterval').value) || 30;
        body = { title, customer, interval: String(interval), start_date: existing?.raw?.start_date || date, next_date: date, time, note: noteVal };
        if(!existing){ body.canceled=false; body.archived=false; }
      }
      const d = existing ? await apiUpdate(type, existing.id, body) : await apiCreate(type, body);
      if(!d) return;
      showToast('✅ ذخیره شد');
      backdrop.remove();
      renderMain();
    });
  }
  draw();
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
}

function openCalendarPicker(inputEl){
  document.querySelectorAll('.mini-cal-popup').forEach(p=>p.remove());
  let [vy,vm] = (inputEl.value || todayShamsi()).split('-').map(Number);
  const popup = document.createElement('div');
  popup.className = 'mini-cal-popup';
  popup.style.cssText = 'position:fixed;z-index:300;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px;width:250px;top:50%;left:50%;transform:translate(-50%,-50%)';
  function draw(){
    const firstOfMonthG = jalaliToGregorian(vy, vm, 1);
    const jsDate = new Date(firstOfMonthG.y, firstOfMonthG.m-1, firstOfMonthG.d);
    const startOffset = (jsDate.getDay() + 1) % 7;
    const totalDays = sDim(vy, vm);
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += '<div></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells += `<div data-pick="${dateStr}" style="text-align:center;padding:5px 0;border-radius:6px;cursor:pointer;font-size:11px;${inputEl.value===dateStr?'background:var(--accent);color:#fff':''}">${fn(d)}</div>`;
    }
    popup.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <button type="button" id="mcPrev" style="border:none;background:none;cursor:pointer">‹</button>
        <div style="font-size:12px;font-weight:700">${SMONTHS[vm-1]} ${fn(vy)}</div>
        <button type="button" id="mcNext" style="border:none;background:none;cursor:pointer">›</button>
      </div>
      <div class="cal-grid" style="margin-bottom:4px">${WEEKDAY_NAMES.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    `;
    popup.querySelector('#mcPrev').addEventListener('click', ()=>{ vm--; if(vm<1){vm=12;vy--;} draw(); });
    popup.querySelector('#mcNext').addEventListener('click', ()=>{ vm++; if(vm>12){vm=1;vy++;} draw(); });
    popup.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pick;
      popup.remove();
    }));
  }
  draw();
  document.body.appendChild(popup);
  popup.addEventListener('click', e=>e.stopPropagation());
  setTimeout(()=>{
    document.addEventListener('click', function close(e){
      if(!popup.contains(e.target) && e.target!==inputEl){ popup.remove(); document.removeEventListener('click', close); }
    });
  },0);
}

document.getElementById('addBtn').addEventListener('click', ()=>openReminderModal(null));
document.querySelectorAll('#mainTabs button').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('#mainTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentTab = b.dataset.tab;
  renderMain();
}));
document.getElementById('dateBadge').textContent = fmtDateHuman(todayShamsi()) + ' — یادآوری‌های ' + MY_NAME;
renderMain();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
