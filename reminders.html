  backdrop.querySelector('#qtSaveBtn').addEventListener('click', save);
  titleInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') save(); });
}

function openReminderModal(existing, presetDate){
  let modalType = existing ? existing._type : 'free';
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';

  function draw(){
    const isEdit = !!existing;
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${isEdit?'ویرایشِ یادآوری':'یادآوریِ جدید'}</h3>
        ${!isEdit ? `
        <div class="type-seg">
          <button type="button" data-pick-type="free" class="${modalType==='free'?'active':''}">آزاد (یک‌بار)</button>
          <button type="button" data-pick-type="recurring" class="${modalType==='recurring'?'active':''}">دوره‌ای</button>
        </div>` : ''}
        <div class="field"><label>${modalType==='free'?'شرح':'عنوان'}</label><input id="rTitle" type="text" value="${existing ? (existing.title||'') : ''}"></div>
        <div class="field"><label>مشتری (اختیاری)</label>
          <input id="rCustomer" type="text" list="knownCustomersList" value="${existing?.customer||''}">
          <datalist id="knownCustomersList">${[...new Set(allItems.map(x=>x.customer).filter(Boolean))].map(c=>`<option value="${c}">`).join('')}</datalist>
        </div>
        <div class="row2">
          <div class="field"><label>تاریخِ ${modalType==='free'?'یادآوری':'شروع/موعدِ بعدی'} (شمسی)</label><input id="rDate" type="text" readonly value="${existing?.date||presetDate||todayShamsi()}" placeholder="1405-06-26"></div>
          <div class="field"><label>ساعت (اختیاری)</label><input id="rTime" type="time" value="${existing?.raw?.time||''}"></div>
        </div>
        ${modalType==='recurring' ? `
        <div class="field"><label>هر چند روز تکرار بشه؟</label><input id="rInterval" type="number" min="1" value="${existing?.raw?.interval||30}"></div>` : ''}
        <div class="field"><label>⏳ یادآوریِ قبل از موعد (اختیاری — چند تا هم می‌شه)</label>
          <div class="bf-chips" id="rBefore">${beforeChipsHtml([...(existing?.raw?.remind_before||[]), ...((existing?.raw?.warn_days||[]).map(d=>d*1440))])}</div>
          <div class="bf-hint">${'نسبت به ساعتِ یادآوری؛ اگه ساعت نذارید، نسبت به ۹ صبحِ همون روز. پیامِ بله + هشدارِ تقویمِ گوگل.'}</div></div>
        <div class="field"><label>${modalType==='free'?'دسته (اختیاری)':'یادداشت (اختیاری)'}</label><textarea id="rNote">${modalType==='free' ? (existing?.raw?.category||'') : (existing?.raw?.note||'')}</textarea></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-primary" id="rSaveBtn">${isEdit?'ذخیره':'ثبت'}</button>
          <button class="btn btn-ghost" id="rCancelBtn">انصراف</button>
        </div>
      </div>`;
    backdrop.querySelector('#rCancelBtn').addEventListener('click', ()=>backdrop.remove());
    if(!isEdit){
      backdrop.querySelectorAll('[data-pick-type]').forEach(b=>b.addEventListener('click', ()=>{
        modalType = b.dataset.pickType; draw();
      }));
    }
    const dateInput = backdrop.querySelector('#rDate');
    dateInput.addEventListener('click', ()=>openCalendarPicker(dateInput));
    backdrop.querySelector('#rBefore').addEventListener('click', e=>{ const b=e.target.closest('[data-bf]'); if(b) b.classList.toggle('on'); });
    backdrop.querySelector('#rSaveBtn').addEventListener('click', async ()=>{
      const title = backdrop.querySelector('#rTitle').value.trim();
      const customer = backdrop.querySelector('#rCustomer').value.trim();
      const date = dateInput.value.trim();
      const time = backdrop.querySelector('#rTime').value;
      const noteVal = backdrop.querySelector('#rNote').value.trim();
      const remindBefore = [...backdrop.querySelectorAll('#rBefore .bf-chip.on')].map(b=>+b.dataset.bf);
      if(!title || !date){ showToast('عنوان/شرح و تاریخ را وارد کنید'); return; }
      let body, type;
      if(modalType === 'free'){
        type = 'free';
        body = { desc:title, customer, date, time, category: noteVal, assignee_name: MY_NAME, assigned_by_name: MY_NAME, remind_before: remindBefore };
        if(!existing){ body.done=false; body.canceled=false; body.archived=false; }
      } else {
        type = 'recurring';
        const interval = parseInt(backdrop.querySelector('#rInterval').value) || 30;
        // warn_days قدیمی به remind_before منتقل شد (همون چیپ‌ها) — دیگه جداگانه نگه داشته نمی‌شه
        body = { title, customer, interval: String(interval), start_date: existing?.raw?.start_date || date, next_date: date, time, note: noteVal,
                 warn_days: [], remind_before: remindBefore, assignee_name: existing?.raw?.assignee_name || MY_NAME };
        if(!existing){ body.canceled=false; body.archived=false; }
      }
      const d = existing ? await apiUpdate(type, existing.id, body) : await apiCreate(type, body);
      if(!d) return;
      showToast('✅ ذخیره شد');
      backdrop.remove();
      await refreshData();
      renderMain();
    });
  }
  draw();
  document.body.appendChild(backdrop);
}

function openCalendarPicker(inputEl){
  document.querySelectorAll('.mini-cal-popup').forEach(p=>p.remove());
  let [vy,vm] = (inputEl.value || todayShamsi()).split('-').map(Number);
  const popup = document.createElement('div');
  popup.className = 'mini-cal-popup';
  popup.style.cssText = 'position:fixed;z-index:300;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px;width:250px;top:50%;left:50%;transform:translate(-50%,-50%)';
  function draw(){
    const firstOfMonthG = jalaliToGregorian(vy, vm, 1);
    const jsDate = new Date(firstOfMonthG.y, firstOfMonthG.m-1, firstOfMonthG.d);
    const startOffset = (jsDate.getDay() + 1) % 7;
    const totalDays = sDim(vy, vm);
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += '<div></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = `${vy}-${String(vm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells += `<div data-pick="${dateStr}" style="text-align:center;padding:5px 0;border-radius:6px;cursor:pointer;font-size:11px;${inputEl.value===dateStr?'background:var(--accent);color:#fff':''}">${fn(d)}</div>`;
    }
    popup.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <button type="button" id="mcPrev" style="border:none;background:none;cursor:pointer">‹</button>
        <div style="font-size:12px;font-weight:700">${SMONTHS[vm-1]} ${fn(vy)}</div>
        <button type="button" id="mcNext" style="border:none;background:none;cursor:pointer">›</button>
      </div>
      <div class="cal-grid" style="margin-bottom:4px">${WEEKDAY_NAMES.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    `;
    popup.querySelector('#mcPrev').addEventListener('click', ()=>{ vm--; if(vm<1){vm=12;vy--;} draw(); });
    popup.querySelector('#mcNext').addEventListener('click', ()=>{ vm++; if(vm>12){vm=1;vy++;} draw(); });
    popup.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>{
      inputEl.value = el.dataset.pick;
      popup.remove();
    }));
  }
  draw();
  document.body.appendChild(popup);
  popup.addEventListener('click', e=>e.stopPropagation());
  setTimeout(()=>{
    document.addEventListener('click', function close(e){
      if(!popup.contains(e.target) && e.target!==inputEl){ popup.remove(); document.removeEventListener('click', close); }
    });
  },0);
}

// ⚠️ (۱۴۰۵/۰۷/۰۷) گوگل کلندرِ مستقیم با Google Apps Script — Google Cloud لازم نیست
//   (حسابِ سرویسِ Google Cloud برایِ حساب‌هایِ ایرانی فعال نمی‌شه). اسکریپت با حسابِ خودِ کاربر
//   هر ۵ دقیقه یادآوری‌ها رو می‌خونه و رویدادِ واقعی با هشدارِ گوگل می‌سازه.
// ══════════════════════════════════════════════════════════════
const GCAL_SCRIPT_TEMPLATE = "/**\n * مدار (SmartChip) ⇄ Google Calendar — نسخه‌ی ۴ (۱۴۰۵/۰۷/۰۸) — دوطرفه + تعطیلات + یادداشت‌هایِ ۱۰ ساله\n *\n * با حسابِ گوگلِ خودتون اجرا می‌شه (Google Cloud لازم نیست). هر ۵ دقیقه:\n *   پلتفرم → گوگل : یادآوری‌ها در تقویمِ 🔵 «SmartChip یادآوری‌ها»، کارهایِ روز (و کارِ فردا) در 🟠 «SmartChip کارهای روز»\n *   گوگل → پلتفرم : رویدادی که خودتون در یکی از این دو تقویم بسازید، وارد پلتفرم می‌شه\n *                    (تقویمِ یادآوری‌ها → یادآوری با همون تاریخ/ساعت ؛ تقویمِ کارها → کار برایِ همون روز)\n *                    ویرایش (عنوان/تاریخ/ساعت) در گوگل → در پلتفرم هم عوض می‌شه\n *                    حذف در گوگل → در پلتفرم «کنسل» (نه پاکِ کامل)\n *   🔴 «مدار — تعطیلات»: تعطیلاتِ رسمیِ ایران (شمسی و قمری) و چین + هشدارِ «یک ماه تا نوروز / تعطیلاتِ چین»\n *                    (فقط خواندنی — چیزی که دستی اینجا بسازید وارد نمی‌شه؛ اگه حذف کنید دوباره ساخته می‌شه)\n *   تقویم‌هایِ شخصیِ دیگه‌تون هیچ‌وقت خونده نمی‌شن.\n *   رویدادهایِ تکرارشونده‌ی گوگل وارد نمی‌شن — یادآوریِ دوره‌ای رو در خودِ SmartChip بسازید.\n *\n * راه‌اندازی: کد رو کامل جایِ کدِ قبلی بچسبونید ← Ctrl+S ← تابعِ setup ← ▶ Run ← Allow.\n */\n\nconst SYNC_URL = '__SYNC_URL__';\nconst MAX_CANCEL_PER_RUN = 10;            // ایمنی: اگه یکجا بیش از این تعداد «حذف‌شده» دیده بشه، هیچ‌کدوم کنسل نمی‌شن\n\nfunction setup() {\n  ScriptApp.getProjectTriggers()\n    .filter(t => t.getHandlerFunction() === 'sync')\n    .forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('sync').timeBased().everyMinutes(5).create();\n  const r = sync();\n  Logger.log('✅ راه‌اندازی شد. ' + (r || ''));\n}\n\nfunction fetchJson_(opts) {\n  const res = UrlFetchApp.fetch(SYNC_URL, Object.assign({ muteHttpExceptions: true, followRedirects: true }, opts || {}));\n  if (res.getResponseCode() !== 200) throw new Error('HTTP ' + res.getResponseCode());\n  const d = JSON.parse(res.getContentText());\n  if (!d || !d.ok) throw new Error('پاسخِ نامعتبر');\n  return d;\n}\n\nlet calCreatedNow_ = false;\nfunction getCal_(name, color) {\n  const c = CalendarApp.getCalendarsByName(name)[0];\n  if (c) return c;\n  calCreatedNow_ = true;                        // تقویم نبود (بارِ اول، یا کلِ تقویم در گوگل حذف شده)\n  return CalendarApp.createCalendar(name, { color: color });\n}\n\n// وضعیتِ فعلیِ یک رویداد — برایِ فهمیدنِ اینکه کاربر در گوگل ویرایشش کرده یا نه\nfunction state_(ev) {\n  const allDay = ev.isAllDayEvent();\n  const pops = (ev.getPopupReminders() || []).slice().sort((a, b) => a - b).join(',');\n  const when = allDay ? ev.getAllDayStartDate().getTime() : ev.getStartTime().getTime() + '-' + ev.getEndTime().getTime();\n  return [ev.getTitle(), allDay ? 'A' : 'T', when, pops].join('|');\n}\n\nfunction hash_(s) {\n  return Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, s, Utilities.Charset.UTF_8)\n    .map(b => ('0' + (b & 0xff).toString(16)).slice(-2)).join('').slice(0, 16);\n}\n\nfunction item_(ev, kind) {\n  const allDay = ev.isAllDayEvent();\n  const o = { kind: kind, title: ev.getTitle(), all_day: allDay, reminders: ev.getPopupReminders() || [] };\n  if (allDay) o.date = Utilities.formatDate(ev.getAllDayStartDate(), Session.getScriptTimeZone(), 'yyyy-MM-dd');\n  else o.start = ev.getStartTime().toISOString();\n  return o;\n}\n\nfunction sync() {\n  let data;\n  try { data = fetchJson_(); }\n  catch (e) { Logger.log('سرور در دسترس نبود (' + e + ') — ۵ دقیقه‌ی بعد دوباره'); return; }\n\n  const names = data.calendars || { reminders: 'SmartChip یادآوری‌ها', tasks: 'SmartChip کارهای روز' };\n  const cals = { reminders: getCal_(names.reminders, CalendarApp.Color.BLUE), tasks: getCal_(names.tasks, CalendarApp.Color.ORANGE) };\n  if (names.holidays) cals.holidays = getCal_(names.holidays, CalendarApp.Color.RED);\n  const from = new Date(data.window.from), to = new Date(data.window.to);\n  const props = PropertiesService.getScriptProperties();\n  const known = JSON.parse(props.getProperty('known') || '[]');\n\n  // ── ۱) خواندنِ هر دو تقویم ──\n  const tagged = {}, fresh = [];\n  const win = k => (data.windows && data.windows[k]) ? [new Date(data.windows[k].from), new Date(data.windows[k].to)] : [from, to];\n  Object.keys(cals).forEach(k => {\n    const w = win(k);\n    cals[k].getEvents(w[0], w[1]).forEach(ev => {\n      const id = ev.getTag('scid');\n      if (id) {\n        if (tagged[id]) { ev.deleteEvent(); return; }            // تکراریِ تصادفی\n        tagged[id] = { ev: ev, cal: k };\n      } else if (k !== 'holidays' && !ev.isRecurringEvent()) {\n        fresh.push({ ev: ev, cal: k });                           // ساخته‌شده توسطِ خودتون در گوگل (نه در تقویمِ تعطیلات)\n      }\n    });\n  });\n\n  // ── ۲) تغییراتِ سمتِ گوگل ──\n  const serverIds = {};\n  data.events.forEach(e => { serverIds[e.id] = e; });\n  const payload = { create: [], update: [], cancel: [] };\n  const freshByGid = {};\n  fresh.forEach(f => {\n    const it = item_(f.ev, f.cal === 'tasks' ? 'task' : 'reminder');\n    it.gid = f.ev.getId();\n    freshByGid[it.gid] = f;\n    payload.create.push(it);\n  });\n  Object.keys(tagged).forEach(id => {\n    const t = tagged[id], e = serverIds[id];\n    if (!e) return;\n    const g = t.ev.getTag('gsig');                                   // فقط رویدادهایِ نسخه‌ی ۲ «اثرِ انگشت» دارن\n    const edited = g && g !== hash_(state_(t.ev));\n    const moved = g && e.calendar && e.calendar !== t.cal;          // کاربر بینِ دو تقویم جابه‌جاش کرده\n    if ((edited || moved) && id.indexOf('free-') === 0) {\n      const it = item_(t.ev, t.cal === 'tasks' ? 'task' : 'reminder');\n      it.id = id;\n      payload.update.push(it);\n    }\n  });\n  const gone = known.filter(id => serverIds[id] && !tagged[id] && id.indexOf('free-') === 0);\n  if (calCreatedNow_ && gone.length) {\n    Logger.log('⚠️ یک تقویمِ SmartChip تازه ساخته شد (شاید کلِ تقویم حذف شده بود) — برایِ ایمنی هیچ کاری کنسل نشد؛ همه دوباره ساخته می‌شن.');\n  } else if (gone.length > MAX_CANCEL_PER_RUN) {\n    Logger.log('⚠️ ' + gone.length + ' رویداد یکجا ناپدید شده — برایِ ایمنی هیچ‌کدوم کنسل نشد. اگه عمدی بوده، در خودِ SmartChip کنسل کنید.');\n  } else {\n    payload.cancel = gone;\n  }\n\n  let sent = '';\n  if (payload.create.length || payload.update.length || payload.cancel.length) {\n    try {\n      const r = fetchJson_({ method: 'post', contentType: 'application/json', payload: JSON.stringify(payload) });\n      Object.keys(r.created || {}).forEach(gid => {\n        const f = freshByGid[gid];\n        if (f) { f.ev.setTag('scid', r.created[gid]); f.ev.setTag('sig', 'imported'); tagged[r.created[gid]] = { ev: f.ev, cal: f.cal }; }\n      });\n      sent = ` · از گوگل: جدید ${Object.keys(r.created || {}).length}، ویرایش ${(r.updated || []).length}، کنسل ${(r.canceled || []).length}`;\n      (r.errors || []).forEach(x => Logger.log('خطا: ' + JSON.stringify(x)));\n      data = fetchJson_();                                         // فهرستِ تازه بعد از اعمال\n      data.events.forEach(e => { serverIds[e.id] = e; });\n      Object.keys(serverIds).forEach(id => { if (!data.events.some(e => e.id === id)) delete serverIds[id]; });\n    } catch (e) {\n      Logger.log('ارسالِ تغییراتِ گوگل ناموفق بود (' + e + ') — دفعه‌ی بعد دوباره');\n      return;\n    }\n  }\n\n  // ── ۳) پلتفرم → گوگل ──\n  let created = 0, updated = 0, removed = 0;\n  const want = {};\n  data.events.forEach(e => {\n    want[e.id] = true;\n    const target = cals[e.calendar] ? e.calendar : 'reminders';\n    const t = tagged[e.id];\n    if (t && t.ev.getTag('sig') === e.sig && t.cal === target) return;\n    if (t) { t.ev.deleteEvent(); updated++; } else { created++; }\n    const opts = { description: e.description || '' };\n    let n;\n    if (e.all_day) {\n      const p = e.date.split('-').map(Number);\n      n = cals[target].createAllDayEvent(e.title, new Date(p[0], p[1] - 1, p[2]), opts);\n    } else {\n      n = cals[target].createEvent(e.title, new Date(e.start), new Date(e.end), opts);\n    }\n    n.setTag('scid', e.id);\n    n.setTag('sig', e.sig);\n    n.removeAllReminders();\n    (e.reminders || []).slice(0, 5).forEach(m => n.addPopupReminder(m));\n    n.setTag('gsig', hash_(state_(n)));\n    tagged[e.id] = { ev: n, cal: target };\n  });\n  Object.keys(tagged).forEach(id => {\n    if (!want[id]) { tagged[id].ev.deleteEvent(); removed++; delete tagged[id]; }\n  });\n  props.setProperty('known', JSON.stringify(Object.keys(tagged)));\n  const msg = `رویدادها: ${data.events.length} · جدید ${created} · به‌روز ${updated} · حذف ${removed}${sent}`;\n  Logger.log(msg);\n  return msg;\n}\n";
async function renderGoogleCalSetup(box){

      • <b>SmartChip → گوگل:</b> یادآوری‌ها (ساعت‌دار) در 🔵، کارهایِ روز و «کارِ فردا» (بی‌ساعت) در 🟠 — حداکثر ۵ دقیقه بعد.<br>
      • <b>گوگل → SmartChip:</b> هر رویدادی که <b>خودتون</b> در یکی از این دو تقویم بسازید، وارد می‌شه: 🔵 = یادآوری با همون تاریخ و ساعت، 🟠 = کار برایِ همون روز. ویرایش در گوگل ← در SmartChip هم عوض می‌شه؛ حذف در گوگل ← «کنسل» (نه پاکِ کامل).<br>
      <span class="bf-hint">تقویم‌هایِ شخصیِ دیگه‌تون هیچ‌وقت خونده نمی‌شن. رویدادِ تکرارشونده‌ی گوگل وارد نمی‌شه — یادآوریِ دوره‌ای رو در همین صفحه بسازید.</span>

        <li>از فهرستِ بالای صفحه تابعِ <b dir="ltr">setup</b> رو انتخاب کنید ← <b>▶ Run</b>.</li>

<div id="madarHolPill" style="display:none;position:fixed;bottom:84px;right:16px;z-index:9999;max-width:min(380px,calc(100vw - 32px));background:#1d212e;color:#f4f5f8;border:1px solid rgba(240,165,0,.55);border-radius:12px;padding:10px 12px 10px 34px;font-family:Vazirmatn,Tahoma,sans-serif;font-size:12px;line-height:1.8;box-shadow:0 8px 30px rgba(0,0,0,.35);direction:rtl"></div>
<script>
(function(){
  const API = 'https://api.smartchipelec.com/api/worklog/holidays/';
  const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const fdate = j => { const m=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']; const [y,mo,d]=j.split('-').map(Number); return fa(d)+' '+m[mo-1]; };
  fetch(API).then(r => r.json()).then(d => {
    const today = new Date().toISOString().slice(0,10);
    const w = (d.active_warnings || []).filter(p => !localStorage.getItem('madar_hol_x_' + p.key + '_' + today));
    if (!w.length) return;
    const box = document.getElementById('madarHolPill');
    box.innerHTML = '<button type="button" aria-label="بستن" style="position:absolute;top:6px;left:8px;border:0;background:none;color:#9aa2bd;font-size:15px;cursor:pointer">✕</button>' +
      w.map(p => { const flag = p.country === 'IR' ? '🇮🇷' : '🇨🇳';
        const head = p.ongoing ? `${flag} <b>الان ${p.short}</b> — تا ${fdate(p.jend)}` : `${flag} <b>${fa(p.days_left)} روز تا ${p.short}</b> · ${fdate(p.jstart)} تا ${fdate(p.jend)}`;
        return `<div style="margin-bottom:4px">${head}${p.status === 'predicted' ? ' <span style="color:#9aa2bd">(پیش‌بینی)</span>' : ''}<div style="color:#b9c0d6;font-size:11px">${p.note}</div></div>`; }).join('');
    box.style.display = 'block';
    box.querySelector('button').onclick = () => { w.forEach(p => localStorage.setItem('madar_hol_x_' + p.key + '_' + today, '1')); box.style.display = 'none'; };
  }).catch(() => {});
})();
</script>

// ⚠️ (۱۴۰۵/۰۷/۱۹) دکمه‌یِ روز/شب — کلیدِ مشترکِ smartchip_theme (با صفحه‌یِ اصلی هماهنگ)
(function(){
  const b = document.getElementById('themeBtn'); if(!b) return;
  const root = document.documentElement;
  const paint = () => { const L = root.getAttribute('data-theme')==='light'; b.textContent = L ? '🌙 شب' : '☀️ روز';
    const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', L ? '#a9c8ec' : '#0f1117'); };
  b.addEventListener('click', ()=>{
    const L = root.getAttribute('data-theme')==='light';
    if(L) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','light');
    try{ localStorage.setItem('smartchip_theme', L ? 'dark' : 'light'); }catch(e){}
    paint();
  });
  paint();
})();
</script>
