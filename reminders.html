  }catch(e){}
  if(!url){ box.innerHTML = '<div class="gcal-box">❌ آدرسِ همگام‌سازی گرفته نشد — اتصال به سرور رو چک کنید (بخشِ زیر همچنان کار می‌کنه).</div>'; return; }
  const code = GCAL_SCRIPT_TEMPLATE.replace('__SYNC_URL__', url);
  box.innerHTML = `
    <div class="gcal-box">
      <b>🟢 گوگل کلندر — دوطرفه، با هشدارِ خودِ گوگل (پیشنهادی)</b><br>
      سه تقویم در گوگل ساخته می‌شه: <b>🔵 SmartChip یادآوری‌ها</b>، <b>🟠 SmartChip کارهای روز</b> و <b>🔴 مدار — تعطیلات</b> (تعطیلاتِ رسمیِ ایران — شمسی و قمری — و چین، به‌علاوه‌ی هشدارِ «یک ماه تا نوروز / تعطیلاتِ چین»).<br>
      • <b>SmartChip → گوگل:</b> یادآوری‌ها (ساعت‌دار) در 🔵، کارهایِ روز و «کارِ فردا» (بی‌ساعت) در 🟠 — حداکثر ۵ دقیقه بعد.<br>
      • <b>گوگل → SmartChip:</b> هر رویدادی که <b>خودتون</b> در یکی از این دو تقویم بسازید، وارد می‌شه: 🔵 = یادآوری با همون تاریخ و ساعت، 🟠 = کار برایِ همون روز. ویرایش در گوگل ← در SmartChip هم عوض می‌شه؛ حذف در گوگل ← «کنسل» (نه پاکِ کامل).<br>
      <span class="bf-hint">تقویم‌هایِ شخصیِ دیگه‌تون هیچ‌وقت خونده نمی‌شن. رویدادِ تکرارشونده‌ی گوگل وارد نمی‌شه — یادآوریِ دوره‌ای رو در همین صفحه بسازید.</span>
      <ol>
        <li>با فیلترشکن و همون حسابِ گوگلی که تقویمتونه، وارد <b dir="ltr">script.google.com</b> بشید ← <b>New project</b>.</li>
        <li>همه‌ی کدِ پیش‌فرض رو پاک کنید و کدِ زیر رو بچسبونید ← <b>Ctrl+S</b>.</li>
        <li>از فهرستِ بالای صفحه تابعِ <b dir="ltr">setup</b> رو انتخاب کنید ← <b>▶ Run</b>.</li>
        <li>پنجره‌ی اجازه: <b dir="ltr">Review permissions</b> ← حسابتون ← <b dir="ltr">Advanced</b> ← <b dir="ltr">Go to … (unsafe)</b> ← <b dir="ltr">Allow</b>. این هشدار عادیه؛ اسکریپت مالِ خودتونه.</li>
      </ol>
      تموم. در گوگل کلندر (کامپیوتر یا گوشی) سه تقویمِ «SmartChip یادآوری‌ها»، «SmartChip کارهای روز» و «مدار — تعطیلات» ظاهر می‌شن. <b>اگه نسخه‌ی قبلیِ اسکریپت رو نصب کرده بودید</b>، فقط کدِ جدید رو جایِ قبلی بچسبونید و یک بار setup رو اجرا کنید.
      <textarea class="gcal-code" id="gcCode" readonly>${code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>

    </div>
    <b>🍎 آیفون / روشِ قبلی (اشتراکِ لینک)</b>`;

<div id="madarHolPill" style="display:none;position:fixed;bottom:84px;right:16px;z-index:9999;max-width:min(380px,calc(100vw - 32px));background:#1d212e;color:#f4f5f8;border:1px solid rgba(240,165,0,.55);border-radius:12px;padding:10px 12px 10px 34px;font-family:Vazirmatn,Tahoma,sans-serif;font-size:12px;line-height:1.8;box-shadow:0 8px 30px rgba(0,0,0,.35);direction:rtl"></div>
<script>
(function(){
  const API = 'https://api.smartchipelec.com/api/worklog/holidays/';
  const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const fdate = j => { const m=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']; const [y,mo,d]=j.split('-').map(Number); return fa(d)+' '+m[mo-1]; };
  fetch(API).then(r => r.json()).then(d => {
    const today = new Date().toISOString().slice(0,10);
    const w = (d.active_warnings || []).filter(p => !localStorage.getItem('madar_hol_x_' + p.key + '_' + today));
    if (!w.length) return;
    const box = document.getElementById('madarHolPill');
    box.innerHTML = '<button type="button" aria-label="بستن" style="position:absolute;top:6px;left:8px;border:0;background:none;color:#9aa2bd;font-size:15px;cursor:pointer">✕</button>' +
      w.map(p => { const flag = p.country === 'IR' ? '🇮🇷' : '🇨🇳';
        const head = p.ongoing ? `${flag} <b>الان ${p.short}</b> — تا ${fdate(p.jend)}` : `${flag} <b>${fa(p.days_left)} روز تا ${p.short}</b> · ${fdate(p.jstart)} تا ${fdate(p.jend)}`;
        return `<div style="margin-bottom:4px">${head}${p.status === 'predicted' ? ' <span style="color:#9aa2bd">(پیش‌بینی)</span>' : ''}<div style="color:#b9c0d6;font-size:11px">${p.note}</div></div>`; }).join('');
    box.style.display = 'block';
    box.querySelector('button').onclick = () => { w.forEach(p => localStorage.setItem('madar_hol_x_' + p.key + '_' + today, '1')); box.style.display = 'none'; };
  }).catch(() => {});
})();
</script>
