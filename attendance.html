<script>
/* ⚠️ (۱۴۰۵/۰۷/۰۸) سرورِ مدار: api.smartchipelec.com (از طریقِ Cloudflare — بدونِ فیلترشکن).
   اگه این آدرس وصل نشد، همون درخواست خودکار با آدرسِ قدیمیِ Render تکرار می‌شه و تا ۵ دقیقه مستقیم از اون می‌ره. */
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.madarApiFallbackActive = function(){ return Date.now() < downUntil; };
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){
      if(init && init.signal && init.signal.aborted) throw err;
      downUntil = Date.now() + 5*60*1000;
      return orig(alt, init);
    });
  };
})();
</script>

<style>
@import url('./vendor-fonts.css');
/* ═══ 🕘 حضور و غیاب (۱۴۰۵/۰۷/۱۰) ═══ */
:root{--bg:#0f1117;--surface:#1a1e2a;--card:#232838;--border:#323952;--accent:#f0a500;--text:#f4f5f8;--muted:#9aa2bd;--faint:#6b7390;--green:#22c55e;--red:#ef4444;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.top b{font-size:17px;font-weight:900}.top a{font-size:12px;color:var(--muted);text-decoration:none;margin-right:auto}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 70px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:800;margin-bottom:8px}
.today{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.today .d{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--border);border-radius:14px;padding:3px 10px;background:var(--card)}
.chip.in{border-color:rgba(34,197,94,.5)}.chip.out{border-color:rgba(96,165,250,.5)}.chip.review{border-color:rgba(240,165,0,.6);color:var(--accent)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:8px 14px;cursor:pointer}
.tab.on{background:rgba(240,165,0,.14);border-color:var(--accent);color:var(--accent)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.qrbox canvas,.qrbox img{background:#fff;padding:14px;border-radius:14px;width:min(320px,80vw);height:auto;image-rendering:pixelated}
.bar{width:min(320px,80vw);height:6px;background:var(--card);border-radius:3px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.big{font-size:22px;font-weight:900}
.hint{font-size:12.5px;color:var(--muted);line-height:2;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#141821}.btn.sm{font-size:11.5px;padding:4px 9px}
.btn.ok{border-color:rgba(34,197,94,.5);color:var(--green)}.btn.no{border-color:rgba(239,68,68,.5);color:var(--red)}
video{width:min(360px,90vw);border-radius:14px;background:#000}
.res{margin-top:10px;border-radius:12px;padding:12px 14px;font-size:14px;line-height:2;display:none}
.res.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.45)}
.res.warn{display:block;background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.5)}
.res.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.5)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px}
.flags span{border:1px solid var(--border);border-radius:8px;padding:1px 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:right}th{color:var(--muted);font-size:11.5px;background:var(--card)}
.tblw{overflow-x:auto}
.inp{border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:13px;border-radius:9px;padding:7px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.muted{color:var(--muted);font-size:12px}
.warnbox{border:1px solid rgba(240,165,0,.45);background:rgba(240,165,0,.07);border-radius:12px;padding:10px 12px;font-size:13px;line-height:2;margin-bottom:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;display:none}

.kx-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kx-head b{font-size:16px}.kx-nav{display:flex;gap:6px;align-items:center}
.kx td,.kx th{white-space:nowrap;text-align:center}
.kx td.l{text-align:right}
.kx tr.inc td{background:rgba(239,68,68,.10)}
.kx tr.off td{opacity:.5}
.kx tr.abs td{background:rgba(239,68,68,.06)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.sum div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:17px;color:var(--text)}
.kind-btns{display:flex;gap:10px;width:min(360px,90vw)}
.kind-btns button{flex:1;height:64px;font-size:18px;font-weight:900;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;cursor:pointer;position:relative}
.kind-btns button.sug{border-color:var(--accent)}
.kind-btns button.sug::after{content:'پیشنهاد';position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:#141821;font-size:10px;padding:0 8px;border-radius:8px}
.ov{position:fixed;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.modal h3{margin-bottom:8px}
.rv{display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:start}
.rv-c{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:13px;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:right}
.rv-c.on{background:rgba(240,165,0,.13);color:var(--accent);font-weight:800}
.rv-c .n{margin-right:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;min-width:22px;text-align:center}
.rv-c .n.z{background:var(--card);color:var(--faint)}
.rrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:7px 2px;font-size:12.5px}
@media(max-width:760px){.rv{grid-template-columns:1fr}}
</style>

<body>
<div class="top"><span style="font-size:22px">🕘</span><b>حضور و غیاب</b><a href="index.html">‹ صفحه‌ی اصلیِ مدار</a></div>
<div class="wrap" id="app"><div class="hint" style="padding:40px">در حالِ بارگذاری…</div></div>
<div class="toast" id="toast"></div>
<script>
const API = 'https://api.smartchipelec.com/api/org/';
const ATT = API + 'att/';
const $ = id => document.getElementById(id);
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = m => m ? fa(String(Math.floor(m/60)).padStart(2,'0')) + ':' + fa(String(m%60).padStart(2,'0')) : '—';
const mins = m => m ? fa(m) + ' دقیقه' : '—';
const S = {st:null, mode:null, tab:null, kind:null, qrTimer:null, cam:null, detector:null, kxMonth:null, admin:null, atab:'review', person:null, pMonth:null, rvSel:null, pendingPayload:null};
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3200); }
// ⚠️ (۱۴۰۵/۰۷/۱۰) کتابخانه‌هایِ کیوآرکد داخلِ خودِ مدار (vendor-qr.js) — دیگه به CDN وابسته نیست
let qrLibPromise = null;
function loadQrLib(){ if(window.jsQR && window.qrcode) return Promise.resolve(); return qrLibPromise || (qrLibPromise = new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='./vendor-qr.js'; s.onload=ok; s.onerror=()=>{ qrLibPromise=null; no(new Error('فایلِ vendor-qr.js پیدا نشد — به مدیریت خبر بدید')); }; document.head.appendChild(s); })); }
function deviceKey(){ let k = localStorage.getItem('madar_att_device'); if(!k){ const a=new Uint8Array(24); crypto.getRandomValues(a); k=[...a].map(b=>b.toString(16).padStart(2,'0')).join(''); localStorage.setItem('madar_att_device', k); } return k; }
function deviceLabel(){ const u=navigator.userAgent; const o=/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iPhone':/Windows/.test(u)?'Windows':/Mac OS/.test(u)?'Mac':'دستگاه'; const b=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':''; return o+(b?' / '+b:''); }
const isPhone = () => matchMedia('(pointer:coarse)').matches || innerWidth < 820;
async function api(path, body, base){
  const r = await fetch((base||ATT) + path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  const d = await r.json().catch(()=>({ok:false, error:'پاسخِ نامعتبر'}));
  if(r.status === 401){ MadarAuth.require(true); throw new Error('ورود لازم است'); }
  if(!r.ok || d.ok === false) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}
function getGeo(){ return new Promise(res => { if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lng:p.coords.longitude, accuracy:p.coords.accuracy}), () => res(null), {enableHighAccuracy:true, timeout:8000, maximumAge:0}); }); }
function shiftMonth(m, d){ let [y,mo] = m.split('-').map(Number); mo += d; if(mo<1){mo=12;y--;} if(mo>12){mo=1;y++;} return y+'-'+String(mo).padStart(2,'0'); }
function modal(html){ const o=document.createElement('div'); o.className='ov'; o.innerHTML=`<div class="modal">${html}</div>`; o.onclick=e=>{ if(e.target===o) o.remove(); }; document.body.appendChild(o); return o; }

async function loadState(){ S.st = await api('state/?device=' + encodeURIComponent(deviceKey())); }
function render(){
  const st = S.st, d = st.day;
  if(!S.mode) S.mode = isPhone() ? 'phone' : 'pc';
  if(!S.tab) S.tab = S.mode === 'phone' ? 'scan' : 'qr';
  const pun = st.punches.map(p => `<span class="chip ${p.kind} ${p.status==='review'?'review':''}">${p.kind==='in'?'🟢 ورود':'🔵 خروج'} ${fa(p.time)}${p.status==='review'?' · ⚠ بررسی':''}${p.status==='pending'?' · ✏️ منتظرِ تأیید':''}</span>`).join('') || '<span class="muted">امروز هنوز ثبتی نیست</span>';
  const first = S.mode === 'phone' ? `<button class="tab ${S.tab==='scan'?'on':''}" onclick="setTab('scan')">📷 ثبتِ ورود / خروج</button>` : `<button class="tab ${S.tab==='qr'?'on':''}" onclick="setTab('qr')">🖥️ کدِ من</button>`;
  $('app').innerHTML = `
    <div class="card"><div class="today"><div><div class="big">${d.work ? 'امروز روزِ کاریه' : '🌙 امروز تعطیله'}</div><div class="d">${fa(st.today.replace(/-/g,'/'))} · ${d.work ? `شروع ${fa(st.settings.start)} (فرجه تا ${fa(st.settings.grace)}) · پایان ${fa(d.end)}` : esc(d.why)}</div></div>
      <div style="margin-right:auto" class="chips">${pun}</div></div></div>
    <div class="tabs">${first}<button class="tab ${S.tab==='mine'?'on':''}" onclick="setTab('mine')">📅 کارکردِ من</button>${st.is_mgmt?`<button class="tab ${S.tab==='admin'?'on':''}" onclick="setTab('admin')">🛠️ مدیریت</button>`:''}
      <button class="tab" style="margin-right:auto;font-size:11px;font-weight:500" onclick="S.mode=S.mode==='phone'?'pc':'phone';S.tab=null;render()">${S.mode==='phone'?'🖥️ نمایشِ کد رویِ این دستگاه':'📱 حالتِ گوشی'}</button></div>
    <div id="pane"></div>`;
  stopQr(); stopCam();
  if(S.tab === 'qr') paneQr(); else if(S.tab === 'scan') paneScan(); else if(S.tab === 'mine') paneMine(); else if(S.tab === 'admin') adminView();
}
function setTab(t){ S.tab = t; render(); }

// ── 🖥️ کامپیوتر: فقط کد ──
async function paneQr(){
  $('pane').innerHTML = `<div class="card"><div class="qrbox"><div id="qr"></div><div class="bar"><span id="qrbar" style="width:100%"></span></div>
    <div class="hint">این <b>کدِ شخصیِ شماست</b> و <b>هر ۱۰ ثانیه</b> عوض می‌شه.<br>با <b>گوشیِ حضورِ</b> خودتون اسکنش کنید — <b>رویِ گوشی</b> انتخاب می‌کنید «ورود» یا «خروج».<br>کامپیوتر فقط کد رو نشون می‌ده؛ ثبت با گوشی انجام می‌شه.</div></div></div>`;
  try{ await loadQrLib(); }catch(e){ $('qr').innerHTML = '<div class="hint">❌ '+esc(e.message)+'</div>'; return; }
  const tick = async () => {
    try{
      const d = await api('qr/');
      const link = location.href.split('#')[0] + '#p=' + d.payload;
      const q = qrcode(0, 'M'); q.addData(link); q.make();
      $('qr') && ($('qr').innerHTML = q.createImgTag(6, 0));
      const left = d.expires_in, bar = $('qrbar');
      if(bar){ bar.style.transition='none'; bar.style.width=(left*10)+'%'; requestAnimationFrame(()=>{ bar.style.transition='width '+left+'s linear'; bar.style.width='0%'; }); }
      S.qrTimer = setTimeout(tick, left*1000 + 150);
    }catch(e){ $('qr') && ($('qr').innerHTML = '<div class="hint">'+esc(e.message)+'</div>'); S.qrTimer = setTimeout(tick, 5000); }
  };
  tick();
}
function stopQr(){ clearTimeout(S.qrTimer); S.qrTimer = null; }

// ── 📱 گوشی: انتخابِ ورود/خروج + اسکن ──
function suggestedKind(){
  const ps = S.st.punches.filter(p=>p.status!=='pending');
  if(ps.length) return ps[ps.length-1].kind === 'in' ? 'out' : 'in';
  const now = new Date(), m = now.getHours()*60 + now.getMinutes();
  return m >= 12*60 ? 'out' : 'in';      // بعد از ظهر و هنوز هیچ ثبتی نیست ← احتمالاً خروج (ورود فراموش شده)
}
function paneScan(){
  const st = S.st, dev = st.device, sug = suggestedKind();
  const devBox = !dev.status ? `<div class="warnbox">📱 <b>این گوشی هنوز «گوشیِ حضورِ» شما نیست.</b> اگه گوشیِ شخصیِ خودتونه، ثبتش کنید تا مدیر تأیید کنه. تا تأیید، ثبت‌ها «نیاز به بررسی» می‌خورن.<div class="row"><button class="btn pri" onclick="regDevice()">📱 ثبتِ این گوشی به‌عنوانِ گوشیِ حضورِ من</button></div></div>`
    : dev.status === 'pending' ? `<div class="warnbox">⏳ این گوشی ثبت شده و <b>منتظرِ تأییدِ مدیر</b> است.</div>` : '';
  const noIn = sug === 'out' && !st.punches.some(p=>p.kind==='in' && p.status!=='pending');
  $('pane').innerHTML = devBox + `<div class="card"><div class="qrbox">
    <div class="hint" style="margin-bottom:4px">۱) انتخاب کنید ← ۲) کدِ رویِ <b>کامپیوترِ خودتون</b> رو اسکن کنید</div>
    <div class="kind-btns"><button id="kIn" class="${sug==='in'?'sug':''}" onclick="pickKind('in')">🟢 ورود</button><button id="kOut" class="${sug==='out'?'sug':''}" onclick="pickKind('out')">🔵 خروج</button></div>
    ${noIn ? '<div class="warnbox" style="width:min(360px,90vw);margin:6px 0 0">امروز ورودی ثبت نکردید. اگه الان خروجه، «خروج» رو بزنید — روزِ امروز «تردد ناقص» می‌شه و بعد درخواستِ اصلاحِ ورود می‌دید.</div>' : ''}
    <video id="cam" playsinline muted hidden></video>
    <div class="hint">لحظه‌ی اسکن، موقعیتِ گوشی فقط یک بار خونده می‌شه (اجازه بدید).</div>
    <div id="res" class="res"></div>
    <button class="btn sm" onclick="corrDlg(S.st.today)">گوشی همراهم نبود / مشکل دارم — درخواستِ اصلاح</button></div></div>`;
}
async function pickKind(k){
  S.kind = k;
  $('kIn').classList.toggle('sug', k==='in'); $('kOut').classList.toggle('sug', k==='out');
  if(S.pendingPayload){ const p = S.pendingPayload; S.pendingPayload = null; return doPunch(p, k); }
  startCam();
}
async function startCam(){
  const v = $('cam'); v.hidden = false;
  try{ S.cam = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ toast('❌ اجازه‌ی دوربین داده نشد — با دوربینِ معمولیِ گوشی هم می‌شه کد رو اسکن کرد'); v.hidden = true; return; }
  v.srcObject = S.cam; await v.play();
  // ⚠️ خواننده‌ی داخلیِ گوشی (اگه باشه، مثلِ کرومِ اندروید) ← وگرنه کتابخانه‌ی داخلِ مدار
  let detector = null;
  if('BarcodeDetector' in window){ try{ detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!detector){ try{ await loadQrLib(); }catch(e){ toast('❌ '+e.message); stopCam(); return; } }
  const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently:true});
  const found = data => { const m = /#p=(MATT1\.[\w.]+)/.exec(data) || /^(MATT1\.[\w.]+)$/.exec(data); if(m){ stopCam(); doPunch(m[1], S.kind); return true; } return false; };
  const loop = async () => {
    if(!S.cam) return;
    if(v.readyState === v.HAVE_ENOUGH_DATA){
      if(detector){ try{ const r = await detector.detect(v); if(r[0] && found(r[0].rawValue)) return; }catch(e){} }
      else { c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0); const img=ctx.getImageData(0,0,c.width,c.height); const q=jsQR(img.data,img.width,img.height); if(q && q.data && found(q.data)) return; }
    }
    requestAnimationFrame(loop);
  };
  loop();
}
function stopCam(){ if(S.cam){ S.cam.getTracks().forEach(t=>t.stop()); S.cam = null; } const v=$('cam'); if(v) v.hidden = true; }
async function doPunch(payload, kind){
  if(!kind){ S.pendingPayload = payload; S.tab='scan'; render(); toast('کد خونده شد — «ورود» یا «خروج» رو انتخاب کنید'); return; }
  const res = $('res'); if(res){ res.className='res warn'; res.innerHTML='در حالِ ثبت…'; }
  const geo = await getGeo();
  try{

    .concat(S.rep.rows.map(r=>{const t=r.total; return [r.staff.name,r.staff.unit,t.required_days,t.present_days,t.absent_days,t.leave_days,t.mission_days,t.incomplete_days,t.required_min,t.worked_min,t.overtime_min,t.deficit_min,t.late_min,t.early_min,t.hourly_leave_min];}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'خلاصه');
  const det = [['کارمند','روز','تاریخ','ورود','خروج','کارکرد','تأخیر','تعجیل','اضافه‌کار','وضعیت','توضیحات']];
  S.rep.rows.forEach(r=>r.days.filter(x=>!x.future).forEach(x=>det.push([r.staff.name,x.weekday,x.date,x.in||'',x.out||'',x.work_min,x.late_min,x.early_min,x.over_min,x.status,x.note||''])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'جزئیات');
  XLSX.writeFile(wb, 'کارکرد-پرسنل-' + S.rep.month + '.xlsx');
}
function aDevices(){
  const a = S.admin;
  $('abody').innerHTML = a.devices.length ? a.devices.map(d=>`<div class="rrow"><b>${esc(d.staff)}</b> · ${esc(d.label||'—')} · <span class="muted">${esc(d.status_label)} · ${fa(d.created)}</span><span style="margin-right:auto"></span>${d.status==='pending'?`<button class="btn sm ok" onclick="dAct(${d.id},'approve')">تأیید</button>`:''}<button class="btn sm no" onclick="dAct(${d.id},'revoke')">لغو</button></div>`).join('') + '<div class="muted" style="margin-top:8px">هر نفر یک گوشیِ حضور داره؛ تأییدِ گوشیِ جدید، قبلی رو لغو می‌کنه.</div>' : '<div class="hint">هنوز گوشی‌ای ثبت نشده</div>';
}
async function dAct(id, action){ try{ await api('admin/action/', {what:'device', id, action}); toast('✅ انجام شد'); adminView(); }catch(e){ toast('❌ '+e.message); } }
function aSettings(){
  const a = S.admin, s = a.settings;
  $('abody').innerHTML = `<h3>🌐 اینترنتِ شرکت</h3><div class="muted">آی‌پیِ همین الانِ شما: <b dir="ltr">${esc(a.my_ip)}</b> — اگه الان در شرکتید و رویِ وای‌فایِ شرکت، تأییدش کنید.</div>
    <div class="row"><button class="btn sm pri" onclick="setAct({what:'ip',action:'add',ip:'${esc(a.my_ip)}'})">✅ این اینترنتِ شرکته</button></div>
    <div class="muted">ثبت‌شده: ${s.office_ips.length?s.office_ips.map(ip=>`<span class="chip" dir="ltr">${esc(ip)} <a href="#" onclick="setAct({what:'ip',action:'remove',ip:'${esc(ip)}'});return false">✕</a></span>`).join(' '):'— هنوز ثبت نشده'}</div>
    ${a.ip_candidates.length?`<div class="muted" style="margin-top:6px">پیشنهادِ خودکار: ${a.ip_candidates.map(c=>`<span class="chip" dir="ltr">${esc(c.ip)} · ${fa(c.share)}٪ ${s.office_ips.includes(c.ip)?'✅':`<a href="#" onclick="setAct({what:'ip',action:'add',ip:'${esc(c.ip)}'});return false">تأیید</a>`}</span>`).join(' ')}</div>`:''}
    <h3 style="margin-top:14px">📍 موقعیتِ شرکت</h3><div class="muted">${s.office_lat!=null?`ثبت شده · شعاع ${fa(s.radius_m)} متر`:'هنوز ثبت نشده'}</div>
    <div class="row"><input class="inp" id="rad" value="${s.radius_m}" style="width:80px;text-align:center"> متر <button class="btn sm pri" onclick="setLoc()">📍 موقعیتِ همین الانِ من = شرکت</button></div>
    <h3 style="margin-top:14px">⏰ ساعتِ کاری و قوانین</h3>
    <div class="row">شروع <input class="inp" id="s1" value="${s.start}" style="width:70px;direction:ltr"> فرجه تا <input class="inp" id="s2" value="${s.grace}" style="width:70px;direction:ltr"> یادآوری <input class="inp" id="s3" value="${s.remind}" style="width:70px;direction:ltr"></div>
    <div class="row">پایان شنبه–چهارشنبه <input class="inp" id="s4" value="${s.end}" style="width:70px;direction:ltr"> پنجشنبه <input class="inp" id="s5" value="${s.end_thu}" style="width:70px;direction:ltr"></div>
    <div class="row">سقفِ مرخصیِ استحقاقی <input class="inp" id="s6" value="${s.entitled_days}" style="width:60px;text-align:center"> روز در سال · اضافه‌کاریِ بیش از <input class="inp" id="s7" value="${s.overtime_flag}" style="width:60px;text-align:center"> دقیقه نیازِ مجوز داره</div>
    <div class="row"><button class="btn sm pri" onclick="setAct({what:'settings',start:$('s1').value,grace:$('s2').value,remind:$('s3').value,end:$('s4').value,end_thu:$('s5').value,entitled_days:$('s6').value,overtime_flag:$('s7').value})">ذخیره</button></div>`;
}
async function setAct(body){ try{ await api('admin/action/', body); toast('✅ انجام شد'); adminView(); }catch(e){ toast('❌ '+e.message); } }
async function setLoc(){ const g = await getGeo(); if(!g){ toast('❌ موقعیت خونده نشد — اجازه‌ی موقعیت رو بدید'); return; } setAct({what:'location', lat:g.lat, lng:g.lng, radius_m:+$('rad').value||250}); }

(async function init(){
  if(!MadarAuth.token()){ MadarAuth.require(true); $('app').innerHTML = '<div class="hint" style="padding:40px">برایِ حضور و غیاب با ورودِ امن وارد شوید.</div>'; return; }
  try{ await loadState(); }catch(e){ $('app').innerHTML = '<div class="hint" style="padding:40px">⚠️ '+esc(e.message)+'</div>'; return; }
  if(/^#admin:/.test(location.hash) && S.st.is_mgmt) S.tab = 'admin';
  if(location.hash === '#mine'){ S.tab = 'mine'; history.replaceState(null,'',location.pathname); }
  const m = /^#p=(MATT1\.[\w.]+)/.exec(location.hash);
  if(m){ S.mode='phone'; S.tab='scan'; render(); doPunch(m[1], null); } else render();
  window.addEventListener('hashchange', () => {
    const k = /^#p=(MATT1\.[\w.]+)/.exec(location.hash);
    if(k && S.st){ S.mode='phone'; doPunch(k[1], null); return; }
    if(location.hash === '#mine'){ S.tab = 'mine'; history.replaceState(null,'',location.pathname); render(); return; }
    if(/^#admin:/.test(location.hash) && S.st && S.st.is_mgmt){ S.tab = 'admin'; render(); }
  });
})();
</script>
<script src="./madar-help.js" defer></script>
</body>
