<script>
(function(){
  var NEW='https://api.smartchipelec.com', OLD='https://smartchip-backend.onrender.com';
  if(!window.fetch || window.__madarFetch) return; window.__madarFetch = true;
  var orig = window.fetch.bind(window), downUntil = 0;
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input instanceof URL ? input.href : null);
    if(!url || url.indexOf(NEW) !== 0) return orig(input, init);
    var alt = OLD + url.slice(NEW.length);
    if(Date.now() < downUntil) return orig(alt, init);
    return orig(url, init).catch(function(err){ downUntil = Date.now() + 5*60*1000; return orig(alt, init); });
  };
})();
</script>

const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let ITEMS=[],MGR=false,ME='',TAB='flow',STATS=[],COMPLETE_ID=null;
function todayJ(){const p=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.year+'/'+p.month+'/'+p.day;}
async function api(path,method,body){
  const b=Object.assign({actor:ME},body||{});
  const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json'},cache:'no-store',body:method&&method!=='GET'?JSON.stringify(b):undefined});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function load(){
  try{
    const j=await api('?actor='+encodeURIComponent(ME));ITEMS=j.items;MGR=j.manager;ME=j.me||ME;
  }catch(e){$('box').innerHTML='<div class="empty">'+esc(e.message)+'<br>با ورودِ امن از صفحه‌یِ اصلی وارد شوید.</div>';return;}
  try{STATS=(await api('stats/?actor='+encodeURIComponent(ME))).people;}catch(e){STATS=[];}
  render();
}
function counts(){const c={flow:0,future:0,done:0,prop:0};ITEMS.forEach(i=>{if(i.status==='done')c.done++;else if(i.status==='future')c.future++;else if(i.status==='proposed'||i.status==='rejected')c.prop++;else c.flow++;});return c;}
function render(){
  const c=counts();
  const part=ITEMS.filter(i=>i.status==='doing').length;
  $('sum').innerHTML=`<div><b style="color:var(--ok)">${fa(c.done)}</b><span>انجام‌شده</span></div><div><b style="color:var(--warn)">${fa(part)}</b><span>در حالِ انجام</span></div><div><b>${fa(c.flow)}</b><span>در جریان/صف</span></div><div><b>${fa(c.future)}</b><span>آینده</span></div>`;
  const T=[['flow','در جریان ('+fa(c.flow)+')'],['future','آینده ('+fa(c.future)+')'],['done','انجام‌شده ('+fa(c.done)+')'],['prop',(MGR?'پیشنهادها':'پیشنهادهایِ من')+' ('+fa(c.prop)+')'],['stats','👥 مشارکت']];
  $('tabs').innerHTML=T.map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="TAB='${t[0]}';render()">${t[1]}</button>`).join('');
  $('banner').innerHTML=(MGR&&!ITEMS.some(i=>i.status!=='proposed'))?`<div class="banner">نقشه‌یِ راهِ قبلی هنوز به سرور منتقل نشده. <button class="btn sm pri" onclick="doImport()">انتقالِ ${fa(SEED.length)} موردِ قبلی</button></div>`:'';
  if(TAB==='stats') return renderStats();
  let L;
  if(TAB==='flow') L=ITEMS.filter(i=>['queue','doing'].includes(i.status)).sort((a,b)=>(a.status==='doing'?0:1)-(b.status==='doing'?0:1)||(a.priority||99)-(b.priority||99));
  else if(TAB==='future') L=ITEMS.filter(i=>i.status==='future');
  else if(TAB==='done') L=ITEMS.filter(i=>i.status==='done').sort((a,b)=>(b.completed_date||'').localeCompare(a.completed_date||''));
  else L=ITEMS.filter(i=>['proposed','rejected'].includes(i.status));
  $('box').innerHTML=L.length?L.map(card).join(''):'<div class="empty">موردی نیست</div>';
}
function card(i){
  const pct=i.steps_total?Math.round(i.steps_done*100/i.steps_total):(i.status==='done'?100:0);
  const st=i.status==='done'?'<span class="pill ok">✓ انجام‌شده</span>':i.status==='doing'?`<span class="pill part">نیمه‌کاره · ${fa(i.steps_done)} از ${fa(i.steps_total)}</span>`:i.status==='proposed'?'<span class="pill q">منتظرِ تأیید</span>':i.status==='rejected'?'<span class="pill bad">ردشده</span>':i.steps_total?`<span class="pill q">${fa(i.steps_done)} از ${fa(i.steps_total)}</span>`:'';
  const steps=i.steps.map(s=>`<div class="st ${s.done?'d':''}"><button class="cb ${MGR?'m':''}" ${MGR?`onclick="tick(${i.id},${s.id},${!s.done})"`:'disabled'}>${s.done?'✓':''}</button><span class="tx">${esc(s.text)}</span><span class="dt">${s.done?esc(s.done_date)+(s.done_by?'<br>'+esc(s.done_by):''):''}</span>${MGR?`<button class="btn sm bad" onclick="delStep(${i.id},${s.id})" title="حذف">✕</button>`:''}</div>`).join('');
  const act=MGR?`<div class="act">
    ${i.status==='proposed'?`<button class="btn sm pri" onclick="act(${i.id},'approve')">✔ تأیید (در صف)</button><button class="btn sm" onclick="act(${i.id},'approve',{status:'future'})">تأیید (آینده)</button><button class="btn sm bad" onclick="act(${i.id},'reject')">ردکردن</button>`:''}
    ${['queue','future','doing'].includes(i.status)?`<button class="btn sm" onclick="addStep(${i.id})">+ مرحله</button><button class="btn sm pri" onclick="askComplete(${i.id})">✓ انجام شد</button>`:''}
    ${['done','rejected'].includes(i.status)?`<button class="btn sm" onclick="act(${i.id},'reopen')">↩ بازگرداندن</button>`:''}
    <button class="btn sm" onclick="editItem(${i.id})">✎ ویرایش</button><button class="btn sm bad" onclick="delItem(${i.id})">حذف</button></div>`:'';
  const log=(i.log||[]).slice().reverse().map(l=>`<div class="log">${esc(l.date)} · ${esc(l.by)} · ${esc({created:'ثبت',approved:'تأیید',rejected:'رد',completed:'تکمیل',reopened:'بازگشت',edited:'ویرایش',imported:'انتقال'}[l.event]||l.event)} ${esc(l.text)}</div>`).join('');
  return `<div class="it" id="i${i.id}"><div class="hd"><h3>${esc(i.title)}</h3><span class="pill ${i.kind}">${KL[i.kind]||i.kind}</span><span class="pill">وزن ${fa(i.weight)}</span>${i.priority?`<span class="pill q">اولویت ${fa(i.priority)}</span>`:''}${st}</div>
  ${(i.steps_total||i.status==='done')?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}
  <div class="meta"><span>🗣 گفته: <b>${esc(i.reported_by||'—')}</b> · ${esc(i.reported_date||'')}</span>${i.status==='done'?`<span>✅ تکمیل: <b>${esc(i.completed_by||'—')}</b> · ${esc(i.completed_date||'')}</span>`:''}${i.approved_by?`<span>تأیید: ${esc(i.approved_by)} · ${esc(i.approved_date)}</span>`:''}</div>
  ${steps?`<div style="margin-top:8px">${steps}</div>`:''}
  ${i.desc?`<details><summary>📄 توضیحات</summary><div class="dsc">${esc(i.desc)}</div></details>`:''}
  ${log?`<details><summary>🕘 تاریخچه</summary>${log}</details>`:''}${act}</div>`;
}
function renderStats(){
  $('box').innerHTML=STATS.length?`<table><tr><th>نام</th><th>گفته (تأییدشده)</th><th>باگ</th><th>ایده/بهبود</th><th>تمام کرده</th><th>امتیاز</th></tr>`+STATS.map(p=>`<tr><td>${esc(p.name)}</td><td>${fa(p.found)}</td><td>${fa(p.found_bug)}</td><td>${fa(p.found_idea)}</td><td>${fa(p.fixed)}</td><td><b>${fa(p.points)}</b></td></tr>`).join('')+`</table><div class="note">فقط مواردِ تأییدشده. امتیاز = جمعِ وزنِ مواردی که گفته + وزنِ مواردی که تمام کرده. ${MGR?'':'شما فقط ردیفِ خودتان (و تیمتان اگر سرپرست باشید) را می‌بینید.'}</div>`:'<div class="empty">هنوز مشارکتِ ثبت‌شده‌ای نیست</div>';
}
async function run(fn){try{await fn();await load();}catch(e){alert(e.message);}}
function tick(id,sid,done){run(()=>api(id+'/step/'+sid+'/','PATCH',{done}));}
function delStep(id,sid){if(confirm('این مرحله حذف شود؟'))run(()=>api(id+'/step/'+sid+'/','DELETE'));}
function addStep(id){const t=prompt('متنِ مرحله:');if(t&&t.trim())run(()=>api(id+'/step/','POST',{text:t}));}
function act(id,a,b){run(()=>api(id+'/'+a+'/','POST',b));}
function delItem(id){if(confirm('این مورد برایِ همیشه حذف شود؟ (برایِ تمام‌شده‌ها بهتر است «بازگرداندن» یا نگه‌داشتن)'))run(()=>api(id+'/','DELETE'));}
function editItem(id){const i=ITEMS.find(x=>x.id===id);const t=prompt('عنوان:',i.title);if(t===null)return;const by=prompt('چه کسی گفت؟',i.reported_by);if(by===null)return;const d=prompt('تاریخِ گفتن (شمسی):',i.reported_date);if(d===null)return;run(()=>api(id+'/','PATCH',{title:t,reported_by:by,reported_date:en(d)}));}
function askComplete(id){COMPLETE_ID=id;$('cBy').value=ME;$('cDate').value=todayJ();$('ov2').style.display='flex';}
function doComplete(){const id=COMPLETE_ID;$('ov2').style.display='none';act(id,'complete',{completed_by:$('cBy').value,completed_date:en($('cDate').value)});}
function openNew(){$('nTitle').value=$('nDesc').value=$('nSteps').value='';$('nBy').value=ME;$('nDate').value=todayJ();$('nErr').textContent='';document.querySelectorAll('.mgr').forEach(e=>e.style.display=MGR?'':'none');$('ov').style.display='flex';$('nTitle').focus();}
function closeNew(){$('ov').style.display='none';}
async function saveNew(){
  const title=$('nTitle').value.trim();if(!title){$('nErr').textContent='عنوان لازم است';return;}
  try{await api('','POST',{title,kind:$('nKind').value,weight:+$('nWeight').value,desc:$('nDesc').value,reported_by:$('nBy').value,reported_date:en($('nDate').value),steps:$('nSteps').value.split('\n').map(s=>s.trim()).filter(Boolean)});closeNew();if(!MGR)TAB='prop';await load();}catch(e){$('nErr').textContent=e.message;}
}
async function doImport(){if(!confirm('نقشه‌یِ راهِ قبلی (همه‌یِ موارد با وضعیتِ فعلی) منتقل شود؟ تکراری‌ها نادیده گرفته می‌شوند.'))return;run(()=>api('import/','POST',{items:SEED}));}
$('today').textContent=new Date().toLocaleDateString('fa-IR',{calendar:'persian',weekday:'long',day:'numeric',month:'long',year:'numeric'});
MadarAccess.ready(()=>{ME=(MadarAccess.name&&MadarAccess.name())||(window.MadarAuth&&MadarAuth.name&&MadarAuth.name())||'';load();});
</script>
